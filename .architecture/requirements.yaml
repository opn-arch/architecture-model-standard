    inferred externals, qualified IDs, strict TDD, backward compatibility.
- id: REQ-2
  text: Harden DiagramSpec, ArchitectureViewContext, and viewer curation with typed
    provenance/drilldowns, complete reference and JSON safety validation, cross-model
    hierarchy relationships, malformed-input fallback, evidence claims, presentation-only
    inferred flow kinds, and globally unique presentation IDs.
