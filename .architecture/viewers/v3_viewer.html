<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AMS v3 Viewer</title>
<style>
:root {
  --bg: #1a1a2e; --fg: #e0e0e0; --muted: #a0a0c0;
  --sidebar: #16213e; --panel: #16213e; --border: #2a2a4e;
  --accent: #e94560; --link: #7ec8e3; --ok: #4ade80; --warn: #fbbf24; --error: #e94560;
  --ok-bg: #14532d; --warn-bg: #78350f; --error-bg: #7f1d1d;
}
* { box-sizing: border-box; }
body { margin:0; font:14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--fg); background:var(--bg); }
.layout { display:grid; grid-template-columns: 280px 1fr; min-height:100vh; }
#sidebar { background:var(--sidebar); border-right:1px solid var(--border); overflow-y:auto; padding:16px 0; position:sticky; top:0; height:100vh; }
#sidebar h1 { margin:0 16px 4px; font-size:15px; color:var(--fg); }
#sidebar .frame { margin:0 16px 12px; color:var(--muted); font-size:11px; }
#sidebar .totals { margin:0 16px 14px; font-size:11px; color:var(--muted); border-top:1px solid var(--border); padding-top:10px; }
#sidebar .totals b { color:var(--fg); }
#sidebar .nav-item { display:block; padding:8px 16px; color:var(--link); cursor:pointer; font-size:13px; border-left:3px solid transparent; }
#sidebar .nav-item:hover { background:var(--border); }
#sidebar .nav-item.active { background:var(--border); border-left-color:var(--accent); color:var(--fg); font-weight:600; }
#sidebar details { margin:4px 0; }
#sidebar summary { padding:8px 16px; cursor:pointer; color:var(--fg); font-size:12px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; user-select:none; }
#sidebar summary:hover { background:var(--border); }
#sidebar .entity-link { display:block; padding:5px 16px 5px 28px; color:var(--link); cursor:pointer; font-size:12px; border-left:3px solid transparent; text-decoration:none; }
#sidebar .entity-link:hover { background:var(--border); }
#sidebar .entity-link.active { background:var(--border); border-left-color:var(--accent); color:var(--fg); }
#sidebar .entity-link .cid { font-family: ui-monospace, "SF Mono", Menlo, monospace; color:var(--muted); font-size:10px; display:block; }
#content { padding:24px 32px; max-width:1000px; }
.breadcrumb { color:var(--muted); font-size:12px; margin-bottom:8px; }
.breadcrumb a { color:var(--link); text-decoration:none; cursor:pointer; }
.breadcrumb a:hover { text-decoration:underline; }
h2.content-header { color:var(--accent); margin:0 0 4px; font-size:24px; }
.subtitle { color:var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; margin-bottom:16px; }
.card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; margin-bottom:14px; }
.card h3 { margin:0 0 10px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
.grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
.bar-row { display:grid; grid-template-columns: 110px 1fr 50px; gap:8px; align-items:center; margin-bottom:6px; font-size:12px; }
.bar-row .label { font-family: ui-monospace, "SF Mono", Menlo, monospace; color:var(--fg); }
.bar-row .bar { height:14px; border-radius:3px; }
.bar-row .num { text-align:right; color:var(--muted); font-variant-numeric: tabular-nums; }
.bar.ok { background:var(--ok); }
.bar.warn { background:var(--warn); }
.bar.error { background:var(--error); }
.bar.neutral { background:var(--link); }
table.tops { width:100%; border-collapse:collapse; font-size:12px; }
table.tops td { padding:5px 6px; border-bottom:1px solid var(--border); color:var(--fg); }
table.tops td.cid { font-family: ui-monospace, "SF Mono", Menlo, monospace; color:var(--muted); width:120px; }
table.tops td.kind { color:var(--muted); font-size:11px; width:80px; }
table.tops td.num { text-align:right; color:var(--muted); font-variant-numeric:tabular-nums; width:50px; }
table.tops tr { cursor:pointer; }
table.tops tr:hover td { background:var(--border); }
.attr-group { margin-top:14px; }
.attr-group h3 { margin:0 0 6px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
.prom { padding:10px 12px; border:1px solid var(--border); border-radius:6px; margin-bottom:6px; background:var(--panel); position:relative; }
.prom .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.pid { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; color:var(--muted); }
.content-text { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; margin-top:6px; word-break:break-word; color:var(--fg); white-space:pre-wrap; }
.prov { display:none; font-size:11px; color:var(--muted); margin-top:6px; font-family: ui-monospace, "SF Mono", Menlo, monospace; white-space:pre-wrap; border-top:1px dashed var(--border); padding-top:6px; }
.prom:hover .prov { display:block; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { display:inline-block; padding:3px 9px; border-radius:12px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:11px; cursor:pointer; background:var(--border); border:1px solid var(--border); color:var(--link); }
.chip:hover { background:var(--accent); color:var(--fg); border-color:var(--accent); }
.badge { padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
.badge.ok    { background:var(--ok-bg);    color:var(--ok); }
.badge.warn  { background:var(--warn-bg);  color:var(--warn); }
.badge.error { background:var(--error-bg); color:var(--error); }
.badge.gap   { background:var(--error-bg); color:var(--error); }
.empty { color:var(--muted); font-style:italic; font-size:12px; }
textarea.notes { width:100%; min-height:100px; background:var(--bg); color:var(--fg); border:1px solid var(--border); border-radius:6px; padding:10px; font:inherit; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:12px; resize:vertical; }
button.save { margin-top:8px; padding:8px 16px; background:var(--accent); color:#fff; border:0; border-radius:6px; cursor:pointer; font:inherit; font-weight:600; }
button.save:hover { background:#ff5570; }
button.save:disabled { background:var(--border); cursor:not-allowed; color:var(--muted); }
table.gaps { width:100%; border-collapse:collapse; font-size:12px; background:var(--panel); border:1px solid var(--border); border-radius:6px; overflow:hidden; }
table.gaps th, table.gaps td { padding:7px 10px; text-align:left; border-bottom:1px solid var(--border); color:var(--fg); }
table.gaps th { background:var(--border); font-size:10px; text-transform:uppercase; color:var(--muted); }
table.gaps tr:hover td { background:var(--border); cursor:pointer; }
table.gaps td.cid, table.gaps td.pid { font-family: ui-monospace, "SF Mono", Menlo, monospace; color:var(--muted); }
h3.gap-header { margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); }
.source-tag { font-size:10px; color:var(--muted); font-family: ui-monospace, "SF Mono", Menlo, monospace; margin-left:8px; }
</style>
</head>

on as a single\nJSONL line. The journal is diagnostic, not authoritative: callers should\nNOT fail user-visible operations if :func:`append` raises.\n\nAtomicity\n---------\nWrites use ``O_APPEND`` with an explicit ``fsync``. On POSIX, ``write()``\nto an ``O_APPEND`` file descriptor is atomic for line-sized payloads\n(\u2264 ``PIPE_BUF``, \u2265 4 KiB on Linux/macOS) \u2014 concurrent writers cannot\ninterleave partial lines. The plan called for a \"tmp + rename\" pattern\nbut that is inherently incompatible with append semantics (\"never\ntruncates\"); ``O_APPEND`` is the standard, portable answer.\n\nDirectory creation is idempotent \u2014 the ``.architecture/`` directory is\ncreated on demand (``parents=True, exist_ok=True``). Existing sibling\nfiles (``sil.sqlite`` etc.) are never touched.\n\nDeterminism\n-----------\nTimestamps come from :func:`_now_iso` which honors\n``AMS_DETERMINISTIC_NOW`` \u2014 see the same helper in\n``architecture_model.sil.rollup`` for the established convention."], "gap_type": null, "id": "PR-3670fd3e3d41", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback.gates; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Append-only feedback journals for lifecycle events.\n\nThe ``feedback`` subpackage owns three JSONL journals under\n``<repo>/.architecture/``:\n\n* ``gates.jsonl`` \u2014 one line per :class:`~architecture_model.feedback.gates.GateEvent`\n  (Task 15).\n* ``drift.jsonl`` \u2014 one line per :class:`~architecture_model.feedback.drift.DriftSnapshot`\n  (Task 16).\n* ``test_results.jsonl`` \u2014 one line per :class:`~architecture_model.feedback.test_results.TestResultBatch`\n  (Task 17).\n\nAll writers are append-only and atomic-safe (write to a temp file in the\nsame directory, then rename over the target \u2014 POSIX rename is atomic on\nthe same filesystem). Journals are diagnostic, not authoritative: callers\nmust not fail user-visible operations if a journal write raises."], "gap_type": null, "id": "PR-3ec837d43afe", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["JUnit-XML ingest \u2192 :class:`TestResultBatch` (Phase 2 Task 17).\n\nParses a standard JUnit XML file (as produced by ``pytest --junit-xml``,\n``mvn test``, ``go test -v -json | ...``, etc.) into a\n:class:`~architecture_model.feedback.test_results.TestResultBatch` ready\nto hand to :func:`architecture_model.feedback.test_results.append`.\n\nOnly stdlib :mod:`xml.etree.ElementTree` is used \u2014 no external deps.\n\nJUnit dialect notes\n-------------------\nBoth single ``<testsuite>`` and wrapping ``<testsuites>`` roots are\naccepted. Attributes (``tests``, ``failures``, ``errors``, ``skipped``,\n``time``) are all optional; missing counters default to 0 and are then\nconsistency-checked (see :func:`ingest_junit`). ``<error>`` children on\na test case are treated as failures for the purposes of the roll-up\n(the shape spec has no ``errored`` field yet); the failure message\ncarries the child element's tag as a hint."], "gap_type": null, "id": "PR-e6b4b258d1f8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback.junit_ingest; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": ["DriftFlag", "DriftSnapshot"], "gap_type": null, "id": "PR-1302deb1744f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback.drift; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["GateEvent"], "gap_type": null, "id": "PR-b67a9097573b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback.gates; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-classes", "id": "PR-d8676ab87b61", "provenance": "pipeline_v3.containerize; src=src.architecture_model.feedback.junit_ingest; via=pipeline_v3.derive_promises", "status": "typed-gap"}]}, "gap_count": 2, "id": "COM chitecture_model.lifecycle.renderers.markdown; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["compute_artifact_spec_digest"], "gap_type": null, "id": "PR-adba69d11e7b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.artifact_spec; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["canonical_json", "canonical_yaml_load", "digest"], "gap_type": null, "id": "PR-b38e25d105c8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.serialization; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["current_root_digest", "generation_dir", "list_generations", "publish", "read_current_generation", "recover"], "gap_type": null, "id": "PR-b98e040d54bf", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.publication; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["register_all"], "gap_type": null, "id": "PR-c28b013594e4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.se_docs; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["build_graph", "mark_stale", "stale_report"], "gap_type": null, "id": "PR-cf86ec8c7e83", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.stale; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["iter_descendants", "load_package", "resolve"], "gap_type": null, "id": "PR-d793893b3a76", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.package; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["switch_current", "write_atomic", "write_tree_atomic"], "gap_type": null, "id": "PR-da4e9f543be0", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.atomic_store; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["compute_view_spec_digest"], "gap_type": null, "id": "PR-dc91c48d9e21", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.view_spec; via=pipeline_v3.derive_promises", "status": "open"}], "intent": [{"content": ["Crash-safe atomic file and tree writes.\n\nPurpose\n-------\nProvide primitives that ensure a target path never contains partially-written\ndata even under process crash, kill -9, or power loss (modulo fs guarantees).\n\nInvariants\n----------\n* A final target path is only ever created via ``os.replace`` from a fully\n  fsynced sibling temp file. Readers see either the previous state or the new\n  state, never a half-written one.\n* Temp/staging paths are removed on every error path.\n\nPlatform caveats\n----------------\n* Symlink swap in :func:`switch_current` is POSIX-only; Windows support is out\n  of scope for Phase 1.\n* Parent-directory fsync is best-effort and silently skipped on platforms that\n  do not support ``os.O_DIRECTORY``."], "gap_type": null, "id": "PR-088b3b18b89b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.atomic_store; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ModelSlice contract: curated view spec over an architecture model.\n\nPurpose\n-------\nA ``ModelSlice`` names a *reproducible curated subset* of an architecture\nmodel. Slice specs are the input to view synthesis and artifact\ngeneration: they answer \"which subset of the model, closed under which\nrules, is being rendered?\" A slice is a **contract**, not a rendering \u2014\nit stores selectors + closure policy, not resolved entities.\n\nInvariants\n----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\")``);\n  slices are immutable value objects safe to share across threads.\n* ``contract_version`` is pinned to :data:`SchemaVersions.MODEL_SLICE`.\n  Rejecting a mismatch is intentional: bumping the version REQUIRES a\n  migration that overrides the validator.\n* ``id`` is a slug (``[a-zA-Z0-9._-]+``) \u2014 spaces and empty strings are\n  rejected so slice ids can be embedded in filenames and URLs.\n* ``selectors`` must nominate at least one dimension; an empty slice has\n  no defined semantics.\n* When ``scope == \"federated\"`` the slice MUST bound its reach with at\n  least one of ``entity_ids``/``fblocks``/``layers`` \u2014 federated with no\n  bound is unbounded and forbidden.\n* The **digest** (see :func:`compute_slice_digest`) excludes\n  ``generated_at`` and ``signatures``: they are envelope metadata, not\n  content, and would otherwise defeat content-addressing.\n\nThread safety\n-------------\nInstances are frozen pydantic models. All functions in this module are\npure. Safe for concurrent read access.\n\nError taxonomy\n--------------\nConstruction failures raise :class:`pydantic.ValidationError` wrapping the\nunderlying :class:`ValueError`. This module does not define custom\nexception types."], "gap_type": null, "id": "PR-135c21ac7e9c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.model_slice; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Map a SemanticDiff onto the set of view families to invalidate.\n\nThe rule table is data; adding a rule is data-only, not code. Each rule\ndeclares a trigger (entity kind + operation + optional field set) and\nthe set of families it invalidates."], "gap_type": null, "id": "PR-1415776b738b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.invalidation; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Canonical serialization and content digest for lifecycle artifacts.\n\nPurpose\n-------\nProvide deterministic, byte-identical serialization of Python objects so\nthey can be content-addressed via cryptographic digest. This is the\nfoundation for revision identity, semantic diff, and signature slots in\nthe architecture lifecycle.\n\nInvariants\n----------\n* **Determinism.** ``canonical_json(x) == canonical_json(x)`` byte-for-byte\n  across processes, machines, Python versions, and dict insertion orders.\n* **NFC normalization.** All Unicode strings (both dict keys and string\n  values) are normalized to Unicode Normal Form C before encoding, so\n  visually identical strings hash to the same digest.\n* **Sorted keys.** Object keys are sorted lexicographically at every\n  nesting level.\n* **Compact.** No insignificant whitespace; separators are ``(\",\", \":\")``.\n* **UTF-8, no BOM.** ``ensure_ascii=False`` \u2014 Unicode passes through.\n\nForbidden types\n---------------\n* ``float`` \u2014 floating point representation is not stable across\n  platforms. Use ``int`` for exact integers.\n* ``decimal.Decimal`` \u2014 rejected in Phase 1 to keep the numeric surface\n  strictly integral. A future phase may add a canonical decimal encoding.\n* Non-string mapping keys \u2014 raise ``TypeError``.\n\nAccepted types\n--------------\n``int``, ``str``, ``bool``, ``None``, ``list``, ``tuple`` (encoded as\nJSON array), ``dict`` (string keys only).\n\nKey-path exclusion semantics\n----------------------------\n``exclude_paths`` is a sequence of tuples. Each tuple is a path of\nstring keys applied at successive nesting levels of ``dict`` values. For\nexample, ``exclude_paths=[(\"generated_at\",), (\"meta\", \"signatures\")]``\nstrips the top-level ``generated_at`` key AND the nested\n``meta.signatures`` key before serialization. Missing paths are silent\nno-ops. List/tuple traversal is not supported in Phase 1.\n\nThread safety\n-------------\nAll functions in this module are pure and thread-safe. They do not\nmutate their inputs."], "gap_type": null, "id": "PR-1cec9eeed3f2", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.serialization; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Reference-doc projectors \u2014 Phase 4-A Tasks 13-15.\n\nThese projectors surface promoted Interface entities (produced by\n:mod:`architecture_model.pipeline.endpoint_promotion`) as deterministic\nMarkdown references:\n\n* ``family6.cli_reference`` \u2014 CLI commands grouped by framework.\n* ``family6.api_reference`` \u2014 HTTP routes grouped by method.\n* ``family6.plugin_guide`` \u2014 plugin hooks grouped by entry-point group.\n\nAll three follow the same conventions established by\n``nonse.py``: single ``DiagramSpec`` per projector with\n``id=f\"prose:{name}\"``, ``facets={\"content_kind\": \"markdown\", \"body\": ...}``.\nEmpty inputs render a stable \"No X\" placeholder so downstream consumers\ncan distinguish \"not applicable\" from missing data."], "gap_type": null, "id": "PR-2046e391fdb4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.reference_docs; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Concrete WriteBackProjector subclasses for Phase 4-A Tasks 3\u20136.\n\nEach subclass targets a specific doc family + set of semantic fields.\nAll variants share the same infrastructure (base view dispatch, prompt\nbuild, provider.structured, ModelPatch packing) \u2014 they differ only in\nwhich fields they author and which entity kinds they target.\n\nEntity-id filtering: LLM output is intersected with entities actually\npresent in the model fragment. Unknown ids (hallucinations) are dropped\nsilently so downstream apply steps never encounter dangling patches."], "gap_type": null, "id": "PR-205405e84687", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.write_back_variants; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Freshness constants for artifact provenance.\n\nA projected view / rendered artifact is:\n- ``\"fresh\"`` \u2014 was produced from the current model revision.\n- ``\"stale\"`` \u2014 was produced from an earlier revision and needs rebuild.\n- ``\"pending\"`` \u2014 scheduled for rebuild but not yet produced.\n\nThe `project()` function stamps `\"fresh\"` on outputs unconditionally at\nproduction time. Downstream invalidation (SemanticDiff \u2192 stale_families)\nflips the stored marker to `\"stale\"`; scheduling flips it to `\"pending\"`."], "gap_type": null, "id": "PR-3242bc63d8be", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.freshness; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["AI-context artifact renderer (T18 commit 2).\n\nPurpose\n-------\nRender a :class:`~architecture_model.lifecycle.view_projection.ProjectedView`\ninto a compact, LLM-friendly plain-text context payload summarizing the\nprojected DiagramSpec (nodes, edges, warnings, provenance).\n\nPurity contract\n---------------\nNo filesystem, network, environment, or logging side effects. Pure\nfunction of its inputs.\n\nAdaptation source\n-----------------\nThe historical LLM context formatter\n``architecture_model.integrations.llm_context.format_model_context``\nconsumes a full ``ArchitectureModel`` and is not currently present in\nthis tree. Rather than reconstruct a synthetic model from a DiagramSpec\n(lossy round-trip), this renderer emits a self-contained textual\nsummary directly from ``ProjectedView`` fields. This mirrors the pattern\nused by the HTML renderer in T18 commit 1.\n\nIf ``artifact.parameters`` carries ``max_tokens`` (int), the output is\nsoft-capped to roughly ``max_tokens * 4`` characters (a conventional\n~4 chars/token heuristic); unknown parameters are silently ignored.\n\nError taxonomy\n--------------\n* :class:`ValueError` \u2014 ``artifact.renderer`` is not ``\"ai-context\"``,\n  or a list of views is supplied but empty."], "gap_type": null, "id": "PR-383cba84c62c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.ai_context; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Semantic-intersection stale graph for the architecture lifecycle.\n\nPurpose\n-------\nBuild a directed acyclic graph (DAG) over lifecycle-object kinds\n(``package``, ``model``, ``manifest``, ``slice``, ``view``, ``artifact``) and\ncompute the set of nodes that become stale when a given set of source paths\nchanges. The graph is planning-only \u2014 nothing is executed or rebuilt.\n\nSemantic intersection\n---------------------\nEach node declares ``owned_paths`` \u2014 POSIX-style ``fnmatch`` glob patterns\nrelative to the package root. A node is *directly* invalidated only when a\nchanged path matches one of its own globs. Direct invalidation then\npropagates to all transitive descendants. A slice with\n``owned_paths=(\"core/**\",)`` is *not* invalidated by changes under\n``cli/`` \u2014 this is what makes the graph \"semantic\".\n\nNodes with an empty ``owned_paths`` tuple (and any kind other than\n``package``) are never invalidated by paths; they only become stale through\nan upstream input. This lets synthetic view/artifact nodes participate in\npropagation without pretending to own any code.\n\nInvariants\n----------\n* Node kind is a lowercase string from ``NODE_KINDS``. It is a soft enum so\n  later tasks (T13\u2013T18) can add ``slice``, ``view`` and ``artifact`` nodes\n  without modifying this module.\n* All returned collections (topological orders, stale-node lists, reason\n  dicts) are deterministic \u2014 internal iteration is over sorted node ids.\n* Cycle detection is performed by :meth:`DependencyGraph.topological_order`\n  and raises :class:`CycleError`.\n* :func:`stale_report` never raises on a missing cache; a corrupt cache is\n  silently discarded and regenerated.\n\nThread-safety\n-------------\nNot thread-safe. Callers must serialize concurrent access to a single\ngraph instance and to ``.architecture/stale.yaml``.\n\nError taxonomy\n--------------\n* :class:`CycleError` \u2014 raised on cycle detection.\n* :class:`KeyError` \u2014 raised by :meth:`DependencyGraph.add_edge` on unknown\n  node ids.\n* Package-loader errors from :mod:`architecture_model.lifecycle.package`\n  propagate unchanged."], "gap_type": null, "id": "PR-47e9d02d30c7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.stale; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Adapters wrapping architecture_model.docs non-SE generators as projectors.\n\nTask 7 of Phase 1 substrate-and-liveness plan. Heterogeneous signatures:\neach adapter constructs the required args from the fragment. For\nmulti-entity generators (component_spec, behavior_spec) outputs are\naggregated across all entities and joined with '\\n\\n---\\n\\n' so each\nfamily<N>.<name> maps to a single deterministic body."], "gap_type": null, "id": "PR-55c6d829ec85", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.nonse; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Adapters wrapping architecture_model.docs.diagrams generators as projectors.\n\nTask 7 of Phase 1 substrate-and-liveness plan. Follows the Task 6 SE-docs\npattern: uniform `(fragment, config) -> DiagramSpec` adapter. Emits\n``facets[\"content_kind\"] = \"mermaid\"`` so downstream renderers can\ndistinguish diagram bodies from prose."], "gap_type": null, "id": "PR-5a6b1e915dad", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.mermaid; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Cross-process file locks with timeout and stale-lock reclaim.\n\nPurpose\n-------\nCoordinate mutually exclusive access to filesystem-backed resources\n(e.g., a package staging area) across processes on the same host.\n\nInvariants\n----------\n* Uses advisory ``fcntl.flock`` (POSIX). Non-POSIX platforms raise\n  :class:`NotImplementedError` on enter.\n* On acquire, the lock file contains ``pid\\nhostname\\ntimestamp\\n`` so stale\n  locks can be detected.\n* Non-reentrant: a second acquire from the same process on the same lock file\n  blocks or times out like any other contender.\n* Stale locks (mtime older than ``stale_after`` seconds AND holder PID dead)\n  are reclaimed with a :class:`StaleLockReclaimed` warning.\n\nPlatform scope\n--------------\nPOSIX only in Phase 1. Multi-host coordination (NFS advisory quirks) is out of\nscope."], "gap_type": null, "id": "PR-5c0743f78839", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.locks; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ViewSpec contract: curated view over a ModelSlice, bound to a projector.\n\nPurpose\n-------\nA ``ViewSpec`` names a *reproducible rendering intent* over an immutable\n``ModelSlice`` revision. It answers \"which projector + configuration should\nrender which slice, in what kind of output?\" A ViewSpec is a **contract**,\nnot a rendered artifact \u2014 the actual ``DiagramSpec`` / prose / table is\nproduced by the projector at runtime (T16).\n\nInvariants\n----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\")``);\n  view specs are immutable value objects safe to share across threads.\n* ``contract_version`` is pinned to :data:`SchemaVersions.VIEW_SPEC`.\n  Rejecting a mismatch is intentional: bumping the version REQUIRES a\n  migration that overrides the validator.\n* ``id`` is a slug (``[A-Za-z0-9._-]+``) \u2014 spaces and empty strings are\n  rejected so view ids can be embedded in filenames and URLs.\n* ``slice_ref.model_revision`` is REQUIRED and non-empty. A ViewSpec is\n  bound to an *immutable slice revision*: without a revision the view has\n  no reproducible input and thus no reproducible output. This is a\n  critical spec property; do not relax it.\n* ``projector`` is a non-empty string. Registry membership is enforced at\n  runtime by the projector registry (T16), not by the schema.\n* ``output_content_kind`` is one of ``diagram``/``prose``/``table``.\n* The **digest** (see :func:`compute_view_spec_digest`) excludes\n  ``generated_at`` and ``signatures``: they are envelope metadata, not\n  content, and would otherwise defeat content-addressing.\n\nThread safety\n-------------\nInstances are frozen pydantic models. All functions in this module are\npure. Safe for concurrent read access.\n\nError taxonomy\n--------------\nConstruction failures raise :class:`pydantic.ValidationError` wrapping the\nunderlying :class:`ValueError`. This module does not define custom\nexception types."], "gap_type": null, "id": "PR-5ced95e34cd5", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.view_spec; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["HTML shell renderer for the interactive pipeline dashboard."], "gap_type": null, "id": "PR-6dc1aa69dc03", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.pipeline_html; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Lifecycle package: identity, serialization, packages, revisions, slices, views, artifacts, gates."], "gap_type": null, "id": "PR-7c659f9086c6", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Markdown artifact renderer.\n\nPurpose\n-------\nProduce a minimal, deterministic markdown document that summarises a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView`.\n\nThe document contains:\n\n* A title (``parameters['title']`` if supplied, otherwise\n  ``view.diagram_spec.title``, otherwise the view id).\n* A metadata block: view id, slice id, model revision, projector and\n  projector version (from ``view.provenance``).\n* A fenced code block with the diagram source. If the DiagramSpec\n  carries a ``mermaid`` string in ``facets['mermaid']`` we use that\n  (``mermaid`` fence); otherwise a compact text listing of nodes and\n  edges (``text`` fence). This is intentionally minimal \u2014 richer\n  diagram-in-markdown embedding is out of scope for T18 commit 1.\n* A warnings summary listing every entry of ``view.warnings``.\n\nPurity contract\n---------------\nNo filesystem, network, environment, or logging side effects. Pure\nfunction of its inputs; safe for concurrent use.\n\nAdaptation source\n-----------------\nNo existing markdown adapter in the tree owns this responsibility (the\ncore ``visualize._md_to_html`` converts markdown *to* HTML \u2014 the opposite\ndirection). This module therefore implements a small, self-contained\nmarkdown emitter directly. If a shared markdown emitter is introduced\nlater, this renderer should be refactored to delegate.\n\nError taxonomy\n--------------\n* :class:`ValueError` \u2014 ``artifact.renderer`` is not ``\"markdown\"``, or a\n  list of views is supplied but empty."], "gap_type": null, "id": "PR-91d58dafbafd", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.markdown; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Semantic diff over architecture models, manifests, and child revisions.\n\nPurpose\n-------\nProvide a complete, deterministic diff between two architecture-lifecycle\nsnapshots. Covers:\n\n* All entity kinds present on :class:`architecture_model.core.types.Entities`\n  (discovered reflectively via :func:`dataclasses.fields`).\n* All relationship attributes (identity key = ``(from, to, type)``; any\n  attribute delta becomes a ``changed`` entry).\n* Manifest ground truth (files, symbols by fully-qualified name, symbol\n  signatures).\n* Child sub-architecture revisions (added / removed / revision changed).\n* Git provenance propagation when both models carry\n  ``meta.provenance.git_commit``.\n\nInvariants\n----------\n* Deterministic ordering \u2014 all list outputs are lexicographically sorted.\n* Missing inputs (``manifest_*=None`` or ``child_revisions_*=None``)\n  produce empty structures, never ``None``.\n* Field equality uses canonical JSON (NFC, sorted-keys) via\n  :mod:`architecture_model.lifecycle.serialization` so nested dict/list\n  equality is order-insensitive.\n* Pydantic v2, ``extra=forbid``: unknown fields on any diff container\n  raise ``ValidationError``.\n\nThread safety\n-------------\nPure functions; no shared mutable state. Safe to call concurrently.\n\nError taxonomy\n--------------\n* Unsupported entity attribute types propagate ``TypeError`` from\n  :func:`canonical_json`.\n* Malformed inputs (non-``ArchitectureModel``) raise ``AttributeError``\n  from the reflective walk \u2014 callers must supply parsed models."], "gap_type": null, "id": "PR-92a307ab26f4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.diff; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Build the JSON payload consumed by the pipeline-dashboard HTML shell.\n\nThe output shape is intentionally simple and JSON-serializable so it can be\nembedded directly into an interactive HTML view:\n\n    {\n      \"nodes\":  [{\"id\", \"name\", \"kind\", ...}, ...],\n      \"edges\":  [{\"from\", \"to\", \"type\"}, ...],\n      \"badges\": {node_id: {validation_score?, invocations_7d?, ...}, ...},\n    }\n\nThe SIL store is duck-typed: any object exposing\n``rollup(component_id) -> dict | None`` is accepted. Passing ``None``\nyields an empty badges dict \u2014 the AMS builder has no dependency on OCA."], "gap_type": null, "id": "PR-93b33d086af4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.pipeline_html_data; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SVG artifact renderer.\n\nPurpose\n-------\nRender a :class:`~architecture_model.lifecycle.view_projection.ProjectedView`\ninto deterministic, standalone SVG bytes.\n\nPurity contract\n---------------\nThis function performs NO filesystem, network, environment, or logging\nside effects. It is a pure function of its inputs and safe for\nconcurrent use.\n\nAdaptation source\n-----------------\nWraps :func:`architecture_model.core.diagram_renderer.render_diagram_svg`,\nextracting the ``DiagramSpec`` from ``view.diagram_spec`` and encoding\nthe returned string as UTF-8. The upstream renderer is treated as an\nopaque, deterministic, dependency-free SVG string generator.\n\nError taxonomy\n--------------\n* :class:`ValueError` \u2014 ``artifact.renderer`` is not ``\"svg\"``, or a list\n  of views is supplied but empty."], "gap_type": null, "id": "PR-9a7ceca0f82a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.svg; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Frozen contract versions for the architecture lifecycle.\n\nThis module is the single source of truth for the schema version of every\npersisted artifact in the architecture lifecycle: models, packages,\nmanifests, model slices, view specs, artifact specs, and AI work orders.\n\nInvariants:\n\n* Every persisted artifact declares a ``schema_version`` matching the\n  constant defined here for its :class:`ContractKind`.\n* Bumping any constant in this module REQUIRES a matching migration in\n  ``architecture_model.lifecycle.migrations`` and a documented terminology\n  update in ``terminology.md``.\n* The ``DIGEST_ALGO`` constant identifies the canonicalization + hash\n  algorithm used to compute content-addressed revisions; changing it is a\n  breaking change for every stored revision id.\n* Enum values are hyphen-cased lowercase strings so they round-trip\n  cleanly through JSON Schema ``enum`` declarations without translation."], "gap_type": null, "id": "PR-9aeb358f0987", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.versions; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Overlay-aware projector helper (Phase 2 Task 14).\n\nAn *overlay* is a named supplementary decoration folded onto a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView` in\ndeclared order. Overlays let a single projector emit a base diagram (from\nthe architecture model alone) and then be augmented with runtime signals\n(SI&L rollups, drift flags, gate outcomes) sourced from the\n:class:`~architecture_model.lifecycle.model_slice_materializer.MaterializedSlice`\nsupplementary fragments.\n\nDesign contract\n---------------\n* Order-preserving: overlays are applied in the exact order declared on\n  :attr:`ViewCuration.overlays`. Later overlays may see facets written by\n  earlier ones but MUST NOT clobber unrelated keys.\n* Silent skip for unknown names: this keeps the pipeline deterministic\n  when overlays are declared but not yet implemented (Task 15-17 land the\n  gates/drift/test_results backing journals).\n* Silent skip for missing fragments: if a fragment is ``None`` or absent\n  from ``supplementary_fragments`` the overlay is a no-op.\n* Purity: returns a NEW :class:`ProjectedView`; the input view is not\n  mutated. The wrapped :class:`DiagramSpec`'s ``facets`` dict is\n  copied and augmented; ``nodes`` / ``edges`` / other structural fields\n  are shared by reference (safe \u2014 DiagramSpec is treated as immutable at\n  this layer).\n\nFacet layout\n------------\nAll overlay output is written under the reserved facet key\n``\"overlays\"`` as a mapping ``{overlay_name: overlay_payload}``. This\nkeeps overlays namespaced away from projector-native facet keys and\nmakes the applied overlay set trivially inspectable.\n\nAdditionally, the ordered list of *applied* overlay names (recognized\noverlays whose fragment was available) is written to\n``facets[\"applied_overlays\"]``. Declared-but-unrecognized or\ndeclared-but-empty overlays are NOT listed there."], "gap_type": null, "id": "PR-9f9b766b304a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.overlays; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Transactional package publication with generation-based storage.\n\nPurpose\n-------\nPublish an architecture package as an immutable, content-addressed\n\"generation\" directory and atomically switch a ``CURRENT`` symlink to point\nat it. Every publication is journaled so an interrupted publish can be\ndetected and cleaned up post-crash.\n\nLayout on disk::\n\n    <package_root>/\n      package.yaml\n      generations/\n        0000001/\n          model/.architecture-model.yaml\n          manifest/manifest.json\n          slices/...             (optional bundle inputs)\n          views/...              (optional)\n          artifacts/...          (optional)\n          digest.json            (auto-written)\n        0000002/\n          ...\n      CURRENT -> generations/0000002    (symlink)\n      .locks/publication.lock            (FileLock file)\n\nInvariants\n----------\n* A generation directory, once committed, is immutable \u2014 never rewritten.\n* ``CURRENT`` is switched atomically (temp symlink + ``os.replace``).\n* The journal is the source of truth for crash recovery: a\n  ``package.publish.begin`` without a matching commit/abort means the\n  publish was interrupted.\n* Per-file digests are computed on raw bytes with sha256; the root digest\n  is the canonical-JSON digest of ``{\"files\": <sorted map>}``.\n* ``digest.json`` bytes are added to the tree AFTER the root digest is\n  fixed; the map inside ``digest.json`` does not include ``digest.json``\n  itself.\n\nLocking\n-------\nA single ``FileLock`` at ``<pkg>/.locks/publication.lock`` serializes\nconcurrent publishers on the same host. On timeout the specialized\n:class:`PublicationLockTimeout` is raised.\n\nNon-goals (Phase 1)\n-------------------\n* Garbage collection of old generations \u2014 future retention task.\n* Cross-host coordination \u2014 same limitations as :class:`FileLock`.\n* Rollback of ``CURRENT`` \u2014 recovery only cleans staging leftovers."], "gap_type": null, "id": "PR-a0c14d042749", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.publication; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Adapters wrapping architecture_model.docs.se generators as projectors.\n\nEach adapter takes ``(fragment: ArchitectureModel, config: dict)`` per the\nProjectorFn contract and returns a ``DiagramSpec`` whose Markdown body is\nstashed in ``facets[\"body\"]`` with ``facets[\"content_kind\"] = \"markdown\"``.\n\nDesign note (2026-09-08): Phase 1 intentionally overloads DiagramSpec to\ncarry prose content pending Phase 2's ProseSpec / RenderedContent union.\nThe ``facets[\"content_kind\"]`` discriminator lets downstream renderers\n(and Task 8+ invalidation) distinguish diagram vs prose views."], "gap_type": null, "id": "PR-a394a6875b9e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.se_docs; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Canonical package ownership + shared-file declarations.\n\nPurpose\n-------\nEvery source file in an architecture package tree must have a single\ncanonical owner package. This module computes the mapping from file paths\nto owner ``architecture_id`` s, enforces that overlap is only permitted\nwhen explicitly declared via ``shared_paths``, and records\nslug-remap provenance so renames remain auditable.\n\nKey rules\n---------\n* A file is \"claimed\" by a package when it matches any pattern in that\n  package's ``owned_paths``. Patterns are POSIX-style globs interpreted\n  via :func:`fnmatch.fnmatchcase`, applied to the file's path *relative\n  to the claiming package's own root* (not the source root).\n* If multiple packages claim the same file, the overlap is legal only\n  when at least one of them declares a matching ``shared_paths`` entry\n  whose ``owners`` set exactly equals the claimants. Any other overlap\n  is a conflict.\n* Files matched by no ``owned_paths`` pattern are recorded as\n  ``unowned``. Callers decide whether that's an error.\n\nInvariants\n----------\n* Deterministic output: ``files`` is sorted lexicographically by path;\n  ``conflicts`` and ``unowned`` are also sorted by path. Two runs on the\n  same tree return identical results.\n* No filesystem writes except from :func:`record_remap`. Ownership\n  computation is a pure read of the on-disk tree.\n\nExcluded from the walk (never appear in ``files`` or ``unowned``):\n    * any directory named ``__pycache__``\n    * any directory whose name starts with ``.`` (covers ``.git``,\n      ``.architecture``, ``.architecture-models`` and similar tool dirs)\n    * any file with the ``.pyc`` suffix"], "gap_type": null, "id": "PR-a3f6bc423b41", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.ownership; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Supplementary-data loaders for MaterializedSlice (Phase 2 Task 10).\n\nA :class:`~architecture_model.lifecycle.model_slice.SupplementaryRef` on a\nslice names an out-of-model data source. This module owns the loaders\nthat resolve each ``kind`` to a bounded fragment attached to\n``MaterializedSlice.supplementary_fragments``.\n\nPhase 2 Task 10 lands ``sil`` end-to-end (reads\n``.architecture/sil.sqlite``). The remaining kinds (``gates``, ``drift``,\n``test_results``, ``learning``) are wired as stubs that emit\n``SLICE.SUPPLEMENTARY_NOT_AVAILABLE`` warnings; their real backing stores\nland in Tasks 15-17 (ams-side journals) and the arch-agent learning\nstore.\n\nAll fragments are frozen dataclasses. All loaders are pure and\nside-effect-free (read-only SQLite in the sil case)."], "gap_type": null, "id": "PR-a7b94cd69691", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.supplementary_loaders; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ZIP bundle artifact renderer (T18 commit 2).\n\nPurpose\n-------\nAggregate multiple already-rendered artifact byte payloads into a single\ndeterministic ZIP archive, together with a ``manifest.json`` describing\nthe bundle contents and their sha256 digests.\n\nPurity contract\n---------------\nWrites to an in-memory :class:`io.BytesIO` \u2014 no filesystem, network,\nenvironment, or logging side effects.\n\nSignature difference\n--------------------\nUnlike the per-view renderers (``svg``, ``markdown``, ``html``,\n``ai-context``), :func:`render_zip` needs an out-of-band way to fetch\nthe bytes of each sibling artifact named in ``artifact.bundle_refs``.\nIt therefore takes a keyword-only ``resolve_artifact`` callable:\n\n    resolve_artifact(bundle_ref_id: str) -> bytes\n\nIf ``resolve_artifact`` is ``None`` the renderer raises\n:class:`ValueError`. If the callable returns ``None`` or raises\n:class:`KeyError` for a given id, :class:`BundleResolutionError` (a\n:class:`ValueError` subclass) is raised.\n\nRegistry entry\n--------------\n:func:`render_zip` is registered under the ``\"zip\"`` key of\n:data:`architecture_model.lifecycle.renderers.DEFAULT_RENDERERS` so\ncallers can discover it uniformly, but invoking it via the ordinary\n``(view, artifact)`` registry call signature will raise ``ValueError``\nbecause ``resolve_artifact`` cannot be supplied that way. Phase 2\norchestrators are expected to detect ``renderer == \"zip\"`` and invoke\n:func:`render_zip` directly with the resolver.\n\nDeterminism\n-----------\n* Every ZipInfo ``date_time`` is fixed to the ZIP epoch minimum\n  ``(1980, 1, 1, 0, 0, 0)``.\n* Bundle entries and manifest ``bundles`` are sorted by id.\n* The manifest ``produced_at`` timestamp is the only source of\n  nondeterminism between calls; tests freeze\n  :func:`datetime.datetime.now` to compare byte-identical output."], "gap_type": null, "id": "PR-a823269d9eb1", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.zip; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ArchitecturePackage descriptor and recursive loader.\n\nA ``package.yaml`` file marks a self-contained architecture package: it\nnames the package, points at the package's canonical model and reality\nmanifest, and lists any nested child packages. Packages compose into a\ntree; every architecture_id in that tree must be unique and the tree\nmust be acyclic.\n\nThis module provides:\n\n* :class:`ArchitecturePackage` \u2014 the pydantic descriptor model.\n* :func:`load_package` \u2014 parse one ``package.yaml`` (no recursion).\n* :func:`iter_descendants` \u2014 depth-first traversal with cycle and\n  duplicate-id detection.\n* :func:`resolve` \u2014 look up a package by architecture_id."], "gap_type": null, "id": "PR-b7e95b909b37", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.package; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Drill-down link emission for root-family projectors (Phase 3 Task 16).\n\nEvery root-family view (``family3.component_diagram``,\n``family6.icd``, etc.) lists a subset of the model's entities in its\nrendered body. This module supplies a ``drill_to`` map \u2014 a dict of\n``{entity_id: \"familyN.entity_page:entity_id\"}`` \u2014 that root-family\nadapters attach to their :class:`DiagramSpec` facets. Renderers may\nlater use these to emit hyperlinks or hover targets. The map has no\nvisual effect on the rendered body itself.\n\nCoverage per family mirrors the ``EntityPageProjector`` dispatch\nmatrix in ``entity_pages.py``:\n\n* family1 \u2014 actor, capability, behavior, interface, constraint, layer, component\n* family2 \u2014 capability, component, behavior\n* family3 \u2014 component, layer\n* family4 \u2014 behavior, actor\n* family5 \u2014 component, environment, resource\n* family6 \u2014 interface, component\n* family7 \u2014 component, capability, behavior, interface, constraint\n* family8 \u2014 component, capability, interface"], "gap_type": null, "id": "PR-bdb0913f62b8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.drill; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Deterministic schema migration framework for lifecycle contracts.\n\nPurpose\n-------\nProvide a deterministic, auditable mechanism to bump a persisted\nlifecycle payload from an older ``contract_version`` to the current\nschema version declared in\n:mod:`architecture_model.lifecycle.versions`.\n\nInvariants\n----------\n* Exactly one migration may be registered per ``(kind, from_version)``.\n  This guarantees a single, deterministic forward path.\n* Every migration step MUST update ``contract_version`` to its declared\n  ``to_version``. Steps that forget to bump the version are rejected.\n* Migration provenance is APPENDED to ``payload[\"meta\"][\"migration_chain\"]``\n  and is NEVER overwritten. Prior chain entries are preserved verbatim.\n\nNon-goal\n--------\nThis module is the framework only. Phase 1 ships with an empty registry:\nconcrete migrations are added when a schema version actually bumps."], "gap_type": null, "id": "PR-c3798c678951", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.migrations; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["HTML artifact renderer.\n\nPurpose\n-------\nWrap the SVG rendering of a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView` in a\nminimal, self-contained HTML5 document that can be opened in any browser\nwithout external assets.\n\nPurity contract\n---------------\nNo filesystem, network, environment, or logging side effects. Pure\nfunction of its inputs.\n\nAdaptation source\n-----------------\nThe full-featured HTML viewer in\n:func:`architecture_model.core.visualize.generate_html_viewer` is\npurpose-built for interactive multi-view browsing, requires a model +\nproject root, and *writes to disk*. It is unsuitable as a per-artifact\nrenderer bound to a single :class:`ProjectedView`.\n\nThis module therefore delegates SVG generation to\n:func:`architecture_model.core.diagram_renderer.render_diagram_svg` (via\n:mod:`architecture_model.lifecycle.renderers.svg`) and wraps the result\nin a small deterministic HTML skeleton. If a shared, in-memory HTML\ndocument builder is later extracted from ``visualize``, this renderer\nshould delegate to it.\n\nError taxonomy\n--------------\n* :class:`ValueError` \u2014 ``artifact.renderer`` is not ``\"html\"``, or a\n  list of views is supplied but empty."], "gap_type": null, "id": "PR-c46b3c826397", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.html; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ViewSpec projector registry and pure projection (T16).\n\nPurpose\n-------\nThis module turns a :class:`~architecture_model.lifecycle.view_spec.ViewSpec`\nplus a matching :class:`~architecture_model.lifecycle.model_slice_materializer.MaterializedSlice`\ninto a :class:`ProjectedView` carrying a\n:class:`~architecture_model.core.diagram_spec.DiagramSpec`.\n\nA **projector** is a pure callable ``(model_fragment, projector_config) ->\nDiagramSpec``. Projectors are registered by name in a\n:class:`ProjectorRegistry`; the module-level :data:`DEFAULT_REGISTRY` is\nseeded with adapters for the four canonical Systems-Engineering views\n(``se.conops``, ``se.functional``, ``se.logical``, ``se.use_cases``) that\ndelegate to :mod:`architecture_model.core.se_view_projectors` without\nmodifying it.\n\nContract for projector implementations\n--------------------------------------\n* MUST be a pure function of ``(model_fragment, projector_config)``. It\n  MUST NOT read the filesystem, network, environment variables, or any\n  model outside the provided fragment. This is a documented contract; it\n  is not (and cannot be) enforced by the runtime.\n* MUST return a :class:`DiagramSpec` instance. Any other return value\n  causes :func:`project` to raise :class:`TypeError`.\n* SHOULD be deterministic: given equal ``(model_fragment,\n  projector_config)`` it MUST produce equal DiagramSpecs.\n\nInvariants\n----------\n* :func:`project` verifies that\n  ``view.slice_ref.slice_id == materialized_slice.slice_id`` and\n  ``view.slice_ref.model_revision == materialized_slice.model_revision``\n  before invoking the projector. Mismatches raise :class:`SliceMismatch`,\n  enforcing the \"ViewSpec bound to immutable slice revision\" invariant\n  established by T15.\n* :func:`project` passes a shallow copy of ``view.projector_config`` to\n  the projector so any mutation performed inside the projector cannot\n  leak back into the frozen ViewSpec.\n* The ``provenance`` dict on the returned :class:`ProjectedView` records\n  ``projector``, ``projector_version``, ``produced_at`` (RFC3339 UTC with\n  ``Z`` suffix), and ``slice_digest`` (currently the materialized\n  slice's ``model_revision``). Everything except ``produced_at`` is\n  deterministic across repeated calls.\n* Warnings from the :class:`MaterializedSlice` are surfaced as strings of\n  the form ``\"<code>: <message>\"`` on ``ProjectedView.warnings`` so\n  downstream renderers can present them without importing lifecycle\n  types.\n\nThread safety\n-------------\n:class:`ProjectorRegistry` mutations (``register``/``unregister``) are\nNOT thread-safe in this phase. The intended usage is: seed\n:data:`DEFAULT_REGISTRY` at import time (single-threaded) and treat it\nas read-only afterwards. :func:`project` itself is a pure function and\nsafe for concurrent use once the registry is quiescent.\n\nError taxonomy\n--------------\n* :class:`ProjectorNotFound` (subclass of :class:`KeyError`) \u2014 unknown\n  projector name in :func:`ProjectorRegistry.get` or :func:`project`.\n* :class:`SliceMismatch` (subclass of :class:`ValueError`) \u2014 the ViewSpec\n  references a slice_id / model_revision that does not match the\n  materialized slice supplied to :func:`project`.\n* :class:`TypeError` \u2014 the registered projector returned a value that is\n  not a :class:`DiagramSpec`."], "gap_type": null, "id": "PR-d38323fe3286", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.view_projection; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Root architecture package index.\n\nPurpose\n-------\nProvide a fast, deterministic lookup table from ``architecture_id`` / slug /\nsource-file path to the on-disk package that owns it. Instead of re-walking\nthe package tree on every query, callers rebuild the index once after any\nstructural change and then consume it as a flat list.\n\nThe index lives at ``<repo_root>/.architecture/package-index.yaml`` by\nconvention. Tests may override the location via ``index_path``.\n\nInvariants\n----------\n* The index file is written via :func:`atomic_store.write_atomic`, so\n  readers never observe a partially written index.\n* Every rebuild records an ``index.rebuild.commit`` event on the journal\n  at ``<repo_root>/.architecture/journal.jsonl``.\n* Entries are sorted by ``slug`` for byte-stable output.\n* ``entry.root`` is a POSIX-style path *relative to* ``repo_root``.\n* ``contract_version`` matches :data:`SchemaVersions.PACKAGE`.\n\nNon-goals\n---------\n* Federated cross-repo indexes \u2014 Phase 1 indexes one repo root at a time.\n* Generation tracking \u2014 ``current_generation`` is always ``None`` here;\n  Task 8 populates it once revision publishing exists."], "gap_type": null, "id": "PR-d4842576f6b6", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.package_index; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Renderer registry for lifecycle artifacts (T18).\n\nEach renderer is a pure callable ``(ProjectedView | list[ProjectedView],\nArtifactSpec) -> bytes``. Renderers MUST:\n\n* Perform no filesystem, network, environment, or logging side effects.\n* Accept a single :class:`ProjectedView` or a list (first element used;\n  empty list raises :class:`ValueError`).\n* Reject an :class:`ArtifactSpec` whose ``renderer`` field does not match\n  the renderer's own name (raises :class:`ValueError` with\n  ``renderer mismatch: expected 'X', got 'Y'``).\n* Return ``bytes``.\n\nThe two aggregating renderers (``ai-context``, ``zip``) are added in\nT18 commit 2 and are not registered here yet."], "gap_type": null, "id": "PR-d542b0c0a963", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Model/manifest revision pairing helpers.\n\nPurpose\n-------\nEnforce an immutable one-to-one binding between an architecture model\nand its reality manifest. A model captures intent (capabilities,\ncomponents, relationships); a manifest captures ground truth (AST-derived\nmodules, functions, imports). Because a model's meaning is anchored in\nthe manifest it was authored against, the two artifacts must travel\ntogether and mutations to either must be detectable.\n\nThis module supplies pure helpers to:\n\n* compute stable content digests for models and manifests, excluding\n  volatile bookkeeping fields;\n* stamp a matching pair with cross-references (``model.meta.manifest_digest``\n  and ``manifest.pairing.model_digest``);\n* verify that a given (model, manifest) pair is still consistent.\n\nInvariants\n----------\n* **Idempotent stamp.** ``stamp_pairing`` may be called on already-stamped\n  inputs and produces the same digests, because pre-existing pointers are\n  stripped before recomputation.\n* **Volatile fields excluded.** Timestamps and detached signature blocks\n  do not participate in the digest, so re-serializing or re-signing does\n  not break pairing.\n* **Content addressed.** Digests are computed via the T2 canonical\n  serializer, so ``sha256-v1`` is the algorithm tag stored in\n  ``manifest.pairing.algo``.\n\nNon-goals\n---------\n* This module does **not** touch disk.\n* It does **not** wire into ``manifest.generator`` or ``core.parser``.\n  Future publishers may call these helpers; Phase 1 keeps them pure."], "gap_type": null, "id": "PR-d5e1fd6f38b7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.pairing; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ArtifactSpec contract: renderable artifact bound to a view or bundle.\n\nPurpose\n-------\nAn ``ArtifactSpec`` names a *renderable output* \u2014 SVG, markdown, HTML, an\nAI context bundle, or a zip package aggregating other artifacts. Each\nnon-zip artifact binds to exactly one :class:`ViewRef` (a view + a pinned\nmodel revision), which in turn identifies the immutable slice/model input.\nZip artifacts instead aggregate a list of sibling artifact ids.\n\nAn ArtifactSpec is a **contract** (not a rendered payload) that is\ncontent-addressable via :func:`compute_artifact_spec_digest`.\n\nMigration note\n--------------\nThis module owns ``ArtifactSpec``. The prior owner\n``opencode_arch.artifacts.selector`` will become a compatibility import\nshim in a follow-up (opencode-arch Phase 2). Downstream imports should\nbe updated to ``architecture_model.lifecycle.artifact_spec``.\n\nInvariants\n----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\")``);\n  ArtifactSpec/ViewRef/SignatureSlot are immutable value objects safe to\n  share across threads.\n* ``contract_version`` is pinned to :data:`SchemaVersions.ARTIFACT_SPEC`;\n  mismatch raises :class:`ValueError` (wrapped by pydantic).\n* ``id`` and ``view_ref.view_id`` are slugs ``[A-Za-z0-9._-]+``. Each\n  entry of ``bundle_refs`` is also a slug.\n* ``renderer == \"zip\"`` iff ``bundle_refs`` is a non-empty list of slugs\n  AND ``view_ref is None``.\n* ``renderer != \"zip\"`` iff ``view_ref`` is present AND ``bundle_refs``\n  is either None or an empty list.\n* ``view_ref.model_revision`` is REQUIRED and non-empty when a\n  ``view_ref`` is present: a rendered artifact is bound to an *immutable\n  revision* of its view input; otherwise reproducibility is lost.\n\nDigest\n------\n:func:`compute_artifact_spec_digest` excludes:\n\n* ``generated_at`` \u2014 envelope metadata (not content).\n* ``signature_slots[*].signature`` \u2014 signature values are populated after\n  the digest is computed; the slot's ``algorithm``/``key_id`` remain part\n  of the identity (they declare which key is *expected* to sign).\n\nImplementation strategy: pre-strip ``signature`` fields in the payload\ncopy before delegating to\n``architecture_model.lifecycle.serialization.digest`` (which only\nsupports exclusion by exact key path, not glob-through-list). This is\nexplicit and directly unit-testable.\n\nThread safety\n-------------\nInstances are frozen pydantic models. All functions in this module are\npure. Safe for concurrent read access.\n\nError taxonomy\n--------------\nConstruction failures raise :class:`pydantic.ValidationError` wrapping\nthe underlying :class:`ValueError`. This module does not define custom\nexception types."], "gap_type": null, "id": "PR-dce9df16bb5f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.artifact_spec; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "missing-intent", "id": "PR-e1e68953dd65", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["``WriteBackProjector`` base class \u2014 Phase 4-A Task 1.\n\nWrite-back projectors are the LLM-authoring counterpart to the\ndeterministic Phase 1-3 projectors. A ``.llm`` variant sits alongside\nits deterministic sibling: the deterministic projector renders whatever\nsemantic content is already on the model; the write-back projector\ntakes the deterministic base view as input, prompts an\n:class:`~architecture_model.llm.provider.LLMProvider` for a structured\nauthoring payload, and packages the response as an\n:class:`~architecture_model.ai.proposals.ModelPatch` proposal ready for\n:func:`architect_proposal_apply` to persist.\n\nContract:\n\n1. ``base_projector_name`` (class attr) names the sibling deterministic\n   projector. The base view is dispatched from the provided ``registry``\n   (or :data:`DEFAULT_REGISTRY` when unset).\n2. Subclasses override three hooks:\n   - ``build_prompt(base_view, fragment, config) -> str``\n   - ``expected_proposal_schema() -> dict``\n   - ``pack_proposal(raw, fragment, config) -> Proposal``\n3. ``__call__`` composes: dispatch base \u2192 build prompt \u2192 provider\n   ``structured()`` \u2192 pack proposal \u2192 wrap in a ``DiagramSpec`` with\n   ``content_kind=\"ai_proposal\"``.\n\nNo LLM providers are imported at module load \u2014 a provider is passed via\nDI so tests inject mocks and the module remains offline-safe."], "gap_type": null, "id": "PR-e986d67b5191", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.write_back; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["EntityPageProjector base class with kind dispatch (Phase 3 Task 7).\n\nRather than register ``family1.entity_page.component``,\n``family1.entity_page.capability``, ... as separate projectors (14 kinds\n* 7 families = 98 names), each family registers a single\n``familyN.entity_page`` projector: an instance of a\n:class:`EntityPageProjector` subclass that dispatches internally by the\nscope entity's kind.\n\nScope info is injected into the projector config by\n:func:`architecture_model.lifecycle.view_projection.project` from the\nmaterialized slice's ``provenance['scope_metadata']`` for entity-scoped\nslices. The two keys consumed here are:\n\n* ``__scope_entity_id`` \u2014 the id from ``scope=entity(<id>)``.\n* ``__scope_entity_kind`` \u2014 the singular canonical kind\n  (``\"component\"``, ``\"capability\"``, ...).\n\nSubclasses set ``family: int`` and implement ``_project_<kind>(model,\nconfig) -> DiagramSpec`` for each supported kind. Unknown kinds raise\n``NotImplementedError`` \u2014 the base does not silently degrade.\n\nThe concrete family renderers land in Tasks 8-14; this file only ships\nthe dispatch scaffolding + tests."], "gap_type": null, "id": "PR-ea923ed38a41", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.entity_pages; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ModelSlice materializer: resolve a :class:`ModelSlice` contract into a\nconcrete :class:`MaterializedSlice` fragment.\n\nPurpose\n-------\nA :class:`ModelSlice` is a *contract* \u2014 selectors + closure policy. This\nmodule realizes that contract against an :class:`ArchitecturePackage` by\nloading the package's model (and, for ``scope == \"descendants\"``, its\ndescendants' models), applying selectors + curation, closing the\nrelationship set under the configured closure policy, and packaging the\nresult as a deterministic, content-addressable :class:`MaterializedSlice`.\n\nCommit-1 scope\n--------------\nThis commit implements ``scope`` \u2208 {``local``, ``descendants``} and\n``shared_refs == \"none\"``. ``scope == \"federated\"`` and\n``shared_refs`` \u2208 {``explicit``, ``transitive``} raise\n:class:`NotImplementedError` \u2014 they land in T14 commit 2.\n\nInvariants\n----------\n* The returned :class:`MaterializedSlice` is deterministic given a fixed\n  model + slice + wall-clock: fragment entities and relationships are\n  sorted by id / (from,to,type) so two calls yield equal fragments.\n* The dangling-relationship bug in the legacy\n  :mod:`architecture_model.core.slicer` (which keeps a relationship if\n  *either* endpoint is in the fragment) does **not** occur here: under\n  ``closure == \"strict\"`` a relationship is retained only when *both*\n  endpoints are in the fragment; otherwise it is dropped and a\n  ``SLICE.DANGLING_STRIPPED`` warning is recorded.\n* ``curation.include`` re-adds entities that selectors dropped; it is\n  applied *after* ``curation.exclude`` so a redundant include+exclude\n  pair yields exclusion (exclude wins on precedence).\n* ``curation.redactions`` clears descriptive fields (``description``,\n  ``rationale``, ``intent``) but preserves identity (``id``, ``name``,\n  ``kind``, ``status``).\n\nThread safety\n-------------\nPure functions; no module-level mutable state. :class:`MaterializedSlice`\nis a frozen dataclass. The materializer is safe to call concurrently\nprovided the underlying :class:`ArchitecturePackage` tree is not being\nmutated.\n\nError taxonomy\n--------------\n* :class:`NotImplementedError` \u2014 federated scope / shared_refs modes not\n  yet implemented.\n* :class:`FileNotFoundError` \u2014 the package's ``model_ref`` cannot be\n  resolved to a file (bubbled from :func:`load_model`).\n* :class:`ValueError` \u2014 a malformed selector value (bubbled from\n  underlying utilities).\n\nWarnings are non-fatal and surfaced via :attr:`MaterializedSlice.warnings`."], "gap_type": null, "id": "PR-eb9426bdfea7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.model_slice_materializer; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ArtifactSpec dependency DAG + rebuild plan generator.\n\nPurpose\n-------\nGiven a collection of :class:`ArtifactSpec` objects, build a directed\nacyclic graph over their bundle references and emit a topologically\nordered :class:`RebuildPlan` naming which artifacts must be rebuilt.\n\nDesign\n------\nThe DAG is *artifact-centric*: nodes are ArtifactSpecs and edges point\nfrom each entry in a zip artifact's ``bundle_refs`` to the zip itself\n(upstream leaf artifacts must be built before the zip that aggregates\nthem). Non-zip artifacts contribute nodes with no outgoing edges (their\nview/slice/model upstream chain is already modeled by\n:mod:`architecture_model.lifecycle.stale` and is exposed here only as\n``BuildStep.view_ref`` metadata).\n\nWe deliberately do **not** reuse\n:class:`architecture_model.lifecycle.stale.DependencyGraph`. That graph\ncarries ``owned_paths`` / ``inputs`` semantics tuned for path-based\ninvalidation across the full lifecycle graph (packages, models,\nmanifests, slices, views, artifacts). Here we need only artifact-to-\nartifact edges with cycle + missing-ref checks, so a small local DAG is\nclearer and avoids overloading upstream node ids.\n\nExecution\n---------\nThis module is planning-only. No artifact bytes are produced; execution\nis Phase 2."], "gap_type": null, "id": "PR-ef0afa57358e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.artifact_dag; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Recursive lifecycle gates for architecture packages.\n\nPurpose\n-------\nProvides a small, composable gate system that answers the question\n\"is this architecture package (and every descendant) fit to publish?\"\nEach :class:`Gate` inspects a single :class:`ArchitecturePackage` and\nreturns a :class:`GateResult`. :func:`evaluate_tree` recurses the\npackage tree, collects per-package results, and lifts any blocking\nchild finding up to the root with breadcrumbs so callers can locate\nthe failure site in a hierarchy.\n\nInvariants\n----------\n* Gates never mutate the package or filesystem \u2014 they read only.\n* Output is fully deterministic: ``per_package`` is keyed by\n  ``architecture_id`` with insertion order matching a depth-first walk\n  sorted by child ``slug`` (as :func:`iter_descendants` already\n  guarantees), and findings inside every :class:`GateResult` are\n  sorted by ``(severity, code, path)``.\n* ``blocking`` is true iff at least one ``severity == \"error\"`` finding\n  is present. ``passed`` is true iff ``blocking`` is false.\n* Only the string values in :data:`GATE_KINDS` may appear on a gate;\n  the frozen-set is intentionally open \u2014 later tasks may add kinds by\n  redefining it locally, but this module never mutates it.\n\nThread-safety\n-------------\nAll public types are frozen dataclasses; all functions are pure with\nrespect to their inputs. Concurrent evaluation of independent\npackage trees is safe. Concurrent evaluation of the SAME tree while\nits underlying files are being written is not safe (caller must hold\nan appropriate lifecycle lock).\n\nError taxonomy\n--------------\nGates do not raise for policy failures \u2014 they return findings with\n``severity=\"error\"``. Programmer errors (e.g. a package whose\n``root`` is unset because it was not loaded via\n:func:`load_package`) propagate as their native exceptions."], "gap_type": null, "id": "PR-f0859543513c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.gates; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Append-only JSONL journal for lifecycle events.\n\nEach entry is a canonical single-line JSON object with fields ``id`` (uuid4\nhex), ``ts`` (ISO 8601 UTC), ``event`` (kind string), and ``payload`` (dict).\n\nConcurrency\n-----------\nSingle-writer per process. Multi-process write coordination is out of scope;\nuse :class:`architecture_model.lifecycle.locks.FileLock` around a\n:class:`Journal` if you need it."], "gap_type": null, "id": "PR-f7d16ef5753b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.journal; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": ["Journal", "JournalEntry"], "gap_type": null, "id": "PR-04670ec71aab", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.journal; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-classes", "id": "PR-11a8b79ea843", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.serialization; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["ContractKind", "SchemaVersions"], "gap_type": null, "id": "PR-141d6e403210", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.versions; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["PairingMismatch"], "gap_type": null, "id": "PR-1914bdda2eab", "provenance": "pipeline_v3.containerize; src=src.architecture_model.lifecycle.pairing; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SliceRef", "ViewCuration", "ViewSpec"], "gap_type": null, "id": "PR-1ebabaa404e8", "provenance": "pipeline_v3
