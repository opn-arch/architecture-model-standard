esolution outcomes, calibration overrides,\nand quality history for cross-session learning (Loop 2)."], "gap_type": null, "id": "PR-2a48fff546d2", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.learning; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Pipeline coordinator with DAG resolution and recursive decomposition."], "gap_type": null, "id": "PR-2b76924daf2e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.coordinator; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Correction consumption helpers for pipeline stages.\n\nLoads structured Correction objects from the LearningStore and filters\nthem by stage/module name for post-processing stage outputs."], "gap_type": null, "id": "PR-359e6a37768f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.corrections; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Infer pipeline stage \u2014 derives capabilities, actors, and behaviors from Inventory.\n\nCapability-driven: clusters by purpose (routes, domain modules, test patterns),\nnot by import structure. Import affinity is a secondary signal only."], "gap_type": null, "id": "PR-38b85552737f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.infer; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Cross-project global learning persistence.\n\nStores heuristic rules, archetype patterns, and workflow lessons\nthat transfer knowledge across different repositories (Loop 3)."], "gap_type": null, "id": "PR-38cd9a6bd8b8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.global_learning; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Output types for the allocate pipeline stage."], "gap_type": null, "id": "PR-38d5ede0375b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.allocate_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Targeted extraction: map changed files \u2192 impacted subsystems + M1 decision.\n\nGiven a list of changed source files and a repo root that contains\n``.architecture-models/<subsystem>/.architecture-model.yaml`` sub-models,\ncompute which subsystems own any of the changed files (must re-extract)\nand whether the M1 aggregation must also re-run (any hit or any unknown\nfile \u2192 yes).\n\nOwnership is derived from ``entities.components[*].files`` in each\nsub-model. Files not owned by any subsystem are surfaced as\n``unknown_files`` for human/agent investigation."], "gap_type": null, "id": "PR-4034a18bd669", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.targeted; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Output types for the contract pipeline stage."], "gap_type": null, "id": "PR-42b122aa1855", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.contract_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Endpoint dataclasses shared by the endpoint extractors.\n\nAn ``Endpoint`` is a callable surface that outside actors invoke:\nClick/argparse subcommands, HTTP routes, or plugin hooks. The pipeline\npromotes them into Interface entities (Phase 4-A Task 12); reference-doc\nprojectors (Tasks 13-15) render them as CLI reference / API reference /\nplugin guide docs.\n\nFrozen dataclasses: no field reassignment. Instances are not hashable\n(``metadata`` is a dict) \u2014 extractor output is de-duplicated by\n``(kind, name, file, lineno)`` tuples externally when needed."], "gap_type": null, "id": "PR-484a891b7985", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.endpoint_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Endpoint extractors (Phase 4-A Tasks 8-10).\n\nDeterministic AST-based extraction of CLI commands (Click + argparse),\nHTTP routes (FastAPI/Flask/starlette \u2014 Task 9), and plugin hooks\n(entry_points \u2014 Task 10). Each extractor returns a list of\n:class:`~architecture_model.pipeline.endpoint_types.Endpoint` sorted by\n``(file, lineno)``.\n\nDesign goals\n------------\n1. Pure-AST \u2014 no import execution, safe on untrusted sources.\n2. Deterministic \u2014 repeated runs on the same input produce byte-identical\n   output. Extractors sort by ``(file, lineno)``.\n3. Best-effort \u2014 unknown decorator shapes are ignored rather than\n   raising; the pipeline is expected to be resilient to third-party\n   framework variations."], "gap_type": null, "id": "PR-5538ad95855f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.endpoint_extract; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Stage tracer: reverse-engineers which pipeline function created each entity."], "gap_type": null, "id": "PR-6e946477a3b9", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.stage_tracer; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Output types for the validate pipeline stage."], "gap_type": null, "id": "PR-76d30cee4a45", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.validate_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Modular extraction pipeline for architecture models."], "gap_type": null, "id": "PR-7716ad8a5a95", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Observe pipeline stage \u2014 produces a factual Inventory from source code.\n\nWraps existing manifest generation, route detection, and constraint detection\ninto the unified Stage protocol. Zero inference \u2014 only observable facts."], "gap_type": null, "id": "PR-7a763e5c43aa", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.observe; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Promote extracted endpoints to Interface entities \u2014 Phase 4-A Task 12.\n\nGiven an :class:`ArchitectureModel` and a repo root, run the three\nendpoint extractors (CLI / HTTP / plugin_hook) and emit Interface\nentities with appropriate ``subkind`` + ``metadata``. Auto-create\n``exposes`` relationships from each endpoint's owning Component\n(determined by matching the endpoint's file against ``component.files``).\n\nIdempotent by construction: Interface ids are deterministic hashes of\n``(subkind, file, name, lineno)``. Re-running over the same repo\nupdates existing Interfaces in place and skips duplicate ``exposes``\nedges rather than compounding output.\n\nThe helper is a pure data-in / data-out transformation \u2014 the caller\n(pipeline stage, MCP tool, CLI) decides when to invoke it. Keeping the\npromotion decoupled from the observe stage means it can also run on\npartially-loaded models (e.g. an OCA-side pipeline stitching data from\nmultiple repos)."], "gap_type": null, "id": "PR-7cd8a1dd6c91", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.endpoint_promotion; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Validate pipeline stage \u2014 checks structural correctness of extracted model.\n\nRuns checks: orphan components, unrealized capabilities, missing relationships,\nfile coverage, naming conventions."], "gap_type": null, "id": "PR-81100d3f97ea", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.validate; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Contract pipeline stage \u2014 maps test files to components as behavioral contracts."], "gap_type": null, "id": "PR-872c7bd946ec", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.contract; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Per-stage LLM re-inference prompt builders for gap analysis.\n\nBuilds prompts that give an LLM the same inputs a deterministic pipeline stage\nreceived and asks it to independently produce the output, acting as a second\nopinion to identify what the deterministic pipeline gets wrong."], "gap_type": null, "id": "PR-87ac68a80940", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.gap_prompts; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Output types for the decompose pipeline stage."], "gap_type": null, "id": "PR-8852a955708a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.decompose_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Specify pipeline stage \u2014 derives interface specifications from routes and exports."], "gap_type": null, "id": "PR-8bfc9e1ad819", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.specify; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Derive subsystem views from the single root architecture model.\n\nEach view is a filtered slice of the root model containing one top-level\ncomponent and all its children, plus all entities reachable via relationships\n(capabilities, behaviors, interfaces, constraints, requirements, actors).\n\nViews are written as standard .architecture-model.yaml files \u2014 one per\nsubsystem \u2014 so they can be used as input to SE doc generators, LLM authoring,\nand any tool that operates on ArchitectureModel objects."], "gap_type": null, "id": "PR-8e016bcee259", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.derive_views; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Output types for the specify pipeline stage."], "gap_type": null, "id": "PR-97c55201122f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline.specify_types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Lessons generator \u2014 extracts actionable insights from pipeline results."], "gap_type": null, "id": "PR-9b53c2ca828d", "pro  :data:`PROPOSAL_TYPES`."], "gap_type": null, "id": "PR-026a2bc04580", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.proposals; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["AI contracts: work orders and proposals for architecture-model reasoning."], "gap_type": null, "id": "PR-7783c16694e4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Typed validators for AI proposals.\n\nEach :class:`Proposal` kind has a dedicated validator that returns a\n:class:`ValidationReport`. Validators are pure: no side effects, no\nmutation of inputs, no file writes.\n\nTop-level :func:`validate` performs the cross-cutting revision-drift\ncheck and dispatches on ``proposal.kind`` via\n:data:`PROPOSAL_VALIDATORS`."], "gap_type": null, "id": "PR-9bf237d1ee0d", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.validators; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Apply ModelPatch proposals to ArchitectureModel.\n\nThe executor supports three operations:\n  - ``add``:     append value to entities.<target_kind> list\n  - ``remove``:  drop entity with matching target_id from any entities list\n  - ``replace``: setattr(entity[target_id], field, value)\n\nNote: the validator (``ai.validators._VALID_OPS``) also lists ``move`` as a\nsyntactically valid op, but the semantics of ``move`` are not yet specified;\nthe executor raises ``ParseError`` for it."], "gap_type": null, "id": "PR-a7896e12ec41", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.patch; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Proposal-packaging helper for write-back projectors \u2014 Phase 4-A Task 2.\n\n``pack_proposal`` centralizes prompt-digest computation and ModelPatch\nconstruction so :class:`~architecture_model.lifecycle.projectors.write_back.WriteBackProjector`\nsubclasses only supply the domain-specific operations list. Identical\ninputs always produce identical ``proposal_id`` (SHA-256 identity on\n``work_order_id | model_version | prompt_digest``) \u2014 this stability is\nrequired for idempotent ``architect_propose`` invocations and for\ndeduping proposals in the lifecycle store."], "gap_type": null, "id": "PR-ab5f828df6ba", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.pack; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["AI :class:`WorkOrder` contract.\n\nA ``WorkOrder`` is a bounded, content-addressable request submitted to an\nAI agent. It nominates:\n\n* a set of :class:`SliceRef` inputs (at least one) \u2014 the agent MUST NOT\n  read anything outside these slices;\n* the set of :class:`ProposalKind` outputs the requester will accept;\n* a hard :class:`Budget` (tokens + wall time);\n* provenance (``requested_by``, ``created_at``).\n\nThe contract is versioned by :data:`SchemaVersions.WORK_ORDER` and\nvalidated by ``spec/ai-work-order.schema.json`` (Draft 2020-12)."], "gap_type": null, "id": "PR-c5d279669135", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.work_order; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["AI Job state machine and persistence.\n\nA :class:`Job` tracks the lifecycle of an AI :class:`WorkOrder` through\napproval, queueing, execution, validation, and terminal outcomes. State\ntransitions are governed by :data:`ALLOWED_TRANSITIONS`; every transition\nappends an immutable :class:`JobEvent` to :attr:`Job.history` and emits\nan ``ai.job.transition`` event on the lifecycle\n:class:`~architecture_model.lifecycle.journal.Journal`.\n\nPersistence is per-job YAML at\n``<root>/.architecture/ai/jobs/<job_id>.yaml`` written atomically via\n:func:`architecture_model.lifecycle.atomic_store.write_atomic`.\n\nThis module implements state + persistence only. Execution (dequeue,\nworker, dispatch) is intentionally out of scope."], "gap_type": null, "id": "PR-e7f2e81822c6", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.jobs; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": ["ArtifactCandidate", "DecompositionProposal", "ImpactAssessment", "ModelPatch", "Provenance", "SliceProposal", "ViewCurationProposal"], "gap_type": null, "id": "PR-02710e0bff46", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.proposals; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-classes", "id": "PR-34abebe42b98", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.patch; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["Budget", "ProposalKind", "SliceRef", "WorkOrder"], "gap_type": null, "id": "PR-43a1f0509e8b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.work_order; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ValidationFinding", "ValidationReport"], "gap_type": null, "id": "PR-a3d6535e6609", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.validators; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["InvalidTransitionError", "Job", "JobEvent", "JobState", "JobStore"], "gap_type": null, "id": "PR-f4217df8ff00", "provenance": "pipeline_v3.containerize; src=src.architecture_model.ai.jobs; via=pipeline_v3.derive_promises", "status": "open"}]}, "gap_count": 2, "id": "COMP-88e48294", "inbound": ["COMP-3a28244a"], "kind": "component", "module_count": 7, "name": "ai", "neighbors_mermaid": "flowchart LR\n  nCOMP88e48294[\"COMP-88e48294<br/>ai\"]\n  nCOMP1896b055[\"COMP-1896b055<br/>core\"]\n  nCOMP3a28244a[\"COMP-3a28244a<br/>lifecycle\"]\n  nCOMP88e48294 -->|depends-on| nCOMP1896b055\n  nCOMP88e48294 -->|depends-on| nCOMP3a28244a\n  nCOMP3a28244a -->|depends-on| nCOMP88e48294\n  classDef component fill:#1e293b,stroke:#6639ba,color:#e6edf3;\n  classDef capability fill:#3b1e5a,stroke:#a855f7,color:#f3e8f idence_refs"], "gap_type": null, "id": "PR-bac9987587ad", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.evidence; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-functions", "id": "PR-ccca12d0c8a0", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["dump_yaml", "load_yaml"], "gap_type": null, "id": "PR-d7e50f5b66e9", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.record; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["bind_store", "instrumented"], "gap_type": null, "id": "PR-e8d731b67ab9", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.decorators; via=pipeline_v3.derive_promises", "status": "open"}], "intent": [{"content": ["B2.1.3 \u2014 Roll up runtime SI&L records into an architecture-component record.\n\nGiven an architecture-component ``SILRecord`` and the runtime records for the\npipeline stages / MCP tools / renderers that touch the modules allocated to\nthat architecture component, produce a merged copy of the arch record with:\n\n* ``rollup.runtime_components`` \u2014 insertion-ordered, deduped list of runtime\n  component IDs whose scope overlaps the arch component's modules.\n* ``metrics.invocations_7d`` \u2014 sum across runtime records.\n* ``metrics.avg_duration_ms`` \u2014 invocation-weighted average.\n* ``metrics.failure_rate_7d`` \u2014 invocation-weighted average.\n\nArch-only metric fields (``validation_score``, ``drift_flag_count``,\n``regen_readiness``, ``lesson_count``) are preserved from the input.\nThe input record is never mutated."], "gap_type": null, "id": "PR-2d1a5dcd12b9", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.rollup; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SI&L instrumentation decorator (no-op when no store bound)."], "gap_type": null, "id": "PR-60bcb955dc07", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.decorators; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SI&L (Self-Improvement & Logging) package."], "gap_type": null, "id": "PR-9c16a52c848e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SI&L (Self-Improvement & Logging) record schema.\n\nPer-component record used by both architecture components (COMP-* in the\nmodel) and runtime components (pipeline stages, MCP tools, renderers,\nvalidators), distinguished by `kind`.\n\nSee docs/plans/2026-09-05-comment-view-shared-interfaces-design.md \u00a74."], "gap_type": null, "id": "PR-a7ba3b3e5e22", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.record; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["SI&L \u2192 Promise evidence binding \u2014 Phase 5 of T0.14.\n\nAggregation layer: consumes existing :class:`SILRecord` objects and\nlifts their signal into :class:`Promise` ``verified_by`` entries. NOT\na rewrite of :mod:`architecture_model.sil.{record,rollup,decorators}`\n\u2014 those remain the source of truth. This module is the join.\n\nReference format for a SIL-derived evidence entry::\n\n    SIL:<component_id>:<metric>=<value>\n    SIL:<component_id>:healthy\n    SIL:<component_id>:event=<event_id>\n\nRules:\n\n* A SILRecord contributes evidence to a Promise iff\n  ``sil_record.component_id == promise.owner_entity``.\n* Evidence is emitted in a canonical order (metrics first, then event\n  ids sorted ascending) so re-binding is idempotent and deterministic.\n* Existing ``verified_by`` entries are preserved; duplicates removed\n  while preserving first-seen order.\n* TYPED_GAP promises still receive evidence \u2014 a design-declared gap\n  can be evidenced (e.g. \"we know we lack this and here's the SIL\n  proof\") without being closed."], "gap_type": null, "id": "PR-e1d8a857ba75", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.evidence; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": [], "gap_type": "no-public-classes", "id": "PR-446bbc6b488e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.rollup; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["Event", "Metrics", "Rollup", "SILRecord"], "gap_type": null, "id": "PR-d2febfe56be0", "provenance": "pipeline_v3.containerize; src=src.architecture_model.sil.record; via=pipeline_v3.derive_promises", "status": "open"}]}, "gap_count": 2, "id": "COMP-8f04b04b", "inbound": ["COMP-1896b055", "COMP-3a28244a", "COMP-47414902", "COMP-adf886f2"], "kind": "component", "module_count": 5, "name": "sil", "neighbors_mermaid": "flowchart LR\n  nCOMP8f04b04b[\"COMP-8f04b04b<br/>sil\"]\n  nCOMP1896b055[\"COMP-1896b055<br/>core\"]\n  nCOMP3a28244a[\"COMP-3a28244a<br/>lifecycle\"]\n  nCOMP47414902[\"COMP-47414902<br/>pipeline\"]\n  nCOMPadf886f2[\"COMP-adf886f2<br/>authoring\"]\n  nCOMP8f04b04b -->|depends-on| nCOMP1896b055\n  nCOMP1896b055 -->|depends-on| nCOMP8f04b04b\n  nCOMP3a28244a -->|depends-on| nCOMP8f04b04b\n  nCOMP47414902 -->|depends-on| nCOMP8f04b04b\n  nCOMPadf886f2 -->|depends-on| nCOMP8f04b04b\n  classDef component fill:#1e293b,stroke:#6639ba,color:#e6edf3;\n  classDef capability fill:#3b1e5a,stroke:#a855f7,color:#f3e8ff,stroke-width:2px;\n  classDef behavior fill:#1e293b,stroke:#0969da,color:#e6edf3;\n  classDef interface fill:#0f2e1e,stroke:#1a7f37,color:#dafbe1;\n  classDef actor fill:#1e293b,stroke:#0969da,color:#e6edf3;\n  classDef constraint fill:#3b1e1e,stroke:#f97316,color:#fed7aa;\n  classDef layer fill:#1a2f4a,stroke:#38bdf8,color:#e0f2fe;\n  classDef root fill:#7f1d1d,stroke:#e94560,color:#ffe4e6,stroke-width:3px;\n  class nCOMP1896b055,nCOMP3a28244a,nCOMP47414902,nCOMPadf886f2 component;\n  class nCOMP8f04b04b root;", "neighbors_refs": ["COMP-1896b055", "COMP-3a28244a", "COMP-4741490 026-09-15 \u2014 SVG circular layout in prior overhaul\nwasted screen space and did not scale past ~24 nodes. Deferred until\nan interactive force-directed / hierarchical layout is warranted.\nNeighbor navigation via chips (D6) covers the immediate use case.\n", "status": "open"}, {"content": ["multi_attribute_entity_detail"], "gap_type": null, "id": "PR-VIEWER-D3", "provenance": "Renders promises grouped by attribute. Canonical order: intent \u2192 delivers\n\u2192 provides, then any remaining attributes in insertion order. Attribute\nvocabulary is open-ended per Promise schema \u2014 promise.attribute is any\nnon-empty string, promise-graph.schema.json enforces no enum. Reference\nvocabulary is Phase 2 schema 2.1's 14 semantic fields (intent, goals,\nstakeholders, success_criteria, failure_modes, trade_offs, assumptions,\nopen_questions, requirements, verification, slos, owner, maturity,\ndependencies_rationale) \u2014 see CONTEXT.md Phase 2 section. Badges:\nok=verified, warn=open, error=typed-gap. Gap type shown as secondary\nbadge. Renamed from component_detail_with_promises 2026-09-15 to reflect\nmulti-kind support; renamed from entity_detail_with_promises 2026-09-15\nto reflect open-ended attribute vocabulary.\n", "status": "verified"}, {"content": ["gap_index_view"], "gap_type": null, "id": "PR-VIEWER-D4", "provenance": "Flat list across all entities. Grouped by gap_type. Click owner id\nto jump to entity detail. Unrealized authored CAP/BEH entries\nsurfaced automatically.\n", "status": "verified"}, {"content": ["se_level_navigation"], "gap_type": null, "id": "PR-VIEWER-D5", "provenance": "scope declined 2026-09-15 \u2014 SE views (ConOps, Functional Analysis,\nLogical Architecture, etc.) live in the 2.x SE document suite\n(COMP-4.2) and are not part of the v3-native viewer surface.\nSidebar organizes by entity kind, which is the v3 modeling\nprimitive. Revisit if v3 SE view projectors are built.\n", "status": "open"}, {"content": ["inbound_outbound_neighbor ver; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["quality_report"], "gap_type": null, "id": "PR-e89e63aabb9c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.dashboard; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["format_summaries", "subsystem_summary"], "gap_type": null, "id": "PR-e9950c749a18", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.update_summary; via=pipeline_v3.derive_promises", "status": "open"}], "intent": [{"content": ["Regen readiness static metric module.\n\nComputes how ready an enriched architecture model is for blind regeneration\nby analyzing body_hint coverage, test contracts, constants, and signatures."], "gap_type": null, "id": "PR-07127b9f6bfe", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.regen_readiness; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Quality orchestrator \u2014 chains code review \u2192 model feedback \u2192 diff \u2192 dashboard."], "gap_type": null, "id": "PR-2133b183b833", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.orchestrator; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Static code analysis engine \u2014 complexity, docstrings, type hints, code smells."], "gap_type": null, "id": "PR-2d565c1a174c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.code_review; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Chain-closure quality module \u2014 Phase 3 of T0.14 (v3 bootstrap).\n\nRealizes CAP-DF-VERIFY:\n    \"Verify delivery-down and verify-up chain closure at both structural\n     and per-attribute levels. Gaps are typed (named categories), never\n     silent NULLs.\"\n\nConsumes a Promise-graph (see :mod:`architecture_model.core.promise`) and\nemits a :class:`ChainClosureReport` with three typed gap categories:\n\n- ``G-DELIVERY`` \u2014 a Promise has no upstream delivery lineage. Sub-cases:\n  * missing ``delivered_from`` on a non-root owner\n  * ``delivered_from`` points to an id absent from the graph\n- ``G-VERIFY`` \u2014 a Promise (not itself a TYPED_GAP) has no\n  ``verified_by`` evidence records. Also fires when a Promise's status\n  is ``VERIFIED`` but ``verified_by`` is empty (structural inconsistency).\n- ``G-OPEN-Q`` \u2014 a Promise whose ``attribute == \"open_questions\"`` and\n  whose content is a non-empty question or list of questions. Each\n  question yields one gap.\n\nPromises with ``status == TYPED_GAP`` are exempt from delivery/verify\nchecks \u2014 the gap is already named on the Promise itself.\n\nRoot owners (typically actors) are exempt from ``G-DELIVERY``: they have\nno upstream by design. Callers declare roots via ``root_owner_ids``.\n\nclosure_pct = 1 - gap_count / promise_count, clamped to [0, 1]. Empty\ngraph vacuously yields 1.0."], "gap_type": null, "id": "PR-3774dc46489a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.chain_closure; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Confidence scoring engine for architecture entities.\n\nComputes a 0.0-1.0 confidence score per entity based on weighted field\ncompleteness. Higher confidence = higher likelihood we could regenerate\nthe entity's implementation from the model alone."], "gap_type": null, "id": "PR-560418322f38", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.confidence; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Bidirectional feedback: code analysis findings -> architecture model updates."], "gap_type": null, "id": "PR-5a88c0303607", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.model_feedback; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Standalone per-entity quality metrics \u2014 Phase 4 of T0.14.\n\nRealizes CAP-DF-GATING telemetry: per-entity quality scores computed\nWITHOUT chain-closure. Complementary to\n:mod:`architecture_model.quality.chain_closure` \u2014 those metrics are\ngraph-relative (need cross-entity Promise lineage); these are\nentity-relative and cheap to compute per commit.\n\nMetrics:\n\n* ``completeness_pct`` \u2014 fraction of canonical semantic fields\n  (:data:`architecture_model.migration.v2_to_v3.SEMANTIC_FIELDS`) that\n  have at least one Promise on the entity. Duplicate attributes count\n  once.\n* ``provenance_integrity_pct`` \u2014 fraction of the entity's Promises whose\n  ``provenance`` field is non-empty. Vacuously 1.0 when the entity has\n  no Promises (nothing UN-stamped).\n* ``typed_gap_pct`` \u2014 fraction of the entity's Promises with\n  ``status == TYPED_GAP``. Named absences are a signal of maturity, not\n  a defect \u2014 this metric reports the \"gap surface named\" ratio.\n* ``relationship_density`` \u2014 count of relationships where the entity\n  appears as ``from`` or ``to``. Self-loops count once. Zero when the\n  caller doesn't supply a relationships list.\n\n``overall_score`` = weighted 0..100 rubric:\n\n* 45 pts \u00d7 ``completeness_pct``\n* 25 pts \u00d7 ``provenance_integrity_pct``\n* 15 pts \u00d7 (1 if ``typed_gap_pct`` <= 0.5 else (1 - (typed_gap_pct-0.5)*2))\n* 15 pts \u00d7 min(1.0, ``relationship_density`` / 10)\n\nRationale: completeness is the highest weight (drives regen fidelity);\nprovenance is next (drives auditability); typed-gap and relationship\ndensity are corroborating signals with lower weight and diminishing\nreturns (10 relationships saturates the density term)."], "gap_type": null, "id": "PR-5ad3ac0ad8aa", "provenance": "pipeline_v3.containerize; src=src.architecture_model.quality.standalone; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Unified quality subsystem \u2014 monitoring, confidence, coverage, regen readiness, code review, dashboard."], "gap_type": null, "id": "PR-6bcd5e467689", "provenance": "pipeline_v3.containerize; src=src.architecture_m nance": "pipeline_v3.containerize; src=src.architecture_model.manifest.kt_scanner; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Multi-signal module grouping for architecture model generation.\n\nGroups modules into logical components using three signals:\n1. Subdirectory affinity \u2014 files in the same subdirectory\n2. Name-prefix affinity \u2014 underscore-prefixed files in the same directory\n3. Import affinity \u2014 files with high mutual import counts\n\nTrivial files (__init__.py with no code, __version__.py, etc.) are filtered out."], "gap_type": null, "id": "PR-7ecb2d6aaf12", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.grouping; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Regex-based TypeScript/JavaScript scanner (fallback).\n\nUsed when Node.js/@arch-model/scanner-js is not available.\nProvides degraded output: no type resolution, raw signatures."], "gap_type": null, "id": "PR-8bcccb1f8485", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.ts_scanner; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Main manifest generation and caching logic."], "gap_type": null, "id": "PR-a109fc82507b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.generator; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Functional block definitions and processing.\n\nLoads functional blocks from .architecture-model.yaml config. Falls back to\nauto-discovery if no config exists. The FUNCTIONAL_BLOCKS constant is maintained\nfor backward compatibility but now reads from config."], "gap_type": null, "id": "PR-aa2011a801b7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.blocks; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["AST helpers and file scanning for the reality manifest.\n\nFunctions for parsing Python source files, extracting metadata (docstrings,\nfunction signatures, imports), and assembling per-file scan results."], "gap_type": null, "id": "PR-b313fa1760f7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.scanner; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Project metrics computation from filesystem scanning.\n\nLoads metric definitions from .architecture-model.yaml config.\nFalls back to heuristic discovery if no config exists."], "gap_type": null, "id": "PR-b419f698caa1", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.metrics; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Reality Manifest Generator \u2014 modular package.\n\nPublic API:\n    generate_manifest        \u2014 full AST scan of the project\n    load_or_generate_manifest \u2014 cached generation with 1-hour TTL\n    get_manifest_slice       \u2014 focused markdown slice for artifact injection\n    print_summary            \u2014 terminal summary display"], "gap_type": null, "id": "PR-baa3126adcd4", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Language-agnostic source analysis protocol.\n\nThese types represent the MINIMUM data needed for hierarchical decomposition.\nThey can be populated by:\n- Python AST scanner (automatic, via from_manifest)\n- External tools (Madge for JS, go-callvis for Go)\n- Agent reading code (any language)\n- JSON ingestion via architect_ingest MCP tool\n\nThe hierarchical pipeline (grouping \u2192 source_blocks \u2192 representativeness \u2192 interface\ncontracts) operates entirely on SourceGraph. Language-specific scanners produce\nSourceGraph as their output format."], "gap_type": null, "id": "PR-bdccfcbb35c8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.protocol; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Typed dataclasses for manifest generation outputs.\n\nEvery function in the manifest pipeline should accept and return\ntyped objects, not raw dicts. This module defines those types."], "gap_type": null, "id": "PR-c18edee0c876", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.types; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Pipeline-scoped cache for scan_file results."], "gap_type": null, "id": "PR-e98c763df02a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.scan_cache; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Recursive manifest generation -- per-F-block deep scans.\n\nProduces a RecursiveManifest for each functional block, with full\nmodule-level detail (functions with calls, docstrings, raises).\nEach RecursiveManifest links to its parent model via component_id."], "gap_type": null, "id": "PR-eb931f198600", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.recursive; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Terminal summary display for the reality manifest."], "gap_type": null, "id": "PR-ef304ad1927b", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.display; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Behavioral extraction from function AST nodes.\n\nExtracts call_order, control_flow, and guards from function bodies.\nThese are lightweight structural signals \u2014 no type inference or inter-procedural analysis."], "gap_type": null, "id": "PR-f04d12feb422", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.behavior; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Multi-language scanner that merges SourceGraphs from all detected languages.\n\nDetects languages by file extension, runs appropriate scanners,\nand merges results into a single unified SourceGraph."], "gap_type": null, "id": "PR-fdf3b4289c7d", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.multi_scanner; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Call graph infrastructure for multi-hop behavior flow tracing."], "gap_type": null, "id": "PR-fe58256f3f46", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.call_graph; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": ["CallGraph", "FlowTrace"], "gap_type": null, "id": "PR-3c24a689e8d7", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.call_graph; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ModuleGroup"], "gap_type": null, "id": "PR-3d44a4a55212", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.grouping; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-classes", "id": "PR-48366fafabb1", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.ts_scanner; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["DependencyEdge", "ExportedSymbol", "SourceGraph", "SourceUnit"], "gap_type": null, "id": "PR-5ce1876c3b3a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.protocol; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ScanCache"], "gap_type": null, "id": "PR-5f1294c3b736", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.scan_cache; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["EventChain"], "gap_type": null, "id": "PR-97739ee3c349", "provenance": "pipeline_v3.containerize; src=src.architecture_model.manifest.chains; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["BlockManifest", "ClassInfo", "DecoratedFunction", "FunctionInfo", "ImportDetail", "InterfaceEdge", "Manifest", "MetricsResult", "ModuleInfo", "ModuleStatus", "RecursiveManifest", "ScanReport", "SubFunctionEntry"], "gap_type": null, "id": "PR-f1b97eecafba", "provenance": "pipeline_v3.cont e_model.pipeline_v3.publish; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["cluster_modules"], "gap_type": null, "id": "PR-c642922a337f", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.cluster; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["derive_promises", "derive_promises_for_module"], "gap_type": null, "id": "PR-cf0f350e5f08", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.derive_promises; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-functions", "id": "PR-ea1fa0d96373", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["verify_model", "verify_per_component"], "gap_type": null, "id": "PR-f31a08949b2c", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.verify; via=pipeline_v3.derive_promises", "status": "open"}], "failure_modes": [{"content": ["schema drift breaks byte-determinism gate \u2192 Phase 8 CI failure", "import-edge asymmetry (src. prefix) causes cluster mis-attribution \u2192 mitigated by link.py root-prefix normalizer", "unpinned AMS_DETERMINISTIC_NOW causes CI timestamp flake", "pipeline emits only 1 of 7 entity kinds (components) \u2014 declared as Part 3 mainline gap CAP-DF.4 / BEH-S1"], "gap_type": null, "id": "PR-COMP-c5a72728-failure-modes", "provenance": "2026-09-15 SE walk enrichment; last item cited in publish.py:107", "status": "open"}], "intent": [{"content": ["pipeline_v3 \u2014 Promise-graph-native extraction pipeline (T0.14 Phase 6).\n\nEight-stage pipeline consuming a repo and producing a v3 architecture\nmodel (Promise-graph + entities + relationships):\n\n    scan -> derive_promises -> cluster -> link -> containerize\n         -> verify -> publish\n    (orchestrated by orchestrator)\n\nEach stage is a self-contained module with its own tests. Intermediate\ndata types flow between stages via typed dataclasses; no stage reaches\nback into a previous stage's internals."], "gap_type": null, "id": "PR-3b2d68bad421", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.verify \u2014 Chain-closure verification stage (T0.14 Phase 6.6).\n\nRuns :func:`architecture_model.quality.chain_closure.analyze_chain_closure`\nover a :class:`ContainerizedModel`. Two entry points:\n\n    - :func:`verify_model` \u2014 flat chain-closure report over the whole model.\n    - :func:`verify_per_component` \u2014 per-component reports for drill-down.\n\nRoot-owner convention\n---------------------\n\nAfter :mod:`containerize`, every Promise's ``owner_entity`` is a\ncomponent id \u2014 there is no higher-level entity for a component-scoped\nPromise to be \"delivered from\". If callers do not supply an explicit\n``root_owner_ids`` set, verify treats every component id in the model\nas a root. This prevents the entire graph from spuriously flagging\n``G-DELIVERY`` when what we actually want to inspect is verification\ncoverage (``G-VERIFY``) and open-question closure (``G-OPEN-Q``).\n\nCallers who *do* want strict delivery-lineage checking (e.g. when\ninter-component delivery edges are expected) can pass\n``root_owner_ids=frozenset()`` or a specific subset."], "gap_type": null, "id": "PR-4e48ee93647e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.verify; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.link \u2014 Relationship inference stage (T0.14 Phase 6.4).\n\nDerives ``depends-on`` :class:`Link` records between :class:`Cluster`\nvalues from import edges reported by the scan stage. Each import in a\nmodule belonging to cluster A that resolves to a module in cluster B\n(A \u2260 B) contributes a link A \u2192 B with weight = distinct\n(source_module, target_cluster) pairs.\n\nResolution rules\n----------------\n\nAn import string ``imp`` resolves to cluster ``C`` iff ``imp`` starts with\n``C.root_prefix`` on a dotted-segment boundary. To bridge the AMS reality\nwhere scanned module names begin with ``src.`` but imports do not, the\nresolver also matches after stripping a leading ``src.`` from cluster\nprefixes.\n\nWhen multiple clusters match, the longest matching prefix wins (most-\nspecific containment). Unresolved imports (stdlib, third-party, or\nanything outside the scanned tree) are silently dropped.\n\nDesign intent\n-------------\n\nKept deliberately simple: one relationship kind (``depends-on``), one\nsignal (import edges). Additional relationship kinds \u2014 ``exposes``\n(interface), ``realizes`` (capability), ``triggers`` (behavior) \u2014 come\nonline in later stages once we know cluster / entity types. The link\nstage's contract is: **structural coupling only**."], "gap_type": null, "id": "PR-80390d2a1acd", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.link; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.publish \u2014 Model emit stage (T0.14 Phase 6.7).\n\nSerializes a :class:`ContainerizedModel` to v3 YAML and (optionally)\nwrites it to disk. The shape matches the Phase 2 v3-poc migration\noutput so downstream consumers (validator, decompose, docs) get a\nuniform schema regardless of whether the model came from migration or\nfresh pipeline_v3 extraction.\n\nTwo entry points:\n\n    - :func:`serialize_model` \u2014 pure, in-memory YAML text.\n    - :func:`publish_model` \u2014 writes to disk, returns :class:`PublishResult`.\n\nDeterminism\n-----------\n\n- Components sorted by ``id``.\n- Promises within a component sorted by ``(attribute, id)``.\n- Relationships sorted by ``(from_cluster, to_cluster)``.\n- ``meta.generated_at`` honors ``AMS_DETERMINISTIC_NOW`` (ISO-8601 str)\n  when set; otherwise stamps the current UTC instant.\n- YAML emit: ``sort_keys=False`` (respects our fixed key order),\n  ``default_flow_style=False`` (block style), no aliases."], "gap_type": null, "id": "PR-86746af4f12a", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.publish; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.cluster \u2014 Component grouping stage (T0.14 Phase 6.3).\n\nGroups :class:`ScannedModule` records into :class:`Cluster` records by\ndotted-name prefix. Each cluster is a candidate v3 component; downstream\nstages (link, containerize, publish) turn clusters into ``COMP-*`` entities\nwith realizes/depends-on relationships.\n\nSimplification vs. legacy manifest.grouping\n-------------------------------------------\nThe legacy :mod:`architecture_model.manifest.grouping` uses multi-signal\naffinity (subdirectory + name-prefix + import edges) with a full merge-\nand-split pipeline. That algorithm is production-tested and remains the\ndefault for legacy pipeline consumers.\n\nFor v3 first-pass, we deliberately start with a simpler, more transparent\nprefix-based clustering:\n\n    - Group modules by the first ``depth`` dotted-name segments.\n    - Cluster id = ``COMP-<sha1(root_prefix)[:8]>`` (deterministic).\n    - Cluster name = last segment of the root prefix (human-friendly).\n    - Clusters and their modules are sorted for byte-stable output.\n\nImport-affinity refinement can be added later as an optional post-pass\n(see Phase 9 / adapter tasks) without changing this module's interface."], "gap_type": null, "id": "PR-a6baf3026a61", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.cluster; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.containerize \u2014 Component packaging stage (T0.14 Phase 6.5).\n\nComposes the outputs of :mod:`scan`, :mod:`derive_promises`, :mod:`cluster`,\nand :mod:`link` into a coherent :class:`ContainerizedModel` \u2014 the v3 shape\nconsumed by :mod:`verify` (chain-closure) and :mod:`publish` (YAML emit).\n\nCore operation: **Promise ownership rebinding**\n------------------------------------------------\n\n``derive_promises`` produces Promises owned by *modules* (dotted names).\nv3 architecture entities are *components*, not modules. Containerize\nwalks each cluster, rebinds every Promise owned by one of its member\nmodules to ``owner_entity = cluster.id``, and recomputes the Promise id\nagainst the new owner via :func:`compute_promise_id`.\n\nBecause the identity triple ``(attribute, content, owner)`` changes, ids\nchange. Two Promises that were distinct at the module level but become\nidentical at the component level (e.g. both modules had\n``delivers=[]`` typed-gap) collapse to one record via id-set dedup.\n\nProvenance is enriched to capture the originating module(s) so audit\ntools can trace a component-level Promise back to its module sources."], "gap_type": null, "id": "PR-b94760fa9989", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.containerize; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.derive_promises \u2014 Attribute derivation stage (T0.14 Phase 6.2).\n\nConsumes :class:`ScanResult` from the scan stage and produces a flat list\nof :class:`Promise` records. Each :class:`ScannedModule` contributes three\nPromises, one per canonical scan-derived attribute:\n\n    - ``intent``    \u2190 module docstring\n    - ``delivers``  \u2190 sorted list of public function names\n    - ``provides``  \u2190 sorted list of public class names\n\nMissing signals produce :class:`PromiseStatus.TYPED_GAP` Promises with\ntyped ``gap_type`` labels so downstream chain-closure can categorize the\ngap without ambiguity. Owner entity is the module's dotted name (as\ncomputed by :func:`architecture_model.pipeline_v3.scan._dotted_name`).\n\nDesign notes:\n    - \"Public\" = name does not start with underscore.\n    - `delivers`/`provides` content is sorted for deterministic hashing.\n    - The three attributes are emitted in a fixed order (intent, delivers,\n      provides) so per-module Promise ordering is stable independent of\n      dict-iteration order."], "gap_type": null, "id": "PR-d5d1d5f80917", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.derive_promises; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.scan \u2014 Reality scan stage (T0.14 Phase 6.1).\n\nDelegates AST scanning to the existing :mod:`architecture_model.manifest`\ngenerator and lifts the result into a Promise-graph-friendly shape\n(:class:`ScanResult` / :class:`ScannedModule`) with deterministic ordering.\n\nThis is intentionally a THIN bridge \u2014 the manifest module has full test\ncoverage of AST semantics; duplicating that work would create drift.\nLater stages of pipeline_v3 consume the normalized shape without ever\ntouching Manifest / ModuleInfo directly, so any future replacement of\nthe scan backend is a local change."], "gap_type": null, "id": "PR-dd7407b25a01", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.scan; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["pipeline_v3.orchestrator \u2014 Stage coordinator (T0.14 Phase 6.8).\n\nWires the seven pipeline_v3 stages into a single end-to-end run:\n\n    scan \u2192 derive_promises \u2192 cluster \u2192 link \u2192 containerize \u2192 verify \u2192 publish\n\nExposes :func:`run_pipeline` and :class:`PipelineRunResult`. Every\nintermediate artifact (scan, promises, clusters, links, model, verify\nreport, per-component reports, publish result) is available on the\nreturned :class:`PipelineRunResult` so downstream tooling can inspect\nany stage without re-running.\n\nDesign intent\n-------------\n\nThe orchestrator is deliberately thin \u2014 a straight-line composition of\nthe seven stage modules. Each stage remains independently testable and\ncallable; the orchestrator adds convenience, not new semantics. That\nchoice keeps failure isolation trivial: any bug lives in the stage it\nbelongs to, not in a coordination layer.\n\nOptional flags\n--------------\n\n- ``cluster_depth``: dotted-segment depth for clustering (default 3).\n- ``project_name``: stamped into ``meta.project`` at publish time.\n- ``skip_publish``: run every stage except publish; leave no artifact\n  on disk. Useful for CI checks, tests, and in-memory workflows."], "gap_type": null, "id": "PR-f19c4669b82e", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.orchestrator; via=pipeline_v3.derive_promises", "status": "open"}], "provides": [{"content": ["Cluster"], "gap_type": null, "id": "PR-1c9eec4e61e0", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.cluster; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["Link"], "gap_type": null, "id": "PR-2ac4a46e98af", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.link; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["PublishResult"], "gap_type": null, "id": "PR-2f11d0d9f6c3", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.publish; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ContainerizedComponent", "ContainerizedModel"], "gap_type": null, "id": "PR-a2f9b6d725d6", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.containerize; via=pipeline_v3.derive_promises", "status": "open"}, {"content": [], "gap_type": "no-public-classes", "id": "PR-b259aa3443ad", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.verify; via=pipeline_v3.derive_promises", "status": "typed-gap"}, {"content": ["PipelineRunResult"], "gap_type": null, "id": "PR-d8918f9711d8", "provenance": "pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.orchestrator; via=pipeline_v3.derive_promises", "status": "open"}, {"content": ["ScanResult", "Sca "))\n  nACTse((\"ACT-se<br/>Systems Engineer\"))\n  subgraph USE_CASES[\"Use Cases (Behaviors)\"]\n    nBEHS1[\"BEH-S1<br/>llm_entity_kind_promotion\"]\n    nBEHS2[\"BEH-S2<br/>llm_gap_remediation\"]\n    nBEHrunpipeline[\"BEH-run-pipeline<br/>run_extraction_pipeline_end_to_end\"]\n    nBEHviewbrowse[\"BEH-view-browse<br/>view_browse_merged_model\"]\n    nBEHviewnote[\"BEH-view-note<br/>view_capture_human_note\"]\n    nBEHviewsave[\"BEH-view-save<br/>view_save_notes_yaml\"]\n    nBEHwalkauthor[\"BEH-walk-author<br/>walk_author_fragment_yaml\"]\n    nBEHwalkdescend[\"BEH-walk-descend<br/>walk_descend_concept_to_components\"]\n    nBEHwalkrealize[\"BEH-walk-realize<br/>walk_link_to_extracted_components\"]\n  end\n  nACTci --> nBEHrunpipeline\n  nACTdeveloper --> nBEHrunpipeline\n  nACTdeveloper --> nBEHviewbrowse\n  nACTdeveloper --> nBEHviewnote\n  nACTdeveloper --> nBEHviewsave\n  nACTllm --> nBEHS1\n  nACTllm --> nBEHS2\n  nACTse --> nBEHviewbrowse\n  nACTse --> nBEHwalkauthor\n  nACTse --> nBEHwalkdescend\n  nACTse --> nBEHwalkrealize", "narrative": "Use cases \u2014 actor\u2192behavior triggers grouped per actor. Each actor's behaviors are the concrete operations they perform. ACT-llm behaviors (BEH-S1, BEH-S2) are declared open (Part 3). ACT-developer and ACT-se share BEH-view-browse (both open the viewer to review the model).", "title": "Use Cases"}}, "sources": [".architecture-model.v3.yaml", ".architecture/model/capabilities.v3.yaml", ".architecture/model/enrichment.v3.yaml", ".architecture/model/viewer.v3.yaml"], "status_hist": {"open": 616, "typed-gap": 54, "verified": 108}, "top_by_gaps": [{"gap_count": 3, "id": "COMP-1896b055", "kind": "component", "name": "core"}, {"gap_count": 3, "id": "COMP-3a28244a", "kind": "component", "name": "lifecycle"}, {"gap_count": 3, "id": "COMP-61323f76", "kind": "component", "name": "data"}, {"gap_count": 3, "id": "COMP-8a6bd396", "kind": "component", "name": "cli"}, {"gap_count": 3, "id": "COMP-bfb0fcf3", "kind": "componen <script>
const data = JSON.parse(document.getElementById('v3-data').textContent);
const byId = {};
for (const kind of data.kinds_present) {
  for (const e of data.entities_by_kind[kind]) byId[e.id] = e;
}
// Notes state (in-memory, seeded from embedded notes)
const notes = Object.assign({}, data.notes || {});

document.getElementById('t-entities').textContent = data.totals.entities;
document.getElementById('t-kinds').textContent = data.kinds_present.length;
document.getElementById('t-proms').textContent = data.totals.promises;
document.getElementById('t-gaps').textContent = data.totals.gaps;
document.getElementById('t-rels').textContent = data.totals.relationships;
document.getElementById('t-schema').textContent = (data.meta || {}).schema_version || '-';

// --- Sidebar entity groups ---
function renderSidebar() {
  const host = document.getElementById('entity-groups');
  let html = '';
  for (const kind of data.kinds_present) {
    const items = data.entities_by_kind[kind];
    html += `<details open><summary data-kind="${kind}">${kind} (${items.length})</summary>`;
    for (const e of items) {
      html += `<a class="entity-link" data-id="${e.id}">${escapeHtml(e.name)}<span class="cid">${e.id}</span></a>`;
    }
    html += `</details>`;
  }
  host.innerHTML = html;
  // Event delegation: single listener survives re-renders and guarantees
  // every entity-link responds. Replaces per-element attachment which was
  // suspected of failing intermittently on component rows.
  host.addEventListener('click', (ev) => {
    const a = ev.target.closest('a.entity-link');
    if (a && host.contains(a)) {
      ev.preventDefault(); ev.stopPropagation();
      if (a.dataset.id) selectEntity(a.dataset.id);
      else if (a.dataset.se) showSEView(a.dataset.se);
      return;
    }
    const s = ev.target.closest('summary[data-kind]');
    if (s && host.contains(s)) {
      // Don't preventDefault — let <details> toggle naturally.
      showKindList(s.dataset.kind);
    }
  });
  // SE Views section lives OUTSIDE #entity-groups; wire separately.
  document.querySelectorAll('#sidebar .entity-link[data-se]').forEach(a => {
    a.addEventListener('click', (ev) => {
      ev.preventDefault(); ev.stopPropagation();
      showSEView(a.dataset.se);
    });
  });
  document.querySelectorAll('.nav-item').forEach(a => {
    a.addEventListener('click', (ev) => {
      ev.preventDefault();
      const t = a.dataset.nav;
      if (t === 'overview') showOverview();
      else if (t === 'gaps') showGaps();
    });
  });
}

function showKindList(kind) {
  highlightNav(null, null);
  const items = data.entities_by_kind[kind] || [];
  let html = `<div class="breadcrumb"><a data-nav="overview">Overview</a> / ${kind}</div>`;
  html += `<h2 class="content-header">${kind} (${items.length})</h2>`;
  html += `<div class="subtitle">All ${kind} in the merged model. Click a row for entity detail.</div>`;
  html += `<div class="card"><table class="tops"><thead><tr>`;
  html += `<th style="text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px">Id</th>`;
  html += `<th style="text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px">Name</th>`;
  html += `<th style="text-align:right;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px">Promises</th>`;
  html += `<th style="text-align:right;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px">Gaps</th>`;
  html += `<th style="text-align:left;font-size:11px;text-transform:uppercase;color:var(--muted);padding:6px">Source</th>`;
  html += `</tr></thead><tbody>`;
  for (const e of items) {
    html += `<tr data-id="${e.id}"><td class="cid">${e.id}</td><td>${escapeHtml(e.name)}</td><td class="num">${e.promise_count}</td><td class="num">${e.gap_count}</td><td class="cid" style="font-size:10px">${escapeHtml(e.source)}</td></tr>`;
  }
  html += `</tbody></table></div>`;
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('table.tops tr[data-id]').forEach(tr => tr.addEventListener('click', () => selectEntity(tr.dataset.id)));
  document.querySelectorAll('.breadcrumb a').forEach(a => a.addEventListener('click', () => { if (a.dataset.nav === 'overview') showOverview(); }));
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function highlightNav(kind, id) {
  document.querySelectorAll('.nav-item').forEach(a => a.classList.toggle('active', a.dataset.nav === kind));
  document.querySelectorAll('.entity-link').forEach(a => {
    const isEntity = a.dataset.id === id;
    const isSE = a.dataset.se && a.dataset.se === kind;
    a.classList.toggle('active', isEntity || isSE);
  });
}

// --- Overview ---
function showOverview() {
  highlightNav('overview', null);
  const sh = data.status_hist || {};
  const total = Math.max(1, (sh.verified||0) + (sh.open||0) + (sh['typed-gap']||0));
  const rows = [
    ['verified', sh.verified||0, 'ok'],
    ['open', sh.open||0, 'warn'],
    ['typed-gap', sh['typed-gap']||0, 'error'],
  ];
  const statusBars = rows.map(([label, n, cls]) => {
    const pct = (n/total*100).toFixed(1);
    return `<div class="bar-row"><div class="label">${label}</div><div class="bar ${cls}" style="width:${pct}%"></div><div class="num">${n}</div></div>`;
  }).join('');
  const gh = data.gap_type_hist || {};
  const gkeys = Object.keys(gh).sort((a,b) => gh[b]-gh[a] || a.localeCompare(b));
  const gtotal = Math.max(1, gkeys.reduce((s,k) => s+gh[k], 0));
  const gapBars = gkeys.length ? gkeys.map(k => {
    const pct = (gh[k]/gtotal*100).toFixed(1);
    return `<div class="bar-row"><div class="label">${k}</div><div class="bar neutral" style="width:${pct}%"></div><div class="num">${gh[k]}</div></div>`;
  }).join('') : '<span class="empty">No typed gaps.</span>';
  const topProms = (data.top_by_promises || []).map(c =>
    `<tr data-id="${c.id}"><td class="cid">${c.id}</td><td>${escapeHtml(c.name)}</td><td class="kind">${c.kind}</td><td class="num">${c.promise_count}</td></tr>`
  ).join('');
  const topGaps = (data.top_by_gaps || []).map(c =>
    `<tr data-id="${c.id}"><td class="cid">${c.id}</td><td>${escapeHtml(c.name)}</td><td class="kind">${c.kind}</td><td class="num">${c.gap_count}</td></tr>`
  ).join('');
  const kindSummary = data.kinds_present.map(k =>
    `<div class="bar-row"><div class="label">${k}</div><div class="bar neutral" style="width:${(data.entities_by_kind[k].length/data.totals.entities*100).toFixed(1)}%"></div><div class="num">${data.entities_by_kind[k].length}</div></div>`
  ).join('');
  const diag = data.diagnostics || {};
  const dw = diag.direction_warnings || [];
  const sr = diag.realization_skip_reasons || {};
  const srKeys = Object.keys(sr);
  let diagBanner = '';
  if (dw.length || srKeys.length) {
    const dwRows = dw.map(w => `<li><code>[${w.type}] ${w.from} -> ${w.to}</code>: ${escapeHtml(w.warning)}</li>`).join('');
    const srRows = srKeys.map(k => `<li><code>${k}</code>: ${escapeHtml(sr[k])}</li>`).join('');
    diagBanner = `<div class="card" style="border-color:var(--warn,#c93);background:#3b2a10">` +
      `<h3>Build diagnostics (${dw.length + srKeys.length})</h3>` +
      (dw.length ? `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:6px">Note-vs-edge direction (${dw.length})</div><ul style="margin:4px 0 0 0;padding-left:20px;font-size:12px">${dwRows}</ul>` : '') +
      (srKeys.length ? `<div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-top:8px">Realization silent-skips (${srKeys.length})</div><ul style="margin:4px 0 0 0;padding-left:20px;font-size:12px">${srRows}</ul>` : '') +
      `</div>`;
  }
  document.getElementById('content').innerHTML = `
    <div class="breadcrumb">Overview</div>
    <h2 class="content-header">Architecture Model</h2>
    <div class="subtitle">${data.sources.length} source(s) &middot; ${data.totals.entities} entities across ${data.kinds_present.length} kinds</div>
    ${diagBanner}
    <div class="grid2">
      <div class="card"><h3>Promise status</h3>${statusBars}</div>
      <div class="card"><h3>Typed gap distribution</h3>${gapBars}</div>
      <div class="card"><h3>Entity kinds</h3>${kindSummary}</div>
      <div class="card"><h3>Sources merged</h3><ul style="margin:0;padding-left:18px;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px">${data.sources.map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div>
      <div class="card"><h3>Top 5 by promise count</h3><table class="tops">${topProms}</table></div>
      <div class="card"><h3>Top 5 by typed-gap count</h3><table class="tops">${topGaps}</table></div>
    </div>`;
  document.querySelectorAll('table.tops tr').forEach(tr => tr.addEventListener('click', () => selectEntity(tr.dataset.id)));
}

// --- Gaps ---
function showGaps() {
  highlightNav('gaps', null);
  const groups = {};
  for (const g of (data.gaps || [])) {
    (groups[g.gap_type] = groups[g.gap_type] || []).push(g);
  }
  const keys = Object.keys(groups).sort((a,b) => groups[b].length - groups[a].length || a.localeCompare(b));
  let html = `<div class="breadcrumb">Typed Gaps</div><h2 class="content-header">Typed Gaps</h2><div class="subtitle">${data.totals.gaps} total across ${keys.length} type(s)</div>`;
  if (!keys.length) html += '<p class="empty">No typed gaps.</p>';
  for (const k of keys) {
    const rows = groups[k].map(g =>
      `<tr data-id="${g.owner}"><td class="cid">${g.owner}</td><td>${escapeHtml(g.owner_name)}</td><td class="kind">${g.owner_kind}</td><td class="pid">${g.promise_id}</td><td>${g.attribute}</td></tr>`
    ).join('');
    html += `<h3 class="gap-header">${k} (${groups[k].length})</h3>` +
      `<table class="gaps"><thead><tr><th>Owner id</th><th>Owner name</th><th>Kind</th><th>Promise id</th><th>Attribute</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  document.getElementById('content').innerHTML = html;
  document.querySelectorAll('table.gaps tr[data-id]').forEach(tr => tr.addEventListener('click', () => selectEntity(tr.dataset.id)));
}

// --- Entity detail ---
function badge(status) {
  const cls = ({verified:'ok', open:'warn', 'typed-gap':'error'})[status] || 'warn';
  return `<span class="badge ${cls}">${status}</span>`;
}

function selectEntity(id) {
  const e = byId[id];
  if (!e) {
    console.warn('selectEntity miss:', id, 'byId size:', Object.keys(byId).length);
    return;
  }
  try {
    highlightNav(null, id);
    const attrs = ['intent','delivers','provides'];
    let html = `<div class="breadcrumb"><a data-nav="overview">Overview</a> / ${e.kind}s / ${e.id}</div>`;
    html += `<h2 class="content-header">${escapeHtml(e.name)}</h2>`;
    html += `<div class="subtitle">${e.id} &middot; ${e.kind}${e.root_prefix ? ' &middot; '+escapeHtml(e.root_prefix) : ''}<span class="source-tag">from ${escapeHtml(e.source)}</span></div>`;
    html += `<div class="card"><h3>Summary</h3><div style="font-size:13px">${e.module_count} modules &middot; ${e.promise_count} promises &middot; ${e.gap_count} typed gaps</div></div>`;

    // Inline capability-scoped flow diagram (design principle: any
    // capability whose contained behaviors have triggers edges gets an
    // inline Mermaid flow card here). Rendered ABOVE promises because
    // the flow is the primary insight for pipeline-shaped capabilities.
    let flowDiagramId = null;
    if (e.kind === 'capability' && e.flow_mermaid) {
      flowDiagramId = `mmd-flow-${e.id}-${++_seRenderCounter}`;
      html += `<div class="card"><h3>Flow (contained behaviors)</h3>` +
              `<div class="mermaid-host" style="background:#0f172a;padding:12px;border-radius:6px;overflow-x:auto">` +
              `<div id="${flowDiagramId}" class="mermaid">${escapeHtml(e.flow_mermaid)}</div>` +
              `</div></div>`;
    }

    // Additional graph-walk cards (silent skip when field absent).
    function _walkCard(title, mmd, refs, slug) {
      if (!mmd) return { id: null, html: '' };
      const did = `mmd-${slug}-${e.id}-${++_seRenderCounter}`;
      const chips = (refs || []).map(id =>
        `<span class="chip" data-id="${id}">${id}</span>`
      ).join('');
      const html = `<div class="card"><h3>${title}</h3>` +
        `<div class="mermaid-host" style="background:#0f172a;padding:12px;border-radius:6px;overflow-x:auto">` +
        `<div id="${did}" class="mermaid">${escapeHtml(mmd)}</div></div>` +
        (chips ? `<div style="margin-top:8px;font-size:11px;color:var(--muted);text-transform:uppercase">Entities referenced (${(refs||[]).length})</div><div class="chips" style="margin-top:4px">${chips}</div>` : '') +
        `</div>`;
      return { id: did, html };
    }
    const decompCard = _walkCard('Decomposition (contains, ≤2 hops)', e.decomposition_mermaid, e.decomposition_refs, 'decomp');
    const realizCard = _walkCard('Realization chain', e.realization_mermaid, e.realization_refs, 'realiz');
    const xflowCard = _walkCard('Cross-capability flow (triggers)', e.cross_flow_mermaid, e.cross_flow_refs, 'xflow');
    const cimpCard = _walkCard('Constraint impact (2-hop)', e.constraint_impact_mermaid, e.constraint_impact_refs, 'cimp');
    html += xflowCard.html + cimpCard.html + decompCard.html + realizCard.html;

    const seen = new Set();
    for (const attr of attrs) {
      const rows = (e.by_attr[attr] || []);
      seen.add(attr);
      if (!rows.length) continue;
      html += `<div class="card"><h3>${attr} (${rows.length})</h3>`;
      for (const p of rows) {
        const gap = p.gap_type ? `<span class="badge gap">${p.gap_type}</span>` : '';
        html += `<div class="prom"><div class="row">${badge(p.status)}${gap}<span class="pid">${escapeHtml(p.id)}</span></div>` +
                `<div class="content-text">${escapeHtml((p.content || []).join(', ')) || '<span class="empty">(empty)</span>'}</div>` +
                `<div class="prov">${escapeHtml(p.provenance || '')}</div></div>`;
      }
      html += `</div>`;
    }
    for (const attr of Object.keys(e.by_attr)) {
      if (seen.has(attr)) continue;
      const rows = e.by_attr[attr];
      html += `<div class="card"><h3>${attr} (${rows.length})</h3>`;
      for (const p of rows) {
        html += `<div class="prom"><div class="row">${badge(p.status)}<span class="pid">${escapeHtml(p.id)}</span></div>` +
                `<div class="content-text">${escapeHtml((p.content || []).join(', '))}</div></div>`;
      }
      html += `</div>`;
    }

    const neighCard = _walkCard('Neighbors (1-hop, typed)', e.neighbors_mermaid, e.neighbors_refs, 'neigh');
    html += neighCard.html;

    html += `<div class="card"><h3>Neighbors</h3>`;
    html += `<div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase">Depends on (${e.outbound.length})</div><div class="chips" style="margin-bottom:12px">`;
    html += e.outbound.length ? e.outbound.map(id => `<span class="chip" data-id="${id}">${id}</span>`).join('') : '<span class="empty">none</span>';
    html += `</div><div style="margin-bottom:6px;font-size:11px;color:var(--muted);text-transform:uppercase">Depended on by (${e.inbound.length})</div><div class="chips">`;
    html += e.inbound.length ? e.inbound.map(id => `<span class="chip" data-id="${id}">${id}</span>`).join('') : '<span class="empty">none</span>';
    html += `</div></div>`;

    const noteVal = notes[e.id] || '';
    html += `<div class="card"><h3>Notes</h3>` +
      `<textarea class="notes" id="notes-${e.id}" placeholder="Human notes, questions, TODOs — persisted to notes.yaml via Save button.">${escapeHtml(noteVal)}</textarea>` +
      `<button class="save" id="save-btn">Save notes.yaml (download)</button>` +
      `<div style="margin-top:6px;font-size:11px;color:var(--muted)">Option A: browser downloads full notes.yaml. Place in <code>.architecture/viewers/notes.yaml</code> and rebuild.</div></div>`;

    document.getElementById('content').innerHTML = html;
    document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => selectEntity(ch.dataset.id)));
    document.querySelectorAll('.breadcrumb a').forEach(a => a.addEventListener('click', () => {
      if (a.dataset.nav === 'overview') showOverview();
    }));
    const ta = document.getElementById(`notes-${e.id}`);
    if (ta) {
      ta.addEventListener('input', () => { notes[e.id] = ta.value; });
    }
    const saveBtn = document.getElementById('save-btn');
    if (saveBtn && ta) {
      saveBtn.addEventListener('click', () => {
        // Snapshot current textarea before download.
        notes[e.id] = ta.value;
        // Build YAML manually (deterministic, sorted).
        const keys = Object.keys(notes).sort();
        let yaml = "schema_version: '1.0'\nnotes:\n";
        if (!keys.length) yaml += '  {}\n';
        for (const k of keys) {
          const v = notes[k] || '';
          if (!v.trim()) continue;
          // Use YAML block scalar for multi-line safety.
          yaml += `  ${k}: |\n`;
          for (const line of v.split('\n')) yaml += `    ${line}\n`;
        }
        const blob = new Blob([yaml], {type: 'text/yaml'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'notes.yaml';
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    // Render inline Mermaid flow (after content injection so element exists).
    if (window.mermaid) {
      const targets = [
        [flowDiagramId, 'flow'],
        [xflowCard.id, 'cross_flow'],
        [cimpCard.id, 'constraint_impact'],
        [decompCard.id, 'decomposition'],
        [realizCard.id, 'realization'],
        [neighCard.id, 'neighbors'],
      ];
      for (const [did, tag] of targets) {
        if (!did) continue;
        const el = document.getElementById(did);
        if (!el) continue;
        mermaid.run({ nodes: [el] }).catch(err => {
          console.error(tag + ' mermaid render failed for', e.id, err);
          el.innerHTML = `<pre style="color:var(--muted);font-size:11px">Mermaid error: ${escapeHtml(String(err))}</pre>`;
        });
      }
    }
  } catch (err) {
    console.error('selectEntity render failed for', id, err);
    document.getElementById('content').innerHTML =
      `<div class="card"><h2>Render error</h2><div class="subtitle">${escapeHtml(id)}</div>` +
      `<pre style="color:var(--muted);white-space:pre-wrap">${escapeHtml(String(err && err.stack || err))}</pre></div>`;
  }
}

renderSidebar();
showOverview();

// --- SE Views (Mermaid diagrams) ---
if (window.mermaid) {
  mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', flowchart: { htmlLabels: true, curve: 'basis' } });
}

let _seRenderCounter = 0;
async function showSEView(viewId) {
  highlightNav(viewId, null);
  const v = (data.se_views || {})[viewId];
  if (!v) { document.getElementById('content').innerHTML = `<div class="empty">SE view ${escapeHtml(viewId)} not found.</div>`; return; }
  const refs = (v.entity_refs || []).map(id =>
    `<span class="chip" data-id="${id}">${id}</span>`
  ).join('');
  const diagramId = `mmd-${viewId}-${++_seRenderCounter}`;
  document.getElementById('content').innerHTML = `
    <div class="breadcrumb"><a data-nav="overview">Overview</a> / SE Views / ${escapeHtml(v.title)}</div>
    <h2 class="content-header">${escapeHtml(v.title)}</h2>
    <div class="subtitle">Deterministic render from merged model (${v.entity_refs.length} entity refs)</div>
    <div class="card"><h3>Intent</h3><div style="font-size:13px;line-height:1.6">${escapeHtml(v.narrative)}</div></div>
    <div class="card"><h3>Diagram</h3>
      <div class="mermaid-host" style="background:#0f172a;padding:12px;border-radius:6px;overflow-x:auto">
        <div id="${diagramId}" class="mermaid">${escapeHtml(v.mermaid)}</div>
      </div>
    </div>
    <div class="card"><h3>Entities referenced (${v.entity_refs.length})</h3><div class="chips">${refs || '<span class="empty">none</span>'}</div></div>
    <details class="card"><summary style="cursor:pointer;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:0.05em">Mermaid source</summary><pre style="margin:8px 0 0;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;color:var(--muted);white-space:pre-wrap">${escapeHtml(v.mermaid)}</pre></details>
  `;
  document.querySelectorAll('.chip').forEach(ch => ch.addEventListener('click', () => selectEntity(ch.dataset.id)));
  document.querySelectorAll('.breadcrumb a').forEach(a => a.addEventListener('click', () => {
    if (a.dataset.nav === 'overview') showOverview();
  }));
  if (window.mermaid) {
    try {
      const el = document.getElementById(diagramId);
      await mermaid.run({ nodes: [el] });
    } catch (err) {
      const el = document.getElementById(diagramId);
      if (el) el.innerHTML = `<div class="empty">Mermaid render failed: ${escapeHtml(err.message || String(err))}</div>`;
    }
  }
}
</script>
</body>
</html>
