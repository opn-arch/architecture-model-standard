    - src/architecture_model/manifest/behavior.py
    - src/architecture_model/manifest/chains.py
    - src/architecture_model/manifest/test_analyzer.py
    kind: library
    contract: "resolve_imports() \u2192 edges, extract_interfaces() \u2192 InterfaceInfo"
  - id: COMP-3.3
    name: Grouping & Generation
    status: ACTIVE
    description: Component grouping logic, manifest generation, recursive scanning
    layer: domain
    files:
