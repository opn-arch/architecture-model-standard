meta:
  schema_version: '2.1'
  project: architecture-model-standard
  generated_at: '2026-08-16'
  domain_profile: library
entities:
  actors:
  - id: ACT-1
    name: AI Agent (MCP Client)
    status: ACTIVE
    description: LLM-based coding agent that invokes architecture tools via MCP protocol
    intent: Consume compressed architecture context to generate, validate, and update
      models
    goals:
    - Load and query architecture models
    - Validate model correctness
    - Propose model updates
    - Trace change impact
    type: human
  - id: ACT-2
    name: Developer
    status: ACTIVE
    description: Human developer using CLI or integrating the library directly
    intent: Author and maintain architecture models for software projects
    goals:
    - Define system architecture
    - Validate models against code
    - Generate documentation
    - Track architectural drift
    type: human
  - id: ACT-3
    name: CI/CD Pipeline
    status: ACTIVE
    description: Automated pipeline running validation and doc generation on commits
    intent: Automate architecture validation and documentation generation in pipelines
    goals:
    - Run validation checks on PRs
    - Generate architecture docs
    - Detect model drift
    type: human
  capabilities:
  - id: CAP-0
    name: Provide Architecture-as-Code Standard
    status: ACTIVE
    description: Root capability encompassing all system functions
  - id: CAP-0.1
    name: Understand Software Architecture
    status: ACTIVE
    description: Analyze and represent software architecture from source code
  - id: CAP-0.2
    name: Validate Architectural Claims
    status: ACTIVE
    description: Verify architectural claims against code reality
  - id: CAP-0.3
    name: Generate Architecture Artifacts
    status: ACTIVE
    description: Produce documentation, models, and exports from architectural knowledge
  - id: CAP-0.4
    name: Evolve Architecture Over Time
    status: ACTIVE
    description: Track changes, decompose systems, and maintain model quality
  - id: CAP-1
    name: Validate Architecture Models
    status: ACTIVE
    description: Check model correctness, completeness, hierarchy consistency, and
      domain rules
    intent: Ensure architecture models are structurally sound and internally consistent
      before downstream consumption
    moes:
    - Validation score >= 80 on well-formed models
    - Zero false-positive errors on valid models
    - All referential integrity violations detected
  - id: CAP-2
    name: Extract Architecture from Code
    status: ACTIVE
    description: Scan source code AST and derive components, relationships, behaviors
      automatically
    intent: Bootstrap architecture models from existing codebases without manual authoring
    moes:
    - Extraction produces valid models scoring >= 90 on arbitrary Python repos
    - All non-trivial source files represented in the model
    - Relationship types correctly inferred from import analysis
  - id: CAP-3
    name: Run Modular Extraction Pipeline
    status: ACTIVE
    description: "Execute 10-stage pipeline (observe\u2192infer\u2192allocate\u2192\
      relate\u2192specify\u2192contract\u2192validate\u2192decompose\u2192synthesize\u2192\
      emit)"
    intent: Provide a repeatable, cacheable, stage-by-stage process for producing
      architecture models from code
    moes:
    - All 10 stages complete without error on repos with >200 files
    - Each stage independently runnable with cached predecessors
    - Deterministic output for identical input
  - id: CAP-4
    name: Generate Reality Manifest
    status: ACTIVE
    description: Scan source files to produce structural facts (functions, imports,
      classes, routes, tests)
    intent: Establish ground-truth code inventory so architecture claims can be verified
      against reality
    moes:
    - All non-trivial Python files scanned with function/class extraction
    - Import edges resolved with >95% accuracy
    - Manifest generation completes in <10s for repos with 200 files
  - id: CAP-5
    name: Generate SE Documentation
    status: ACTIVE
    description: Produce functional analysis, logical architecture, use cases, requirements,
      V&V, operations docs
    intent: Auto-generate standards-compliant systems engineering documentation from
      architecture models
    moes:
    - Generate at least 15 SE document types from a single model
    - Core docs (health, functional-analysis) regenerate in <1s without LLM
    - User-edited sections preserved across regeneration
  - id: CAP-6
    name: Author Model from Requirements
    status: ACTIVE
    description: Parse requirements document into a concept-phase architecture model
    intent: Enable forward-engineering by converting stakeholder requirements into
      architecture before code exists
    moes:
    - Parse markdown requirements into valid ArchitectureModel
    - Actors, capabilities, and constraints correctly extracted
    - Generated model passes validation with score >= 80
  - id: CAP-7
    name: Slice and Query Models
    status: ACTIVE
    description: Filter model by block, layer, status, artifact for focused context
      delivery
    intent: Deliver only relevant architecture context to token-limited AI agents
      and focused human queries
    moes:
    - Sliced output fits within 4000-token budget
    - Slice preserves all relationships touching included entities
    - Query response time <100ms for any slice operation
  - id: CAP-8
    name: Diff Model Versions
    status: ACTIVE
    description: Compare two model versions showing additions, removals, and changes
    intent: Track architectural evolution over time and detect unintended structural
      changes
    moes:
    - All added, removed, and changed entities detected
    - Diff output human-readable and machine-parseable
    - Diff completes in <1s for models with 100+ entities
  - id: CAP-9
    name: Decompose Models Hierarchically
    status: ACTIVE
    description: Break coarse models into per-system sub-models with parent/child
      relationships
    intent: Enable scalable architecture management by splitting large models into
      focused, self-contained subsystems
    moes:
    - Components with >=5 files produce autonomous sub-models
    - Each sub-model is independently valid
    - Parent model correctly references all child systems
  - id: CAP-10
    name: Enrich Models with Code Intelligence
    status: ACTIVE
    description: Auto-populate signatures, constants, test contracts, behaviors from
      source
    intent: Bridge the gap between abstract architecture and concrete code to enable
      faithful code regeneration
    moes:
    - Signatures populated for >90% of public functions
    - Body hints cover trivial functions (one-liners)
    - Test contracts extracted for all test files with assertions
  - id: CAP-11
    name: Assess Regen Readiness
    status: ACTIVE
    description: Score how well a model captures enough detail to regenerate code
    intent: Quantify whether a model contains sufficient information for an AI agent
      to regenerate working code
    moes:
    - Regen score correlates with actual test pass rate (r > 0.8)
    - Per-component scores with actionable blocker list
    - Grade scale (A-F) matches blind regeneration fidelity
  - id: CAP-12
    name: Check Development Gate
    status: ACTIVE
    description: Verify code reality is tracking toward authored architecture intent
    intent: Prevent architectural drift by gating development milestones on model-to-code
      alignment
    moes:
    - Gate check reports coverage percentage of authored capabilities
    - Unimplemented capabilities clearly flagged
    - Gate result includes pass/fail with actionable gaps
  - id: CAP-13
    name: Detect and Fix Model Drift
    status: ACTIVE
    description: Compare model against current code, report coverage gaps
    intent: Keep architecture models synchronized with evolving codebases by detecting
      and reporting divergence
    moes:
    - File coverage reported as percentage of source files modeled
    - Orphan components (no matching files) detected
    - Drift report generated in <5s
  - id: CAP-14
    name: Manage Global Learnings
    status: ACTIVE
    description: Store, retrieve, and apply heuristics/archetypes/workflows across
      pipeline runs
    intent: Improve pipeline accuracy over time by accumulating and reusing extraction
      patterns
    moes:
    - Learnings persisted across pipeline runs
    - Pattern lookup returns relevant heuristics in <100ms
    - Duplicate learnings deduplicated by content hash
  - id: CAP-15
    name: Export for AI Consumption
    status: ACTIVE
    description: Produce flat-file exports optimized for token-limited AI environments
    intent: Make architecture models portable and consumable by AI agents that cannot
      access the repository directly
    moes:
    - Export includes model, sub-models, docs, manifests, and diagrams
    - Exported package is self-contained (no external dependencies)
    - Total export size fits within reasonable token budgets for frontier models
