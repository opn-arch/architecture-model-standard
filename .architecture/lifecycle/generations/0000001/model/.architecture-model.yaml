    - src/architecture_model/core/merger.py
    - src/architecture_model/persistence/__init__.py
    - src/architecture_model/persistence/store.py
    kind: library
    contract: "load_model(path) \u2192 ArchitectureModel, dump_model(model, path),\
      \ compact_for_storage()"
  - id: COMP-1.4
    name: Model Operations
    status: ACTIVE
    description: Slice, diff, coverage, impact analysis, clustering, source block
      assignment
    layer: foundation
    files:
    - src/architecture_model/core/slicer.py
    - src/architecture_model/core/differ.py
    - src/architecture_model/core/coverage.py
    - src/architecture_model/core/cluster.py
    - src/architecture_model/core/source_block_assign.py
    - src/architecture_model/core/source_block_quality.py
    - src/architecture_model/core/representativeness.py
    - src/architecture_model/core/test_affinity.py
    kind: library
    contract: slice_model(focus), diff_models(a, b), compute_coverage(model, manifest)
  - id: COMP-1.5
    name: Quality Metrics
    status: ACTIVE
    description: Confidence scoring, regen readiness, corrections tracking
    layer: foundation
    files:
    - src/architecture_model/core/confidence.py
    - src/architecture_model/core/regen_readiness.py
    - src/architecture_model/core/corrections.py
    - src/architecture_model/core/decomposer.py
    - src/architecture_model/core/visualize.py
    kind: library
    contract: compute_model_confidence(), compute_regen_readiness_score()
  - id: COMP-2
    name: Pipeline
    status: ACTIVE
    description: Modular 10-stage extraction pipeline with coordination and caching
    intent: Automate the entire code-to-model extraction process as a repeatable,
      cacheable pipeline
    goals:
    - Execute all 10 stages in dependency order with error recovery
    - Cache intermediate results for incremental re-runs
    - Surface uncertainties for human or LLM resolution between stages
    failure_modes:
    - Cache staleness causes pipeline to emit outdated models
    - Stage failure cascades prevent partial results from being usable
    - Uncertainty accumulation across stages produces low-confidence models
    trade_offs:
    - Stage granularity (10 stages) vs. simpler monolithic extraction
    - Cache correctness vs. cache invalidation complexity
    - Determinism vs. allowing LLM enrichment between stages
    layer: domain
    files:
    - src/architecture_model/pipeline/__init__.py
  - id: COMP-2.1
    name: Pipeline Coordination
    status: ACTIVE
    description: Stage orchestration, context management, caching, reporting
    layer: domain
    files:
    - src/architecture_model/pipeline/coordinator.py
    - src/architecture_model/pipeline/protocol.py
    - src/architecture_model/pipeline/cache.py
    - src/architecture_model/pipeline/context_gen.py
    - src/architecture_model/pipeline/report.py
    - src/architecture_model/pipeline/artifacts.py
    - src/architecture_model/pipeline/corrections.py
    contract: PipelineCoordinator.run(repo_path) orchestrates all stages in dependency
      order
