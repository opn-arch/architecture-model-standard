    - src/architecture_model/pipeline/specify_types.py
    - src/architecture_model/pipeline/contract.py
    - src/architecture_model/pipeline/contract_types.py
    - src/architecture_model/pipeline/validate.py
    - src/architecture_model/pipeline/validate_types.py
    contract: "specify() \u2192 SpecifyResult, contract() \u2192 ContractResult, validate()\
      \ \u2192 ValidateResult"
  - id: COMP-2.5
    name: Synthesis & Emit Stages
    status: ACTIVE
    description: 'decompose + synthesize + emit: break down, merge, output final model'
    layer: domain
    files:
    - src/architecture_model/pipeline/decompose.py
    - src/architecture_model/pipeline/decompose_types.py
    - src/architecture_model/pipeline/synthesize.py
    - src/architecture_model/pipeline/synthesize_types.py
    - src/architecture_model/pipeline/emit.py
    - src/architecture_model/pipeline/emit_types.py
    - src/architecture_model/pipeline/regen_score.py
    contract: "decompose() \u2192 systems, synthesize() \u2192 merged model, emit()\
      \ \u2192 final YAML"
  - id: COMP-3
    name: Manifest
    status: ACTIVE
    description: "Source code scanning \u2014 AST analysis, import resolution, grouping"
    intent: Produce ground-truth code inventories via AST scanning so architecture
      claims can be verified
    goals:
    - Scan all source files and extract functions, classes, imports, and metrics
    - Resolve import edges to build accurate dependency graphs
    - Group modules into logical components by affinity signals
    failure_modes:
    - Dynamic imports or metaprogramming invisible to AST scanning
    - Import resolution fails on namespace packages or conditional imports
    - Grouping algorithm produces incoherent component boundaries
    trade_offs:
    - AST-only analysis (fast, deterministic) vs. runtime analysis (more accurate)
    - Language-specific scanners vs. universal parsing (chose per-language for accuracy)
    - Scan depth vs. performance on large repos
    layer: domain
    files:
    - src/architecture_model/manifest/__init__.py
    - src/architecture_model/manifest/types.py
    kind: library
  - id: COMP-3.1
    name: Scanners
    status: ACTIVE
    description: Language-specific source file scanners (Python, TypeScript, Kotlin)
    layer: domain
    files:
