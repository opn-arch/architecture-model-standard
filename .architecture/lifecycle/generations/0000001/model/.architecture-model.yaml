    - src/architecture_model/orchestration/pipeline.py
    contract: "decompose_model() \u2192 per-system sub-models, compact_for_storage()"
  - id: COMP-6
    name: Extract
    status: ACTIVE
    description: "Code-to-model extraction \u2014 route detection, constraint detection,\
      \ artifact parsing"
    intent: Convert raw code artifacts into structured architecture model entities
    goals:
    - Detect web routes, API endpoints, and framework patterns
    - Extract constraints from configuration and code annotations
    - Parse existing architecture artifacts (markdown tables, specs) into model entities
    failure_modes:
    - Framework-specific extractors miss custom or unconventional patterns
    - Artifact parser misinterprets markdown table structure
    - Constraint detection produces false positives from comments or dead code
    trade_offs:
    - Framework-specific detection (accurate) vs. generic heuristics (portable)
    - Extracting from code vs. from documentation (chose both with priority on code)
    - Precision vs. recall in constraint detection
    layer: domain
    files:
    - src/architecture_model/extract/from_code.py
    - src/architecture_model/extract/from_artifacts.py
    - src/architecture_model/extract/route_detector.py
    - src/architecture_model/extract/constraint_detector.py
    - src/architecture_model/extract/table_parser.py
    kind: library
    contract: "extract_from_code(path) \u2192 partial model, detect_routes() \u2192\
      \ route info"
  - id: COMP-7
    name: Authoring
    status: ACTIVE
    description: Forward-author models from requirements, check development gates
    intent: Enable architecture-first development by creating models before code and
      gating progress against them
    goals:
    - Parse freeform requirements documents into concept-phase models
    - Gate development milestones on architecture coverage
    - Bridge the gap between stakeholder intent and technical architecture
    failure_modes:
    - Requirements parser misinterprets ambiguous natural language
    - Gate check produces false failures due to naming mismatches
    - Authored model diverges from implementation reality over time
    trade_offs:
    - Structured parsing (reliable) vs. LLM-based understanding (flexible)
    - Strict gate enforcement vs. advisory-only feedback
    - Requirements granularity vs. model abstraction level
    layer: application
    files:
    - src/architecture_model/authoring/__init__.py
    - src/architecture_model/authoring/parser.py
    - src/architecture_model/authoring/gate.py
    kind: library
    contract: "parse_requirements_doc(text) \u2192 ArchitectureModel, check_development_gate(model,\
      \ manifest)"
  - id: COMP-8
    name: CLI
    status: ACTIVE
    description: "Command-line interface \u2014 all user-facing commands"
    intent: Expose all architecture operations as CLI commands for developers and
      CI/CD pipelines
    goals:
    - Provide commands for validate, slice, diff, manifest, enrich, decompose, and
      docs
    - Support both interactive developer use and headless CI/CD execution
    - Serve as the MCP-wrappable surface for AI agent integration
    failure_modes:
    - CLI argument parsing errors give unhelpful messages
    - Command fails silently instead of returning non-zero exit code
    - Breaking CLI changes disrupt MCP server wrappers
    trade_offs:
    - Single monolithic CLI vs. per-subsystem CLIs (chose monolithic for discoverability)
    - Rich interactive output vs. machine-parseable output (support both via flags)
    - Exposing all operations vs. curating a minimal command set
    layer: interface
    files:
    - src/architecture_model/__init__.py
    - src/architecture_model/__main__.py
    - src/architecture_model/cli/__init__.py
    - src/architecture_model/cli/main.py
    - src/architecture_model/cli/visualize.py
    contract: 'CLI commands: validate, slice, diff, manifest, enrich, decompose, docs,
      coverage, etc.'
  - id: COMP-9
    name: Configuration
    status: ACTIVE
    description: Configuration loading, domain profiles, schema definitions
    intent: Provide discoverable, zero-config project settings with extensibility
      via domain profiles
    goals:
    - Auto-discover project configuration from directory structure
    - Support domain profiles (software, controls, mechanical, electrical)
    - Define schema rules that the validator enforces
    failure_modes:
    - Auto-discovery misidentifies project root or source directories
    - Profile loading fails silently and falls back to wrong defaults
    - Schema definition conflicts with validator implementation
    trade_offs:
    - Convention-over-configuration (easy start) vs. explicit config (predictable)
    - Built-in profiles vs. user-defined profiles (support both)
    - Schema strictness vs. forward compatibility with new fields
    layer: infrastructure
    files:
    - src/architecture_model/config/__init__.py
    - src/architecture_model/config/loader.py
    - src/architecture_model/config/schema.py
    - src/architecture_model/profiles/__init__.py
    - src/architecture_model/profiles/builtins/__init__.py
    - src/architecture_model/profiles/schema.py
    kind: library
    contract: "load_config(repo_path) \u2192 ProjectConfig with profile and domain\
      \ settings"
  - id: COMP-10
    name: Export
    status: ACTIVE
    description: Flat-file export for AI consumption, reference doc generation
    intent: Package architecture models into portable, self-contained bundles for
      token-limited AI environments
    goals:
    - Export model, sub-models, docs, manifests, and diagrams as flat files
    - Generate reference documentation for offline consumption
    - Produce exports that are self-contained without repository access
    failure_modes:
    - Export produces files too large for target AI context window
    - Missing sub-models or manifests make export incomplete
    - File path references in export break when moved to different location
    trade_offs:
    - Complete export (large) vs. minimal export (fits token budgets)
    - Directory-based export vs. single archive (support both)
    - Including all artifacts vs. selective export based on use case
    layer: application
    files:
    - src/architecture_model/export/__init__.py
    - src/architecture_model/export/flatfiles.py
    - src/architecture_model/export/reference.py
    kind: library
    contract: "export_flat_files(model, output_dir) \u2192 portable architecture package"
  - id: COMP-11
    name: Pipeline Learning
    status: ACTIVE
    description: Global learning store, heuristics, lessons extraction
    layer: domain
    files:
    - src/architecture_model/pipeline/global_learning.py
    - src/architecture_model/pipeline/learning.py
    - src/architecture_model/pipeline/lessons.py
    kind: library
    contract: "GlobalLearningStore \u2014 persist and retrieve heuristics/archetypes/workflows"
  - id: COMP-12
    name: Utilities
    status: ACTIVE
    description: Shared utilities, monitoring, patterns, data loading
    intent: Provide cross-cutting utilities that prevent duplication across subsystems
    goals:
    - Centralize file discovery and exclusion pattern logic
    - Provide monitoring and observability hooks for key operations
    - Share common patterns and data loading utilities
    failure_modes:
    - Utility changes silently break multiple dependent subsystems
    - Monitoring hooks add latency to critical-path operations
    - Exclusion patterns miss new file types or directory conventions
    trade_offs:
    - Shared utilities (DRY) vs. subsystem autonomy (decoupled)
    - Monitoring overhead vs. operational visibility
    - General-purpose utilities vs. domain-specific helpers
    layer: infrastructure
    files:
    - src/architecture_model/utils/__init__.py
    - src/architecture_model/utils/discovery.py
    - src/architecture_model/monitoring.py
    - src/architecture_model/monitoring_checks.py
    - src/architecture_model/patterns.py
    - src/architecture_model/data/__init__.py
    kind: library
    contract: Shared utilities for file discovery, monitoring, common patterns
  - id: COMP-COMMENT-SYS
    name: Comment System
    status: ACTIVE
    description: Structured comment collection for review workflows. Provides typed
      models (Comment, Thread), a persistent store, CLI command, and journal integration
      so comments survive across sessions.
    layer: collaboration
    files:
    - src/architecture_model/comments/__init__.py
    - src/architecture_model/comments/models.py
    - src/architecture_model/comments/store.py
    - src/architecture_model/cli/comment.py
    - src/architecture_model/lifecycle/journal.py
    kind: library
    contract: Persist and retrieve structured comments (author, target_ref, body,
      thread_id) with CLI-driven read/write. Comments emit journal events for auditability.
  - id: COMP-SIL
    name: SI&L Instrumentation
    status: ACTIVE
    description: Component-scoped telemetry layer. `sil_instrument` decorator, SQLite-
      backed ring-buffer store (50 events per component), 7-day rollup aggregator.
      Instrumentation currently covers 10 pipeline stages, 5 renderers, 3 validators,
      and 19 MCP tool handlers.
    layer: observability
    files:
    - src/architecture_model/sil/__init__.py
    - src/architecture_model/sil/decorators.py
    - src/architecture_model/sil/record.py
    - src/architecture_model/sil/rollup.py
    kind: library
    contract: '@sil_instrument("component:id") wraps any callable; emits SILRecord
      on invocation; SILStore.rollup(component_id) returns {invocations_7d, failure_rate_7d,
      avg_duration_ms}.'
  - id: COMP-LLM
    name: LLM Provider Protocol
    status: ACTIVE
    description: Runtime-checkable Protocol exposing complete/stream/structured/tokenize.
      AMS defines the contract; concrete adapters (MCP, Frontier, RelayExt) live in
      OCA. Emit stage stamps `meta.provider` on every generated model for reproducibility.
    layer: observability
    files:
    - src/architecture_model/llm/__init__.py
    - src/architecture_model/llm/provider.py
    - src/architecture_model/pipeline/emit.py
    kind: library
    contract: LLMProvider Protocol; `_stamp_provider` writes meta.provider = {name,
      model, policy_ref} at pipeline emit time. `AMS_DETERMINISTIC_NOW` pins timestamps
      for byte-identical rebuilds.
  - id: COMP-DASHBOARD
    name: Pipeline HTML Dashboard Renderer
    status: ACTIVE
    description: '`pipeline-html` renderer + `pipeline_html_data` projector. Produces
      a single-file interactive HTML with embedded JSON state, colored SI&L badges,
      and vanilla-JS drill-down. Deterministic; assets mirrored under assets/pipeline_dashboard/.'
    layer: presentation
    files:
    - src/architecture_model/lifecycle/renderers/pipeline_html.py
    - src/architecture_model/lifecycle/renderers/pipeline_html_data.py
    - src/architecture_model/lifecycle/renderers/assets/pipeline_dashboard/index.css
    - src/architecture_model/lifecycle/renderers/assets/pipeline_dashboard/badges.js
    - src/architecture_model/lifecycle/renderers/assets/pipeline_dashboard/drilldown.js
    kind: library
    contract: render_pipeline_html(*, materialized_slice, sil_store=None) -> str.
      Renderer registered in Renderer Literal and artifact-spec schema enum. Byte-identical
      output guaranteed under fixed inputs.
