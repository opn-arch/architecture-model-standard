      \ full manifest"
  - id: COMP-4
    name: Documentation
    status: ACTIVE
    description: "Architecture documentation generation \u2014 component specs, SE\
      \ docs, diagrams"
    intent: Generate human-readable and AI-consumable architecture documentation from
      models automatically
    goals:
    - Produce component specs, ICDs, and dependency matrices from model data
    - Generate 15+ SE document types following standards-based templates
    - Create Mermaid diagrams for visual architecture communication
    failure_modes:
    - Generated docs become stale if not regenerated after model changes
    - User edits lost on regeneration if preservation logic fails
    - Diagram complexity makes large systems unreadable
    trade_offs:
    - Template-based generation (fast, consistent) vs. LLM-generated prose (richer)
    - Document completeness vs. generation speed
    - Preserving user edits vs. full regeneration freshness
    layer: application
    files:
    - src/architecture_model/docs/__init__.py
    kind: library
