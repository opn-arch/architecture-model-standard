  - id: CAP-COMMENT-COLLABORATION
    name: Enable Reviewer-Author Comment Loop
    status: ACTIVE
    description: Structured comment records attached to review artifacts, persisted
      in a typed store with a CLI surface. Powers the "comment-view loop" collaboration
      model between reviewers and authors.
    intent: Give reviewers a machine-readable place to leave persistent commentary
      on architecture models, views, and artifacts.
  - id: CAP-SIL-INSTRUMENTATION
    name: Instrument Architecturally-Significant Call Sites
    status: ACTIVE
    description: Component-scoped SI&L telemetry captures invocations, outcomes, and
      latency of pipeline stages, renderers, validators, and MCP tool handlers. Backed
      by a SQLite ring buffer with 7-day rollups.
    intent: Turn the pipeline from an opaque batch process into an observable system
      where component health can be queried on-demand.
  - id: CAP-LLM-ROUTING
    name: Route LLM Calls Through Pluggable Providers
    status: ACTIVE
    description: LLMProvider Protocol abstracts subprocess (MCP), frontier HTTPS,
      and relay adapters behind a runtime-checkable interface. Emit-time provider
      stamping guarantees reproducibility.
    intent: Decouple the pipeline from any single LLM backend; support policy- driven
      routing and provenance capture per generated model.
  - id: CAP-INTERACTIVE-DASHBOARD
    name: Render Interactive Pipeline Dashboard
    status: ACTIVE
    description: Single self-contained HTML with embedded pipeline state JSON, colored
      SI&L badges, and drill-down panels. Deterministic build; assets auto-mirrored
      alongside output.
    intent: Provide a review-friendly visual for the pipeline architecture that surfaces
      live health metrics without a running backend.
