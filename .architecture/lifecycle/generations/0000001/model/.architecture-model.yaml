  components:
  - id: COMP-1
    name: Core
    status: ACTIVE
    description: Foundation types, validation, parsing, and model operations
    intent: Provide the canonical type system and fundamental operations that all
      other subsystems depend on
    goals:
    - Define a complete, extensible type system for architecture entities
    - Validate models with scored, actionable feedback
    - Support lossless YAML round-trip parsing
    failure_modes:
    - Type system changes break downstream parsers and MCP tools
    - Validation false positives block valid models from progressing
    - Parser loses data on round-trip due to YAML serialization edge cases
    trade_offs:
    - Rich type system vs. schema simplicity for external consumers
    - Strict validation vs. permissive parsing for backward compatibility
    - Monolithic core vs. fine-grained packages (chose monolithic for import simplicity)
    layer: foundation
    files:
    - src/architecture_model/core/__init__.py
    kind: library
  - id: COMP-1.1
    name: Type System
    status: ACTIVE
    description: All dataclasses, enums, and type definitions for the architecture
      model
    layer: foundation
    files:
    - src/architecture_model/core/types.py
    kind: library
    contract: Defines ArchitectureModel, Component, Relationship, Behavior, System,
      and 17 entity types
  - id: COMP-1.2
    name: Validation
    status: ACTIVE
    description: "Model validation \u2014 JSON schema, referential integrity, hierarchy,\
      \ cycles, domain rules"
    layer: foundation
    files:
    - src/architecture_model/core/validator.py
    - src/architecture_model/spec/__init__.py
    kind: library
    contract: "validate_model() \u2192 ValidationResult with scored issues (100 -\
      \ 10*errors - 2*warnings)"
  - id: COMP-1.3
    name: Parser & Persistence
    status: ACTIVE
    description: YAML parsing, serialization, round-trip preservation
    layer: foundation
    files:
    - src/architecture_model/core/parser.py
