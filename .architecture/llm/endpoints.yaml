# LLM endpoint inventory
#
# Declared registry of all LLM integration points across the AMS + OCA
# codebases. Consumed by
# ``src/architecture_model/walks/meta/llm_endpoint_inventory.py``
# (CAP-WK.llm-endpoint-inventory audit walk).
#
# Endpoint id format: ``<repo_slug>:<posix_relpath_from_repo>:<lineno>``
# - repo_slug = last component of the repo root path
#   (``architecture-model-standard`` | ``opencode-arch``)
# - posix_relpath = path from the repo root, forward-slash separated
# - lineno = 1-based source line of the LLM call site
#
# The id must match the AST-derived form exactly for the audit walk to
# emit ``covered``. Mismatch → ``stale`` (declared, no AST) or
# ``undeclared`` (AST hit, not declared).
#
# migration_status values:
#   protocol   — new LLMProvider Protocol (provider.complete/structured/stream)
#   legacy     — old llm_callback pattern (drives migration audit)
#   provenance — passive read of provider metadata (no call)
#   routing    — routing/policy glue (calls provider indirectly)
#
# Line numbers reflect the code state on ``feat/phase-5-fanout-provenance-family5``
# at the AMS commit that ships Part 13. As code moves, ids drift — the audit
# walk surfaces drift as ``stale`` (declared, no AST hit) so the inventory can
# be maintained.
