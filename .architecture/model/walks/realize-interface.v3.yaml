walk:
  id: WALK-realize-interface
  audits:
    - CAP-WK.realize

  scope:
    kind: interface

  traverse:
    hops:
      # Hop 1: components that expose this interface (inbound exposes).
      - edges: [exposes]
        direction: inbound
      # Hop 2: capabilities those components realize (outbound realizes).
      - edges: [realizes]
        direction: outbound

  classify:
    verdicts:
      - name: ready-to-code
        when: "true"
    on_missing_attributes: ready-to-code

  evidence:
    tier: structural
    sources:
      - model

  emit:
    card_template: realization-chain
    severity_from: verdict
    include_subgraph: true
