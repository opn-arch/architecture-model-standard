walk:
  id: WALK-realize-behavior
  audits:
    - CAP-WK.realize

  scope:
    kind: behavior

  traverse:
    hops:
      # Hop 1: components that trace to this behavior (inbound traces-to).
      - edges: [traces-to]
        direction: inbound
      # Hop 2: capabilities those components realize (outbound realizes).
      - edges: [realizes]
        direction: outbound

  classify:
    verdicts:
      - name: ready-to-code
        when: "true"
    on_missing_attributes: ready-to-code

  evidence:
    tier: structural
    sources:
      - model

  emit:
    card_template: realization-chain
    severity_from: verdict
    include_subgraph: true
