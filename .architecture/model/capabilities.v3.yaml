  # a spec YAML.
  - id: CAP-WK
    name: walk_substrate
    promises:
    - id: PR-CAP-WK-intent
      attribute: intent
      content:
      - Provide a declarative substrate for graph-walk audits over an
        architecture model. Each walk is a WalkSpec YAML running on
        pipeline_v3.substrate through six pure stages
        (select → traverse → classify → rollup → evidence → emit),
        modeled itself as an AMS capability so that walks are first-class
        entities auditable by other walks (meta-closure).
      owner_entity: CAP-WK
      delivered_from: null
      verified_by:
      - src/architecture_model/walks/ package
      - tests/walks/ (24 tests pass 2026-09-16)
      status: verified
      gap_type: null
      provenance: |
        Part 1+2 of the walk-substrate plan (2026-09-16). Substrate promoted
        into pipeline_v3/substrate/; walks module built on top. See
        docs/plans/2026-09-16-walk-substrate.md.
    - id: PR-CAP-WK-requirements
      attribute: requirements
      content:
      - Substrate MUST expose Stage/Pipeline/ContentCache/silent_skip primitives
        that both pipeline_v3 and walks can share without divergence.
      - WalkSpec YAML MUST support kind+predicate selection AND composition via
        scope.from_walk (full-payload passthrough).
      - Classify MUST emit one of five verdicts (ready-to-code, needs-decomp,
        needs-enrichment, needs-validation, contradictory).
      - "Rollup MUST be attribute-category-aware (A=union, B=conjunction, C=contract-composition) and driven by declarative strategy."
      - Every attribute participating in walks MUST carry full provenance
        (value, source, confidence, verified_by) with schema-default category
        overridable inline.
      - Composition graph across WalkSpecs MUST be cycle-detected at load time.
      owner_entity: CAP-WK
      delivered_from: null
      verified_by:
      - src/architecture_model/pipeline_v3/substrate/{stage,pipeline,cache,contract}.py
      - src/architecture_model/walks/{attribute,verdict,runner}.py
      - src/architecture_model/walks/stages/*.py
      - src/architecture_model/walks/spec/loader.py (cycle detection)
      status: verified
      gap_type: null
      provenance: Locked plan decisions from 2026-09-16 (Q1–Q8).
    - id: PR-CAP-WK-goals
      attribute: goals
      content:
      - Reduce a new walk from ~60 LOC hand-written Python to ~20 lines of
        declarative YAML.
      - Enable declarative rollup so umbrella caps (e.g. CAP-DF) inherit
        realization from sub-caps without bespoke Python.
      - Make walks themselves auditable so meta-walks can enforce coverage.
      owner_entity: CAP-WK
      delivered_from: null
      verified_by: []
      status: proposed
      gap_type: null
      provenance: Design goals per plan §4.b table.
