      - scripts/build_v3_viewer.py lines ~714 (L4), ~1131 try/catch (L5), _mermaid_* helpers (L6-L8, L11), _lint_edge_note_directions + _realization_skip_reasons (L10)
      status: verified
      gap_type: null
      provenance: |
        Harvested 2026-09-16 across CAP-PB walk + viewer content-shape fix +
        3-diagram generalization. These are lessons learned by DOING the
        model-based dev loop on itself, and belong in the model so future
        walks inherit them.
