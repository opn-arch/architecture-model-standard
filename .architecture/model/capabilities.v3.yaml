    - id: PR-CAP-DF-lessons_learned
      attribute: lessons_learned
      content:
      - "L1 (CAP-PB walk L1): modeling capability decomposition is a SEPARATE concern from current component decomposition — multiple behaviors can trace to a single COMP hash and that is deliberate; forcing per-stage split is a Part-3 candidate, not a modeling requirement."
      - "L2 (CAP-PB walk L1/L4): semantic attributes (failure_modes, stakeholders, assumptions) force mechanism-level thinking during walks — attributes ARE the walk, not decoration. Every walk should emit at least intent + one reflective attribute."
      - "L3 (CAP-PB walk L5): user-triggered entry behaviors (BEH-run-pipeline) must be modeled as first-class delivers, not implied by orchestrator prose. Missing entry behaviors leave the graph disconnected from actors."
      - "L4 (2026-09-16 viewer walk): cross-source shape divergence (pipeline-emit str vs authored list for Promise.content) MUST normalize at the Python boundary in _build_payload — single source of truth beats consumer-side defense. Applied at scripts/build_v3_viewer.py:~714."
      - "L5 (2026-09-16 viewer walk): layered defense (try/catch on selectEntity) surfaces bugs as 'Render error' but does NOT identify root cause. Diagnosis requires reading the DATA shape across sources, not the code. Falsification (2 working / 23 broken components) pointed at the divergence directly."
      - "L6 (2026-09-16 viewer walk): graph-walk-as-capability generalizes — flow_mermaid → decomposition_mermaid / realization_mermaid / neighbors_mermaid using the same substrate (helper returns tuple | None, stamped on record, rendered by shared loop). Adding future walks = 1 helper + 1 entry in the render targets array."
      - "L7 (2026-09-16 viewer walk): silent-skip (return None when N/A) beats always-render; adaptive thresholds (BFS depth ≤ 2, cap 30 nodes, neighbors threshold 20) keep diagrams readable across entity kinds that vary by 100x in neighborhood size."
      - "L8 (2026-09-16 viewer walk): kind-dispatched walks are unavoidable when the semantic shape of the traversal varies across entity kinds. Realization needed 7 distinct walk strategies (capability / component / behavior / interface / layer / actor / constraint) because the meaningful 2-hop chain is different for each — a single generic template would lose more insight than it saves."
      - "L9 (2026-09-16 realizes-direction-fix): follow-up notes framed as 'add one edge' can hide systemic direction bugs; investigating the CONSUMER contract (walker semantics) before adding data revealed 3 edges + 5 entities affected, not 1. Always probe the consumer before adding producer data."
      - "L10 (2026-09-16 realizes-direction-fix): silent-skip (return None when N/A) is a double-edged sword — correct behavior masking systemic bugs. Mitigation: build-time diagnostic pass (_realization_skip_reasons + _lint_edge_note_directions) that surfaces silently-skipped entities with adjacent-but-wrong-direction edges, plus in-viewer diagnostics banner. Fires zero warnings today (L9 fix cleared all), but present as tripwire for future direction bugs."
      - "L11 (2026-09-16 constraint-impact walk): the 6th walk (2-hop constraint impact) extended _mermaid_realization's 1-hop constraint case without touching that helper — additive walks in a separate helper + separate stamped field beat in-place extension of an existing walker. Same pattern as cross_flow vs flow. Reinforces L6 substrate."
      owner_entity: CAP-DF
      delivered_from: null
      verified_by:
      - docs/reports/2026-09-16-content-shape-and-more-diagrams.md documents L4-L8
      - docs/reports/2026-09-16-cap-pb-walk.md documents L1-L3
      - docs/reports/2026-09-16-realizes-direction-fix.md documents L9-L10
