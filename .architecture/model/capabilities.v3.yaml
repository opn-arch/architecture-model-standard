  # Walks are AMS capabilities. CAP-WK is the umbrella; each sub-cap is one
  # walk realized by a WalkSpec YAML file. Full v3 attributes below on the
  # umbrella cap; sub-caps carry minimal-intent + audits pointer. Retrofits
