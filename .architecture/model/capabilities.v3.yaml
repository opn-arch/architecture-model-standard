    - id: PR-CAP-DF-lessons_learned
      attribute: lessons_learned
      content:
      - "L1 (CAP-PB walk L1): modeling capability decomposition is a SEPARATE concern from current component decomposition — multiple behaviors can trace to a single COMP hash and that is deliberate; forcing per-stage split is a Part-3 candidate, not a modeling requirement."
      - "L2 (CAP-PB walk L1/L4): semantic attributes (failure_modes, stakeholders, assumptions) force mechanism-level thinking during walks — attributes ARE the walk, not decoration. Every walk should emit at least intent + one reflective attribute."
      - "L3 (CAP-PB walk L5): user-triggered entry behaviors (BEH-run-pipeline) must be modeled as first-class delivers, not implied by orchestrator prose. Missing entry behaviors leave the graph disconnected from actors."
      - "L4 (2026-09-16 viewer walk): cross-source shape divergence (pipeline-emit str vs authored list for Promise.content) MUST normalize at the Python boundary in _build_payload — single source of truth beats consumer-side defense. Applied at scripts/build_v3_viewer.py:~714."
      - "L5 (2026-09-16 viewer walk): layered defense (try/catch on selectEntity) surfaces bugs as 'Render error' but does NOT identify root cause. Diagnosis requires reading the DATA shape across sources, not the code. Falsification (2 working / 23 broken components) pointed at the divergence directly."
      - "L6 (2026-09-16 viewer walk): graph-walk-as-capability generalizes — flow_mermaid → decomposition_mermaid / realization_mermaid / neighbors_mermaid using the same substrate (helper returns tuple | None, stamped on record, rendered by shared loop). Adding future walks = 1 helper + 1 entry in the render targets array. SUPERSEDED 2026-09-18 by Parts 1–7 walk substrate: the informal 'helper + entry' pattern is now a formal 6-stage pipeline (select→traverse→classify→rollup→evidence→emit) driven by declarative WalkSpec YAML. See L18."
      - "L7 (2026-09-16 viewer walk): silent-skip (return None when N/A) beats always-render; adaptive thresholds (BFS depth ≤ 2, cap 30 nodes, neighbors threshold 20) keep diagrams readable across entity kinds that vary by 100x in neighborhood size."
      - "L8 (2026-09-16 viewer walk): kind-dispatched walks are unavoidable when the semantic shape of the traversal varies across entity kinds. Realization needed 7 distinct walk strategies (capability / component / behavior / interface / layer / actor / constraint) because the meaningful 2-hop chain is different for each — a single generic template would lose more insight than it saves."
      - "L9 (2026-09-16 realizes-direction-fix): follow-up notes framed as 'add one edge' can hide systemic direction bugs; investigating the CONSUMER contract (walker semantics) before adding data revealed 3 edges + 5 entities affected, not 1. Always probe the consumer before adding producer data."
      - "L10 (2026-09-16 realizes-direction-fix): silent-skip (return None when N/A) is a double-edged sword — correct behavior masking systemic bugs. Mitigation: build-time diagnostic pass (_realization_skip_reasons + _lint_edge_note_directions) that surfaces silently-skipped entities with adjacent-but-wrong-direction edges, plus in-viewer diagnostics banner. Fires zero warnings today (L9 fix cleared all), but present as tripwire for future direction bugs."
      - "L11 (2026-09-16 constraint-impact walk): the 6th walk (2-hop constraint impact) extended _mermaid_realization's 1-hop constraint case without touching that helper — additive walks in a separate helper + separate stamped field beat in-place extension of an existing walker. Same pattern as cross_flow vs flow. Reinforces L6 substrate. SUPERSEDED 2026-09-18: kind-dispatched hops (HopSpec.by_kind) formalize this pattern into the substrate. Constraint-impact is now WALK-constraint-impact (declarative, silent_skip_when_last_hop_empty=true). See L19."
      - "L12 (2026-09-16 compliance walk): auditability requires a per-entity evidence rule, not per-constraint. Defining compliance evidence as ≥1 verified promise on {verification, verified_by, slos, success_criteria} caught 16 real gaps across 12 entities without any per-constraint mapping. Universal evidence attrs > constraint-specific rules for the initial audit tier — refinement can layer per-constraint checks on top later."
      - "L13 (2026-09-16 compliance walk): the audit surfaces 3 legitimate constraint impacts on entities lacking evidence (CAP-DF.2 vs CONS-determinism/no-runtime-deps; CAP-DF.1/.4 vs CONS-open-schema; 6 BEH-* vs the same). These are AUTHORING todos, not walker bugs. The walker's job is to make gaps visible; closing them is model authoring work. Loop pattern: view (banner) → note (gap list) → walk/author (fill promises)."
      - "L14 (2026-09-16 gap closure): the universal-evidence audit accepts three distinct evidence tiers — runtime (test/harness citation), inherited (SLO promised on a realizes-target and reused via the edge), and design-only (compatible-by-construction, Part 3 deferred). All three passed the L12 rule, but only the first truly verifies at runtime. Provenance strings now flag design-only tier explicitly. A future refinement could add a tier field to promises and surface tier in the compliance banner so 'compatibility by construction' does not look identical to 'test citation' in the audit output."
      - "L15 (2026-09-16 tier classifier): the L14 refinement lands as a pure classifier _promise_tier(promise) that reads existing provenance strings (no schema change, backward-compatible). Runtime > inherited > design > asserted priority. _entity_has_compliance_evidence and _constraint_compliance_gaps gain a strong_only flag (default False keeps L12 behavior byte-identical); strong_only=True raises the audit bar to runtime-tier only. _evidence_tier_summary(records) emits per-entity {tier: count} for future banner surfacing. Viewer output unchanged this commit — pure library-tier addition ready to be consumed by a follow-up UI change."
      - "L16 (2026-09-16 CAP-SL self-exercise): applying slice_by_component('COMP-VIEWER') to the merged model and feeding the output back into the walk substrate shows CAP-SL is not walk-substrate-complete. The slicer drops 6 of 7 canonical entity kinds and any relationship pointing across kinds. 3 of 7 walks return None on the slice, 2 more degrade silently. Root cause: include_neighbors=True closes over relationships but only retains targets whose ids are already in the component map. This validates PR-CAP-SL-requirements as legitimately open — component-focus is delivered but the sub-model doesn't preserve the graph the downstream walker needs. Fix is bounded (~30 LOC to close over realizes/exposes/traces-to/constrained-by/contains) but deferred to Part 2 authoring. Filing L16 to make the gap visible before we build on top of CAP-SL as if it were a complete substrate. RESOLVED 2026-09-16: slice_by_component now closes over the full id-to-kind index (any relationship type), retaining cross-kind neighbors in their original entity buckets. 18/18 slicer tests + 4 new cross-kind tests pass. CAP-SL is now walk-substrate-complete for the 1-hop case; multi-hop closure remains a Part 2 refinement if needed."
      - "L17 (2026-09-16 unrealized-capability walk): the 8th walk audits capabilities themselves against the same substrate everything else uses: (0 realizers × 0 open promises) → unrealized; (0 × ≥1) → critical; (≥1 × ≥1) → partial; (≥1 × 0) → ok/silent-skip. Applied to the current model this surfaced 2 critical (CAP-DF, CAP-DF.4), 2 unrealized (CAP-DF.1, CAP-DF.3), 2 partial (CAP-PB, CAP-SL) — the same shape L12-L13 predicted at the promise level, now visible at the capability level. Two design points reinforce prior lessons: the classifier is a pure function on (cap, realizes-edges, promises) with no schema change (L15 pattern), and the Mermaid card uses sentinel pseudo-nodes (NO_REALIZER + OPEN_pid) instead of rendering an empty diagram — silent-skip the ok case, but for non-ok cases make the gap the visual (L7 + L11 pattern). The walk closes the loop started by L12: promise-level compliance and capability-level realization now use the same auditable graph-walk substrate."
      - "L18 (2026-09-18 walk substrate Parts 1–7): walks are first-class capabilities, not viewer helpers. Every walk is (a) a sub-cap under CAP-WK with a `verified_by` path to its WalkSpec YAML and (b) a declarative pipeline of 6 stages (select→traverse→classify→rollup→evidence→emit). 13 hand-rolled Python walkers collapsed to 13 YAML files + 6 shared stages. Adding a walk = writing ~30 lines of YAML; no viewer code touched. Coverage becomes auditable — the meta-walk `audit_walk_coverage` cross-references WalkSpec `audits` lists against the CAP-WK sub-cap inventory and emits Cards for uncovered sub-caps and dangling refs. This is the formalization of L6."
      - "L19 (2026-09-18 kind-dispatched hops): the informal 'walk kind-per-target' pattern from L8 lands in the substrate as HopSpec.by_kind — a mapping from source-node kind to a sub-HopSpec. Realize splits into 7 WalkSpec YAMLs (one per target kind) because the semantic 2-hop chain differs by kind (behavior→component vs capability→component vs constraint→component). Realization-skip splits into 2 (capability side + component side) to audit both endpoints of realizes. The substrate also gains `silent_skip_when_last_hop_empty` (matches L7's adaptive-skip heuristic) so constraint-impact's hop-2 identical-to-hop-1 case is a declarative concern, not a Python conditional. Formalizes L11 into a substrate feature."
      - "L20 (2026-09-18 classify DSL): the classify stage's predicate DSL (`has:`, `count:`, `verified:`, `inbound_count:`, `outbound_count:`, `promise_status_count:`, joined by `and`/`or`) covers every classifier from the pre-substrate era. WALK-attribute-completeness (Part 7) is a pure-YAML meta-walk that buckets entities by promise coverage using only `count:promises` + `promise_status_count:{verified,open}` — no Python. Custom classifier code is now a code smell: if a classifier can be expressed in the DSL, do it in YAML. If it can't, extending the DSL beats writing a walker (see follow-on: `promise_for:<attribute>` atom)."
      - "L21 (2026-09-18 graph adapter Stage 1): NetworkX MultiDiGraph adapter (`architecture_model.graph.to_networkx`) landed as export-only ahead of the walk-substrate refactor; walks continue to use the dict-based substrate. This proves the graph model can round-trip through a proper graph backend (18/18 export tests + graphml round-trip) without perturbing walk behavior. Stage 2 (walk backend swap to NetworkX) is unblocked once all viewer helpers are declarative. Real-repo export: 1011 nodes / 1086 edges (802 promises + 132 unique evidence URIs promoted). Design decision: promise + evidence promotion runs at export time only — the walk substrate keeps its own promise-aware semantics inside classify."
      - "L22 (2026-09-18 walk substrate Part 9): meta-coverage audit was invisible to Python-authored meta-walks (only YAML WalkSpecs were discovered), and the classify DSL could not filter promises by ATTRIBUTE NAME (only STATUS via promise_status_count). Both gaps close together: (a) audit_walk_coverage now scans src/architecture_model/walks/meta/*.py for a `Realizes ``CAP-WK.<id>``` docstring marker, treating each match as walk id `META-<module_stem>`, and (b) classify.py gains `promise_attribute_count:<name> {op} N` alongside `promise_status_count`. The gap was visible because Part 8 reported CAP-WK.meta-coverage and CAP-WK.direction-lint as uncovered despite both having Python implementations. The strict-promotion WalkSpec (promotion-strict.v3.yaml) is the first consumer of the new atom — it buckets entities by Category B attribute coverage (goals, requirements, success_criteria, failure_modes, constraints) as a stricter gate than WALK-promotion's status-based ready-to-code. Real-repo signal on capabilities.v3.yaml: 32 insufficient-strict / 9 partial-strict / 0 ready-to-code-strict — genuine specification gap. Lesson: when a walk YAML carries a `KNOWN LIMITATION` comment referencing a missing DSL primitive, that primitive is a schema follow-on, not a permanent constraint. Adding the atom + separate WalkSpec (additive, not rewrite) preserves the loose-gate signal while surfacing the strict-gate signal."
