- {from: BEH-verify,          to: BEH-publish,         type: triggers, note: pipeline stage 6->7}
# --- 2026-09-16 Task B: close the CAP-DF dev loop (cross-pipeline triggers) ---
- from: BEH-walk-author
  to: BEH-run-pipeline
  type: triggers
  note: |
    After the developer authors a .v3.yaml fragment, they re-run the extraction
    pipeline so the fragment can be merged with (or checked against) refreshed
    pipeline output. Closes CAP-DF -> CAP-PB feedback.
- from: BEH-run-pipeline
  to: BEH-view-browse
  type: triggers
  note: |
    After BEH-publish emits a refreshed IF-model, the developer opens the viewer
    to review the re-extracted graph. Closes CAP-PB -> CAP-DF.2 feedback.
- from: BEH-view-note
  to: BEH-walk-author
  type: triggers
  note: |
    Notes captured in the viewer surface deltas / questions that motivate the
    next walk fragment. Closes CAP-DF.2 -> CAP-DF.1 feedback and completes the
    view -> note -> walk -> re-extract -> view loop.
