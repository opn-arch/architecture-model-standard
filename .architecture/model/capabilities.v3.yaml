# --- 2026-09-16 CAP-PB stage-to-stage flow (Task A) ---
- {from: BEH-scan,            to: BEH-derive-promises, type: triggers, note: pipeline stage 1->2}
- {from: BEH-derive-promises, to: BEH-cluster,         type: triggers, note: pipeline stage 2->3}
- {from: BEH-cluster,         to: BEH-link,            type: triggers, note: pipeline stage 3->4}
- {from: BEH-link,            to: BEH-containerize,    type: triggers, note: pipeline stage 4->5}
