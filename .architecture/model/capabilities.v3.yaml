    into the architecture model as a capability tree. Three top-level
    capabilities decompose the standard + tooling story:

      CAP-PB Extract — extract architecture from source code (pipeline_v3)
      CAP-SL Slice   — produce focused subgraphs (slice.py)
      CAP-DF Evolve  — the model-based development loop (view / note / walk /
                       author / validate / re-extract)

    BEH-* entities trace to the actual COMP-<hash> ids in the pipeline output
    (looked up 2026-09-16 against .architecture-model.v3.yaml). Today the
    entire pipeline_v3 package allocates to a single COMP-c5a72728 —
    per-stage split is a Part 3 candidate (see CAP-DF.4 BEH-S1 entity-kind
    promotion). Every trace listed below therefore resolves to that single
    component id, which is deliberate: this fragment models the CAPABILITY
    decomposition, not the current component decomposition.

    Meta-principle: AMS is a standard + tooling to model ANY system;
    self-application is the validation strategy. This fragment is that
    self-application at the capability layer.
