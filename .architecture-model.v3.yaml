    - id: PR-eb9426bdfea7
      attribute: intent
      content: "ModelSlice materializer: resolve a :class:`ModelSlice` contract into\
        \ a\nconcrete :class:`MaterializedSlice` fragment.\n\nPurpose\n-------\nA\
        \ :class:`ModelSlice` is a *contract* — selectors + closure policy. This\n\
        module realizes that contract against an :class:`ArchitecturePackage` by\n\
        loading the package's model (and, for ``scope == \"descendants\"``, its\n\
        descendants' models), applying selectors + curation, closing the\nrelationship\
        \ set under the configured closure policy, and packaging the\nresult as a\
        \ deterministic, content-addressable :class:`MaterializedSlice`.\n\nCommit-1\
        \ scope\n--------------\nThis commit implements ``scope`` ∈ {``local``, ``descendants``}\
        \ and\n``shared_refs == \"none\"``. ``scope == \"federated\"`` and\n``shared_refs``\
        \ ∈ {``explicit``, ``transitive``} raise\n:class:`NotImplementedError` — they\
        \ land in T14 commit 2.\n\nInvariants\n----------\n* The returned :class:`MaterializedSlice`\
        \ is deterministic given a fixed\n  model + slice + wall-clock: fragment entities\
        \ and relationships are\n  sorted by id / (from,to,type) so two calls yield\
        \ equal fragments.\n* The dangling-relationship bug in the legacy\n  :mod:`architecture_model.core.slicer`\
        \ (which keeps a relationship if\n  *either* endpoint is in the fragment)\
        \ does **not** occur here: under\n  ``closure == \"strict\"`` a relationship\
        \ is retained only when *both*\n  endpoints are in the fragment; otherwise\
        \ it is dropped and a\n  ``SLICE.DANGLING_STRIPPED`` warning is recorded.\n\
        * ``curation.include`` re-adds entities that selectors dropped; it is\n  applied\
        \ *after* ``curation.exclude`` so a redundant include+exclude\n  pair yields\
        \ exclusion (exclude wins on precedence).\n* ``curation.redactions`` clears\
        \ descriptive fields (``description``,\n  ``rationale``, ``intent``) but preserves\
        \ identity (``id``, ``name``,\n  ``kind``, ``status``).\n\nThread safety\n\
        -------------\nPure functions; no module-level mutable state. :class:`MaterializedSlice`\n\
        is a frozen dataclass. The materializer is safe to call concurrently\nprovided\
        \ the underlying :class:`ArchitecturePackage` tree is not being\nmutated.\n\
        \nError taxonomy\n--------------\n* :class:`NotImplementedError` — federated\
        \ scope / shared_refs modes not\n  yet implemented.\n* :class:`FileNotFoundError`\
        \ — the package's ``model_ref`` cannot be\n  resolved to a file (bubbled from\
        \ :func:`load_model`).\n* :class:`ValueError` — a malformed selector value\
        \ (bubbled from\n  underlying utilities).\n\nWarnings are non-fatal and surfaced\
        \ via :attr:`MaterializedSlice.warnings`."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.model_slice_materializer;
        via=pipeline_v3.derive_promises
    - id: PR-ef0afa57358e
      attribute: intent
      content: 'ArtifactSpec dependency DAG + rebuild plan generator.


        Purpose

        -------

        Given a collection of :class:`ArtifactSpec` objects, build a directed

        acyclic graph over their bundle references and emit a topologically

        ordered :class:`RebuildPlan` naming which artifacts must be rebuilt.


        Design

        ------

        The DAG is *artifact-centric*: nodes are ArtifactSpecs and edges point

        from each entry in a zip artifact''s ``bundle_refs`` to the zip itself

        (upstream leaf artifacts must be built before the zip that aggregates

        them). Non-zip artifacts contribute nodes with no outgoing edges (their

        view/slice/model upstream chain is already modeled by

        :mod:`architecture_model.lifecycle.stale` and is exposed here only as

        ``BuildStep.view_ref`` metadata).


        We deliberately do **not** reuse

        :class:`architecture_model.lifecycle.stale.DependencyGraph`. That graph

        carries ``owned_paths`` / ``inputs`` semantics tuned for path-based

        invalidation across the full lifecycle graph (packages, models,

        manifests, slices, views, artifacts). Here we need only artifact-to-

        artifact edges with cycle + missing-ref checks, so a small local DAG is

        clearer and avoids overloading upstream node ids.


        Execution

        ---------

        This module is planning-only. No artifact bytes are produced; execution

        is Phase 2.'
