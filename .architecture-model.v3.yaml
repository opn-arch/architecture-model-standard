      provenance: pipeline_v3.containerize; src=src.architecture_model.ai; via=pipeline_v3.derive_promises
    - id: PR-9bf237d1ee0d
      attribute: intent
      content: 'Typed validators for AI proposals.


        Each :class:`Proposal` kind has a dedicated validator that returns a

        :class:`ValidationReport`. Validators are pure: no side effects, no

        mutation of inputs, no file writes.


        Top-level :func:`validate` performs the cross-cutting revision-drift

        check and dispatches on ``proposal.kind`` via

        :data:`PROPOSAL_VALIDATORS`.'
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.validators;
        via=pipeline_v3.derive_promises
    - id: PR-a7896e12ec41
      attribute: intent
      content: "Apply ModelPatch proposals to ArchitectureModel.\n\nThe executor supports\
        \ three operations:\n  - ``add``:     append value to entities.<target_kind>\
        \ list\n  - ``remove``:  drop entity with matching target_id from any entities\
        \ list\n  - ``replace``: setattr(entity[target_id], field, value)\n\nNote:\
        \ the validator (``ai.validators._VALID_OPS``) also lists ``move`` as a\n\
        syntactically valid op, but the semantics of ``move`` are not yet specified;\n\
        the executor raises ``ParseError`` for it."
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.patch; via=pipeline_v3.derive_promises
    - id: PR-ab5f828df6ba
      attribute: intent
      content: 'Proposal-packaging helper for write-back projectors — Phase 4-A Task
        2.


        ``pack_proposal`` centralizes prompt-digest computation and ModelPatch

        construction so :class:`~architecture_model.lifecycle.projectors.write_back.WriteBackProjector`

        subclasses only supply the domain-specific operations list. Identical

        inputs always produce identical ``proposal_id`` (SHA-256 identity on

        ``work_order_id | model_version | prompt_digest``) — this stability is

        required for idempotent ``architect_propose`` invocations and for

        deduping proposals in the lifecycle store.'
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.pack; via=pipeline_v3.derive_promises
    - id: PR-c5d279669135
      attribute: intent
      content: "AI :class:`WorkOrder` contract.\n\nA ``WorkOrder`` is a bounded, content-addressable\
        \ request submitted to an\nAI agent. It nominates:\n\n* a set of :class:`SliceRef`\
        \ inputs (at least one) — the agent MUST NOT\n  read anything outside these\
        \ slices;\n* the set of :class:`ProposalKind` outputs the requester will accept;\n\
        * a hard :class:`Budget` (tokens + wall time);\n* provenance (``requested_by``,\
        \ ``created_at``).\n\nThe contract is versioned by :data:`SchemaVersions.WORK_ORDER`\
        \ and\nvalidated by ``spec/ai-work-order.schema.json`` (Draft 2020-12)."
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.work_order;
        via=pipeline_v3.derive_promises
    - id: PR-e7f2e81822c6
      attribute: intent
      content: 'AI Job state machine and persistence.


        A :class:`Job` tracks the lifecycle of an AI :class:`WorkOrder` through

        approval, queueing, execution, validation, and terminal outcomes. State

        transitions are governed by :data:`ALLOWED_TRANSITIONS`; every transition

        appends an immutable :class:`JobEvent` to :attr:`Job.history` and emits

        an ``ai.job.transition`` event on the lifecycle

        :class:`~architecture_model.lifecycle.journal.Journal`.


        Persistence is per-job YAML at

        ``<root>/.architecture/ai/jobs/<job_id>.yaml`` written atomically via

        :func:`architecture_model.lifecycle.atomic_store.write_atomic`.


        This module implements state + persistence only. Execution (dequeue,

        worker, dispatch) is intentionally out of scope.'
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.jobs; via=pipeline_v3.derive_promises
