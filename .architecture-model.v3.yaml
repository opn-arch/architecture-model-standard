    - id: PR-b94760fa9989
      attribute: intent
      content: 'pipeline_v3.containerize — Component packaging stage (T0.14 Phase
        6.5).


        Composes the outputs of :mod:`scan`, :mod:`derive_promises`, :mod:`cluster`,

        and :mod:`link` into a coherent :class:`ContainerizedModel` — the v3 shape

        consumed by :mod:`verify` (chain-closure) and :mod:`publish` (YAML emit).


        Core operation: **Promise ownership rebinding**

        ------------------------------------------------


        ``derive_promises`` produces Promises owned by *modules* (dotted names).

        v3 architecture entities are *components*, not modules. Containerize

        walks each cluster, rebinds every Promise owned by one of its member

        modules to ``owner_entity = cluster.id``, and recomputes the Promise id

        against the new owner via :func:`compute_promise_id`.


        Because the identity triple ``(attribute, content, owner)`` changes, ids

        change. Two Promises that were distinct at the module level but become

        identical at the component level (e.g. both modules had

        ``delivers=[]`` typed-gap) collapse to one record via id-set dedup.


        Provenance is enriched to capture the originating module(s) so audit

        tools can trace a component-level Promise back to its module sources.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.containerize;
        via=pipeline_v3.derive_promises
    - id: PR-c40cd79d9664
      attribute: intent
      content: "pipeline_v3.adapters.legacy_pipeline — v3→2.x model converter (T0.14\
        \ Phase 11).\n\nAdapter that converts a v3 model dict (Promise-graph shape)\
        \ into a\n2.x :class:`~architecture_model.core.types.ArchitectureModel` dataclass\n\
        so surviving legacy consumers (visualize, docs) can be invoked from\nv3 call\
        \ sites without duplicating their logic.\n\nPer Plan B' Phase 11: adapters\
        \ are the LAST phase because the v3 shape\nhad to stabilize first. Building\
        \ adapters before Phase 6/7 would have\nlocked in v3-shape decisions prematurely.\n\
        \nMapping (v3 → 2.x)\n------------------\n\n- ``meta.project``, ``meta.generated_at``\
        \ → ``ModelMeta`` (schema_version\n  stamped as ``2.2`` — the latest 2.x —\
        \ so legacy validators accept it).\n- Each v3 component becomes a 2.x :class:`Component`\
        \ with:\n    - ``id``, ``name`` copied verbatim\n    - ``files`` populated\
        \ from ``module_names`` (dotted → path/py)\n    - ``responsibilities`` populated\
        \ from ``delivers``-attribute Promises\n    - ``kind`` defaulted to :class:`ComponentKind.SERVICE`\n\
        - Each v3 relationship (``depends-on`` only in Phase 6/7 output) becomes\n\
        \  a :class:`Relationship` with :class:`RelationType.DEPENDS_ON`.\n\nOnly\
        \ the fields legacy consumers actually read are populated. Everything\nelse\
        \ uses dataclass defaults. Input dict is never mutated."
