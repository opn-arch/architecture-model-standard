    - id: PR-ef0afa57358e
      attribute: intent
      content: 'ArtifactSpec dependency DAG + rebuild plan generator.


        Purpose

        -------

        Given a collection of :class:`ArtifactSpec` objects, build a directed

        acyclic graph over their bundle references and emit a topologically

        ordered :class:`RebuildPlan` naming which artifacts must be rebuilt.


        Design

        ------

        The DAG is *artifact-centric*: nodes are ArtifactSpecs and edges point

        from each entry in a zip artifact''s ``bundle_refs`` to the zip itself

        (upstream leaf artifacts must be built before the zip that aggregates

        them). Non-zip artifacts contribute nodes with no outgoing edges (their

        view/slice/model upstream chain is already modeled by

        :mod:`architecture_model.lifecycle.stale` and is exposed here only as

        ``BuildStep.view_ref`` metadata).


        We deliberately do **not** reuse

        :class:`architecture_model.lifecycle.stale.DependencyGraph`. That graph

        carries ``owned_paths`` / ``inputs`` semantics tuned for path-based

        invalidation across the full lifecycle graph (packages, models,

        manifests, slices, views, artifacts). Here we need only artifact-to-

        artifact edges with cycle + missing-ref checks, so a small local DAG is

        clearer and avoids overloading upstream node ids.


        Execution

        ---------

        This module is planning-only. No artifact bytes are produced; execution

        is Phase 2.'
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.artifact_dag;
        via=pipeline_v3.derive_promises
    - id: PR-f0859543513c
      attribute: intent
      content: "Recursive lifecycle gates for architecture packages.\n\nPurpose\n\
        -------\nProvides a small, composable gate system that answers the question\n\
        \"is this architecture package (and every descendant) fit to publish?\"\n\
        Each :class:`Gate` inspects a single :class:`ArchitecturePackage` and\nreturns\
        \ a :class:`GateResult`. :func:`evaluate_tree` recurses the\npackage tree,\
        \ collects per-package results, and lifts any blocking\nchild finding up to\
        \ the root with breadcrumbs so callers can locate\nthe failure site in a hierarchy.\n\
        \nInvariants\n----------\n* Gates never mutate the package or filesystem —\
        \ they read only.\n* Output is fully deterministic: ``per_package`` is keyed\
        \ by\n  ``architecture_id`` with insertion order matching a depth-first walk\n\
        \  sorted by child ``slug`` (as :func:`iter_descendants` already\n  guarantees),\
        \ and findings inside every :class:`GateResult` are\n  sorted by ``(severity,\
        \ code, path)``.\n* ``blocking`` is true iff at least one ``severity == \"\
        error\"`` finding\n  is present. ``passed`` is true iff ``blocking`` is false.\n\
        * Only the string values in :data:`GATE_KINDS` may appear on a gate;\n  the\
        \ frozen-set is intentionally open — later tasks may add kinds by\n  redefining\
        \ it locally, but this module never mutates it.\n\nThread-safety\n-------------\n\
        All public types are frozen dataclasses; all functions are pure with\nrespect\
        \ to their inputs. Concurrent evaluation of independent\npackage trees is\
        \ safe. Concurrent evaluation of the SAME tree while\nits underlying files\
        \ are being written is not safe (caller must hold\nan appropriate lifecycle\
        \ lock).\n\nError taxonomy\n--------------\nGates do not raise for policy\
        \ failures — they return findings with\n``severity=\"error\"``. Programmer\
        \ errors (e.g. a package whose\n``root`` is unset because it was not loaded\
        \ via\n:func:`load_package`) propagate as their native exceptions."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.gates;
        via=pipeline_v3.derive_promises
