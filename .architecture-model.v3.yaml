    - id: PR-5ad3ac0ad8aa
      attribute: intent
      content: "Standalone per-entity quality metrics — Phase 4 of T0.14.\n\nRealizes\
        \ CAP-DF-GATING telemetry: per-entity quality scores computed\nWITHOUT chain-closure.\
        \ Complementary to\n:mod:`architecture_model.quality.chain_closure` — those\
        \ metrics are\ngraph-relative (need cross-entity Promise lineage); these are\n\
        entity-relative and cheap to compute per commit.\n\nMetrics:\n\n* ``completeness_pct``\
        \ — fraction of canonical semantic fields\n  (:data:`architecture_model.migration.v2_to_v3.SEMANTIC_FIELDS`)\
        \ that\n  have at least one Promise on the entity. Duplicate attributes count\n\
        \  once.\n* ``provenance_integrity_pct`` — fraction of the entity's Promises\
        \ whose\n  ``provenance`` field is non-empty. Vacuously 1.0 when the entity\
        \ has\n  no Promises (nothing UN-stamped).\n* ``typed_gap_pct`` — fraction\
        \ of the entity's Promises with\n  ``status == TYPED_GAP``. Named absences\
        \ are a signal of maturity, not\n  a defect — this metric reports the \"gap\
        \ surface named\" ratio.\n* ``relationship_density`` — count of relationships\
        \ where the entity\n  appears as ``from`` or ``to``. Self-loops count once.\
        \ Zero when the\n  caller doesn't supply a relationships list.\n\n``overall_score``\
        \ = weighted 0..100 rubric:\n\n* 45 pts × ``completeness_pct``\n* 25 pts ×\
        \ ``provenance_integrity_pct``\n* 15 pts × (1 if ``typed_gap_pct`` <= 0.5\
        \ else (1 - (typed_gap_pct-0.5)*2))\n* 15 pts × min(1.0, ``relationship_density``\
        \ / 10)\n\nRationale: completeness is the highest weight (drives regen fidelity);\n\
        provenance is next (drives auditability); typed-gap and relationship\ndensity\
        \ are corroborating signals with lower weight and diminishing\nreturns (10\
        \ relationships saturates the density term)."
      owner_entity: COMP-bb5e3d5a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.quality.standalone;
        via=pipeline_v3.derive_promises
