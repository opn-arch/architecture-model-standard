    - id: PR-3b2d68bad421
      attribute: intent
      content: "pipeline_v3 — Promise-graph-native extraction pipeline (T0.14 Phase\
        \ 6).\n\nEight-stage pipeline consuming a repo and producing a v3 architecture\n\
        model (Promise-graph + entities + relationships):\n\n    scan -> derive_promises\
        \ -> cluster -> link -> containerize\n         -> verify -> publish\n    (orchestrated\
        \ by orchestrator)\n\nEach stage is a self-contained module with its own tests.\
        \ Intermediate\ndata types flow between stages via typed dataclasses; no stage\
        \ reaches\nback into a previous stage's internals."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3;
        via=pipeline_v3.derive_promises
    - id: PR-4e48ee93647e
      attribute: intent
      content: "pipeline_v3.verify — Chain-closure verification stage (T0.14 Phase\
        \ 6.6).\n\nRuns :func:`architecture_model.quality.chain_closure.analyze_chain_closure`\n\
        over a :class:`ContainerizedModel`. Two entry points:\n\n    - :func:`verify_model`\
        \ — flat chain-closure report over the whole model.\n    - :func:`verify_per_component`\
        \ — per-component reports for drill-down.\n\nRoot-owner convention\n---------------------\n\
        \nAfter :mod:`containerize`, every Promise's ``owner_entity`` is a\ncomponent\
        \ id — there is no higher-level entity for a component-scoped\nPromise to\
        \ be \"delivered from\". If callers do not supply an explicit\n``root_owner_ids``\
        \ set, verify treats every component id in the model\nas a root. This prevents\
        \ the entire graph from spuriously flagging\n``G-DELIVERY`` when what we actually\
        \ want to inspect is verification\ncoverage (``G-VERIFY``) and open-question\
        \ closure (``G-OPEN-Q``).\n\nCallers who *do* want strict delivery-lineage\
        \ checking (e.g. when\ninter-component delivery edges are expected) can pass\n\
        ``root_owner_ids=frozenset()`` or a specific subset."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
