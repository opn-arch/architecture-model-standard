    - id: PR-9aeb358f0987
      attribute: intent
      content: "Frozen contract versions for the architecture lifecycle.\n\nThis module\
        \ is the single source of truth for the schema version of every\npersisted\
        \ artifact in the architecture lifecycle: models, packages,\nmanifests, model\
        \ slices, view specs, artifact specs, and AI work orders.\n\nInvariants:\n\
