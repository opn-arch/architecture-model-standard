    - id: PR-9f9b766b304a
      attribute: intent
      content: "Overlay-aware projector helper (Phase 2 Task 14).\n\nAn *overlay*\
        \ is a named supplementary decoration folded onto a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView`\
        \ in\ndeclared order. Overlays let a single projector emit a base diagram\
        \ (from\nthe architecture model alone) and then be augmented with runtime\
        \ signals\n(SI&L rollups, drift flags, gate outcomes) sourced from the\n:class:`~architecture_model.lifecycle.model_slice_materializer.MaterializedSlice`\n\
        supplementary fragments.\n\nDesign contract\n---------------\n* Order-preserving:\
        \ overlays are applied in the exact order declared on\n  :attr:`ViewCuration.overlays`.\
        \ Later overlays may see facets written by\n  earlier ones but MUST NOT clobber\
        \ unrelated keys.\n* Silent skip for unknown names: this keeps the pipeline\
        \ deterministic\n  when overlays are declared but not yet implemented (Task\
        \ 15-17 land the\n  gates/drift/test_results backing journals).\n* Silent\
        \ skip for missing fragments: if a fragment is ``None`` or absent\n  from\
        \ ``supplementary_fragments`` the overlay is a no-op.\n* Purity: returns a\
        \ NEW :class:`ProjectedView`; the input view is not\n  mutated. The wrapped\
        \ :class:`DiagramSpec`'s ``facets`` dict is\n  copied and augmented; ``nodes``\
        \ / ``edges`` / other structural fields\n  are shared by reference (safe —\
        \ DiagramSpec is treated as immutable at\n  this layer).\n\nFacet layout\n\
        ------------\nAll overlay output is written under the reserved facet key\n\
        ``\"overlays\"`` as a mapping ``{overlay_name: overlay_payload}``. This\n\
        keeps overlays namespaced away from projector-native facet keys and\nmakes\
        \ the applied overlay set trivially inspectable.\n\nAdditionally, the ordered\
        \ list of *applied* overlay names (recognized\noverlays whose fragment was\
        \ available) is written to\n``facets[\"applied_overlays\"]``. Declared-but-unrecognized\
        \ or\ndeclared-but-empty overlays are NOT listed there."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.overlays;
        via=pipeline_v3.derive_promises
    - id: PR-a0c14d042749
      attribute: intent
      content: "Transactional package publication with generation-based storage.\n\
        \nPurpose\n-------\nPublish an architecture package as an immutable, content-addressed\n\
        \"generation\" directory and atomically switch a ``CURRENT`` symlink to point\n\
        at it. Every publication is journaled so an interrupted publish can be\ndetected\
        \ and cleaned up post-crash.\n\nLayout on disk::\n\n    <package_root>/\n\
        \      package.yaml\n      generations/\n        0000001/\n          model/.architecture-model.yaml\n\
        \          manifest/manifest.json\n          slices/...             (optional\
        \ bundle inputs)\n          views/...              (optional)\n          artifacts/...\
        \          (optional)\n          digest.json            (auto-written)\n \
        \       0000002/\n          ...\n      CURRENT -> generations/0000002    (symlink)\n\
        \      .locks/publication.lock            (FileLock file)\n\nInvariants\n\
        ----------\n* A generation directory, once committed, is immutable — never\
        \ rewritten.\n* ``CURRENT`` is switched atomically (temp symlink + ``os.replace``).\n\
        * The journal is the source of truth for crash recovery: a\n  ``package.publish.begin``\
        \ without a matching commit/abort means the\n  publish was interrupted.\n\
        * Per-file digests are computed on raw bytes with sha256; the root digest\n\
        \  is the canonical-JSON digest of ``{\"files\": <sorted map>}``.\n* ``digest.json``\
        \ bytes are added to the tree AFTER the root digest is\n  fixed; the map inside\
        \ ``digest.json`` does not include ``digest.json``\n  itself.\n\nLocking\n\
        -------\nA single ``FileLock`` at ``<pkg>/.locks/publication.lock`` serializes\n\
        concurrent publishers on the same host. On timeout the specialized\n:class:`PublicationLockTimeout`\
        \ is raised.\n\nNon-goals (Phase 1)\n-------------------\n* Garbage collection\
        \ of old generations — future retention task.\n* Cross-host coordination —\
        \ same limitations as :class:`FileLock`.\n* Rollback of ``CURRENT`` — recovery\
        \ only cleans staging leftovers."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.publication;
        via=pipeline_v3.derive_promises
