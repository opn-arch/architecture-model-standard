    - id: PR-e986d67b5191
      attribute: intent
      content: "``WriteBackProjector`` base class — Phase 4-A Task 1.\n\nWrite-back\
        \ projectors are the LLM-authoring counterpart to the\ndeterministic Phase\
        \ 1-3 projectors. A ``.llm`` variant sits alongside\nits deterministic sibling:\
        \ the deterministic projector renders whatever\nsemantic content is already\
        \ on the model; the write-back projector\ntakes the deterministic base view\
        \ as input, prompts an\n:class:`~architecture_model.llm.provider.LLMProvider`\
        \ for a structured\nauthoring payload, and packages the response as an\n:class:`~architecture_model.ai.proposals.ModelPatch`\
        \ proposal ready for\n:func:`architect_proposal_apply` to persist.\n\nContract:\n\
        \n1. ``base_projector_name`` (class attr) names the sibling deterministic\n\
        \   projector. The base view is dispatched from the provided ``registry``\n\
        \   (or :data:`DEFAULT_REGISTRY` when unset).\n2. Subclasses override three\
        \ hooks:\n   - ``build_prompt(base_view, fragment, config) -> str``\n   -\
        \ ``expected_proposal_schema() -> dict``\n   - ``pack_proposal(raw, fragment,\
        \ config) -> Proposal``\n3. ``__call__`` composes: dispatch base → build prompt\
        \ → provider\n   ``structured()`` → pack proposal → wrap in a ``DiagramSpec``\
        \ with\n   ``content_kind=\"ai_proposal\"``.\n\nNo LLM providers are imported\
        \ at module load — a provider is passed via\nDI so tests inject mocks and\
        \ the module remains offline-safe."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.projectors.write_back;
        via=pipeline_v3.derive_promises
    - id: PR-ea923ed38a41
      attribute: intent
      content: "EntityPageProjector base class with kind dispatch (Phase 3 Task 7).\n\
        \nRather than register ``family1.entity_page.component``,\n``family1.entity_page.capability``,\
        \ ... as separate projectors (14 kinds\n* 7 families = 98 names), each family\
        \ registers a single\n``familyN.entity_page`` projector: an instance of a\n\
        :class:`EntityPageProjector` subclass that dispatches internally by the\n\
        scope entity's kind.\n\nScope info is injected into the projector config by\n\
        :func:`architecture_model.lifecycle.view_projection.project` from the\nmaterialized\
        \ slice's ``provenance['scope_metadata']`` for entity-scoped\nslices. The\
        \ two keys consumed here are:\n\n* ``__scope_entity_id`` — the id from ``scope=entity(<id>)``.\n\
        * ``__scope_entity_kind`` — the singular canonical kind\n  (``\"component\"\
        ``, ``\"capability\"``, ...).\n\nSubclasses set ``family: int`` and implement\
        \ ``_project_<kind>(model,\nconfig) -> DiagramSpec`` for each supported kind.\
        \ Unknown kinds raise\n``NotImplementedError`` — the base does not silently\
        \ degrade.\n\nThe concrete family renderers land in Tasks 8-14; this file\
        \ only ships\nthe dispatch scaffolding + tests."
