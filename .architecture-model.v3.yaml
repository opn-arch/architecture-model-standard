    - id: PR-9342935144fc
      attribute: intent
      content: "architecture_model.walks.stages.rollup — Category-aware verdict propagation.\n\
        \nPropagates verdicts along a relationship type per RollupSpec. Strategy\n\
        depends on attribute category:\n\n  - A (authoring): union — parent inherits\
        \ children's items.\n  - B (specification): conjunction — parent verdict =\
        \ ∧ children (worst).\n  - C (promise): contract-composition — any-child-ok\
        \ if the child\n    realizes the parent's promise surface; else worst-child.\n\
        \nConcrete strategies:\n  - ``worst-child``: parent's verdict = worst of children's.\n\
        \  - ``any-child-ok``: parent OK if any child is ready-to-code.\n  - ``union``:\
        \ verdict remains; reasons union.\n  - ``conjunction``: same as worst-child\
        \ (semantic alias).\n  - ``contract-composition``: any-child-ok fused with\
        \ worst-child on\n    unrealized subset."
