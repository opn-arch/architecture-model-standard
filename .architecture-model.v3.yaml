        \ so nested dict/list\n  equality is order-insensitive.\n* Pydantic v2, ``extra=forbid``:\
        \ unknown fields on any diff container\n  raise ``ValidationError``.\n\nThread\
        \ safety\n-------------\nPure functions; no shared mutable state. Safe to\
        \ call concurrently.\n\nError taxonomy\n--------------\n* Unsupported entity\
        \ attribute types propagate ``TypeError`` from\n  :func:`canonical_json`.\n\
        * Malformed inputs (non-``ArchitectureModel``) raise ``AttributeError``\n\
        \  from the reflective walk — callers must supply parsed models."
