    - id: PR-d38323fe3286
      attribute: intent
      content: "ViewSpec projector registry and pure projection (T16).\n\nPurpose\n\
        -------\nThis module turns a :class:`~architecture_model.lifecycle.view_spec.ViewSpec`\n\
        plus a matching :class:`~architecture_model.lifecycle.model_slice_materializer.MaterializedSlice`\n\
        into a :class:`ProjectedView` carrying a\n:class:`~architecture_model.core.diagram_spec.DiagramSpec`.\n\
        \nA **projector** is a pure callable ``(model_fragment, projector_config)\
        \ ->\nDiagramSpec``. Projectors are registered by name in a\n:class:`ProjectorRegistry`;\
        \ the module-level :data:`DEFAULT_REGISTRY` is\nseeded with adapters for the\
        \ four canonical Systems-Engineering views\n(``se.conops``, ``se.functional``,\
        \ ``se.logical``, ``se.use_cases``) that\ndelegate to :mod:`architecture_model.core.se_view_projectors`\
        \ without\nmodifying it.\n\nContract for projector implementations\n--------------------------------------\n\
        * MUST be a pure function of ``(model_fragment, projector_config)``. It\n\
        \  MUST NOT read the filesystem, network, environment variables, or any\n\
        \  model outside the provided fragment. This is a documented contract; it\n\
        \  is not (and cannot be) enforced by the runtime.\n* MUST return a :class:`DiagramSpec`\
        \ instance. Any other return value\n  causes :func:`project` to raise :class:`TypeError`.\n\
        * SHOULD be deterministic: given equal ``(model_fragment,\n  projector_config)``\
        \ it MUST produce equal DiagramSpecs.\n\nInvariants\n----------\n* :func:`project`\
        \ verifies that\n  ``view.slice_ref.slice_id == materialized_slice.slice_id``\
        \ and\n  ``view.slice_ref.model_revision == materialized_slice.model_revision``\n\
        \  before invoking the projector. Mismatches raise :class:`SliceMismatch`,\n\
        \  enforcing the \"ViewSpec bound to immutable slice revision\" invariant\n\
        \  established by T15.\n* :func:`project` passes a shallow copy of ``view.projector_config``\
        \ to\n  the projector so any mutation performed inside the projector cannot\n\
        \  leak back into the frozen ViewSpec.\n* The ``provenance`` dict on the returned\
        \ :class:`ProjectedView` records\n  ``projector``, ``projector_version``,\
        \ ``produced_at`` (RFC3339 UTC with\n  ``Z`` suffix), and ``slice_digest``\
        \ (currently the materialized\n  slice's ``model_revision``). Everything except\
        \ ``produced_at`` is\n  deterministic across repeated calls.\n* Warnings from\
        \ the :class:`MaterializedSlice` are surfaced as strings of\n  the form ``\"\
        <code>: <message>\"`` on ``ProjectedView.warnings`` so\n  downstream renderers\
        \ can present them without importing lifecycle\n  types.\n\nThread safety\n\
        -------------\n:class:`ProjectorRegistry` mutations (``register``/``unregister``)\
        \ are\nNOT thread-safe in this phase. The intended usage is: seed\n:data:`DEFAULT_REGISTRY`\
        \ at import time (single-threaded) and treat it\nas read-only afterwards.\
        \ :func:`project` itself is a pure function and\nsafe for concurrent use once\
        \ the registry is quiescent.\n\nError taxonomy\n--------------\n* :class:`ProjectorNotFound`\
        \ (subclass of :class:`KeyError`) — unknown\n  projector name in :func:`ProjectorRegistry.get`\
        \ or :func:`project`.\n* :class:`SliceMismatch` (subclass of :class:`ValueError`)\
        \ — the ViewSpec\n  references a slice_id / model_revision that does not match\
        \ the\n  materialized slice supplied to :func:`project`.\n* :class:`TypeError`\
        \ — the registered projector returned a value that is\n  not a :class:`DiagramSpec`."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.view_projection;
        via=pipeline_v3.derive_promises
    - id: PR-d4842576f6b6
      attribute: intent
      content: "Root architecture package index.\n\nPurpose\n-------\nProvide a fast,\
        \ deterministic lookup table from ``architecture_id`` / slug /\nsource-file\
        \ path to the on-disk package that owns it. Instead of re-walking\nthe package\
        \ tree on every query, callers rebuild the index once after any\nstructural\
        \ change and then consume it as a flat list.\n\nThe index lives at ``<repo_root>/.architecture/package-index.yaml``\
        \ by\nconvention. Tests may override the location via ``index_path``.\n\n\
        Invariants\n----------\n* The index file is written via :func:`atomic_store.write_atomic`,\
        \ so\n  readers never observe a partially written index.\n* Every rebuild\
        \ records an ``index.rebuild.commit`` event on the journal\n  at ``<repo_root>/.architecture/journal.jsonl``.\n\
        * Entries are sorted by ``slug`` for byte-stable output.\n* ``entry.root``\
        \ is a POSIX-style path *relative to* ``repo_root``.\n* ``contract_version``\
        \ matches :data:`SchemaVersions.PACKAGE`.\n\nNon-goals\n---------\n* Federated\
        \ cross-repo indexes — Phase 1 indexes one repo root at a time.\n* Generation\
        \ tracking — ``current_generation`` is always ``None`` here;\n  Task 8 populates\
        \ it once revision publishing exists."
      owner_entity: COMP-3a28244a
      delivered_from: null
