    - id: PR-63bd9a77746e
      attribute: intent
      content: "``architecture-model migrate`` subcommand.\n\nMinimal 2.0 → 2.1 upgrade.\
        \ Reads ``.architecture-model.yaml``, bumps\n``meta.schema_version`` to the\
        \ requested target, preserves every other\nbyte via targeted regex substitution\
        \ on the meta block (no full YAML\nround-trip, no key reordering, no re-quoting).\n\
        \nDeferred to a follow-up: skeleton-field discovery (report which\ncomponents/capabilities/etc.\
        \ would benefit from Phase 2 semantic fields).\n\nDesign deviation from plan\
        \ text (2026-09-08, execution):\n- Plan uses Click (``CliRunner.invoke(cli,\
        \ [...])``); this CLI is\n  argparse-based (``main(argv)``). Test file was\
        \ adapted to invoke\n  ``main`` directly with ``capsys``. Behaviour and exit\
        \ codes match\n  the plan spec."
      owner_entity: COMP-8a6bd396
      delivered_from: null
