    - id: PR-c3798c678951
      attribute: intent
      content: "Deterministic schema migration framework for lifecycle contracts.\n\
        \nPurpose\n-------\nProvide a deterministic, auditable mechanism to bump a\
        \ persisted\nlifecycle payload from an older ``contract_version`` to the current\n\
