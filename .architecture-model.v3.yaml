    - id: PR-484a891b7985
      attribute: intent
      content: 'Endpoint dataclasses shared by the endpoint extractors.


        An ``Endpoint`` is a callable surface that outside actors invoke:

        Click/argparse subcommands, HTTP routes, or plugin hooks. The pipeline

        promotes them into Interface entities (Phase 4-A Task 12); reference-doc

        projectors (Tasks 13-15) render them as CLI reference / API reference /

        plugin guide docs.


        Frozen dataclasses: no field reassignment. Instances are not hashable

        (``metadata`` is a dict) — extractor output is de-duplicated by

        ``(kind, name, file, lineno)`` tuples externally when needed.'
      owner_entity: COMP-47414902
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline.endpoint_types;
        via=pipeline_v3.derive_promises
    - id: PR-5538ad95855f
      attribute: intent
      content: "Endpoint extractors (Phase 4-A Tasks 8-10).\n\nDeterministic AST-based\
        \ extraction of CLI commands (Click + argparse),\nHTTP routes (FastAPI/Flask/starlette\
        \ — Task 9), and plugin hooks\n(entry_points — Task 10). Each extractor returns\
        \ a list of\n:class:`~architecture_model.pipeline.endpoint_types.Endpoint`\
        \ sorted by\n``(file, lineno)``.\n\nDesign goals\n------------\n1. Pure-AST\
        \ — no import execution, safe on untrusted sources.\n2. Deterministic — repeated\
        \ runs on the same input produce byte-identical\n   output. Extractors sort\
        \ by ``(file, lineno)``.\n3. Best-effort — unknown decorator shapes are ignored\
        \ rather than\n   raising; the pipeline is expected to be resilient to third-party\n\
        \   framework variations."
      owner_entity: COMP-47414902
      delivered_from: null
      verified_by: []
      status: open
