    - id: PR-5538ad95855f
      attribute: intent
      content: "Endpoint extractors (Phase 4-A Tasks 8-10).\n\nDeterministic AST-based\
        \ extraction of CLI commands (Click + argparse),\nHTTP routes (FastAPI/Flask/starlette\
        \ — Task 9), and plugin hooks\n(entry_points — Task 10). Each extractor returns\
        \ a list of\n:class:`~architecture_model.pipeline.endpoint_types.Endpoint`\
        \ sorted by\n``(file, lineno)``.\n\nDesign goals\n------------\n1. Pure-AST\
        \ — no import execution, safe on untrusted sources.\n2. Deterministic — repeated\
        \ runs on the same input produce byte-identical\n   output. Extractors sort\
        \ by ``(file, lineno)``.\n3. Best-effort — unknown decorator shapes are ignored\
        \ rather than\n   raising; the pipeline is expected to be resilient to third-party\n\
        \   framework variations."
