    - id: PR-088b3b18b89b
      attribute: intent
      content: "Crash-safe atomic file and tree writes.\n\nPurpose\n-------\nProvide\
        \ primitives that ensure a target path never contains partially-written\n\
        data even under process crash, kill -9, or power loss (modulo fs guarantees).\n\
        \nInvariants\n----------\n* A final target path is only ever created via ``os.replace``\
        \ from a fully\n  fsynced sibling temp file. Readers see either the previous\
