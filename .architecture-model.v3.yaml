    - id: PR-ae6c14849450
      attribute: intent
      content: "pipeline_v3.derive_behaviors — Behavior derivation stage (Part 17a1).\n\
        \nConsumes :class:`ScanResult` from the scan stage and produces a flat\nlist\
        \ of :class:`BehaviorCandidate` records, one per public\nmodule-level function\
        \ (or class method) with a non-empty docstring.\n\nDesign\n------\n\n* Behavior\
        \ granularity is **per public function with a docstring**.\n  Private functions\
        \ (name starts with ``_``) and undocumented functions\n  are ignored to bound\
        \ model size and noise.\n* Behaviors are collected from ``ScannedModule.functions``\
        \ (module-level)\n  and from each ``ScannedModule.classes[*].method_details``\
        \ (class\n  methods). Class methods are surfaced only when the manifest scanner\n\
        \  populated ``method_details`` — the top-level ``functions`` list is\n  authoritative\
        \ for module-level defs.\n* Owner is the module dotted name (later rebound\
        \ to the owning cluster\n  by :mod:`containerize`, mirroring the derive_promises\
        \ pattern).\n* Identity: ``BEH-<sha1(owner_module + \":\" + function_name)[:8]>``.\n\
        * Determinism: output sorted by ``(owner_module, function_name)``.\n\nNon-scope\
        \ for 17a1: behavior promises, composite detection, trigger\nedges. Those\
        \ land in 17a2/17a3/17a4."
