    - id: PR-9552a63cd4e8
      attribute: intent
      content: "pipeline_v3.orchestrator — Stage coordinator (T0.14 Phase 6.8).\n\n\
        Wires the seven pipeline_v3 stages into a single end-to-end run:\n\n    scan\
        \ → derive_promises → cluster → link → containerize → verify → publish\n\n\
        Exposes :func:`run_pipeline` and :class:`PipelineRunResult`. Every\nintermediate\
        \ artifact (scan, promises, clusters, links, model, verify\nreport, per-component\
        \ reports, publish result) is available on the\nreturned :class:`PipelineRunResult`\
        \ so downstream tooling can inspect\nany stage without re-running.\n\nSubstrate\
        \ integration\n---------------------\n\nAs of the walk-substrate work (Part\
        \ 1), the orchestrator runs on the\ngeneric :class:`~architecture_model.pipeline_v3.substrate.Pipeline`\n\
        runner. Each pipeline_v3 stage becomes a :class:`Stage` operating on a\nshared\
        \ ``_PipelineState`` dict. Output is byte-identical to the pre-\nsubstrate\
        \ straight-line implementation (guarded by existing tests).\n\nOptional flags\n\
        --------------\n\n- ``cluster_depth``: dotted-segment depth for clustering\
        \ (default 3).\n- ``project_name``: stamped into ``meta.project`` at publish\
        \ time.\n- ``skip_publish``: run every stage except publish; leave no artifact\n\
        \  on disk. Useful for CI checks, tests, and in-memory workflows."
      owner_entity: COMP-c5a72728
