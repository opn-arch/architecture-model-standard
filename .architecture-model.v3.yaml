    - id: PR-92a307ab26f4
      attribute: intent
      content: "Semantic diff over architecture models, manifests, and child revisions.\n\
        \nPurpose\n-------\nProvide a complete, deterministic diff between two architecture-lifecycle\n\
        snapshots. Covers:\n\n* All entity kinds present on :class:`architecture_model.core.types.Entities`\n\
        \  (discovered reflectively via :func:`dataclasses.fields`).\n* All relationship\
        \ attributes (identity key = ``(from, to, type)``; any\n  attribute delta\
        \ becomes a ``changed`` entry).\n* Manifest ground truth (files, symbols by\
        \ fully-qualified name, symbol\n  signatures).\n* Child sub-architecture revisions\
        \ (added / removed / revision changed).\n* Git provenance propagation when\
        \ both models carry\n  ``meta.provenance.git_commit``.\n\nInvariants\n----------\n\
        * Deterministic ordering — all list outputs are lexicographically sorted.\n\
        * Missing inputs (``manifest_*=None`` or ``child_revisions_*=None``)\n  produce\
        \ empty structures, never ``None``.\n* Field equality uses canonical JSON\
        \ (NFC, sorted-keys) via\n  :mod:`architecture_model.lifecycle.serialization`\
        \ so nested dict/list\n  equality is order-insensitive.\n* Pydantic v2, ``extra=forbid``:\
        \ unknown fields on any diff container\n  raise ``ValidationError``.\n\nThread\
        \ safety\n-------------\nPure functions; no shared mutable state. Safe to\
        \ call concurrently.\n\nError taxonomy\n--------------\n* Unsupported entity\
        \ attribute types propagate ``TypeError`` from\n  :func:`canonical_json`.\n\
        * Malformed inputs (non-``ArchitectureModel``) raise ``AttributeError``\n\
        \  from the reflective walk — callers must supply parsed models."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.diff;
