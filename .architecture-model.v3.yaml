    - id: PR-86746af4f12a
      attribute: intent
      content: "pipeline_v3.publish — Model emit stage (T0.14 Phase 6.7).\n\nSerializes\
        \ a :class:`ContainerizedModel` to v3 YAML and (optionally)\nwrites it to\
        \ disk. The shape matches the Phase 2 v3-poc migration\noutput so downstream\
        \ consumers (validator, decompose, docs) get a\nuniform schema regardless\
        \ of whether the model came from migration or\nfresh pipeline_v3 extraction.\n\
        \nTwo entry points:\n\n    - :func:`serialize_model` — pure, in-memory YAML\
        \ text.\n    - :func:`publish_model` — writes to disk, returns :class:`PublishResult`.\n\
        \nDeterminism\n-----------\n\n- Components sorted by ``id``.\n- Promises within\
        \ a component sorted by ``(attribute, id)``.\n- Relationships sorted by ``(from_cluster,\
        \ to_cluster)``.\n- ``meta.generated_at`` honors ``AMS_DETERMINISTIC_NOW``\
        \ (ISO-8601 str)\n  when set; otherwise stamps the current UTC instant.\n\
        - YAML emit: ``sort_keys=False`` (respects our fixed key order),\n  ``default_flow_style=False``\
        \ (block style), no aliases."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
