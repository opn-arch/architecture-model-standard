    - id: PR-135c21ac7e9c
      attribute: intent
      content: "ModelSlice contract: curated view spec over an architecture model.\n\
        \nPurpose\n-------\nA ``ModelSlice`` names a *reproducible curated subset*\
        \ of an architecture\nmodel. Slice specs are the input to view synthesis and\
        \ artifact\ngeneration: they answer \"which subset of the model, closed under\
        \ which\nrules, is being rendered?\" A slice is a **contract**, not a rendering\
        \ —\nit stores selectors + closure policy, not resolved entities.\n\nInvariants\n\
        ----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\"\
        )``);\n  slices are immutable value objects safe to share across threads.\n\
        * ``contract_version`` is pinned to :data:`SchemaVersions.MODEL_SLICE`.\n\
        \  Rejecting a mismatch is intentional: bumping the version REQUIRES a\n \
        \ migration that overrides the validator.\n* ``id`` is a slug (``[a-zA-Z0-9._-]+``)\
        \ — spaces and empty strings are\n  rejected so slice ids can be embedded\
        \ in filenames and URLs.\n* ``selectors`` must nominate at least one dimension;\
        \ an empty slice has\n  no defined semantics.\n* When ``scope == \"federated\"\
        `` the slice MUST bound its reach with at\n  least one of ``entity_ids``/``fblocks``/``layers``\
        \ — federated with no\n  bound is unbounded and forbidden.\n* The **digest**\
        \ (see :func:`compute_slice_digest`) excludes\n  ``generated_at`` and ``signatures``:\
        \ they are envelope metadata, not\n  content, and would otherwise defeat content-addressing.\n\
        \nThread safety\n-------------\nInstances are frozen pydantic models. All\
        \ functions in this module are\npure. Safe for concurrent read access.\n\n\
        Error taxonomy\n--------------\nConstruction failures raise :class:`pydantic.ValidationError`\
        \ wrapping the\nunderlying :class:`ValueError`. This module does not define\
        \ custom\nexception types."
