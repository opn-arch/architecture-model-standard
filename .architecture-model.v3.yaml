    - id: PR-63bb4e55b7bf
      attribute: intent
      content: "pipeline_v3.derive_triggers — Behavior-to-behavior trigger emission\
        \ (Parts 17a2, 17a3).\n\nConsumes :class:`ScanResult` + list of :class:`BehaviorCandidate`\
        \ and\nproduces a list of :class:`TriggerEdge` values connecting behaviors\n\
        whose source functions call each other.\n\nAlgorithm\n---------\n\nFor each\
        \ BehaviorCandidate ``A`` owned by module ``M_A`` with function\n``fn_A``:\n\
        \n1. Look up ``fn_A``'s ``calls`` list from the scanned module's function\n\
        \   dict. ``calls`` is a de-duped list of bare callee names (both\n   ``foo()``\
        \ and ``obj.foo()`` surface as ``\"foo\"`` — the manifest\n   scanner does\
        \ not preserve receivers).\n2. For each callee name ``x``:\n   a. **Local\
        \ resolution** — a public function ``x`` defined in ``M_A``\n      that also\
        \ has a BehaviorCandidate → target = that candidate.\n   b. **Imported resolution**\
        \ — search behaviors whose ``function_name\n      == x`` AND whose ``owner_module``\
        \ is imported by ``M_A``:\n      - ``from M import x`` in ``M_A.imports``\
        \ → candidate.owner_module\n        must equal ``M``.\n      - ``import M``\
        \ in ``M_A.imports`` → any behavior in module ``M``\n        (any function\
        \ name matching) qualifies.\n   c. If exactly one candidate matches → collect\
        \ ``TriggerEdge(A.id,\n      match.id)`` in call-site order (per-source dedup\
        \ preserves first\n      occurrence). Ambiguous matches are skipped to bound\
        \ noise.\n3. Self-triggers (A → A) are dropped.\n\nComposite detection (Part\
        \ 17a3)\n-------------------------------\n\nA source behavior with ``>= COMPOSITE_MIN_TRIGGERS``\
        \ (default 3)\nresolved outgoing trigger edges is treated as **composite**.\
        \ Each of\nits outgoing edges is tagged with ``sequence = 1..N`` in call-site\n\
        order (per the ``calls`` list from the AST scan). Behaviors below the\nthreshold\
        \ emit edges with ``sequence = None``.\n\nThe threshold matches the plan heuristic:\
        \ \"a behavior whose owning\nmodule calls >= 3 other behaviors in fixed order\"\
        . Detection is\nimplicit — no separate ``is_composite`` flag; consumers detect\n\
        compositeness by observing at least one outgoing edge with a non-None\n``sequence``\
        \ on any behavior.\n\nDeterminism\n-----------\n\nOutput list sorted by ``(from_behavior,\
        \ to_behavior)``. Edge identity\nis ``(from, to)`` — parallel edges are not\
        \ emitted. When sequences\nare stamped, they reflect the source function's\
        \ call-site order at\nthe time of derivation.\n\nNon-scope for 17a3: Call-chain\
        \ metadata on ``traces-to`` edges (17a4)."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.derive_triggers;
        via=pipeline_v3.derive_promises
    - id: PR-80390d2a1acd
      attribute: intent
      content: 'pipeline_v3.link — Relationship inference stage (T0.14 Phase 6.4).


        Derives ``depends-on`` :class:`Link` records between :class:`Cluster`

        values from import edges reported by the scan stage. Each import in a

        module belonging to cluster A that resolves to a module in cluster B

        (A ≠ B) contributes a link A → B with weight = distinct

        (source_module, target_cluster) pairs.


        Resolution rules

        ----------------


        An import string ``imp`` resolves to cluster ``C`` iff ``imp`` starts with

        ``C.root_prefix`` on a dotted-segment boundary. To bridge the AMS reality

        where scanned module names begin with ``src.`` but imports do not, the

        resolver also matches after stripping a leading ``src.`` from cluster

        prefixes.


        When multiple clusters match, the longest matching prefix wins (most-

        specific containment). Unresolved imports (stdlib, third-party, or

        anything outside the scanned tree) are silently dropped.


        Design intent

        -------------


        Kept deliberately simple: one relationship kind (``depends-on``), one

        signal (import edges). Additional relationship kinds — ``exposes``

        (interface), ``realizes`` (capability), ``triggers`` (behavior) — come

        online in later stages once we know cluster / entity types. The link

        stage''s contract is: **structural coupling only**.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.link;
        via=pipeline_v3.derive_promises
