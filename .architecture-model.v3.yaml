    - id: PR-c46b3c826397
      attribute: intent
      content: "HTML artifact renderer.\n\nPurpose\n-------\nWrap the SVG rendering\
        \ of a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView`\
