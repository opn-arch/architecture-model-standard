    - id: PR-2d1a5dcd12b9
      attribute: intent
      content: "B2.1.3 — Roll up runtime SI&L records into an architecture-component\
        \ record.\n\nGiven an architecture-component ``SILRecord`` and the runtime\
        \ records for the\npipeline stages / MCP tools / renderers that touch the\
