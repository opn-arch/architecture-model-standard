      attribute: intent
      content: "Renderer registry for lifecycle artifacts (T18).\n\nEach renderer\
        \ is a pure callable ``(ProjectedView | list[ProjectedView],\nArtifactSpec)\
        \ -> bytes``. Renderers MUST:\n\n* Perform no filesystem, network, environment,\
