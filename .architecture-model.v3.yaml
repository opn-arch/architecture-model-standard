    - id: PR-d5e1fd6f38b7
      attribute: intent
      content: "Model/manifest revision pairing helpers.\n\nPurpose\n-------\nEnforce\
        \ an immutable one-to-one binding between an architecture model\nand its reality\
        \ manifest. A model captures intent (capabilities,\ncomponents, relationships);\
        \ a manifest captures ground truth (AST-derived\nmodules, functions, imports).\
        \ Because a model's meaning is anchored in\nthe manifest it was authored against,\
        \ the two artifacts must travel\ntogether and mutations to either must be\
        \ detectable.\n\nThis module supplies pure helpers to:\n\n* compute stable\
        \ content digests for models and manifests, excluding\n  volatile bookkeeping\
        \ fields;\n* stamp a matching pair with cross-references (``model.meta.manifest_digest``\n\
        \  and ``manifest.pairing.model_digest``);\n* verify that a given (model,\
        \ manifest) pair is still consistent.\n\nInvariants\n----------\n* **Idempotent\
        \ stamp.** ``stamp_pairing`` may be called on already-stamped\n  inputs and\
        \ produces the same digests, because pre-existing pointers are\n  stripped\
        \ before recomputation.\n* **Volatile fields excluded.** Timestamps and detached\
        \ signature blocks\n  do not participate in the digest, so re-serializing\
        \ or re-signing does\n  not break pairing.\n* **Content addressed.** Digests\
        \ are computed via the T2 canonical\n  serializer, so ``sha256-v1`` is the\
        \ algorithm tag stored in\n  ``manifest.pairing.algo``.\n\nNon-goals\n---------\n\
        * This module does **not** touch disk.\n* It does **not** wire into ``manifest.generator``\
        \ or ``core.parser``.\n  Future publishers may call these helpers; Phase 1\
        \ keeps them pure."
