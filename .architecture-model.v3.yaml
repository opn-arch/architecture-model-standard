    - id: PR-a3f6bc423b41
      attribute: intent
      content: "Canonical package ownership + shared-file declarations.\n\nPurpose\n\
        -------\nEvery source file in an architecture package tree must have a single\n\
        canonical owner package. This module computes the mapping from file paths\n\
        to owner ``architecture_id`` s, enforces that overlap is only permitted\n\
        when explicitly declared via ``shared_paths``, and records\nslug-remap provenance\
        \ so renames remain auditable.\n\nKey rules\n---------\n* A file is \"claimed\"\
        \ by a package when it matches any pattern in that\n  package's ``owned_paths``.\
        \ Patterns are POSIX-style globs interpreted\n  via :func:`fnmatch.fnmatchcase`,\
        \ applied to the file's path *relative\n  to the claiming package's own root*\
        \ (not the source root).\n* If multiple packages claim the same file, the\
        \ overlap is legal only\n  when at least one of them declares a matching ``shared_paths``\
        \ entry\n  whose ``owners`` set exactly equals the claimants. Any other overlap\n\
        \  is a conflict.\n* Files matched by no ``owned_paths`` pattern are recorded\
        \ as\n  ``unowned``. Callers decide whether that's an error.\n\nInvariants\n\
        ----------\n* Deterministic output: ``files`` is sorted lexicographically\
        \ by path;\n  ``conflicts`` and ``unowned`` are also sorted by path. Two runs\
        \ on the\n  same tree return identical results.\n* No filesystem writes except\
        \ from :func:`record_remap`. Ownership\n  computation is a pure read of the\
        \ on-disk tree.\n\nExcluded from the walk (never appear in ``files`` or ``unowned``):\n\
        \    * any directory named ``__pycache__``\n    * any directory whose name\
        \ starts with ``.`` (covers ``.git``,\n      ``.architecture``, ``.architecture-models``\
        \ and similar tool dirs)\n    * any file with the ``.pyc`` suffix"
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.ownership;
        via=pipeline_v3.derive_promises
