    - id: PR-2d1a5dcd12b9
      attribute: intent
      content: "B2.1.3 — Roll up runtime SI&L records into an architecture-component\
        \ record.\n\nGiven an architecture-component ``SILRecord`` and the runtime\
        \ records for the\npipeline stages / MCP tools / renderers that touch the\
        \ modules allocated to\nthat architecture component, produce a merged copy\
        \ of the arch record with:\n\n* ``rollup.runtime_components`` — insertion-ordered,\
        \ deduped list of runtime\n  component IDs whose scope overlaps the arch component's\
        \ modules.\n* ``metrics.invocations_7d`` — sum across runtime records.\n*\
        \ ``metrics.avg_duration_ms`` — invocation-weighted average.\n* ``metrics.failure_rate_7d``\
        \ — invocation-weighted average.\n\nArch-only metric fields (``validation_score``,\
        \ ``drift_flag_count``,\n``regen_readiness``, ``lesson_count``) are preserved\
        \ from the input.\nThe input record is never mutated."
      owner_entity: COMP-8f04b04b
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.sil.rollup;
        via=pipeline_v3.derive_promises
