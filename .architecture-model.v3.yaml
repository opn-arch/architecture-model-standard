    - id: PR-5c0743f78839
      attribute: intent
      content: "Cross-process file locks with timeout and stale-lock reclaim.\n\n\
        Purpose\n-------\nCoordinate mutually exclusive access to filesystem-backed\
        \ resources\n(e.g., a package staging area) across processes on the same host.\n\
        \nInvariants\n----------\n* Uses advisory ``fcntl.flock`` (POSIX). Non-POSIX\
        \ platforms raise\n  :class:`NotImplementedError` on enter.\n* On acquire,\
        \ the lock file contains ``pid\\nhostname\\ntimestamp\\n`` so stale\n  locks\
        \ can be detected.\n* Non-reentrant: a second acquire from the same process\
        \ on the same lock file\n  blocks or times out like any other contender.\n\
        * Stale locks (mtime older than ``stale_after`` seconds AND holder PID dead)\n\
        \  are reclaimed with a :class:`StaleLockReclaimed` warning.\n\nPlatform scope\n\
        --------------\nPOSIX only in Phase 1. Multi-host coordination (NFS advisory\
        \ quirks) is out of\nscope."
      owner_entity: COMP-3a28244a
      delivered_from: null
