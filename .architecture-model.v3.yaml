    - id: PR-1cec9eeed3f2
      attribute: intent
      content: "Canonical serialization and content digest for lifecycle artifacts.\n\
        \nPurpose\n-------\nProvide deterministic, byte-identical serialization of\
        \ Python objects so\nthey can be content-addressed via cryptographic digest.\
        \ This is the\nfoundation for revision identity, semantic diff, and signature\
        \ slots in\nthe architecture lifecycle.\n\nInvariants\n----------\n* **Determinism.**\
        \ ``canonical_json(x) == canonical_json(x)`` byte-for-byte\n  across processes,\
        \ machines, Python versions, and dict insertion orders.\n* **NFC normalization.**\
        \ All Unicode strings (both dict keys and string\n  values) are normalized\
        \ to Unicode Normal Form C before encoding, so\n  visually identical strings\
        \ hash to the same digest.\n* **Sorted keys.** Object keys are sorted lexicographically\
        \ at every\n  nesting level.\n* **Compact.** No insignificant whitespace;\
        \ separators are ``(\",\", \":\")``.\n* **UTF-8, no BOM.** ``ensure_ascii=False``\
        \ — Unicode passes through.\n\nForbidden types\n---------------\n* ``float``\
        \ — floating point representation is not stable across\n  platforms. Use ``int``\
        \ for exact integers.\n* ``decimal.Decimal`` — rejected in Phase 1 to keep\
        \ the numeric surface\n  strictly integral. A future phase may add a canonical\
        \ decimal encoding.\n* Non-string mapping keys — raise ``TypeError``.\n\n\
        Accepted types\n--------------\n``int``, ``str``, ``bool``, ``None``, ``list``,\
        \ ``tuple`` (encoded as\nJSON array), ``dict`` (string keys only).\n\nKey-path\
        \ exclusion semantics\n----------------------------\n``exclude_paths`` is\
        \ a sequence of tuples. Each tuple is a path of\nstring keys applied at successive\
        \ nesting levels of ``dict`` values. For\nexample, ``exclude_paths=[(\"generated_at\"\
        ,), (\"meta\", \"signatures\")]``\nstrips the top-level ``generated_at`` key\
        \ AND the nested\n``meta.signatures`` key before serialization. Missing paths\
        \ are silent\nno-ops. List/tuple traversal is not supported in Phase 1.\n\n\
        Thread safety\n-------------\nAll functions in this module are pure and thread-safe.\
        \ They do not\nmutate their inputs."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.serialization;
        via=pipeline_v3.derive_promises
