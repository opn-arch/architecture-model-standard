    - id: PR-91d58dafbafd
      attribute: intent
      content: "Markdown artifact renderer.\n\nPurpose\n-------\nProduce a minimal,\
        \ deterministic markdown document that summarises a\n:class:`~architecture_model.lifecycle.view_projection.ProjectedView`.\n\
        \nThe document contains:\n\n* A title (``parameters['title']`` if supplied,\
        \ otherwise\n  ``view.diagram_spec.title``, otherwise the view id).\n* A metadata\
        \ block: view id, slice id, model revision, projector and\n  projector version\
        \ (from ``view.provenance``).\n* A fenced code block with the diagram source.\
        \ If the DiagramSpec\n  carries a ``mermaid`` string in ``facets['mermaid']``\
        \ we use that\n  (``mermaid`` fence); otherwise a compact text listing of\
        \ nodes and\n  edges (``text`` fence). This is intentionally minimal — richer\n\
        \  diagram-in-markdown embedding is out of scope for T18 commit 1.\n* A warnings\
        \ summary listing every entry of ``view.warnings``.\n\nPurity contract\n---------------\n\
        No filesystem, network, environment, or logging side effects. Pure\nfunction\
        \ of its inputs; safe for concurrent use.\n\nAdaptation source\n-----------------\n\
        No existing markdown adapter in the tree owns this responsibility (the\ncore\
        \ ``visualize._md_to_html`` converts markdown *to* HTML — the opposite\ndirection).\
        \ This module therefore implements a small, self-contained\nmarkdown emitter\
        \ directly. If a shared markdown emitter is introduced\nlater, this renderer\
        \ should be refactored to delegate.\n\nError taxonomy\n--------------\n* :class:`ValueError`\
        \ — ``artifact.renderer`` is not ``\"markdown\"``, or a\n  list of views is\
        \ supplied but empty."
