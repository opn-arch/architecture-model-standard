    - id: PR-e1d8a857ba75
      attribute: intent
      content: "SI&L → Promise evidence binding — Phase 5 of T0.14.\n\nAggregation\
        \ layer: consumes existing :class:`SILRecord` objects and\nlifts their signal\
        \ into :class:`Promise` ``verified_by`` entries. NOT\na rewrite of :mod:`architecture_model.sil.{record,rollup,decorators}`\n\
        — those remain the source of truth. This module is the join.\n\nReference\
        \ format for a SIL-derived evidence entry::\n\n    SIL:<component_id>:<metric>=<value>\n\
        \    SIL:<component_id>:healthy\n    SIL:<component_id>:event=<event_id>\n\
        \nRules:\n\n* A SILRecord contributes evidence to a Promise iff\n  ``sil_record.component_id\
        \ == promise.owner_entity``.\n* Evidence is emitted in a canonical order (metrics\
        \ first, then event\n  ids sorted ascending) so re-binding is idempotent and\
        \ deterministic.\n* Existing ``verified_by`` entries are preserved; duplicates\
        \ removed\n  while preserving first-seen order.\n* TYPED_GAP promises still\
        \ receive evidence — a design-declared gap\n  can be evidenced (e.g. \"we\
        \ know we lack this and here's the SIL\n  proof\") without being closed."
