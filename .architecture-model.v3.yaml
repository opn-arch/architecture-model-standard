    - id: PR-383cba84c62c
      attribute: intent
      content: "AI-context artifact renderer (T18 commit 2).\n\nPurpose\n-------\n\
        Render a :class:`~architecture_model.lifecycle.view_projection.ProjectedView`\n\
        into a compact, LLM-friendly plain-text context payload summarizing the\n\
        projected DiagramSpec (nodes, edges, warnings, provenance).\n\nPurity contract\n\
        ---------------\nNo filesystem, network, environment, or logging side effects.\
        \ Pure\nfunction of its inputs.\n\nAdaptation source\n-----------------\n\
        The historical LLM context formatter\n``architecture_model.integrations.llm_context.format_model_context``\n\
        consumes a full ``ArchitectureModel`` and is not currently present in\nthis\
        \ tree. Rather than reconstruct a synthetic model from a DiagramSpec\n(lossy\
        \ round-trip), this renderer emits a self-contained textual\nsummary directly\
        \ from ``ProjectedView`` fields. This mirrors the pattern\nused by the HTML\
        \ renderer in T18 commit 1.\n\nIf ``artifact.parameters`` carries ``max_tokens``\
        \ (int), the output is\nsoft-capped to roughly ``max_tokens * 4`` characters\
        \ (a conventional\n~4 chars/token heuristic); unknown parameters are silently\
        \ ignored.\n\nError taxonomy\n--------------\n* :class:`ValueError` — ``artifact.renderer``\
        \ is not ``\"ai-context\"``,\n  or a list of views is supplied but empty."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.ai_context;
        via=pipeline_v3.derive_promises
    - id: PR-47e9d02d30c7
      attribute: intent
      content: "Semantic-intersection stale graph for the architecture lifecycle.\n\
        \nPurpose\n-------\nBuild a directed acyclic graph (DAG) over lifecycle-object\
        \ kinds\n(``package``, ``model``, ``manifest``, ``slice``, ``view``, ``artifact``)\
        \ and\ncompute the set of nodes that become stale when a given set of source\
        \ paths\nchanges. The graph is planning-only — nothing is executed or rebuilt.\n\
        \nSemantic intersection\n---------------------\nEach node declares ``owned_paths``\
        \ — POSIX-style ``fnmatch`` glob patterns\nrelative to the package root. A\
        \ node is *directly* invalidated only when a\nchanged path matches one of\
        \ its own globs. Direct invalidation then\npropagates to all transitive descendants.\
        \ A slice with\n``owned_paths=(\"core/**\",)`` is *not* invalidated by changes\
        \ under\n``cli/`` — this is what makes the graph \"semantic\".\n\nNodes with\
        \ an empty ``owned_paths`` tuple (and any kind other than\n``package``) are\
        \ never invalidated by paths; they only become stale through\nan upstream\
        \ input. This lets synthetic view/artifact nodes participate in\npropagation\
        \ without pretending to own any code.\n\nInvariants\n----------\n* Node kind\
        \ is a lowercase string from ``NODE_KINDS``. It is a soft enum so\n  later\
        \ tasks (T13–T18) can add ``slice``, ``view`` and ``artifact`` nodes\n  without\
        \ modifying this module.\n* All returned collections (topological orders,\
        \ stale-node lists, reason\n  dicts) are deterministic — internal iteration\
        \ is over sorted node ids.\n* Cycle detection is performed by :meth:`DependencyGraph.topological_order`\n\
