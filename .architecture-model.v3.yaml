    - id: PR-3774dc46489a
      attribute: intent
      content: "Chain-closure quality module — Phase 3 of T0.14 (v3 bootstrap).\n\n\
        Realizes CAP-DF-VERIFY:\n    \"Verify delivery-down and verify-up chain closure\
        \ at both structural\n     and per-attribute levels. Gaps are typed (named\
        \ categories), never\n     silent NULLs.\"\n\nConsumes a Promise-graph (see\
        \ :mod:`architecture_model.core.promise`) and\nemits a :class:`ChainClosureReport`\
        \ with three typed gap categories:\n\n- ``G-DELIVERY`` — a Promise has no\
        \ upstream delivery lineage. Sub-cases:\n  * missing ``delivered_from`` on\
        \ a non-root owner\n  * ``delivered_from`` points to an id absent from the\
        \ graph\n- ``G-VERIFY`` — a Promise (not itself a TYPED_GAP) has no\n  ``verified_by``\
        \ evidence records. Also fires when a Promise's status\n  is ``VERIFIED``\
        \ but ``verified_by`` is empty (structural inconsistency).\n- ``G-OPEN-Q``\
        \ — a Promise whose ``attribute == \"open_questions\"`` and\n  whose content\
        \ is a non-empty question or list of questions. Each\n  question yields one\
        \ gap.\n\nPromises with ``status == TYPED_GAP`` are exempt from delivery/verify\n\
        checks — the gap is already named on the Promise itself.\n\nRoot owners (typically\
        \ actors) are exempt from ``G-DELIVERY``: they have\nno upstream by design.\
        \ Callers declare roots via ``root_owner_ids``.\n\nclosure_pct = 1 - gap_count\
        \ / promise_count, clamped to [0, 1]. Empty\ngraph vacuously yields 1.0."
      owner_entity: COMP-bb5e3d5a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.quality.chain_closure;
        via=pipeline_v3.derive_promises
