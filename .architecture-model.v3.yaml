    - id: PR-f058a28255d8
      attribute: intent
      content: "NetworkX export adapter for AMS models (Stage 1).\n\nConverts an AMS\
        \ v3 model dict into a ``networkx.MultiDiGraph`` with\ndeterministic node/edge\
        \ ordering. Promises and evidence are promoted to\nfirst-class sub-nodes when\
        \ ``promises_as_nodes`` is True, wired via\nsynthetic ``has-promise`` and\
        \ ``verified-by`` edges.\n\nDesign invariants:\n    - Parallel typed edges\
        \ preserved (browse regression: same node pair,\n      different relationship\
        \ types → distinct edges with unique keys).\n    - Deterministic: two builds\
        \ from the same input produce identical\n      node/edge iteration order.\n\
        \    - YAML remains source of truth; graph is a derived view.\n    - Zero\
        \ touch on walks/traverse.\n\nPublic API:\n    to_networkx(model, *, promises_as_nodes,\
        \ include_verified_by,\n                include_semantic_fields) -> nx.MultiDiGraph\n\
        \    BUCKET_ORDER, EDGE_TYPES, SEMANTIC_FIELDS"
      owner_entity: COMP-423b7878
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.graph.networkx_adapter;
        via=pipeline_v3.derive_promises
