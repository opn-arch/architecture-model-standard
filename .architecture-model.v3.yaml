        :func:`architecture_model.core.visualize.generate_html_viewer` is\npurpose-built\
        \ for interactive multi-view browsing, requires a model +\nproject root, and\
        \ *writes to disk*. It is unsuitable as a per-artifact\nrenderer bound to\
        \ a single :class:`ProjectedView`.\n\nThis module therefore delegates SVG\
        \ generation to\n:func:`architecture_model.core.diagram_renderer.render_diagram_svg`\
        \ (via\n:mod:`architecture_model.lifecycle.renderers.svg`) and wraps the result\n\
        in a small deterministic HTML skeleton. If a shared, in-memory HTML\ndocument\
        \ builder is later extracted from ``visualize``, this renderer\nshould delegate\
        \ to it.\n\nError taxonomy\n--------------\n* :class:`ValueError` — ``artifact.renderer``\
        \ is not ``\"html\"``, or a\n  list of views is supplied but empty."
