    - id: PR-80390d2a1acd
      attribute: intent
      content: 'pipeline_v3.link — Relationship inference stage (T0.14 Phase 6.4).


        Derives ``depends-on`` :class:`Link` records between :class:`Cluster`

        values from import edges reported by the scan stage. Each import in a

        module belonging to cluster A that resolves to a module in cluster B

        (A ≠ B) contributes a link A → B with weight = distinct

        (source_module, target_cluster) pairs.


        Resolution rules

        ----------------


        An import string ``imp`` resolves to cluster ``C`` iff ``imp`` starts with

        ``C.root_prefix`` on a dotted-segment boundary. To bridge the AMS reality

        where scanned module names begin with ``src.`` but imports do not, the

        resolver also matches after stripping a leading ``src.`` from cluster

        prefixes.


        When multiple clusters match, the longest matching prefix wins (most-

        specific containment). Unresolved imports (stdlib, third-party, or

        anything outside the scanned tree) are silently dropped.


        Design intent

        -------------


        Kept deliberately simple: one relationship kind (``depends-on``), one

        signal (import edges). Additional relationship kinds — ``exposes``

        (interface), ``realizes`` (capability), ``triggers`` (behavior) — come

        online in later stages once we know cluster / entity types. The link

        stage''s contract is: **structural coupling only**.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.link;
        via=pipeline_v3.derive_promises
    - id: PR-86746af4f12a
      attribute: intent
      content: "pipeline_v3.publish — Model emit stage (T0.14 Phase 6.7).\n\nSerializes\
        \ a :class:`ContainerizedModel` to v3 YAML and (optionally)\nwrites it to\
        \ disk. The shape matches the Phase 2 v3-poc migration\noutput so downstream\
        \ consumers (validator, decompose, docs) get a\nuniform schema regardless\
        \ of whether the model came from migration or\nfresh pipeline_v3 extraction.\n\
        \nTwo entry points:\n\n    - :func:`serialize_model` — pure, in-memory YAML\
        \ text.\n    - :func:`publish_model` — writes to disk, returns :class:`PublishResult`.\n\
        \nDeterminism\n-----------\n\n- Components sorted by ``id``.\n- Promises within\
        \ a component sorted by ``(attribute, id)``.\n- Relationships sorted by ``(from_cluster,\
        \ to_cluster)``.\n- ``meta.generated_at`` honors ``AMS_DETERMINISTIC_NOW``\
        \ (ISO-8601 str)\n  when set; otherwise stamps the current UTC instant.\n\
        - YAML emit: ``sort_keys=False`` (respects our fixed key order),\n  ``default_flow_style=False``\
        \ (block style), no aliases."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.publish;
        via=pipeline_v3.derive_promises
    - id: PR-a6baf3026a61
      attribute: intent
      content: "pipeline_v3.cluster — Component grouping stage (T0.14 Phase 6.3).\n\
        \nGroups :class:`ScannedModule` records into :class:`Cluster` records by\n\
        dotted-name prefix. Each cluster is a candidate v3 component; downstream\n\
        stages (link, containerize, publish) turn clusters into ``COMP-*`` entities\n\
        with realizes/depends-on relationships.\n\nSimplification vs. legacy manifest.grouping\n\
        -------------------------------------------\nThe legacy :mod:`architecture_model.manifest.grouping`\
        \ uses multi-signal\naffinity (subdirectory + name-prefix + import edges)\
        \ with a full merge-\nand-split pipeline. That algorithm is production-tested\
        \ and remains the\ndefault for legacy pipeline consumers.\n\nFor v3 first-pass,\
        \ we deliberately start with a simpler, more transparent\nprefix-based clustering:\n\
        \n    - Group modules by the first ``depth`` dotted-name segments.\n    -\
        \ Cluster id = ``COMP-<sha1(root_prefix)[:8]>`` (deterministic).\n    - Cluster\
        \ name = last segment of the root prefix (human-friendly).\n    - Clusters\
        \ and their modules are sorted for byte-stable output.\n\nImport-affinity\
        \ refinement can be added later as an optional post-pass\n(see Phase 9 / adapter\
        \ tasks) without changing this module's interface."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.cluster;
        via=pipeline_v3.derive_promises
    - id: PR-b94760fa9989
      attribute: intent
      content: 'pipeline_v3.containerize — Component packaging stage (T0.14 Phase
        6.5).


        Composes the outputs of :mod:`scan`, :mod:`derive_promises`, :mod:`cluster`,

        and :mod:`link` into a coherent :class:`ContainerizedModel` — the v3 shape

        consumed by :mod:`verify` (chain-closure) and :mod:`publish` (YAML emit).


        Core operation: **Promise ownership rebinding**

        ------------------------------------------------


        ``derive_promises`` produces Promises owned by *modules* (dotted names).

        v3 architecture entities are *components*, not modules. Containerize

        walks each cluster, rebinds every Promise owned by one of its member

        modules to ``owner_entity = cluster.id``, and recomputes the Promise id

        against the new owner via :func:`compute_promise_id`.


        Because the identity triple ``(attribute, content, owner)`` changes, ids

        change. Two Promises that were distinct at the module level but become

        identical at the component level (e.g. both modules had

        ``delivers=[]`` typed-gap) collapse to one record via id-set dedup.


        Provenance is enriched to capture the originating module(s) so audit

        tools can trace a component-level Promise back to its module sources.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.containerize;
        via=pipeline_v3.derive_promises
    - id: PR-d5d1d5f80917
      attribute: intent
      content: "pipeline_v3.derive_promises — Attribute derivation stage (T0.14 Phase\
        \ 6.2).\n\nConsumes :class:`ScanResult` from the scan stage and produces a\
        \ flat list\nof :class:`Promise` records. Each :class:`ScannedModule` contributes\
        \ three\nPromises, one per canonical scan-derived attribute:\n\n    - ``intent``\
        \    ← module docstring\n    - ``delivers``  ← sorted list of public function\
        \ names\n    - ``provides``  ← sorted list of public class names\n\nMissing\
        \ signals produce :class:`PromiseStatus.TYPED_GAP` Promises with\ntyped ``gap_type``\
        \ labels so downstream chain-closure can categorize the\ngap without ambiguity.\
        \ Owner entity is the module's dotted name (as\ncomputed by :func:`architecture_model.pipeline_v3.scan._dotted_name`).\n\
        \nDesign notes:\n    - \"Public\" = name does not start with underscore.\n\
        \    - `delivers`/`provides` content is sorted for deterministic hashing.\n\
        \    - The three attributes are emitted in a fixed order (intent, delivers,\n\
        \      provides) so per-module Promise ordering is stable independent of\n\
        \      dict-iteration order."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.derive_promises;
        via=pipeline_v3.derive_promises
    - id: PR-dd7407b25a01
      attribute: intent
      content: 'pipeline_v3.scan — Reality scan stage (T0.14 Phase 6.1).


        Delegates AST scanning to the existing :mod:`architecture_model.manifest`

        generator and lifts the result into a Promise-graph-friendly shape

        (:class:`ScanResult` / :class:`ScannedModule`) with deterministic ordering.


        This is intentionally a THIN bridge — the manifest module has full test

        coverage of AST semantics; duplicating that work would create drift.

        Later stages of pipeline_v3 consume the normalized shape without ever

        touching Manifest / ModuleInfo directly, so any future replacement of

        the scan backend is a local change.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.scan;
        via=pipeline_v3.derive_promises
    - id: PR-f19c4669b82e
      attribute: intent
      content: "pipeline_v3.orchestrator — Stage coordinator (T0.14 Phase 6.8).\n\n\
        Wires the seven pipeline_v3 stages into a single end-to-end run:\n\n    scan\
        \ → derive_promises → cluster → link → containerize → verify → publish\n\n\
        Exposes :func:`run_pipeline` and :class:`PipelineRunResult`. Every\nintermediate\
        \ artifact (scan, promises, clusters, links, model, verify\nreport, per-component\
        \ reports, publish result) is available on the\nreturned :class:`PipelineRunResult`\
        \ so downstream tooling can inspect\nany stage without re-running.\n\nDesign\
        \ intent\n-------------\n\nThe orchestrator is deliberately thin — a straight-line\
        \ composition of\nthe seven stage modules. Each stage remains independently\
        \ testable and\ncallable; the orchestrator adds convenience, not new semantics.\
        \ That\nchoice keeps failure isolation trivial: any bug lives in the stage\
        \ it\nbelongs to, not in a coordination layer.\n\nOptional flags\n--------------\n\
        \n- ``cluster_depth``: dotted-segment depth for clustering (default 3).\n\
        - ``project_name``: stamped into ``meta.project`` at publish time.\n- ``skip_publish``:\
        \ run every stage except publish; leave no artifact\n  on disk. Useful for\
        \ CI checks, tests, and in-memory workflows."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.orchestrator;
        via=pipeline_v3.derive_promises
