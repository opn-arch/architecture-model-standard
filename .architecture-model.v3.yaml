    - id: PR-c7b175dd4db6
      attribute: intent
      content: "Promise dataclass — Phase 1 of T0.14 (v3 bootstrap).\n\nA Promise\
        \ is the fundamental unit of Plan B's schema 3.0: every semantic\nfield on\
        \ a 2.1 entity (intent, goals, verification, ...) becomes a Promise\nrecord\
        \ with deterministic ID, delivery lineage, and verification evidence.\n\n\
        This module realizes COMP-PB-PROMISE-TYPE (see .architecture-model.plan-b.yaml\n\
        line 1655-1697). Round-trip serialization delegates to COMP-PB-PROMISE-PARSER\n\
        (TBD in a later task) but the core to_dict/from_dict lives here.\n\nShape\
        \ (locked in walk-instance #1 + T0.14 plan):\n\n    Promise(\n        id,\
        \               # PR-<sha1[:12]> deterministic\n        attribute,       \
        \ # semantic field name (intent, goals, ...)\n        content,          #\
        \ str | list[str], the promised value\n        owner_entity,     # entity\
        \ ID that owns this Promise\n        delivered_from,   # parent Promise ID\
        \ or None\n        verified_by,      # tuple[str, ...] verification IDs /\
        \ evidence refs\n        status,           # PromiseStatus enum\n        gap_type,\
        \         # str | None, only when status=TYPED_GAP\n        provenance,  \
        \     # source of this Promise (turn / walk / plan ref)\n    )\n\nInvariants\
        \ enforced at construction:\n    - status=TYPED_GAP  ⇒  gap_type is non-empty\n\
        \    - status!=TYPED_GAP ⇒  gap_type is None\n    - attribute and owner_entity\
        \ are non-empty\n    - id, when supplied, must match compute_promise_id(attribute,\
        \ content, owner)"
      owner_entity: COMP-1896b055
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.core.promise;
        via=pipeline_v3.derive_promises
