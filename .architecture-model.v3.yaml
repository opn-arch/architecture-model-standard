    - id: PR-5ced95e34cd5
      attribute: intent
      content: "ViewSpec contract: curated view over a ModelSlice, bound to a projector.\n\
        \nPurpose\n-------\nA ``ViewSpec`` names a *reproducible rendering intent*\
        \ over an immutable\n``ModelSlice`` revision. It answers \"which projector\
        \ + configuration should\nrender which slice, in what kind of output?\" A\
        \ ViewSpec is a **contract**,\nnot a rendered artifact — the actual ``DiagramSpec``\
        \ / prose / table is\nproduced by the projector at runtime (T16).\n\nInvariants\n\
        ----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\"\
        )``);\n  view specs are immutable value objects safe to share across threads.\n\
        * ``contract_version`` is pinned to :data:`SchemaVersions.VIEW_SPEC`.\n  Rejecting\
        \ a mismatch is intentional: bumping the version REQUIRES a\n  migration that\
        \ overrides the validator.\n* ``id`` is a slug (``[A-Za-z0-9._-]+``) — spaces\
        \ and empty strings are\n  rejected so view ids can be embedded in filenames\
        \ and URLs.\n* ``slice_ref.model_revision`` is REQUIRED and non-empty. A ViewSpec\
        \ is\n  bound to an *immutable slice revision*: without a revision the view\
        \ has\n  no reproducible input and thus no reproducible output. This is a\n\
        \  critical spec property; do not relax it.\n* ``projector`` is a non-empty\
        \ string. Registry membership is enforced at\n  runtime by the projector registry\
        \ (T16), not by the schema.\n* ``output_content_kind`` is one of ``diagram``/``prose``/``table``.\n\
        * The **digest** (see :func:`compute_view_spec_digest`) excludes\n  ``generated_at``\
        \ and ``signatures``: they are envelope metadata, not\n  content, and would\
        \ otherwise defeat content-addressing.\n\nThread safety\n-------------\nInstances\
        \ are frozen pydantic models. All functions in this module are\npure. Safe\
        \ for concurrent read access.\n\nError taxonomy\n--------------\nConstruction\
        \ failures raise :class:`pydantic.ValidationError` wrapping the\nunderlying\
        \ :class:`ValueError`. This module does not define custom\nexception types."
