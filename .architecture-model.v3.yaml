    - id: PR-d5e1fd6f38b7
      attribute: intent
      content: "Model/manifest revision pairing helpers.\n\nPurpose\n-------\nEnforce\
        \ an immutable one-to-one binding between an architecture model\nand its reality\
        \ manifest. A model captures intent (capabilities,\ncomponents, relationships);\
        \ a manifest captures ground truth (AST-derived\nmodules, functions, imports).\
        \ Because a model's meaning is anchored in\nthe manifest it was authored against,\
        \ the two artifacts must travel\ntogether and mutations to either must be\
        \ detectable.\n\nThis module supplies pure helpers to:\n\n* compute stable\
        \ content digests for models and manifests, excluding\n  volatile bookkeeping\
        \ fields;\n* stamp a matching pair with cross-references (``model.meta.manifest_digest``\n\
        \  and ``manifest.pairing.model_digest``);\n* verify that a given (model,\
        \ manifest) pair is still consistent.\n\nInvariants\n----------\n* **Idempotent\
        \ stamp.** ``stamp_pairing`` may be called on already-stamped\n  inputs and\
        \ produces the same digests, because pre-existing pointers are\n  stripped\
        \ before recomputation.\n* **Volatile fields excluded.** Timestamps and detached\
        \ signature blocks\n  do not participate in the digest, so re-serializing\
        \ or re-signing does\n  not break pairing.\n* **Content addressed.** Digests\
        \ are computed via the T2 canonical\n  serializer, so ``sha256-v1`` is the\
        \ algorithm tag stored in\n  ``manifest.pairing.algo``.\n\nNon-goals\n---------\n\
        * This module does **not** touch disk.\n* It does **not** wire into ``manifest.generator``\
        \ or ``core.parser``.\n  Future publishers may call these helpers; Phase 1\
        \ keeps them pure."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.pairing;
        via=pipeline_v3.derive_promises
    - id: PR-dce9df16bb5f
      attribute: intent
      content: "ArtifactSpec contract: renderable artifact bound to a view or bundle.\n\
        \nPurpose\n-------\nAn ``ArtifactSpec`` names a *renderable output* — SVG,\
        \ markdown, HTML, an\nAI context bundle, or a zip package aggregating other\
        \ artifacts. Each\nnon-zip artifact binds to exactly one :class:`ViewRef`\
        \ (a view + a pinned\nmodel revision), which in turn identifies the immutable\
        \ slice/model input.\nZip artifacts instead aggregate a list of sibling artifact\
        \ ids.\n\nAn ArtifactSpec is a **contract** (not a rendered payload) that\
        \ is\ncontent-addressable via :func:`compute_artifact_spec_digest`.\n\nMigration\
        \ note\n--------------\nThis module owns ``ArtifactSpec``. The prior owner\n\
        ``opencode_arch.artifacts.selector`` will become a compatibility import\n\
        shim in a follow-up (opencode-arch Phase 2). Downstream imports should\nbe\
        \ updated to ``architecture_model.lifecycle.artifact_spec``.\n\nInvariants\n\
        ----------\n* Frozen (``model_config = ConfigDict(frozen=True, extra=\"forbid\"\
        )``);\n  ArtifactSpec/ViewRef/SignatureSlot are immutable value objects safe\
        \ to\n  share across threads.\n* ``contract_version`` is pinned to :data:`SchemaVersions.ARTIFACT_SPEC`;\n\
        \  mismatch raises :class:`ValueError` (wrapped by pydantic).\n* ``id`` and\
        \ ``view_ref.view_id`` are slugs ``[A-Za-z0-9._-]+``. Each\n  entry of ``bundle_refs``\
        \ is also a slug.\n* ``renderer == \"zip\"`` iff ``bundle_refs`` is a non-empty\
        \ list of slugs\n  AND ``view_ref is None``.\n* ``renderer != \"zip\"`` iff\
        \ ``view_ref`` is present AND ``bundle_refs``\n  is either None or an empty\
        \ list.\n* ``view_ref.model_revision`` is REQUIRED and non-empty when a\n\
        \  ``view_ref`` is present: a rendered artifact is bound to an *immutable\n\
        \  revision* of its view input; otherwise reproducibility is lost.\n\nDigest\n\
        ------\n:func:`compute_artifact_spec_digest` excludes:\n\n* ``generated_at``\
        \ — envelope metadata (not content).\n* ``signature_slots[*].signature`` —\
        \ signature values are populated after\n  the digest is computed; the slot's\
        \ ``algorithm``/``key_id`` remain part\n  of the identity (they declare which\
        \ key is *expected* to sign).\n\nImplementation strategy: pre-strip ``signature``\
        \ fields in the payload\ncopy before delegating to\n``architecture_model.lifecycle.serialization.digest``\
        \ (which only\nsupports exclusion by exact key path, not glob-through-list).\
        \ This is\nexplicit and directly unit-testable.\n\nThread safety\n-------------\n\
        Instances are frozen pydantic models. All functions in this module are\npure.\
        \ Safe for concurrent read access.\n\nError taxonomy\n--------------\nConstruction\
        \ failures raise :class:`pydantic.ValidationError` wrapping\nthe underlying\
        \ :class:`ValueError`. This module does not define custom\nexception types."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.artifact_spec;
        via=pipeline_v3.derive_promises
