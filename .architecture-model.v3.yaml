    - id: PR-a823269d9eb1
      attribute: intent
      content: "ZIP bundle artifact renderer (T18 commit 2).\n\nPurpose\n-------\n\
        Aggregate multiple already-rendered artifact byte payloads into a single\n\
        deterministic ZIP archive, together with a ``manifest.json`` describing\n\
        the bundle contents and their sha256 digests.\n\nPurity contract\n---------------\n\
        Writes to an in-memory :class:`io.BytesIO` — no filesystem, network,\nenvironment,\
        \ or logging side effects.\n\nSignature difference\n--------------------\n\
        Unlike the per-view renderers (``svg``, ``markdown``, ``html``,\n``ai-context``),\
        \ :func:`render_zip` needs an out-of-band way to fetch\nthe bytes of each\
        \ sibling artifact named in ``artifact.bundle_refs``.\nIt therefore takes\
        \ a keyword-only ``resolve_artifact`` callable:\n\n    resolve_artifact(bundle_ref_id:\
        \ str) -> bytes\n\nIf ``resolve_artifact`` is ``None`` the renderer raises\n\
        :class:`ValueError`. If the callable returns ``None`` or raises\n:class:`KeyError`\
        \ for a given id, :class:`BundleResolutionError` (a\n:class:`ValueError` subclass)\
        \ is raised.\n\nRegistry entry\n--------------\n:func:`render_zip` is registered\
        \ under the ``\"zip\"`` key of\n:data:`architecture_model.lifecycle.renderers.DEFAULT_RENDERERS`\
        \ so\ncallers can discover it uniformly, but invoking it via the ordinary\n\
        ``(view, artifact)`` registry call signature will raise ``ValueError``\nbecause\
        \ ``resolve_artifact`` cannot be supplied that way. Phase 2\norchestrators\
        \ are expected to detect ``renderer == \"zip\"`` and invoke\n:func:`render_zip`\
        \ directly with the resolver.\n\nDeterminism\n-----------\n* Every ZipInfo\
        \ ``date_time`` is fixed to the ZIP epoch minimum\n  ``(1980, 1, 1, 0, 0,\
        \ 0)``.\n* Bundle entries and manifest ``bundles`` are sorted by id.\n* The\
        \ manifest ``produced_at`` timestamp is the only source of\n  nondeterminism\
        \ between calls; tests freeze\n  :func:`datetime.datetime.now` to compare\
        \ byte-identical output."
      owner_entity: COMP-3a28244a
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.lifecycle.renderers.zip;
        via=pipeline_v3.derive_promises
