    - id: PR-3b2d68bad421
      attribute: intent
      content: "pipeline_v3 — Promise-graph-native extraction pipeline (T0.14 Phase\
        \ 6).\n\nEight-stage pipeline consuming a repo and producing a v3 architecture\n\
        model (Promise-graph + entities + relationships):\n\n    scan -> derive_promises\
        \ -> cluster -> link -> containerize\n         -> verify -> publish\n    (orchestrated\
        \ by orchestrator)\n\nEach stage is a self-contained module with its own tests.\
        \ Intermediate\ndata types flow between stages via typed dataclasses; no stage\
        \ reaches\nback into a previous stage's internals."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3;
        via=pipeline_v3.derive_promises
    - id: PR-3d7d90ccd172
      attribute: intent
      content: 'pipeline_v3.substrate.cache — Content-addressed cache.


        Stages that pass the same input twice within a run should get identical

        outputs. This cache memoizes stage outputs by a content hash of the

        input, scoped by stage name and run id.


        Not persistent — lives for the duration of a Pipeline run. Persistent

        caching (across runs) is a Part 5+ concern and lives elsewhere.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.substrate.cache;
        via=pipeline_v3.derive_promises
    - id: PR-40a8e09b9e5a
      attribute: intent
      content: 'pipeline_v3.substrate.stage — Stage protocol + result types.


        A Stage is a pure function ``run(input, ctx) -> output``. Inputs and

        outputs are stage-specific; the substrate stays type-neutral. Stages

        compose into Pipelines that thread outputs through.


        `wrap_function` lifts an existing plain function (like the pipeline_v3

        stage functions ``scan_repo``, ``cluster_modules``, etc.) into a Stage

        with a declared name and optional input adapter.'
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.pipeline_v3.substrate.stage;
        via=pipeline_v3.derive_promises
    - id: PR-450a599d9bce
      attribute: intent
      content: "pipeline_v3.slice — v3-native slicer (T0.14 Phase 9).\n\nProduces\
        \ token-budgeted focused views over a v3 model dict. Two entry\npoints:\n\n\
        - :func:`slice_by_component` — target component + optional 1-hop\n  neighborhood,\
        \ with relationships filtered to edges wholly inside\n  the retained set.\n\
        - :func:`slice_by_promise` — owner component narrowed to a single\n  promise,\
        \ with relationships dropped (promise-scoped views don't\n  need the component\
        \ graph).\n\nSizing concern was deliberately deferred from earlier phases\
        \ (per\nplan Phase 9 — \"premature optimization would have distorted schema\n\
        decisions\"). Now that the v3 shape is locked, slicing is a pure\ndict → dict\
        \ transform: deterministic, side-effect-free, safe for\ndownstream LLM prompts\
        \ and doc projectors.\n\nBoth functions:\n\n- Preserve ``meta.schema_version``\
        \ and other meta keys.\n- Deep-copy the retained components (original model\
        \ is never mutated).\n- Add ``meta.sliced_from`` = original project name.\n\
        - Add ``meta.slice_spec`` = ``{\"kind\", \"target\"}`` provenance."
      owner_entity: COMP-c5a72728
      delivered_from: null
      verified_by: []
