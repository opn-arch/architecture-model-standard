    - id: PR-026a2bc04580
      attribute: intent
      content: 'Typed AI proposal contracts.


        One dataclass per :class:`ProposalKind`. Each proposal carries mandatory

        :class:`Provenance` linking it back to the originating work order and the

        model revision + prompt the agent was given.


        Serialization: every proposal exposes ``to_dict`` / ``from_dict`` with a

        top-level ``kind`` discriminator; :func:`proposal_from_dict` dispatches

        on that value using :data:`PROPOSAL_TYPES`.'
      owner_entity: COMP-88e48294
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.ai.proposals;
        via=pipeline_v3.derive_promises
    - id: PR-7783c16694e4
      attribute: intent
      content: 'AI contracts: work orders and proposals for architecture-model reasoning.'
      owner_entity: COMP-88e48294
      delivered_from: null
