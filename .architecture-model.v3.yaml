    - id: PR-1527db2216ea
      attribute: intent
      content: 'Append-only ``.architecture/drift.jsonl`` writer (Phase 2 Task 16).


        Records a full drift snapshot per model revision as a single JSONL line.

        A snapshot bundles all currently-flagged drift issues (orphans, missing

        implementations, unrealized capabilities, broken references) so consumers

        can reconstruct historical drift state per revision without cross-line

        correlation.


        Atomicity and determinism follow the same conventions as

        :mod:`architecture_model.feedback.gates` — ``O_APPEND`` + ``fsync``,

        ``AMS_DETERMINISTIC_NOW`` honored for the snapshot timestamp when

        omitted at construction time.'
      owner_entity: COMP-37133896
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.feedback.drift;
        via=pipeline_v3.derive_promises
    - id: PR-3670fd3e3d41
      attribute: intent
      content: 'Append-only ``.architecture/gates.jsonl`` writer (Phase 2 Task 15).


        Records the outcome of every :func:`architect_gate` invocation as a single

        JSONL line. The journal is diagnostic, not authoritative: callers should

        NOT fail user-visible operations if :func:`append` raises.


        Atomicity

        ---------

        Writes use ``O_APPEND`` with an explicit ``fsync``. On POSIX, ``write()``

        to an ``O_APPEND`` file descriptor is atomic for line-sized payloads

        (≤ ``PIPE_BUF``, ≥ 4 KiB on Linux/macOS) — concurrent writers cannot

        interleave partial lines. The plan called for a "tmp + rename" pattern

        but that is inherently incompatible with append semantics ("never

        truncates"); ``O_APPEND`` is the standard, portable answer.


        Directory creation is idempotent — the ``.architecture/`` directory is

        created on demand (``parents=True, exist_ok=True``). Existing sibling

        files (``sil.sqlite`` etc.) are never touched.


        Determinism

        -----------

        Timestamps come from :func:`_now_iso` which honors

        ``AMS_DETERMINISTIC_NOW`` — see the same helper in

        ``architecture_model.sil.rollup`` for the established convention.'
      owner_entity: COMP-37133896
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.feedback.gates;
        via=pipeline_v3.derive_promises
    - id: PR-3ec837d43afe
      attribute: intent
      content: "Append-only feedback journals for lifecycle events.\n\nThe ``feedback``\
        \ subpackage owns three JSONL journals under\n``<repo>/.architecture/``:\n\
        \n* ``gates.jsonl`` — one line per :class:`~architecture_model.feedback.gates.GateEvent`\n\
        \  (Task 15).\n* ``drift.jsonl`` — one line per :class:`~architecture_model.feedback.drift.DriftSnapshot`\n\
        \  (Task 16).\n* ``test_results.jsonl`` — one line per :class:`~architecture_model.feedback.test_results.TestResultBatch`\n\
        \  (Task 17).\n\nAll writers are append-only and atomic-safe (write to a temp\
        \ file in the\nsame directory, then rename over the target — POSIX rename\
        \ is atomic on\nthe same filesystem). Journals are diagnostic, not authoritative:\
        \ callers\nmust not fail user-visible operations if a journal write raises."
      owner_entity: COMP-37133896
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.feedback; via=pipeline_v3.derive_promises
    - id: PR-bac84b2b8cd5
      attribute: intent
      content: "Append-only ``.architecture/llm_calls.jsonl`` writer (CAP-DF Part\
        \ 15).\n\nRecords every LLM invocation as a single JSONL line for consumption\
        \ by\nthe ``prompt_refiner`` meta-walk. Mirrors the pattern established by\n\
        ``feedback/gates.py`` and ``feedback/drift.py``:\n\n* Atomic append via ``O_APPEND\
        \ | O_CREAT | O_WRONLY`` + ``fsync``.\n* Fail-soft — journal write errors\
        \ NEVER propagate to caller.\n* Deterministic ``_now_iso`` (honors ``AMS_DETERMINISTIC_NOW``).\n\
        \nThe wire format wraps the existing ``LLMCallRecord`` dataclass fields\n\
        plus two optional CAP-DF Part 13/14 additions:\n\n* ``endpoint_id`` — the\
        \ deterministic id from\n  ``.architecture/llm/endpoints.yaml`` (Part 13).\n\
        * ``task_class`` — the routing task class (Part 14).\n\nBoth are empty strings\
        \ by default so existing callers that emit bare\n``LLMCallRecord`` objects\
        \ work unchanged."
      owner_entity: COMP-37133896
      delivered_from: null
      verified_by: []
      status: open
      gap_type: null
      provenance: pipeline_v3.containerize; src=src.architecture_model.feedback.llm_calls;
        via=pipeline_v3.derive_promises
    - id: PR-e6b4b258d1f8
      attribute: intent
      content: 'JUnit-XML ingest → :class:`TestResultBatch` (Phase 2 Task 17).


        Parses a standard JUnit XML file (as produced by ``pytest --junit-xml``,

        ``mvn test``, ``go test -v -json | ...``, etc.) into a

        :class:`~architecture_model.feedback.test_results.TestResultBatch` ready

        to hand to :func:`architecture_model.feedback.test_results.append`.


        Only stdlib :mod:`xml.etree.ElementTree` is used — no external deps.


        JUnit dialect notes

        -------------------

        Both single ``<testsuite>`` and wrapping ``<testsuites>`` roots are

        accepted. Attributes (``tests``, ``failures``, ``errors``, ``skipped``,

        ``time``) are all optional; missing counters default to 0 and are then

        consistency-checked (see :func:`ingest_junit`). ``<error>`` children on

        a test case are treated as failures for the purposes of the roll-up

        (the shape spec has no ``errored`` field yet); the failure message

        carries the child element''s tag as a hint.'
      owner_entity: COMP-37133896
      delivered_from: null
