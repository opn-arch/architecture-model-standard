[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architecture-model-standard"
version = "0.1.0"
description = "Universal machine-readable YAML architecture model for LLM-driven system engineering"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]
training = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "datasets>=2.19",
    "litellm>=1.40",
    "aiohttp>=3.9",
    "numpy>=1.26",
]

[project.scripts]
architecture-model = "architecture_model.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
