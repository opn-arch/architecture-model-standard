[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "architecture-model-standard"
version = "1.0.0"
description = "Universal machine-readable YAML architecture model for LLM-driven system engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]
license = "MIT"
authors = [{name = "Architecture Model Contributors"}]
keywords = ["architecture", "model", "llm", "code-generation", "ast"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/opn-arch/architecture-model-standard"
Repository = "https://github.com/opn-arch/architecture-model-standard"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.scripts]
architecture-model = "architecture_model.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/architecture_model"]

[tool.hatch.build.targets.sdist]
exclude = [".venv*", "*.egg-info", ".git", "__pycache__", "packages/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
