entity-platform:
  description: "Platform adapter exposing domain devices as HA entities"
  indicators:
    - "class *Entity"
    - "async_setup_entry"
    - "PLATFORM_SCHEMA"
  typical_files: 1-2
  contract_template: "Exposes {domain} devices as HA {entity_type} entities"

config-flow:
  description: "Multi-step user configuration wizard"
  indicators:
    - "class *FlowHandler(ConfigFlow)"
    - "async_step_user"
    - "async_step_confirm"
  typical_files: 1
  contract_template: "Guides user through {integration} setup via UI steps"

event-handler:
  description: "Subscribes to events and dispatches actions"
  indicators:
    - "async_track_"
    - "@callback"
    - "hass.bus.async_listen"
    - "on"
    - "emit"
    - "subscribe"
    - "publish"
    - "listener"
    - "EventBus"
    - "EventEmitter"
  typical_files: 1
  contract_template: "Reacts to {event_type} events by {action}"

data-class:
  description: "Pure data container with validation"
  indicators:
    - "@dataclass"
    - "TypedDict"
    - "NamedTuple"
    - "BaseModel"
    - "Schema"
    - "fields"
  typical_files: 1
  contract_template: "Holds {domain} data with {validation_type} validation"

adapter:
  description: "Translates between two interfaces/protocols"
  indicators:
    - "client"
    - "async_connect"
    - "parse_"
    - "serialize_"
    - "Client"
    - "connect"
    - "request"
    - "submit"
    - "call"
  typical_files: 1-2
  contract_template: "Translates between {source_protocol} and {target_protocol}"

repository:
  description: "Persistence layer abstracting storage"
  indicators:
    - "async_save"
    - "async_load"
    - "Store"
    - "async_get"
  typical_files: 1
  contract_template: "Persists {entity} data to {storage_backend}"

state-machine:
  description: "Manages explicit state transitions"
  indicators:
    - "STATE_"
    - "transition"
    - "_state"
    - "async_set_state"
    - "State"
    - "Enum"
    - "status"
    - "PENDING"
    - "RUNNING"
    - "COMPLETED"
    - "FAILED"
  typical_files: 1-2
  contract_template: "Manages {entity} lifecycle through states: {state_list}"

registry:
  description: "Central lookup/registration for typed entries"
  indicators:
    - "register"
    - "_registry"
    - "async_get_"
    - "DATA_"
    - "unregister"
    - "registry"
    - "Registry"
    - "lookup"
  typical_files: 1
  contract_template: "Registers and resolves {entry_type} by {key_type}"

message-transformer:
  description: "Parses, validates, and transforms messages"
  indicators:
    - "payload"
    - "decode"
    - "encode"
    - "schema"
    - "serialize"
    - "deserialize"
    - "Message"
    - "marshal"
    - "unmarshal"
  typical_files: 1
  contract_template: "Transforms {input_format} messages into {output_format}"

reconnecting-client:
  description: "Network client with automatic reconnection"
  indicators:
    - "async_connect"
    - "reconnect"
    - "_disconnect"
    - "backoff"
  typical_files: 1-2
  contract_template: "Maintains persistent connection to {service} with auto-reconnect"

worker:
  description: "Executes tasks/jobs in a pool with concurrency control"
  indicators:
    - "execute"
    - "Worker"
    - "Pool"
    - "idle"
    - "busy"
    - "capacity"
    - "task"
  typical_files: 1-3
  contract_template: "Executes {task_type} tasks with concurrency limits"

handler:
  description: "Handles specific commands/events/requests via dispatch"
  indicators:
    - "handle_"
    - "Handler"
    - "dispatch"
    - "process"
    - "command"
  typical_files: 1-2
  contract_template: "Handles {domain} requests via pluggable dispatch"

monitor:
  description: "Observes system health, collects metrics, triggers alerts"
  indicators:
    - "Metrics"
    - "record"
    - "alert"
    - "health"
    - "heartbeat"
    - "alive"
    - "dashboard"
  typical_files: 1-3
  contract_template: "Monitors {target} health and triggers alerts on anomalies"

queue:
  description: "FIFO/priority queue for ordered processing"
  indicators:
    - "Queue"
    - "push"
    - "pop"
    - "enqueue"
    - "dequeue"
    - "peek"
    - "priority"
  typical_files: 1
  contract_template: "Manages ordered {item_type} processing via {queue_type} queue"

parser:
  description: "Parses structured input into internal representations"
  indicators:
    - "parse"
    - "token"
    - "lexer"
    - "grammar"
    - "syntax"
    - "visitor"
    - "tokenize"
    - "ast_node"
  typical_files: 1-3
  contract_template: "Parses {input_format} into {output_structure}"

middleware:
  description: "Intercepts request/response flow in a processing chain"
  indicators:
    - "middleware"
    - "before_request"
    - "after_request"
    - "intercept"
    - "pre_process"
    - "post_process"
    - "request_hook"
    - "response_hook"
  typical_files: 1-2
  contract_template: "Intercepts {flow_type} to apply {concern}"

serializer:
  description: "Converts objects to/from wire or storage formats"
  indicators:
    - "serializer"
    - "deserializer"
    - "encoder"
    - "decoder"
    - "to_json"
    - "from_json"
    - "to_dict"
    - "from_dict"
    - "dump_model"
    - "load_model"
    - "encode_content"
    - "encode_json"
    - "encode_request"
    - "encode_response"
  typical_files: 1-2
  contract_template: "Serializes {domain} objects to/from {format}"

cli:
  description: "Command-line interface with commands and arguments"
  indicators:
    - "command"
    - "argument"
    - "option"
    - "subcommand"
    - "cli_group"
    - "invoke"
    - "param"
    - "argparse"
    - "click"
  typical_files: 1-5
  contract_template: "Provides CLI for {domain} operations"

router:
  description: "Routes requests to appropriate handlers by path or key"
  indicators:
    - "route"
    - "router"
    - "endpoint"
    - "add_route"
    - "include_router"
    - "url_for"
    - "path_param"
    - "dispatch_route"
  typical_files: 1-3
  contract_template: "Routes {request_type} requests to handlers by {routing_key}"

validator:
  description: "Validates input against rules or schemas"
  indicators:
    - "validate"
    - "validator"
    - "is_valid"
    - "assert_valid"
    - "constraint"
    - "field_validator"
    - "check_value"
    - "validation_error"
  typical_files: 1-2
  contract_template: "Validates {input_type} against {rule_set}"

factory:
  description: "Creates configured instances via builder or factory methods"
  indicators:
    - "factory"
    - "builder"
    - "from_config"
    - "instantiate"
    - "create_instance"
    - "build_from"
    - "make_instance"
  typical_files: 1-2
  contract_template: "Creates {product_type} instances from {config_source}"

decorator-pattern:
  description: "Wraps functions or classes to add cross-cutting behavior"
  indicators:
    - "decorator"
    - "wrapper"
    - "wraps"
    - "decorate"
    - "wrap_function"
    - "before_call"
    - "after_call"
    - "functools"
  typical_files: 1-2
  contract_template: "Decorates {target} to add {behavior}"

transport:
  description: "Network I/O layer handling send/receive of data"
  indicators:
    - "transport"
    - "handle_request"
    - "handle_async_request"
    - "connection_pool"
    - "send_request"
    - "receive_response"
    - "open_connection"
    - "close_connection"
    - "aclose"
  typical_files: 1-3
  contract_template: "Handles network I/O for {protocol} communication"

plugin:
  description: "Extensible plugin/hook registration system"
  indicators:
    - "plugin"
    - "extension"
    - "load_plugin"
    - "entry_point"
    - "addon"
    - "plugin_manager"
    - "hook_impl"
    - "get_plugin"
    - "completion_class"
    - "add_completion"
    - "get_completion"
  typical_files: 1-3
  contract_template: "Manages {plugin_type} plugins via {loading_mechanism}"

pipeline:
  description: "Sequential processing through ordered stages"
  indicators:
    - "pipeline"
    - "stage"
    - "pipe"
    - "add_stage"
    - "run_pipeline"
    - "process_step"
    - "transform_step"
    - "chain"
  typical_files: 1-3
  contract_template: "Processes {input_type} through {stage_count} sequential stages"

formatter:
  description: "Formats or renders data for display or output"
  indicators:
    - "format_output"
    - "formatter"
    - "render"
    - "pretty_print"
    - "format_help"
    - "style_text"
    - "ansi"
    - "template"
    - "wrap_text"
    - "indent"
    - "dedent"
  typical_files: 1-2
  contract_template: "Formats {data_type} for {output_target}"
