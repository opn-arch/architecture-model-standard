    kind: library
    intent: Provide the code-to-model backward pass that derives architecture entities and relationships from AST scanning, import graphs, and project configuration
    goals:
    - Extract complete entity sets (actors, capabilities, components, layers, interfaces, constraints) from source code
    - Detect HTTP/CLI routes and map them to interfaces automatically
    - Identify constraints (security, performance, compatibility) from code patterns and comments
