      body_hint: "tables: list[list[dict[str, str]]] = []; lines = markdown.split('\\n'); i = 0; while i < len(lines):\n \
        \   if '|' in lines[i]:\n        header_line = lines[i].strip()\n        if i + 1 < len(lines) and re.match('^\\\\\
        s*\\\\|[\\\\s\\\\-:|]+\\\\|\\\\s*$', lines[i + 1]):\n            headers = _parse_row(header_line)\n            if\
        \ headers:\n                table_rows: list[dict[str, str]] = []\n                i += 2\n                while i\
        \ < len(lines) and '|' in lines[i]:\n                    row_line = lines[i].strip()\n                    if re.match('^\\\
        \\s*\\\\|[\\\\s\\\\-:|]+\\\\|\\\\s*$', row_line):\n                        i += 1\n                        continue\n\
        \                    values = _parse_row(row_line)\n                    if values:\n                        row_dict\
        \ = {}\n                        for idx, h in enumerate(headers):\n                            key = _normalize_header(h)\n\
        \                            row_dict[key] = values[idx] if idx < len(values) else ''\n                        table_rows.append(row_dict)\n\
        \                    i += 1\n                if table_rows:\n                    tables.append(table_rows)\n     \
        \           continue\n    i += 1; return tables"
