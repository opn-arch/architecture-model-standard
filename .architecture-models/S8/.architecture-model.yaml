    trade_offs:
    - AST-only analysis misses runtime-dynamic registrations vs. static completeness is simpler and faster
    - Single-pass extraction vs. iterative refinement — speed over precision for initial model
    - Python-only AST support vs. multi-language — focused quality over broad coverage
    failure_modes:
    - Malformed or syntax-error Python files cause AST parse failures, skipping those modules silently
    - Circular imports between extracted modules may produce duplicate relationship entries
    - Projects with no clear package structure yield flat component graphs with poor layer allocation
