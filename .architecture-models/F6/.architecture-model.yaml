  - id: BEH-ENRICH-TESTS
    name: Test Contract Enrichment
    status: ACTIVE
    description: Discover test files via 7 naming conventions and extract contracts
    trigger: enrich_model
    preconditions:
    - 'comp: Component'
    - 'root: Path'
    postconditions:
    - 'Returns: None'
    steps:
    - Compute existing_methods
    - test_files = _discover_test_files()
    - Iterate over test_files
  - id: BEH-ORCH-FIND-COMPS
    name: Find Block Components
    status: ACTIVE
    description: Find all components belonging to an F-block
    trigger: decompose_model
    postconditions:
    - return result
    steps:
    - Compute result
    - block_files_set = set()
    - Iterate over model.entities.components
    - Return result
  - id: BEH-ORCH-FIND-PARENT
    name: Find Parent Component
    status: ACTIVE
    description: Locate parent component for a block's component hierarchy
    trigger: decompose_model
    postconditions:
    - return (None, None)
    - return (block_components[0].id, block_components[0])
    - return (parent_id, parent_comp)
    steps:
    - Compute block_ids
    - Iterate over model.relationships
    - Check len(block_components) == 1
    - Return (None, None)
  - id: BEH-ORCH-TRACE
    name: Trace Entities
    status: ACTIVE
    description: Trace relationships to find connected capabilities, interfaces, behaviors, constraints
    trigger: decompose_model
    postconditions:
    - return (caps, ifaces, behaviors, constraints)
    steps:
    - cap_ids = set()
    - iface_ids = set()
    - behavior_ids = set()
    - constraint_ids = set()
    - Iterate over model.relationships
    - Compute caps
    - Compute ifaces
    - Compute behaviors
    - Compute constraints
    - Return (caps, ifaces, behaviors, constraints)
  - id: BEH-ORCH-COLLECT-RELS
    name: Collect Relationships
    status: ACTIVE
    description: Collect internal and boundary relationships for sub-model
    trigger: decompose_model
    postconditions:
    - return rels
    steps:
