entities:
  capabilities:
  - id: CAP-F10
    name: Auto-Enrichment
    status: ACTIVE
    description: Populate signatures, constants, and test_contracts from AST scanning
    f_block: F6
  behaviors:
  - id: BEH-ENRICH
    name: Auto-Enrichment
    status: ACTIVE
    description: Enrich architecture model with function signatures, constants, and test contracts from AST
  - id: BEH-ENRICH-SIGS
    name: Signature Enrichment
    status: ACTIVE
    description: Extract function signatures from AST and add to components
    trigger: enrich_model
    preconditions:
