meta:
  schema_version: '2.0'
  project: architecture-model-standard/orchestration
  system: Orchestration
  generated_at: '2026-07-21T23:13:19.373805+00:00'
entities:
  actors:
  - id: ACT-CLI
    name: CLI / Pipeline Runner
    status: ACTIVE
    description: External caller that invokes enrich_model() and decompose_model() entry points, typically via CLI commands
      or pipeline scripts.
    type: human
  - id: ACT-CORE
    name: Core Subsystem
    status: ACTIVE
    description: External dependency providing ArchitectureModel types, parser (load_model, save_model, _parse_behavior),
      and relationship types.
    type: human
  - id: ACT-MANIFEST
    name: Manifest Subsystem
    status: ACTIVE
    description: 'External dependency providing AST scanning utilities: extract_file_hints (body_hints) and analyze_test_file
      (test_analyzer).'
    type: human
  - id: ACT-CONFIG
    name: Config Subsystem
    status: ACTIVE
    description: External dependency providing get_config() which returns project configuration with fblock_dict for decomposition.
    type: human
  capabilities:
  - id: CAP-ENRICH
    name: Model Enrichment
    status: ACTIVE
    description: Populate components with AST-derived function signatures, module-level constants, and test contracts by scanning
      source and test files.
  - id: CAP-DECOMPOSE
    name: Model Decomposition
    status: ACTIVE
    description: Generate per-F-block sub-models by tracing parent model relationships (realizes, exposes, traces-to, constrained-by)
      outward from block components.
  - id: CAP-WRITE
    name: Sub-Model Persistence
    status: ACTIVE
    description: Write generated sub-models to disk as YAML files in a structured directory layout (output_dir/<block_id>/.architecture-model.yaml).
  behaviors:
  - id: BEH-ENRICH
    name: Enrich Model Workflow
    status: ACTIVE
    description: 'For each ACTIVE component with files: extract function signatures via extract_file_hints, extract uppercase
      constants via ast.literal_eval, and discover + analyze test files to populate test_contracts.'
    steps:
    - Iterate ACTIVE components with non-empty files
    - Call _enrich_signatures to extract public function hints
    - Call _enrich_constants to extract uppercase module-level assignments
    - Call _enrich_test_contracts to discover and analyze test files
  - id: BEH-ENRICH-SIG
    name: Enrich Signatures
    status: ACTIVE
    description: Extract public function signatures from each source file using extract_file_hints(path, include_private=False).
      Deduplicates by name.
  - id: BEH-ENRICH-CONST
    name: Enrich Constants
    status: ACTIVE
    description: Parse each source file's AST, find module-level Assign nodes with uppercase Name targets, extract values
      via ast.literal_eval (falling back to ast.unparse), and append Constant objects.
  - id: BEH-ENRICH-TEST
    name: Enrich Test Contracts
    status: ACTIVE
    description: Discover test files via 7 naming conventions (test_{module}.py, test_{package}/test_{module}.py, {module}_test.py,
      etc.), then analyze each with analyze_test_file() to extract TestContract objects.
  - id: BEH-DECOMPOSE
    name: Decompose Model Workflow
    status: ACTIVE
    description: Load parent model, iterate F-blocks from config, find block components by file path matching, trace relationships
      to connected entities, collect internal + boundary relationships, build sub-model, inject sub-behaviors from sub-behaviors.yaml.
    steps:
    - Load parent .architecture-model.yaml
    - Get config with fblock_dict
    - For each F-block find components via _find_block_components
    - Find parent component via _find_parent_component
    - Trace entities via _trace_entities (realizes/exposes/traces-to/constrained-by)
    - Collect relationships via _collect_relationships
    - Build ArchitectureModel sub-model
    - Inject sub-behaviors from sub-behaviors.yaml
  - id: BEH-INJECT
    name: Inject Sub-Behaviors
    status: ACTIVE
    description: Read sub-behaviors.yaml, match behaviors to sub-model components, parse behavior entries, create contains
      and traces-to relationships, and inject triggers relationships for cross-block flows.
  - id: BEH-WRITE
    name: Write Sub-Models
    status: ACTIVE
    description: For each block_id/model pair, create block_dir, write .architecture-model.yaml via save_model().
  interfaces:
  - id: IFC-ENRICH
    name: enrich_model()
    status: ACTIVE
    description: 'enrich_model(model: ArchitectureModel, project_root: Path) -> ArchitectureModel. Mutates model in-place
      and returns it.'
    type: internal
  - id: IFC-DECOMPOSE
    name: decompose_model()
    status: ACTIVE
    description: 'decompose_model(project_root: Path) -> dict[str, ArchitectureModel]. Returns mapping of block_id to sub-model.'
    type: internal
  - id: IFC-WRITE
    name: write_sub_models()
    status: ACTIVE
    description: 'write_sub_models(sub_models: dict, output_dir: Path) -> list[Path]. Writes sub-models to disk, returns list
      of written paths.'
    type: internal
  - id: IFC-EXT-HINTS
    name: extract_file_hints (external)
    status: ACTIVE
    description: Consumed from architecture_model.manifest.body_hints. Extracts function signatures from a source file.
    type: internal
  - id: IFC-EXT-TEST
    name: analyze_test_file (external)
    status: ACTIVE
    description: Consumed from architecture_model.manifest.test_analyzer. Analyzes a test file and returns contracts.
    type: internal
  - id: IFC-EXT-PARSER
    name: load_model / save_model (external)
    status: ACTIVE
    description: Consumed from architecture_model.core.parser. Loads and saves architecture models from/to YAML files.
    type: internal
  - id: IFC-EXT-CONFIG
    name: get_config (external)
    status: ACTIVE
    description: Consumed from architecture_model.config.loader. Returns project configuration with fblock_dict.
    type: internal
  constraints:
  - id: CON-DEDUP
    name: Deduplication Invariant
    status: ACTIVE
    description: All enrichment operations track existing names/methods in sets and skip duplicates, ensuring idempotent enrichment.
    type: technology
  - id: CON-ACTIVE-ONLY
    name: Active Components Only
    status: ACTIVE
    description: Enrichment only processes components with status ACTIVE, skipping deprecated or inactive components.
    type: technology
  - id: CON-FAITHFUL
    name: Faithful Slice Constraint
    status: ACTIVE
    description: Decomposition produces sub-models from the parent model's actual entities via relationship tracing — no entities
      are invented.
    type: technology
  components:
  - id: COMP-ENRICH
    name: enrich
    status: ACTIVE
    description: Enrichment module providing enrich_model() and internal helpers for signature, constant, and test contract
      extraction.
    files:
    - src/architecture_model/orchestration/enrich.py
    signatures:
    - name: enrich_model
      params:
      - 'model: ArchitectureModel'
      - 'project_root: Path'
      returns: ArchitectureModel
      body_hint: "components = model.entities.get('components', []) if isinstance(model.entities, dict) else model.entities.components;\
        \ for comp in components:\n    if _enum_str(comp.status) != 'ACTIVE':\n        continue\n    if not comp.files:\n\
        \        continue\n    _enrich_signatures(comp, project_root)\n    _enrich_constants(comp, project_root)\n    _enrich_test_contracts(comp,\
        \ project_root); return model"
    test_contracts:
    - test_file: test_enrich.py
      test_method: test_enrich_skips_planned_components
      assertion: len(c.signatures) == 0
      contract_type: value_equality
    - test_file: test_enrich.py
      test_method: test_enrich_handles_missing_files
      assertion: len(c.signatures) == 0
      contract_type: value_equality
  - id: COMP-DECOMPOSE
    name: decompose
    status: ACTIVE
    description: Decomposition module providing decompose_model(), write_sub_models(), and internal helpers for component
      finding, entity tracing, relationship collection, and sub-behavior injection.
    files:
    - src/architecture_model/orchestration/decompose.py
    signatures:
    - name: decompose_model
      params:
      - project_root
      body_hint: "model = load_model(project_root / '.architecture-model.yaml'); config = get_config(project_root); results\
        \ = {}; for block_id, block_def in config.fblock_dict.items():\n    block_name = block_def.get('name', block_id)\n\
        \    block_dirs = block_def.get('dirs', [])\n    block_files = block_def.get('files', [])\n    logger.info('Decomposing\
        \ %s: %s', block_id, block_name)\n    components = _find_block_components(model, block_dirs, block_files)\n    if\
        \ not components:\n        logger.warning('No components found for %s (dirs: %s)', block_id, block_dirs)\n       \
        \ continue\n    parent_comp_id, parent_comp = _find_parent_component(model, components)\n    comp_ids = {c.id for\
        \ c in components}\n    if parent_comp and parent_comp.id not in comp_ids:\n        components = [parent_comp] + components\n\
        \        comp_ids.add(parent_comp.id)\n    block_comp_ids = comp_ids.copy()\n    capabilities, interfaces, behaviors,\
        \ constraints = _trace_entities(model, block_comp_ids)\n    all_entity_ids = block_comp_ids.copy()\n    all_entity_ids.update((c.id\
        \ for c in capabilities))\n    all_entity_ids.update((i.id for i in interfaces))\n    all_entity_ids.update((b.id\
        \ for b in behaviors))\n    all_entity_ids.update((c.id for c in constraints))\n    relationships = _collect_relationships(model,\
        \ all_entity_ids, block_comp_ids)\n    sub_model = ArchitectureModel(meta=ModelMeta(schema_version='2.0', project=f'{model.meta.project}/{block_name}',\
        \ system=block_name, generated_at=model.meta.generated_at, parent_model='../../.architecture-model.yaml', refines_component=parent_comp_id\
        \ or ''), entities=Entities(components=components, capabilities=capabilities, interfaces=interfaces, behaviors=behaviors,\
        \ constraints=constraints), relationships=relationships)\n    sub_behaviors_path = project_root / '.architecture-models'\
        \ / 'sub-behaviors.yaml'\n    _inject_sub_behaviors(sub_model, sub_behaviors_path)\n    results[block_id] = sub_model\n\
        \    logger.info('  %s: %d comps, %d caps, %d ifaces, %d behaviors, %d constraints, %d rels', block_id, len(components),\
        \ len(capabilities), len(interfaces), len(behaviors), len(constraints), len(relationships)); return results"
    - name: write_sub_models
      params:
      - sub_models
      - output_dir
      body_hint: "written = []; for block_id, model in sub_models.items():\n    block_dir = output_dir / block_id\n    block_dir.mkdir(parents=True,\
        \ exist_ok=True)\n    out_path = block_dir / '.architecture-model.yaml'\n    save_model(model, out_path)\n    written.append(out_path)\n\
        \    logger.info('Wrote sub-model: %s', out_path); return written"
    test_contracts:
    - test_file: test_decompose.py
      test_method: test_decompose_meta_links_to_parent
      assertion: sub.meta.parent_model == '../../.architecture-model.yaml'
      contract_type: value_equality
    - test_file: test_decompose.py
      test_method: test_write_sub_models
      assertion: data['meta']['parent_model'] == '../../.architecture-model.yaml'
      contract_type: value_equality
    - test_file: test_decompose.py
      test_method: test_decompose_cli
      assertion: ret == 0
      contract_type: value_equality
  - id: COMP-INIT
    name: Package Init
    status: ACTIVE
    description: Package entry point re-exporting enrich_model, decompose_model, and write_sub_models.
    files:
    - src/architecture_model/orchestration/__init__.py
