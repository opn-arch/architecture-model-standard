meta:
  schema_version: '2.0'
  project: architecture-model-standard/Utils
  system: Utils
  generated_at: '2026-08-06T21:52:00'
  manifest_path: manifest.json
  parent_model: ../../.architecture-model.yaml
  refines_component: COMP-UTILS
entities:
  components:
  - id: COMP-UTILS
    name: Utils
    status: ACTIVE
    description: 'Shared utilities: file discovery with exclusion patterns'
    layer: LAYER-INFRA
    source_block: S14
    technology: python
    files:
    - src/architecture_model/utils/discovery.py
    responsibilities:
    - Collect Python files respecting exclusion patterns
    - Define EXCLUDED_DIRS constant
    kind: library
    signatures:
    - name: is_excluded_dir
      params:
      - 'path: Path'
      returns: bool
      body_hint: name = path.name; return name in EXCLUDED_DIRS or name.startswith('.')
    - name: collect_py_files
      params:
      - 'directory: Path'
      - 'recursive: bool'
      - 'exclude_init: bool'
      returns: list[Path]
      body_hint: "if not directory.is_dir():\n    logger.debug('Directory does not exist: %s', directory)\n    return [];\
        \ glob_fn = directory.rglob if recursive else directory.glob; files = sorted((p for p in glob_fn('*.py') if not any((part\
        \ in EXCLUDED_DIRS for part in p.parts)) and (not exclude_init or p.name != '__init__.py'))); logger.debug('Collected\
        \ %d .py files from %s (recursive=%s)', len(files), directory, recursive); return files"
    - name: discover_source_files
      params:
      - 'project_root: Path'
      returns: list[Path]
      body_hint: all_py = collect_py_files(project_root, recursive=True); sources = [f for f in all_py if not _is_test_file(f,
        project_root)]; logger.info('Discovered %d source files (of %d total .py)', len(sources), len(all_py)); return sources
    - name: discover_test_files
      params:
      - 'project_root: Path'
      returns: list[Path]
      body_hint: all_py = collect_py_files(project_root, recursive=True); tests = [f for f in all_py if _is_test_file(f, project_root)];
        logger.info('Discovered %d test files', len(tests)); return tests
    test_contracts:
    - test_file: test_discovery.py
      test_method: test_collect_py_files_excludes_pycache
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_recursive
      assertion: len(result) == 2
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_non_recursive
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_exclude_init
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_nonexistent_dir
      assertion: result == []
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_discover_test_files
      assertion: len(result) == 2
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_discover_test_files_by_name
      assertion: len(result) == 2
      contract_type: value_equality
relationships:
- type: depends-on
  from: COMP-MANIFEST
  to: COMP-UTILS
