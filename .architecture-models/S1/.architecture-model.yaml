entities:
  capabilities:
  - id: CAP-GATE
    name: Development Gate
    status: ACTIVE
    description: Check if code reality tracks toward authored architecture intent (capability realization %, file coverage
      %)
    source_block: S1
  - id: CAP-AUTHOR
    name: Requirements Authoring
    status: ACTIVE
    description: Parse requirements documents into architecture model entities
    source_block: S1
  behaviors:
  - id: BEH-GATE
    name: Development Gate Check
    status: ACTIVE
    description: Verify code reality tracks toward architectural intent
    trigger: Gate check in CI or CLI
    actor: ACT-CI
    steps:
    - Load authored model and manifest
    - Compute capability realization %
    - Compute constraint allocation %
    - Compute file coverage %
    - Compare against phase thresholds
    - Return GateResult with pass/fail
  interfaces:
  - id: IF-GATE
    name: Development Gate API
    status: ACTIVE
    description: check_development_gate(model, manifest, phase?) -> GateResult
    type: internal
    provider: COMP-AUTHORING
  components:
  - id: COMP-AUTHORING
    name: Authoring
    status: ACTIVE
    description: Requirements-driven model authoring and development gate checking
    layer: LAYER-ORCHESTRATION
    source_block: S1
    technology: python
    files:
    - src/architecture_model/authoring/gate.py
    - src/architecture_model/authoring/parser.py
    responsibilities:
    - Parse requirements documents into model entities
    - Check development gate (capability realization, constraint allocation, file coverage)
    kind: library
    signatures:
    - name: check_development_gate
      params:
      - 'model: ArchitectureModel'
      - 'manifest: Manifest'
      - 'phase: str | None'
      returns: GateResult
      body_hint: 'if phase is None: ...; cap_ids = {c.id for c in model.entities.capabilities}; realized_caps = set(); for
        rel in model.relationships: ...; capability_realization = len(realized_caps) / len(cap_ids) * 100 if cap_ids else
        1...; con_ids = {c.id for c in model.entities.constraints}; allocated_cons = set(); for rel in model.relationships:
        ...; constraint_allocation = len(allocated_cons) / len(con_ids) * 100 if con_ids else ...; manifest_files = {m.file
        for m in manifest.modules}; component_files: set[str] = set(); for comp in model.entities.components: ...; file_coverage
        = len(manifest_files & component_files) / len(manifest_file...; overall = capability_realization * 0.4 + constraint_allocation
        * 0....; issues: list[str] = []; if phase == ''concept'': ...; return GateResult(capability_realization=capability_realization,
        constraint_allocation=constraint_allocation, file_coverage=file_coverage, overall=overall, phase=phase, phase_requirements_met=phase_requirements_met,
        issues=issues)'
    - name: parse_requirements_doc
      params:
      - 'text: str'
      returns: ArchitectureModel
      body_hint: 'sections = _split_sections(text); actors: list[Actor] = []; capabilities: list[Capability] = []; constraints:
        list[Constraint] = []; relationships: list[Relationship] = []; if ''actors'' in sections: ...; if ''capabilities''
        in sections: ...; if ''constraints'' in sections: ...; return ArchitectureModel(meta=ModelMeta(project=''authored'',
        schema_version=''1.3''), entities=Entities(actors=actors, capabilities=capabilities, constraints=constraints), relationships=relationships)'
    test_contracts:
    - test_file: test_parser.py
      test_method: test_load_returns_architecture_model
      assertion: model isinstance ArchitectureModel
      contract_type: type_check
    - test_file: test_parser.py
      test_method: test_meta_has_schema_version
      assertion: model.meta.schema_version == '0.1.0'
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_empty_file_raises
      assertion: raises ValueError
      contract_type: raises
    - test_file: test_parser.py
      test_method: test_missing_file_raises
      assertion: raises FileNotFoundError
      contract_type: raises
    - test_file: test_parser.py
      test_method: test_malformed_yaml_raises
      assertion: raises Exception
      contract_type: raises
    - test_file: test_parser.py
      test_method: test_round_trip_preserves_entity_count
      assertion: reloaded.entity_count == model.entity_count
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_round_trip_preserves_relationship_count
      assertion: reloaded.relationship_count == model.relationship_count
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_round_trip_preserves_meta
      assertion: reloaded.meta.project == model.meta.project
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_round_trip_preserves_actor_ids
      assertion: original_ids == reloaded_ids
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_real_model_passes_schema
      assertion: len(real_errors) == 0
      contract_type: value_equality
    - test_file: test_parser.py
      test_method: test_minimal_valid_structure
      assertion: real_errors isinstance list
      contract_type: type_check
