    kind: library
    intent: Provide a deterministic, stage-by-stage architecture extraction engine that transforms raw source code into a validated architecture model through a DAG of composable stages.
    goals:
    - Extract architecture models from arbitrary Python repos without configuration
    - Support incremental execution via stage caching and DAG dependency resolution
    - Enable recursive decomposition of large systems into autonomous subsystem models
    moes:
    - Pipeline produces valid models (score >= 86/100) for repos of 10-500 files
    - Each stage is independently testable and produces typed StageResult outputs
    - Cached stages skip re-execution, reducing repeat runs to <1s for unchanged stages
    trade_offs:
    - Determinism vs. accuracy — no LLM calls means heuristic-based inference may miss nuanced patterns
    - Monolithic component vs. per-stage components — all 22 files in one component simplifies dependency tracking but reduces granularity
    - Threshold-based splitting/merging — fixed constants (MAX_COMPONENT_FILES=12, MIN_COMPONENT_FILES=2) work for most repos but may misfit extreme cases
    failure_modes:
    - Observe stage fails on non-UTF-8 or syntax-invalid Python files, producing incomplete inventory
    - Allocate stage assigns files to wrong components when import graphs are sparse or circular
    - Decompose stage over-fragments or under-merges systems at boundary thresholds (5-file cutoff)
