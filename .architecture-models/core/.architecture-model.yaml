    - Relationship comparison by (type, from, to) key
    - Human-readable diff report formatting
  - id: CAP-merging
    name: Manifest Merging & Enrichment
    status: ACTIVE
    description: Merge manifest data into models (file provenance, layer directories, missing components), enrich with AST
