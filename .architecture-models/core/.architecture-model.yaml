    - _add_missing_components() adds high-LOC modules (>400 LOC threshold)
    - enrich_from_manifest() replaces symbols/functions with AST ground-truth
    - _enrich_relationship_imports() populates Relationship.imports from import graph
    - compact_for_generation() truncates for LLM context limits
  - id: BEH-decompose
    name: Decompose Model into Systems
    status: ACTIVE
    trigger: CLI decompose command or pipeline
    actor: ACT-cli
    preconditions:
    - Flat model with enriched components
    - Manifest with functional_blocks metadata
    postconditions:
    - DecompositionResult with top-level model and sub-models
    - System entities created with sub_model_ref paths
    steps:
    - identify_systems() groups by f_block, computes aggregate complexity
    - Groups above SYSTEM_THRESHOLD become SystemCandidates
    - decompose_model() partitions components and relationships
    - Inter-system relationships promoted to top-level with endpoint rewriting
    - Sub-models contain only intra-system components and relationships
  - id: BEH-coverage-check
    name: Run Coverage Analysis
    status: ACTIVE
    trigger: CLI coverage command
    actor: ACT-cli
    preconditions:
    - ArchitectureModel loaded
    - Manifest dict available
    postconditions:
    - CoverageResult with 5 checks and overall score
    steps:
    - _check_component_coverage() matches model components to manifest modules
    - _check_relationship_accuracy() compares depends-on edges to import graph
    - _check_capability_coverage() matches f_blocks between model and manifest
    - _check_interface_coverage() checks EXPOSES relationships against module exports
    - _check_staleness() compares manifest hashes
  - id: BEH-compose-enriched
    name: Compose Enriched Model from Source
    status: ACTIVE
    trigger: compose_enriched_model() called with project root
    actor: ACT-cli
    preconditions:
    - Project root directory with Python source files
    postconditions:
    - ArchitectureModel with one Component per source file
    - Each component has constants, signatures, and test_contracts
    steps:
    - discover_source_files() and discover_test_files()
    - _map_tests_to_sources() using AST import analysis
    - For each source file, parse AST for constants, signatures, body hints
    - Match test files and extract test contracts
    - Build Component per source file with all enrichment data
  - id: BEH-test-affinity-decompose
    name: Test-Affinity Decomposition
    status: ACTIVE
    trigger: test_affinity_decompose() called with repo path
    actor: ACT-cli
    preconditions:
    - Repository with test files following test_*.py or *_test.py convention
    postconditions:
    - List of Subsystem objects sorted topologically
    steps:
    - Discover test and source files
    - Parse test file imports to identify tested source modules
    - Assign each source to exactly one subsystem by best name match
    - Detect inter-subsystem dependencies via import analysis
    - Topological sort with Kahn's algorithm (leaves first)
    - Unclaimed source files assigned to 'root' subsystem
