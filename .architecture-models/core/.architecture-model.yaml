  - id: COMP-coverage
    name: coverage
    status: ACTIVE
    description: 268-line module comparing model against manifest across 5 dimensions. Produces CoverageResult with per-check
      scores and overall aggregate.
    f_block: F8
    technology: Python
    files:
    - src/architecture_model/core/coverage.py
    responsibilities:
    - Check component coverage against manifest modules
    - Check relationship accuracy against import graph
    - Check capability coverage against functional blocks
    - Check interface coverage against module exports
    - Check staleness via manifest hash comparison
    kind: module
    signatures:
    - name: summary
      returns: str
      body_hint: "lines = ['Model Coverage Report', '=' * 40]; for c in self.checks:\n    status = '✓' if c.score == 100 else\
        \ '△' if c.score >= 80 else '✗'\n    lines.append(f'  {status} {c.name}: {c.matched}/{c.total} ({c.score:.0f}%)')\n\
        \    for m in c.missing:\n        lines.append(f'      ⚠ Missing: {m}')\n    for e in c.extra:\n        lines.append(f'\
        \      ⊕ Extra (not in code): {e}'); lines.append(f'\\nOverall accuracy: {self.overall_score:.0f}%'); return '\\n'.join(lines)"
    - name: coverage_report
      params:
      - 'model: ''ArchitectureModel'''
      - 'manifest: dict'
      returns: CoverageResult
      body_hint: checks = [_check_component_coverage(model, manifest), _check_relationship_accuracy(model, manifest), _check_capability_coverage(model,
        manifest), _check_interface_coverage(model, manifest), _check_staleness(model, manifest)]; overall = sum((c.score
        for c in checks)) / len(checks) if checks else 0.0; return CoverageResult(checks=checks, overall_score=overall)
