      Compensation, Endpoint), Relationship, ModelMeta, Entities container, and the top-level ArchitectureModel with to_dict()/to_yaml()
      serialization.
    f_block: F1
    technology: Python
    files:
    - src/architecture_model/core/types.py
    responsibilities:
    - Define all entity dataclasses with typed fields
    - Define all enum types with lenient parse() methods
    - Provide ArchitectureModel.to_dict() and to_yaml() serialization
    - Compute all_entity_ids, entity_count, relationship_count properties
    kind: module
    signatures:
    - name: parse
      params:
      - 'value: str'
      returns: RelationType | str
      decorators:
      - classmethod
      body_hint: "try:\n    return cls(value)\nexcept ValueError:\n    return value"
    - name: all_entity_ids
      returns: set[str]
      decorators:
      - property
      body_hint: 'ids: set[str] = set(); for actor in self.entities.actors: ...; for cap in self.entities.capabilities: ...;
        for beh in self.entities.behaviors: ...; for iface in self.entities.interfaces: ...; for con in self.entities.constraints:
        ...; for layer in self.entities.layers: ...; for comp in self.entities.components: ...; for sys in self.entities.systems:
        ...; for d in self.entities.data: ...; for e in self.entities.events: ...; for r in self.entities.resources: ...;
        for e in self.entities.environments: ...; for qa in self.entities.quality_attributes: ...; for d in self.entities.decisions:
        ...; for lc in self.entities.lifecycles: ...; return ids'
    - name: entity_count
      returns: int
      decorators:
      - property
      body_hint: return len(self.all_entity_ids)
    - name: relationship_count
      returns: int
      decorators:
      - property
      body_hint: return len(self.relationships)
    - name: to_dict
      returns: dict[str, Any]
      body_hint: 'return {''meta'': self._dump_meta(), ''entities'': self._dump_entities(), ''relationships'': [self._dump_relationship(r)
        for r in self.relationships]}'
    - name: to_yaml
      returns: str
      body_hint: return yaml.dump(self.to_dict(), default_flow_style=False, sort_keys=False)
