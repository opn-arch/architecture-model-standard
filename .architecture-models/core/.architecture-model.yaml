    - Reports missing and extra entities
    - Staleness uses SHA-256 hash comparison
  behaviors:
  - id: BEH-load-validate
    name: Load and Validate Model
    status: ACTIVE
    trigger: CLI or MCP invokes load_model() then validate_model()
