  - id: COMP-parser
    name: parser
    status: ACTIVE
    description: '767-line module for YAML model I/O. Public API: load_model(), validate_model_data(), dump_model(), save_model().
      Internal parsing functions for each entity type and serialization functions mirroring the type system''s structure.'
    f_block: F2
    technology: Python
    files:
    - src/architecture_model/core/parser.py
    responsibilities:
    - Load YAML files into ArchitectureModel via _parse_raw()
    - Validate raw dicts against JSON Schema (optional jsonschema dependency)
    - Serialize ArchitectureModel back to dict/YAML
    - Parse all 15 entity types with graceful enum handling
    kind: module
    constants:
    - name: SCHEMA_PATH
      value: Path(__file__).parent.parent / 'spec' / 'schema.json'
    signatures:
    - name: load_model
      params:
      - 'path: str | Path'
      returns: ArchitectureModel
      body_hint: "path = Path(path); with open(path, 'r', encoding='utf-8') as f:\n    raw = yaml.safe_load(f); if raw is\
        \ None:\n    raise ValueError(f'Empty model file: {path}'); return _parse_raw(raw)"
    - name: validate_model_data
      params:
      - 'data: dict[str, Any]'
      returns: list[str]
      body_hint: "if not HAS_JSONSCHEMA:\n    return ['jsonschema not installed — skipping schema validation']; schema = json.loads(SCHEMA_PATH.read_text(encoding='utf-8'));\
        \ validator = jsonschema.Draft202012Validator(schema); return [f'{e.json_path}: {e.message}' for e in validator.iter_errors(data)]"
    - name: dump_model
