        \        affected.add('use-cases')\n    if etype in ('layer', 'component'):\n        affected.add('logical-architecture')\n\
        \    if etype == 'interface':\n        affected.add('icd')\n    if etype == 'constraint':\n        affected.add('requirements-analysis')\n\
        \    affected.add('readme'); return affected"
