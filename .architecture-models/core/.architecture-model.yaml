  constraints:
  - id: CON-round-trip
    name: Round-trip Fidelity
    status: ACTIVE
    description: Parsing then serializing a model must produce output compatible with re-parsing (_parse_raw round-trip)
    type: technology
    rationale: Ensures no data loss across save/load cycles
  - id: CON-no-overwrite
    name: Merge Never Overwrites Decisions
    status: ACTIVE
    description: merge_manifest() and enrich_from_manifest() supplement but never overwrite entity names, descriptions, status,
      or relationships
    type: technology
    rationale: Architectural decisions are human-authored truth; manifest provides code-grounded facts only
  - id: CON-deep-copy-slices
    name: Slices are Independent
    status: ACTIVE
    description: All slicer functions return deep-copied models to prevent mutation of the source
    type: technology
    rationale: Callers must be able to modify sliced models without side effects
  - id: CON-lenient-enums
    name: Lenient Enum Parsing
    status: ACTIVE
    description: All enum parse() methods accept unknown values as plain strings rather than raising errors
    type: technology
    rationale: Forward compatibility — new enum values in newer schema versions should not break older parsers
  - id: CON-score-formula
    name: Validation Score Formula
    status: ACTIVE
    description: Score = max(0, 100 - (errors * 10) - (warnings * 2)). INFO issues do not affect score.
    type: technology
    metric: score
    threshold: 0-100
    rationale: Provides a single numeric quality indicator for models
