    f_block: F6
    priority: high
    requirements:
    - Never overwrite architectural decisions (names, descriptions, relationships)
    - Auto-discover high-LOC modules not yet in model
    - Wire realizes relationships for newly added components
    - Compact models for 7B model context limits
  - id: CAP-decomposition
    name: Model Decomposition
    status: ACTIVE
    description: Identify complex F-block groups as System entities via weighted complexity scoring, auto-assign F-blocks
