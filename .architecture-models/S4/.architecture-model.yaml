    - src/architecture_model/core/representativeness.py
    - src/architecture_model/core/regen_readiness.py
    - src/architecture_model/core/source_block_assign.py
    - src/architecture_model/core/source_block_quality.py
    - src/architecture_model/core/test_affinity.py
    - src/architecture_model/core/visualize.py
    kind: library
    intent: Provide the foundational type system and deterministic operations that every other subsystem depends on, ensuring a single source of truth for model structure and semantics.
    goals:
    - Define all architecture entity types and relationships as typed Python dataclasses with full enum coverage
    - Provide lossless round-trip parsing between YAML and in-memory model objects
    - Enable model subsetting, comparison, and quality measurement without LLM or network dependencies
    moes:
    - All 8 dependent subsystems (CLI, Pipeline, Orchestration, Extract, Docs, Export, Integrations, Authoring) can operate using only Core's public API
    - Validation score of 86+ on self-referential model (the architecture-model-standard's own model)
    - Zero runtime dependencies beyond PyYAML and standard library
    trade_offs:
    - Richness vs. parse speed — 1186-line types.py covers all schema variants but increases import time
    - Strict typing vs. extensibility — dataclass fields enforce schema but make adding new entity types a multi-file change
    - Determinism vs. intelligence — no LLM calls means coverage/confidence metrics are heuristic-based approximations
    failure_modes:
    - Schema drift — types.py diverges from spec/schema.json, causing silent data loss on parse
    - Validator false negatives — missing validation rules allow structurally invalid models to score 100
    - Slicer relationship leakage — slice includes relationships referencing entities outside the slice boundary
