# Sub-behaviors for injection into sub-models during decomposition
behaviors:
- id: BEH-VALIDATE-IDS
  name: ID Uniqueness Check
  status: ACTIVE
  description: Check all entity IDs are unique across entity types
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Compute type_entities
  - Iterate over type_entities
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-REFS
  name: Referential Integrity Check
  status: ACTIVE
  description: Verify all relationship endpoints reference existing entities
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Compute all_ids
  - Compute layer_ids
  - Iterate over model.relationships
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-ORPHANS
  name: Orphan Entity Detection
  status: ACTIVE
  description: Find entities with no relationships
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.relationships
  - Iterate over model.entities.behaviors
  - Iterate over model.entities.components
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-STATUS
  name: Status Consistency Check
  status: ACTIVE
  description: Verify status field values are valid
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.entities.actors
  - Iterate over model.entities.capabilities
  - Iterate over model.entities.behaviors
  - Iterate over model.entities.interfaces
  - Iterate over model.entities.constraints
  - Iterate over model.entities.layers
  - Iterate over model.entities.components
  - Iterate over model.entities.systems
  - Iterate over model.entities.data
  - Iterate over model.entities.events
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-CAPS
  name: Capability Realization Check
  status: ACTIVE
  description: Ensure every capability is realized by at least one component
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.relationships
  - Iterate over model.entities.capabilities
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-META
  name: Meta Completeness Check
  status: ACTIVE
  description: Validate model meta section has required fields
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Check not model.meta.project
  - Check not model.meta.schema_version
  - Check not model.meta.source_artifacts
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-V11
  name: V1.1 Semantics Check
  status: ACTIVE
  description: Validate schema v1.1+ semantic rules
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.entities.components
  - Iterate over model.entities.behaviors
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-REGEN
  name: Regen Readiness Check
  status: ACTIVE
  description: Score components for code regeneration readiness
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.entities.components
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-PROFILE
  name: Domain Profile Validation
  status: ACTIVE
  description: Validate domain-profile-specific rules
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  - 'Guard: not profile_name or profile_name == ''software'''
  postconditions:
  - 'Returns: None'
  steps:
  - Compute profile_name
  - Check not profile_name or profile_name == 'software'
  - Compute entity_lists
  - Iterate over profile.validation_rules
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-VALIDATE-IMPROVE
  name: Improvement Opportunities
  status: ACTIVE
  description: Detect non-critical improvements
  trigger: validate_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'result: ValidationResult'
  postconditions:
  - 'Returns: None'
  steps:
  - Iterate over model.entities.components
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-VALIDATOR
- id: BEH-PARSE-LOAD
  name: Model Loading
  status: ACTIVE
  description: Load YAML file, parse into ArchitectureModel dataclass
  preconditions:
  - 'path: str | Path'
  postconditions:
  - 'Returns: ArchitectureModel'
  - return _parse_raw(raw)
  steps:
  - path = Path()
  - With open(path, 'r', encoding='utf-8')
  - Check raw is None
  - Return _parse_raw(raw)
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-PARSER
- id: BEH-PARSE-SAVE
  name: Model Saving
  status: ACTIVE
  description: Serialize ArchitectureModel to YAML via to_dict()
  preconditions:
  - 'model: ArchitectureModel'
  - 'path: str | Path'
  postconditions:
  - 'Returns: None'
  steps:
  - path = Path()
  - Call path.parent.mkdir()
  - data = dump_model()
  - With open(path, 'w', encoding='utf-8')
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-PARSER
- id: BEH-PARSE-DUMP
  name: Model Dumping
  status: ACTIVE
  description: Dump model to string format for display
  trigger: save_model
  preconditions:
  - 'model: ArchitectureModel'
  postconditions:
  - 'Returns: dict[str, Any]'
  steps:
  - 'Return {''meta'': _dump_meta(model.meta), ''entities'': _dump_entities('
  parent_behavior: BEH-VALIDATE
  component: COMP-CORE-PARSER
- id: BEH-SLICE-FBLOCK
  name: Slice by F-Block
  status: ACTIVE
  description: Extract sub-model for a functional block by tracing relationships
  preconditions:
  - 'model: ArchitectureModel'
  - 'f_block: str'
  - 'include_relationships: bool'
  postconditions:
  - 'Returns: ArchitectureModel'
  steps:
  - Compute cap_ids
  - Compute behaviors
  - Compute behavior_ids
  - Compute components
  - Compute component_ids
  - Compute interfaces
  - Compute interface_ids
  - Compute relevant_ids
  - Compute data_entities
  - Compute data_ids
  parent_behavior: BEH-SLICE
  component: COMP-CORE-SLICER
- id: BEH-SLICE-LAYER
  name: Slice by Layer
  status: ACTIVE
  description: Extract sub-model for an architectural layer
  preconditions:
  - 'model: ArchitectureModel'
  - 'layer_id: str'
  postconditions:
  - 'Returns: ArchitectureModel'
  steps:
  - Compute layers
  - Compute components
  - Compute component_ids
  - Compute relationships
  - Return ArchitectureModel(meta=ModelMeta(schema_version=model.meta.s
  parent_behavior: BEH-SLICE
  component: COMP-CORE-SLICER
- id: BEH-SLICE-STATUS
  name: Slice by Status
  status: ACTIVE
  description: Filter model entities by status value
  preconditions:
  - 'model: ArchitectureModel'
  - 'status: Status'
  postconditions:
  - 'Returns: ArchitectureModel'
  steps:
  - entities = Entities()
  - all_ids = set()
  - Iterate over ['actors', 'capabilities', 'behaviors', 'interfaces', 'constraints', 'layers', 'components', 'systems', 'data',
    'events', 'resources', 'environments', 'quality_attributes', 'decisions', 'lifecycles']
  - Compute relationships
  - Return ArchitectureModel(meta=deepcopy(model.meta), entities=entiti
  parent_behavior: BEH-SLICE
  component: COMP-CORE-SLICER
- id: BEH-SLICE-ARTIFACT
  name: Slice by Artifact
  status: ACTIVE
  description: Extract sub-model relevant to a specific artifact type
  preconditions:
  - 'model: ArchitectureModel'
  - 'artifact_name: str'
  postconditions:
  - 'Returns: ArchitectureModel'
  - return deepcopy(model)
  - return slicer_fn(model)
  steps:
  - Compute slicers
  - slicer_fn = slicers.get()
  - Check slicer_fn
  - Return deepcopy(model)
  parent_behavior: BEH-SLICE
  component: COMP-CORE-SLICER
- id: BEH-SLICE-COMPONENT
  name: Slice by Component
  status: ACTIVE
  description: Extract sub-model for a single component with dependencies
  preconditions:
  - 'model: ArchitectureModel'
  - 'f_block: str'
  - 'include_relationships: bool'
  postconditions:
  - 'Returns: ArchitectureModel'
  steps:
  - Compute cap_ids
  - Compute behaviors
  - Compute behavior_ids
  - Compute components
  - Compute component_ids
  - Compute interfaces
  - Compute interface_ids
  - Compute relevant_ids
  - Compute data_entities
  - Compute data_ids
  parent_behavior: BEH-SLICE
  component: COMP-CORE-SLICER
- id: BEH-DIFF-ENTITIES
  name: Entity Diff
  status: ACTIVE
  description: Compare entities between two models, detect added/removed/modified
  trigger: diff_models
  preconditions:
  - 'old_entities: list'
  - 'new_entities: list'
  - 'entity_type: str'
  - 'result: ModelDiff'
  postconditions:
  - 'Returns: None'
  steps:
  - Compute old_map
  - Compute new_map
  - old_ids = set()
  - new_ids = set()
  - Iterate over new_ids - old_ids
  - Iterate over old_ids - new_ids
  - Iterate over old_ids & new_ids
  parent_behavior: BEH-DIFF
  component: COMP-CORE-DIFFER
- id: BEH-DIFF-RELS
  name: Relationship Diff
  status: ACTIVE
  description: Compare relationships between two models
  trigger: diff_models
  preconditions:
  - 'old_rels: list[Relationship]'
  - 'new_rels: list[Relationship]'
  - 'result: ModelDiff'
  postconditions:
  - 'Returns: None'
  - return (r.type.value, r.from_id, r.to_id)
  steps:
  - Compute old_set
  - Compute new_set
  - Iterate over new_set - old_set
  - Iterate over old_set - new_set
  parent_behavior: BEH-DIFF
  component: COMP-CORE-DIFFER
- id: BEH-MERGE-MANIFEST
  name: Merge Manifest
  status: ACTIVE
  description: Merge reality manifest data into architecture model
  preconditions:
  - 'model: ArchitectureModel'
  - 'manifest_path: str | Path'
  - 'project_root: str | Path | None'
  - 'Guard: not manifest_path.exists()'
  postconditions:
  - 'Returns: ArchitectureModel'
  - return model
  steps:
  - manifest_path = Path()
  - Check not manifest_path.exists()
  - Check project_root is None
  - manifest = json.loads()
  - content = manifest_path.read_bytes()
  - Compute model.meta.manifest_hash
  - Call _merge_layer_directories()
  - Call _merge_component_files()
  - Call _add_missing_components()
  - Return model
  parent_behavior: BEH-MERGE
  component: COMP-CORE-MERGER
- id: BEH-MERGE-ENRICH
  name: Enrich from Manifest
  status: ACTIVE
  description: Enrich model components with manifest-derived data
  preconditions:
  - 'model: ArchitectureModel'
  - 'manifest: dict'
  postconditions:
  - 'Returns: EnrichmentResult'
  - return EnrichmentResult(_model=model, naming_accuracy=naming_accuracy)
  steps:
  - modules = manifest.get()
  - interfaces = manifest.get()
  - Iterate over modules
  - Compute total_predicted
  - Compute total_matched
  - Iterate over model.entities.components
  - Call _enrich_relationship_imports()
  - Check total_predicted == 0
  - Return EnrichmentResult(_model=model, naming_accuracy=naming_accura
  parent_behavior: BEH-MERGE
  component: COMP-CORE-MERGER
- id: BEH-MERGE-COMPACT
  name: Compact for Generation
  status: ACTIVE
  description: Compact model for code generation context
  preconditions:
  - 'model: ArchitectureModel'
  postconditions:
  - 'Returns: ArchitectureModel'
  - return model
  steps:
  - model = copy.deepcopy()
  - n_components = len()
  - Check n_components > 15
  - Iterate over model.entities.components
  - Return model
  parent_behavior: BEH-MERGE
  component: COMP-CORE-MERGER
- id: BEH-MERGE-COMPOSE
  name: Compose Enriched Model
  status: ACTIVE
  description: Compose a fully enriched model from multiple sources
  preconditions:
  - 'project_root: Path'
  postconditions:
  - 'Returns: ArchitectureModel'
  - return ArchitectureModel(meta=meta, entities=entities, relationships=[])
  steps:
  - source_files = discover_source_files()
  - test_files = discover_test_files()
  - Compute source_stems
  - test_mapping = _map_tests_to_sources()
  - Iterate over source_files
  - Compute project_name
  - meta = ModelMeta()
  - entities = Entities()
  - Return ArchitectureModel(meta=meta, entities=entities, relationship
  parent_behavior: BEH-MERGE
  component: COMP-CORE-MERGER
- id: BEH-DECOMPOSE-IDENTIFY
  name: Identify Systems
  status: ACTIVE
  description: Discover functional subsystems from component graph
  trigger: decompose_model
  preconditions:
  - 'model: ArchitectureModel'
  - 'manifest: dict'
  postconditions:
  - 'Returns: list[SystemCandidate]'
  - return candidates
  steps:
  - Iterate over model.entities.components
  - fblocks_meta = manifest.get()
  - Iterate over groups.items()
  - Return candidates
  parent_behavior: BEH-DECOMPOSE
  component: COMP-CORE-DECOMPOSER
- id: BEH-DECOMPOSE-COMPLEXITY
  name: Compute Complexity
  status: ACTIVE
  description: Calculate complexity metrics for subsystem partitioning
  trigger: identify_systems
  preconditions:
  - 'comp: Component'
  - 'model: ArchitectureModel'
  postconditions:
  - 'Returns: float'
  - return symbol_weight + member_weight + function_weight + dep_weight
  steps:
  - Compute symbol_weight
  - Compute member_weight
  - Compute function_weight
  - deps = sum()
  - Compute dep_weight
  - Return symbol_weight + member_weight + function_weight + dep_weight
  parent_behavior: BEH-DECOMPOSE
  component: COMP-CORE-DECOMPOSER
- id: BEH-DECOMPOSE-PARTITION
  name: Partition Subsystems
  status: ACTIVE
  description: Partition components into subsystems by affinity
  preconditions:
  - 'repo_path: Path'
  postconditions:
  - 'Returns: list[Subsystem]'
  - return result
  - return []
  steps:
  - test_files = _discover_test_files()
  - source_files = _discover_source_files()
  - Check not source_files
  - Iterate over test_files
  - Iterate over test_to_sources.items()
  - Iterate over source_claimants.items()
  - Iterate over source_assignment.items()
  - Iterate over test_name_to_file.items()
  - Iterate over test_files
  - Iterate over source_files
  parent_behavior: BEH-DECOMPOSE
  component: COMP-CORE-DECOMPOSER
- id: BEH-SCAN-PARSE
  name: AST Parsing
  status: ACTIVE
  description: Parse Python source file into AST
  trigger: _scan_file
  preconditions:
  - 'root: Path'
  - 'filepath: Path'
  postconditions:
  - 'Returns: ModuleInfo'
  steps:
  - rel_path = str()
  - line_count = _file_line_count()
  - status = _determine_status()
  - tree = _parse_file_ast()
  - Compute docstring
  - Check tree is not None
  - name = _derive_name_from_docstring()
  - Call logger.debug()
  - Return ModuleInfo(file=rel_path, name=name, docstring=docstring, fu
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-SCAN-FUNCTIONS
  name: Function Extraction
  status: ACTIVE
  description: Extract function definitions with signatures, decorators, docstrings
  trigger: scan_file
  preconditions:
  - 'tree: ast.Module'
  postconditions:
  - 'Returns: list[FunctionInfo]'
  - return functions
  steps:
  - Iterate over ast.iter_child_nodes(tree)
  - Return functions
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-SCAN-CLASSES
  name: Class Extraction
  status: ACTIVE
  description: Extract class definitions with methods and attributes
  trigger: scan_file
  preconditions:
  - 'tree: ast.Module'
  postconditions:
  - 'Returns: list[ClassInfo]'
  - return classes
  steps:
  - Iterate over ast.iter_child_nodes(tree)
  - Return classes
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-SCAN-IMPORTS
  name: Import Extraction
  status: ACTIVE
  description: Extract import statements with aliases and relative resolution
  trigger: scan_file
  preconditions:
  - 'tree: ast.Module'
  postconditions:
  - 'Returns: list[str]'
  - return imports
  steps:
  - Iterate over ast.walk(tree)
  - Return imports
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-SCAN-CONSTANTS
  name: Constant Extraction
  status: ACTIVE
  description: Extract module-level constants and assignments
  trigger: scan_file
  preconditions:
  - 'tree: ast.Module'
  postconditions:
  - 'Returns: dict[str, str]'
  - return consts
  steps:
  - Iterate over ast.iter_child_nodes(tree)
  - Return consts
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-SCAN-METRICS
  name: Metrics Computation
  status: ACTIVE
  description: Compute line count, status, exports for scanned file
  trigger: scan_file
  preconditions:
  - 'filepath: Path'
  postconditions:
  - 'Returns: int'
  - return len(filepath.read_text(encoding='utf-8').splitlines())
  - return 0
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-SCANNER
- id: BEH-MANIFEST-CONFIG
  name: Config Loading
  status: ACTIVE
  description: Load or discover project configuration for manifest generation
  preconditions:
  - 'project_root: Path'
  - 'output_dir: Path | None'
  postconditions:
  - 'Returns: dict[str, Any]'
  - return manifest_dict
  - return data
  steps:
  - config = get_config()
  - Check output_dir is None
  - Check manifest_path.exists()
  - manifest = generate_manifest()
  - manifest_dict = manifest.to_dict()
  - Call manifest_path.parent.mkdir()
  - Call manifest_path.write_text()
  - Return manifest_dict
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-MANIFEST-METRICS
  name: Project Metrics
  status: ACTIVE
  description: Compute project-wide metrics (total lines, file counts)
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-MANIFEST-BLOCKS
  name: Block Assembly
  status: ACTIVE
  description: Assemble functional blocks from config with file enumeration
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-MANIFEST-SCAN
  name: Block Scanning
  status: ACTIVE
  description: Scan all files within each block for AST data
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-MANIFEST-IFACE
  name: Interface Discovery
  status: ACTIVE
  description: Discover inter-block interfaces from import analysis
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-MANIFEST-ASSEMBLE
  name: Manifest Assembly
  status: ACTIVE
  description: Assemble final manifest from blocks, interfaces, metrics
  trigger: load_or_generate_manifest
  preconditions:
  - 'project_root: Path'
  - 'config: Optional[Any]'
  postconditions:
  - 'Returns: Manifest'
  steps:
  - root = project_root.resolve()
  - report = ScanReport()
  - Check config is None
  - Call logger.info()
  - metrics_result = compute_metrics()
  - Call logger.info()
  - Compute blocks_dict
  - Call logger.info()
  - Iterate over blocks_dict.items()
  - Call logger.info()
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-BODYHINT-CLASSIFY
  name: Complexity Classification
  status: ACTIVE
  description: Classify function complexity as TRIVIAL/SHORT/COMPLEX
  preconditions:
  - 'source: str'
  - 'func_name: str'
  postconditions:
  - 'Returns: BodyComplexity'
  - return BodyComplexity.TRIVIAL
  - return BodyComplexity.SHORT
  - return BodyComplexity.COMPLEX
  steps:
  - tree = ast.parse()
  - node = _find_function()
  - body = _strip_docstring()
  - count = len()
  - Check count <= 1
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-BODY-HINTS
- id: BEH-BODYHINT-SUMMARIZE
  name: Body Summarization
  status: ACTIVE
  description: Generate body_hint text summarizing function implementation
  preconditions:
  - 'source: str'
  - 'func_name: str'
  - 'class_name: str | None'
  postconditions:
  - 'Returns: str'
  - return ast.unparse(body[0]) if body else ''
  - return '; '.join((ast.unparse(s) for s in body))
  - return _summarize_complex_body(body)
  steps:
  - tree = ast.parse()
  - node = _find_function()
  - body = _strip_docstring()
  - count = len()
  - Check count <= 1
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-BODY-HINTS
- id: BEH-TEST-DISCOVER
  name: Test Method Discovery
  status: ACTIVE
  description: Find test methods/functions in test files
  trigger: analyze_test_file
  preconditions:
  - 'tree: ast.Module'
  postconditions:
  - 'Returns: list[tuple[str, ast.AST]]'
  - return methods
  steps:
  - Iterate over ast.walk(tree)
  - Return methods
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-TEST-ANALYZER
- id: BEH-TEST-ASSERTIONS
  name: Assertion Pattern Matching
  status: ACTIVE
  description: Extract assertion patterns from test methods (unittest + pytest)
  trigger: analyze_test_file
  preconditions:
  - 'node: ast.AST'
  - 'test_file: str'
  - 'method_name: str'
  postconditions:
  - 'Returns: list[TestContract]'
  - return contracts
  steps:
  - Iterate over ast.walk(node)
  - Return contracts
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-TEST-ANALYZER
- id: BEH-IFACE-RESOLVE
  name: Import Resolution
  status: ACTIVE
  description: Resolve relative and absolute imports to interface edges
  trigger: _derive_interfaces
  preconditions:
  - 'modules: list[ModuleInfo]'
  - 'root: Path'
  postconditions:
  - 'Returns: list[InterfaceEdge]'
  - return interfaces
  - return None
  - return slash + '.py'
  - return init + '.py'
  steps:
  - Iterate over modules
  - Iterate over modules
  - Call logger.debug()
  - Return interfaces
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-INTERFACES
- id: BEH-IFACE-DEDUP
  name: Interface Deduplication
  status: ACTIVE
  description: Deduplicate interface edges from multiple import sources
  preconditions:
  - 'modules: list[dict[str, Any]]'
  - 'root: Path'
  postconditions:
  - 'Returns: list[dict[str, Any]]'
  - return [e.to_dict() for e in edges]
  steps:
  - Call warnings.warn()
  - Compute typed_modules
  - edges = derive_interfaces()
  - Return [e.to_dict() for e in edges]
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-INTERFACES
- id: BEH-RECURSIVE-SCAN
  name: Per-Block Deep Scan
  status: ACTIVE
  description: Perform deep AST scan within a single F-block
  preconditions:
  - 'project_root: Path'
  - 'parent_model: str'
  postconditions:
  - 'Returns: dict[str, RecursiveManifest]'
  - return results
  steps:
  - config = get_config()
  - Iterate over config.fblock_dict.items()
  - block_deps = compute_block_dependencies()
  - Iterate over block_deps.items()
  - Return results
  parent_behavior: BEH-MANIFEST
  component: COMP-MANIFEST-GENERATOR
- id: BEH-RECURSIVE-DEPS
  name: Cross-Block Dependencies
  status: ACTIVE
  description: Compute dependency graph between F-blocks
  trigger: generate_recursive_manifests
  preconditions:
  - 'manifests: dict[str, RecursiveManifest]'
  postconditions:
  - 'Returns: dict[str, list[str]]'
  - return dependencies
  - return None
