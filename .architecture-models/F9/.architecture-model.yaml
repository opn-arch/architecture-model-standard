      returns: bool
      body_hint: name = path.name; return name in EXCLUDED_DIRS or name.startswith('.')
    - name: collect_py_files
      params:
      - 'directory: Path'
      - 'recursive: bool'
      - 'exclude_init: bool'
      returns: list[Path]
      body_hint: "if not directory.is_dir():\n    logger.debug('Directory does not exist: %s', directory)\n    return [];\
