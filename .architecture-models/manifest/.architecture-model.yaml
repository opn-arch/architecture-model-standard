  - id: COMP-3
    name: Test Analyzer
    status: ACTIVE
    description: Test contract extractor (test_analyzer.py, 501 lines). Parses unittest and pytest patterns to produce TestContract
      and Constant objects for behavioral specification.
    files:
    - src/architecture_model/manifest/test_analyzer.py
    kind: module
    constants:
    - name: _EXCLUDED_MODULES
      value: frozenset({'unittest', 'pytest', 'sys', 'os', 'io', 're', 'math', 'collections', 'itertools', 'functools', 'pathlib',
        'typing', 'tempfile', 'shutil', 'json', 'copy', 'contextlib', 'textwrap', 'unittest.mock', 'mock'})
    - name: _ESCAPE_CODE_RE
      value: re.compile('\\\\(?:033|x1b)\\[(\\d+)m')
    signatures:
    - name: analyze_test_file
      params:
      - 'test_file: Path'
      returns: TestAnalysisResult
      body_hint: 'source = test_file.read_text(encoding=''utf-8''); tree = ast.parse(source, filename=str(test_file)); filename
        = test_file.name; result = TestAnalysisResult(test_file=filename); result.required_imports = _extract_imports(tree);
        test_methods = _find_test_methods(tree); result.test_count = len(test_methods); for (method_name, node) in test_methods:
        ...; result.constants = extract_constants_from_contracts(result.contracts); return result'
    - name: extract_constants_from_contracts
      params:
      - 'contracts: list[TestContract]'
      returns: list[Constant]
      body_hint: "constants: list[Constant] = []; seen: set[tuple[str, str]] = set(); for contract in contracts:\n    if contract.contract_type\
        \ != 'value_equality':\n        continue\n    parsed = _parse_escape_code_assertion(contract.assertion)\n    if parsed\
        \ is None:\n        continue\n    parent, name, code, full_escape = parsed\n    key = (parent, name)\n    if key in\
        \ seen:\n        continue\n    seen.add(key)\n    constants.append(Constant(name=name, value=code, context=f'attribute\
        \ of {parent}, produces escape code {full_escape}')); return constants"
