  constraints:
  - id: CON-1
    name: Typed Dataclass Output
    status: ACTIVE
    description: All pipeline functions return typed dataclasses (not raw dicts). Legacy dict-based functions are deprecated
      with warnings. Every dataclass provides to_dict() for JSON serialization.
    type: technology
  - id: CON-2
    name: Graceful Parse Failure
    status: ACTIVE
    description: AST parse failures are logged and tracked in ScanReport but do not halt manifest generation. Files that fail
      parsing get ModuleStatus.MISSING.
    type: technology
  - id: CON-3
    name: Cache TTL
    status: ACTIVE
    description: Cached manifests are valid for 1 hour (3600 seconds). Stale or corrupt caches trigger regeneration.
    type: technology
  - id: CON-4
    name: Public API Filter
    status: ACTIVE
    description: Scanner extracts only public functions (no leading underscore) by default. __init__ methods are included
      for classes. Body hints support include_private flag override.
    type: technology
  - id: CON-5
    name: Config-Driven Blocks
    status: ACTIVE
    description: Functional blocks are loaded from .architecture-model.yaml config. The legacy FUNCTIONAL_BLOCKS module constant
      is deprecated.
    type: technology
  - id: CON-6
    name: Body Hint Tiering
    status: ACTIVE
    description: 'Body hints follow strict tiering: 0-1 statements = TRIVIAL (exact text), 2-5 = SHORT (semicolon-joined),
      6+ = COMPLEX (structural summary with control flow patterns).'
    type: technology
