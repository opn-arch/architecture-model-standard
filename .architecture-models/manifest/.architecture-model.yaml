meta:
  schema_version: '2.0'
  project: architecture-model-standard/manifest
  system: Manifest
  generated_at: '2026-07-21T23:13:46.109347+00:00'
entities:
  actors:
  - id: ACT-1
    name: LLM Agent
    status: ACTIVE
    description: AI agent (via MCP server or CLI) that consumes manifests for architectural understanding, code regeneration,
      and context injection.
    type: human
  - id: ACT-2
    name: CLI User
    status: ACTIVE
    description: Developer or CI pipeline invoking manifest generation, slicing, or display via the architecture-model CLI.
    type: human
  - id: ACT-3
    name: Pipeline Orchestrator
    status: ACTIVE
    description: Automated pipeline (opencode-arch, arch-agent) that calls generate_manifest and get_manifest_slice programmatically.
    type: human
  capabilities:
  - id: CAP-1
    name: AST Scanning
    status: ACTIVE
    description: Parse Python source files via AST to extract public functions (with signatures, calls, docstrings, raises),
      classes (with bases, methods, decorators, attributes), imports (simple and detailed with relative resolution), module
      constants (UPPER_CASE literals), module assignments (non-constant expressions), exports (__all__ or relative imports),
      and decorated functions.
  - id: CAP-2
    name: Body Hint Extraction
    status: ACTIVE
    description: 'Classify function complexity (TRIVIAL/SHORT/COMPLEX) by statement count and produce tiered implementation
      hints: exact body for trivial (<=1 stmt), semicolon-joined for short (2-5), structural summary for complex (6+). Generates
      FunctionSignature objects with body_hint field.'
  - id: CAP-3
    name: Test Contract Analysis
    status: ACTIVE
    description: Parse test files to extract behavioral specifications as TestContract objects. Supports unittest (assertEqual,
      assertTrue, assertRaises, assertIsInstance) and pytest (assert ==, assert isinstance, pytest.raises) patterns. Derives
      constants from value_equality assertions (e.g., ANSI escape codes).
  - id: CAP-4
    name: Manifest Generation
    status: ACTIVE
    description: 'Orchestrate full project scanning: compute metrics, process functional blocks, scan all files, derive interfaces,
      and assemble a typed Manifest dataclass. Supports caching with 1-hour TTL via load_or_generate_manifest.'
  - id: CAP-5
    name: Functional Block Processing
    status: ACTIVE
    description: Process config-driven functional blocks by collecting files from directories, scanning each file, deriving
      inputs/outputs from signatures, and building hierarchical sub-block manifests with status propagation.
  - id: CAP-6
    name: Interface Derivation
    status: ACTIVE
    description: Derive inter-module dependency edges from import analysis. Resolves both absolute and relative imports (same-level,
      parent-level, grandparent-level) to produce InterfaceEdge objects.
  - id: CAP-7
    name: Metric Computation
    status: ACTIVE
    description: Compute project-level metrics from filesystem using config-driven definitions (path, pattern, recursive flag,
      exclusions). Always includes total_python_files as a universal metric.
  - id: CAP-8
    name: Recursive Manifest Generation
    status: ACTIVE
    description: Generate per-F-block deep manifests (RecursiveManifest) with full module detail, cross-block dependency computation
      via import analysis, and JSON serialization to per-block output files.
  - id: CAP-9
    name: Manifest Slicing
    status: ACTIVE
    description: 'Produce focused markdown extracts from manifests for 10 artifact types: functional-architecture, logical-architecture,
      data-dictionary, icd, readme, testing, deployment-guide, operations-manual, use-cases, requirements-analysis. Supports
      both typed Manifest and legacy dict input.'
  - id: CAP-10
    name: Display
    status: ACTIVE
    description: Print terminal summary of manifest showing metrics, functional blocks with active/total counts, interface
      count, and module count.
  behaviors:
  - id: BEH-1
    name: Generate Full Project Manifest
    status: ACTIVE
    description: End-to-end manifest generation for a project.
    trigger: Call to generate_manifest(project_root, config)
    preconditions:
    - Project root directory exists
    - Optional ProjectConfig; auto-loaded from .architecture-model.yaml if absent
    postconditions:
    - Typed Manifest object with metrics, blocks, modules, interfaces, scan_report
    steps:
    - Load or auto-discover project config
    - Compute filesystem metrics via compute_metrics
    - Process each functional block via process_block (collect files, scan, derive I/O)
    - Scan additional files from config layer directories
    - Build module list by scanning all collected files via scan_file
    - Derive inter-module interfaces via derive_interfaces
    - Assemble and return Manifest dataclass
  - id: BEH-2
    name: Scan Single Python File
    status: ACTIVE
    description: Parse one Python file and extract all metadata.
    trigger: Call to scan_file(root, filepath)
    preconditions:
    - File exists and is valid Python (or graceful degradation on parse error)
    postconditions:
    - ModuleInfo with functions, classes, imports, constants, assignments, exports, decorated_functions
    steps:
    - Count lines, determine status (ACTIVE >50 lines, DORMANT <=50, MISSING if not found)
    - Parse AST via _parse_file_ast
    - Extract module docstring, public functions, imports, classes, exports
    - Extract decorated functions, detailed imports, constants, assignments
    - Derive human-readable name from docstring or filename
  - id: BEH-3
    name: Extract Body Hints for File
    status: ACTIVE
    description: Scan an entire file producing FunctionSignature objects with body hints.
    trigger: Call to extract_file_hints(filepath, include_private)
    preconditions:
    - File is readable Python source
    postconditions:
    - List of FunctionSignature objects with params, returns, decorators, body_hint
    steps:
    - Parse source file AST
    - For each top-level function and class method (excluding private unless include_private)
    - Strip docstring from body, count statements
    - Classify as TRIVIAL/SHORT/COMPLEX and produce appropriate hint
    - Build FunctionSignature with all metadata
  - id: BEH-4
    name: Analyze Test File
    status: ACTIVE
    description: Extract behavioral contracts from a test file.
    trigger: Call to analyze_test_file(test_file)
    preconditions:
    - Test file is valid Python with test functions/methods
    postconditions:
    - TestAnalysisResult with contracts, constants, required_imports, test_count
    steps:
    - Parse AST and extract non-framework imports
    - Find all test methods (unittest TestCase methods + pytest top-level functions)
    - For each test method, extract contracts from assertions
    - Handle unittest (self.assertEqual, assertTrue, assertRaises, assertIsInstance)
    - Handle pytest (assert ==, assert isinstance, pytest.raises context manager)
    - Derive constants from value_equality contracts (e.g., ANSI escape codes)
  - id: BEH-5
    name: Load or Generate Cached Manifest
    status: ACTIVE
    description: Return cached manifest if fresh (<1 hour), otherwise regenerate.
    trigger: Call to load_or_generate_manifest(project_root, output_dir)
    preconditions:
    - Project root exists
    postconditions:
    - Manifest dict (JSON-compatible) written to disk and returned
    steps:
    - Resolve output path from config or output_dir parameter
    - Check if cached manifest exists and is <1 hour old
    - If fresh cache exists, load and return JSON
    - Otherwise generate fresh via generate_manifest, serialize, write to disk
  - id: BEH-6
    name: Generate Recursive Block Manifests
    status: ACTIVE
    description: Produce per-F-block deep manifests with cross-block dependencies.
    trigger: Call to generate_recursive_manifests(project_root, parent_model)
    preconditions:
    - Project config with functional blocks defined
    postconditions:
    - Dict of RecursiveManifest objects with block_dependencies populated
    steps:
    - Load config and iterate functional blocks
    - For each block, generate scoped Manifest via generate_block_manifest
    - Map block_id to component_id by convention
    - Compute cross-block dependencies from import analysis
    - Attach dependencies to each RecursiveManifest
  - id: BEH-7
    name: Slice Manifest for Artifact
    status: ACTIVE
    description: Produce focused markdown for a specific documentation artifact.
    trigger: Call to get_manifest_slice(manifest, artifact_name)
    preconditions:
    - Valid manifest (typed or dict) and recognized artifact_name
    postconditions:
    - Markdown string with artifact-relevant data from manifest
    steps:
    - Convert dict to typed Manifest if needed via _manifest_from_dict
    - Dispatch to artifact-specific slicer function
    - Each slicer extracts and formats relevant subset (blocks, modules, metrics, interfaces)
