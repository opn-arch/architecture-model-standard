        line_count); tree = _parse_file_ast(filepath); docstring = None; functions: list[FunctionInfo] = []; imports: list[str]
        = []; if tree is not None: ...; name = _derive_name_from_docstring(docstring, filepath); logger.debug(''Scanned %s:
        %d funcs, %d classes, %d constants'', rel_path, len(functions), len(classes), len(constants)); return ModuleInfo(file=rel_path,
        name=name, docstring=docstring, functions=functions, imports=imports, line_count=line_count, status=status, classes=classes,
