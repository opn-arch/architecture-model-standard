      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_score_deducts_10_per_error
      assertion: result.score == 90
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_score_deducts_2_per_warning
      assertion: result.score == 98
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_score_floors_at_zero
      assertion: result.score == 0
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_info_does_not_affect_score
      assertion: result.score == 100
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_duplicate_id_across_types_errors
      assertion: dup_errors[0].severity == Severity.ERROR
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_unique_ids_no_duplicates
      assertion: len(dup_errors) == 0
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_known_external_not_dangling
      assertion: len(dangling) == 0
      contract_type: value_equality
    - test_file: test_validator.py
      test_method: test_orphan_component_produces_info
      assertion: orphans[0].severity == Severity.INFO
