  - id: COMP-CORE-VALIDATOR
    name: core.validator
    status: ACTIVE
    description: Structural validation engine producing score 0-100
    f_block: F3
    files:
    - src/architecture_model/core/validator.py
    constants:
    - name: ERROR
      value: ERROR
      context: Severity enum member
    - name: INFO
      value: INFO
      context: Severity enum member
    signatures:
    - name: error_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.ERROR))
    - name: warning_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.WARNING))
    - name: info_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.INFO))
    - name: is_valid
      returns: bool
      decorators:
      - property
      body_hint: return self.error_count == 0
    - name: score
      returns: int
      decorators:
      - property
      body_hint: penalty = self.error_count * 10 + self.warning_count * 2; return max(0, 100 - penalty)
    - name: summary
      returns: str
      body_hint: 'return f''Score: {self.score}/100 | Errors: {self.error_count}, Warnings: {self.warning_count}, Info: {self.info_count}'''
    - name: validate_model
      params:
      - 'model: ArchitectureModel'
      - 'strict: bool'
      returns: ValidationResult
      body_hint: 'result = ValidationResult(); _check_id_uniqueness(model, result); _check_referential_integrity(model, result);
