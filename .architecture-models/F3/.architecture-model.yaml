    name: core.differ
    status: ACTIVE
    description: Model version comparison and diff generation
    f_block: F3
    files:
    - src/architecture_model/core/differ.py
    signatures:
    - name: has_changes
      returns: bool
      decorators:
      - property
      body_hint: return bool(self.entity_changes or self.relationship_changes)
    - name: added_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for c in self.entity_changes if c.change_type == ChangeType.ADDED))
    - name: removed_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for c in self.entity_changes if c.change_type == ChangeType.REMOVED))
    - name: modified_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for c in self.entity_changes if c.change_type == ChangeType.MODIFIED))
    - name: summary
      returns: str
      body_hint: "if not self.has_changes:\n    return 'No changes detected.'; return f'Changes: +{self.added_count} -{self.removed_count}\
        \ ~{self.modified_count} entities, {len(self.relationship_changes)} relationship changes'"
    - name: format_report
      returns: str
      body_hint: "if not self.has_changes:\n    return 'No changes detected between model versions.'; lines: list[str] = ['#\
        \ Architecture Model Diff', '', self.summary(), '']; if self.entity_changes:\n    lines.append('## Entity Changes')\n\
        \    lines.append('')\n    by_type: dict[str, list[EntityChange]] = {}\n    for change in self.entity_changes:\n \
        \       by_type.setdefault(change.entity_type, []).append(change)\n    for etype, changes in sorted(by_type.items()):\n\
        \        lines.append(f'### {etype.title()}s')\n        for c in changes:\n            prefix = {'added': '+', 'removed':\
        \ '-', 'modified': '~'}[c.change_type.value]\n            detail = f' ({c.details})' if c.details else ''\n      \
        \      lines.append(f'  {prefix} {c.entity_id}: {c.entity_name}{detail}')\n        lines.append(''); if self.relationship_changes:\n\
        \    lines.append('## Relationship Changes')\n    lines.append('')\n    for rc in self.relationship_changes:\n   \
        \     prefix = {'added': '+', 'removed': '-', 'modified': '~'}[rc.change_type.value]\n        lines.append(f'  {prefix}\
        \ {rc.from_id} --{rc.rel_type}--> {rc.to_id}'); return '\\n'.join(lines)"
    - name: affected_artifacts
      returns: set[str]
      body_hint: "affected: set[str] = set(); for change in self.entity_changes:\n    etype = change.entity_type\n    if etype\
        \ in ('actor', 'behavior'):\n        affected.add('use-cases')\n    if etype == 'capability':\n        affected.add('functional-architecture')\n\
        \        affected.add('use-cases')\n    if etype in ('layer', 'component'):\n        affected.add('logical-architecture')\n\
        \    if etype == 'interface':\n        affected.add('icd')\n    if etype == 'constraint':\n        affected.add('requirements-analysis')\n\
        \    affected.add('readme'); return affected"
    - name: diff_models
      params:
      - 'old_model: ArchitectureModel'
      - 'new_model: ArchitectureModel'
      returns: ModelDiff
      body_hint: result = ModelDiff(); _diff_entity_list(old_model.entities.actors, new_model.entities.actors, 'actor', result);
        _diff_entity_list(old_model.entities.capabilities, new_model.entities.capabilities, 'capability', result); _diff_entity_list(old_model.entities.behaviors,
        new_model.entities.behaviors, 'behavior', result); _diff_entity_list(old_model.entities.interfaces, new_model.entities.interfaces,
        'interface', result); _diff_entity_list(old_model.entities.constraints, new_model.entities.constraints, 'constraint',
        result); _diff_entity_list(old_model.entities.layers, new_model.entities.layers, 'layer', result); _diff_entity_list(old_model.entities.components,
        new_model.entities.components, 'component', result); _diff_relationships(old_model.relationships, new_model.relationships,
        result); return result
