    - name: detect_behavior_triggers
      params:
      - 'behaviors: list[Behavior]'
      - 'call_graph: CallGraph'
      - 'behavior_entries: dict[str, str]'
      - 'max_depth: int'
      returns: list[Relationship]
      body_hint: "entry_to_beh: dict[str, str] = {qname: beh_id for beh_id, qname in behavior_entries.items()}; triggers:\
        \ list[Relationship] = []; seen: set[tuple[str, str]] = set(); for beh in behaviors:\n    entry_qname = behavior_entries.get(beh.id)\n\
        \    if not entry_qname or entry_qname not in call_graph.edges:\n        continue\n    flow = trace_flow(call_graph,\
        \ entry_qname, max_depth=max_depth)\n    for file, fname in flow.steps:\n        qname = f'{file}:{fname}'\n     \
        \   if qname == entry_qname:\n            continue\n        if qname in entry_to_beh:\n            target_beh_id =\
        \ entry_to_beh[qname]\n            if target_beh_id == beh.id:\n                continue\n            pair = (beh.id,\
        \ target_beh_id)\n            if pair not in seen:\n                seen.add(pair)\n                triggers.append(Relationship(type=RelationType.TRIGGERS,\
        \ from_id=beh.id, to_id=target_beh_id)); return triggers"
