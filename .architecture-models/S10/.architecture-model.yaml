      returns: dict[str, str]
      body_hint: "file_funcs: dict[str, list[str]] = {}; for qname, loc in call_graph.locations.items():\n    file_funcs.setdefault(loc,\
        \ []).append(qname); entries: dict[str, str] = {}; for beh in behaviors:\n    if not beh.source_file:\n        continue\n\
        \    snake_name = beh.name.lower().replace(' ', '_').replace('-', '_')\n    candidate = f'{beh.source_file}:{snake_name}'\n\
        \    if candidate in call_graph.locations or candidate in call_graph.edges:\n        entries[beh.id] = candidate\n\
        \        continue\n    file_qnames = file_funcs.get(beh.source_file, [])\n    if file_qnames:\n        best = None\n\
        \        best_score = -1\n        for qn in file_qnames:\n            fname = qn.split(':', 1)[1]\n            score\
        \ = len(set(fname.lower()) & set(snake_name))\n            if score > best_score:\n                best = qn\n   \
        \             best_score = score\n        if best:\n            entries[beh.id] = best; return entries"
