meta:
  schema_version: '2.0'
  project: architecture-model-standard/cli
  system: CLI
  generated_at: '2026-07-21T23:13:19.345941+00:00'
entities:
  actors:
  - id: ACT-USER
    name: CLI User
    status: ACTIVE
    description: Human operator invoking architecture-model commands from the terminal.
    type: human
  - id: ACT-CORE
    name: Core Module
    status: ACTIVE
    description: External system providing parser (load_model, save_model), validator (validate_model), slicer, differ, coverage,
      and type definitions.
    type: human
  - id: ACT-CONFIG
    name: Config Module
    status: ACTIVE
    description: External system providing discover_config, write_config, get_config, and CONFIG_FILENAME for project initialization
      and configuration.
    type: human
  - id: ACT-MANIFEST
    name: Manifest Module
    status: ACTIVE
    description: External system providing generate_manifest and recursive manifest generation for AST-based source code scanning.
    type: human
  - id: ACT-ORCHESTRATION
    name: Orchestration Module
    status: ACTIVE
    description: External system providing enrich_model and decompose_model for model enrichment and F-block decomposition.
    type: human
  - id: ACT-FILESYSTEM
    name: Filesystem
    status: ACTIVE
    description: Local filesystem for reading models/source and writing output files.
    type: human
  capabilities:
  - id: CAP-CMD
    name: Command Dispatch
    status: ACTIVE
    description: Parse CLI arguments via argparse and dispatch to the appropriate command handler based on the subcommand
      name.
  - id: CAP-VALIDATE
    name: Model Validation
    status: ACTIVE
    description: Validate architecture model invariants with optional strict mode.
  - id: CAP-SLICE
    name: Model Slicing
    status: ACTIVE
    description: Extract model subsets by F-block, layer, artifact, or status.
  - id: CAP-DIFF
    name: Model Diffing
    status: ACTIVE
    description: Compare two model versions and report changes with affected artifacts.
  - id: CAP-STATS
    name: Model Statistics
    status: ACTIVE
    description: Display comprehensive model statistics including entity counts, relationship breakdown, and validation score.
  - id: CAP-INIT
    name: Project Initialization
    status: ACTIVE
    description: Auto-generate .architecture-model.yaml by scanning project directory structure.
  - id: CAP-IMPACT
    name: Impact Analysis
    status: ACTIVE
    description: BFS-based impact analysis tracing affected entities through relationships.
  - id: CAP-MANIFEST
    name: Manifest Generation
    status: ACTIVE
    description: Generate reality-manifest.json from source code, with optional recursive per-F-block mode.
  - id: CAP-ENRICH
    name: Model Enrichment
    status: ACTIVE
    description: Auto-enrich model with function signatures, constants, and test contracts.
  - id: CAP-DECOMPOSE
    name: Model Decomposition
    status: ACTIVE
    description: Generate per-F-block sub-models from parent model and recursive manifests.
  - id: CAP-COVERAGE
    name: Coverage Analysis
    status: ACTIVE
    description: Analyze model coverage against code reality via manifest comparison.
  - id: CAP-VISUALIZE
    name: Visualization
    status: ACTIVE
    description: Generate Mermaid diagrams (overview, dependency, block detail) from architecture models.
  behaviors:
  - id: BEH-DISPATCH
    name: Command Dispatch
    status: ACTIVE
    description: Parse argv, identify subcommand, and invoke the matching handler function.
    trigger: CLI invocation with subcommand
    steps:
    - Parse arguments with argparse
    - If no command, print help and return 1
    - Look up handler in dispatch dict
    - Call handler with parsed args
    - Return handler exit code
  - id: BEH-INIT
    name: Init Command
    status: ACTIVE
    description: Scan project directory and auto-generate .architecture-model.yaml configuration.
    trigger: architecture-model init <path> [--force]
    steps:
    - Resolve project root path
    - Check if config already exists (abort unless --force)
    - Call discover_config to scan directory structure
    - Print summary (project, system, layers, F-blocks, metrics)
    - Call write_config to persist
  - id: BEH-VALIDATE
    name: Validate Command
    status: ACTIVE
    description: Load model, run validation, print summary and issues.
    trigger: architecture-model validate <model> [--strict]
    steps:
    - Load model from YAML path
    - Run validate_model with strict flag
    - Print validation summary
    - Print each issue if any
    - Return 0 if valid, 1 otherwise
  - id: BEH-SLICE
    name: Slice Command
    status: ACTIVE
    description: Load model and extract subset by fblock, layer, artifact, or status filter.
    trigger: architecture-model slice <model> --fblock|--layer|--artifact|--status
    steps:
    - Load model from YAML path
    - Determine slice type from args (fblock/layer/artifact/status)
    - Call appropriate slicer function
    - Print entity and relationship counts
    - Optionally save to output path
  - id: BEH-DIFF
    name: Diff Command
    status: ACTIVE
    description: Compare two model versions and report structural changes.
    trigger: architecture-model diff <old> <new>
    steps:
    - Load both models
    - Call diff_models
    - Print diff report
    - Print affected artifacts if changes exist
  - id: BEH-STATS
    name: Stats Command
    status: ACTIVE
    description: Display comprehensive model statistics.
    trigger: architecture-model stats <model>
    steps:
    - Load model
    - Print meta info (project, system, schema version, generated date)
    - Print entity counts by type
    - Print relationship type breakdown
    - Print status breakdown
    - Run validation and print score
  - id: BEH-IMPACT
    name: Impact Command
    status: ACTIVE
    description: BFS traversal through relationships to find affected entities.
    trigger: architecture-model impact <model> <entity_id> [--depth N]
    steps:
    - Load model and collect all entity IDs
    - Verify entity_id exists
    - Build undirected adjacency graph from relationships
    - BFS up to specified depth
    - Print affected entities with their depth level
  - id: BEH-MANIFEST
    name: Manifest Command
    status: ACTIVE
    description: Generate reality manifest JSON from source code scanning.
    trigger: architecture-model manifest <path> [-o output] [--recursive]
    steps:
    - Resolve and validate project root
    - If --recursive, generate per-F-block manifests and write to output dir
    - Otherwise generate single manifest via generate_manifest
    - Determine output path from args or config
    - Write JSON and print summary (modules, interfaces, F-blocks, metrics)
  - id: BEH-ENRICH
    name: Enrich Command
    status: ACTIVE
    description: Auto-enrich model components with signatures, constants, test contracts.
    trigger: architecture-model enrich <model> [--root path]
    steps:
    - Load model from path
    - Count signatures, constants, test contracts before
    - Call enrich_model with project root
    - Save enriched model back
    - Print before/after counts with deltas
  - id: BEH-DECOMPOSE
    name: Decompose Command
    status: ACTIVE
    description: Generate per-F-block sub-models from parent model.
    trigger: architecture-model decompose <path> [-o output]
    steps:
    - Resolve root and verify .architecture-model.yaml exists
    - Call decompose_model to generate sub-models
    - Write sub-models to output directory
    - Print count and per-block entity/relationship summary
  - id: BEH-COVERAGE
    name: Coverage Command
    status: ACTIVE
    description: Analyze model coverage against code reality.
    trigger: architecture-model coverage <model> [-p project] [--manifest path]
    steps:
    - Load model
    - Load or generate manifest (from --manifest path or by scanning project)
    - Call coverage_report
    - Print summary
    - Return 0 if score >= 80, else 1
  - id: BEH-VISUALIZE
    name: Visualize Command
    status: ACTIVE
    description: Generate Mermaid diagrams from architecture model.
    trigger: architecture-model visualize <path> [-o output]
    steps:
    - Load model from .architecture-model.yaml in project root
    - Generate overview diagram (components grouped by F-block with behavior nodes)
    - Generate dependency diagram (inter-component depends-on edges)
    - Load sub-behaviors.yaml if present for block detail diagrams
    - Write all diagrams as markdown files with mermaid code blocks
  - id: BEH-OVERVIEW-DIAGRAM
    name: Generate Overview Diagram
    status: ACTIVE
    description: Create flowchart TB showing behaviors, components grouped by f_block subgraphs, and traces-to edges.
    trigger: Called by visualize command
    steps:
    - Group components by f_block
    - Get f_block display names from capabilities
    - Emit subgraphs (collapse if >8 components)
    - Emit behavior nodes (stadium shape)
    - Emit traces-to relationship edges
  - id: BEH-BLOCK-DIAGRAM
    name: Generate Block Diagram
    status: ACTIVE
    description: Create flowchart for one F-block showing parent behavior, sub-behaviors with steps, and component traces.
    trigger: Called by visualize command for each F-block
    steps:
    - Find parent behavior by ID
    - Filter sub-behaviors for this parent
    - Emit sub-behavior nodes with up to 3 steps
    - Emit contains edges from parent to sub-behaviors
    - Emit traces-to edges from components to sub-behaviors
  - id: BEH-DEPENDENCY-DIAGRAM
    name: Generate Dependency Diagram
    status: ACTIVE
    description: Create flowchart LR showing inter-component depends-on relationships grouped by f_block.
    trigger: Called by visualize command
    steps:
    - Group components by f_block
    - Emit subgraphs per f_block
    - Emit depends-on relationship edges
  interfaces:
  - id: IF-CLI-ENTRY
    name: CLI Entry Point
    status: ACTIVE
    description: The main() function serving as the console_scripts entry point (architecture-model). Accepts optional argv
      list, returns int exit code.
    type: internal
  - id: IF-ARGPARSE
    name: Argument Parser
    status: ACTIVE
    description: 'argparse-based interface defining 11 subcommands with their arguments: init, validate, slice, diff, stats,
      impact, manifest, enrich, decompose, coverage, visualize.'
    type: internal
  - id: IF-STDOUT
    name: Standard Output
    status: ACTIVE
    description: All command output is printed to stdout (summaries, reports, diagrams). Exit codes indicate success (0) or
      failure (1).
    type: internal
  - id: IF-CORE-API
    name: Core Module API
    status: ACTIVE
    description: 'Imports from core: load_model, save_model, validate_model, slice_by_fblock, slice_by_layer, slice_by_status,
      slice_for_artifact, diff_models, coverage_report, Status, RelationType.'
    type: internal
  - id: IF-CONFIG-API
    name: Config Module API
    status: ACTIVE
    description: 'Imports from config: discover_config, write_config, get_config, CONFIG_FILENAME.'
    type: internal
  - id: IF-MANIFEST-API
    name: Manifest Module API
    status: ACTIVE
    description: 'Imports from manifest: generate_manifest, generate_recursive_manifests, write_recursive_manifests.'
    type: internal
  - id: IF-ORCHESTRATION-API
    name: Orchestration Module API
    status: ACTIVE
    description: 'Imports from orchestration: enrich_model, decompose_model, write_sub_models.'
    type: internal
  - id: IF-VISUALIZE-API
    name: Visualize API
    status: ACTIVE
    description: 'Three public functions: generate_overview_diagram(model), generate_block_diagram(model, sub_behaviors, block_name,
      parent_id), generate_dependency_diagram(model). All return Mermaid string.'
    type: internal
  constraints:
  - id: CON-EXIT-CODES
    name: Exit Code Convention
    status: ACTIVE
    description: All commands return 0 on success, 1 on error or validation failure.
    type: technology
  - id: CON-LAZY-IMPORTS
    name: Lazy Import Pattern
    status: ACTIVE
    description: All heavy dependencies (core, config, manifest, orchestration) are imported inside handler functions, not
      at module level. This keeps CLI startup fast and avoids circular imports.
    type: technology
  - id: CON-MERMAID-COMPAT
    name: Mermaid ID Sanitization
    status: ACTIVE
    description: All entity IDs are sanitized (hyphens to underscores) for Mermaid compatibility via _sanitize_id helper.
    type: technology
  components:
  - id: COMP-MAIN
    name: main
    status: ACTIVE
    description: CLI entry point module containing argparse setup, main() dispatch function, and all command handler functions
      (_cmd_init through _cmd_visualize). 569 lines.
    files:
    - src/architecture_model/cli/main.py
    signatures:
