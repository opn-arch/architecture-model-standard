      params:
      - 'argv: list[str] | None'
      returns: int
      body_hint: 'parser = argparse.ArgumentParser(prog=''architecture-model'', descri...; subparsers = parser.add_subparsers(dest=''command'',
        help=''Available com...; p_validate = subparsers.add_parser(''validate'', help=''Validate model in...; p_validate.add_argument(''model'',
        help=''Path to architecture-model.yaml''); p_validate.add_argument(''--strict'', action=''store_true'', help=''Promote
        warnings to errors''); p_slice = subparsers.add_parser(''slice'', help=''Extract model subset''); p_slice.add_argument(''model'',
        help=''Path to architecture-model.yaml''); p_slice.add_argument(''--fblock'', help=''Filter by F-block (e.g., F3)'');
        p_slice.add_argument(''--layer'', help=''Filter by layer (e.g., web-layer)''); p_slice.add_argument(''--artifact'',
        help=''Slice for artifact regeneration''); p_slice.add_argument(''--status'', help=''Filter by status (ACTIVE, PLANNED)'');
        p_slice.add_argument(''-o'', ''--output'', help=''Output YAML path (default: stdout summary)''); p_diff = subparsers.add_parser(''diff'',
        help=''Compare two model ver...; p_diff.add_argument(''old_model'', help=''Path to old/baseline model''); p_diff.add_argument(''new_model'',
        help=''Path to new/current model''); p_stats = subparsers.add_parser(''stats'', help=''Show model statistics''); p_stats.add_argument(''model'',
        help=''Path to architecture-model.yaml''); p_init = subparsers.add_parser(''init'', help=''Auto-generate .archit...;
        p_init.add_argument(''path'', nargs=''?'', default=''.'', help=''Project root directory (default: cwd)''); p_init.add_argument(''--force'',
        action=''store_true'', help=''Overwrite existing config file''); p_impact = subparsers.add_parser(''impact'', help=''Impact
        analysis for...; p_impact.add_argument(''model'', help=''Path to architecture-model.yaml''); p_impact.add_argument(''entity_id'',
