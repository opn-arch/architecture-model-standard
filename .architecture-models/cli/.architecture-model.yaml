  - id: COMP-VISUALIZE
    name: visualize
    status: ACTIVE
    description: 'Mermaid diagram generation module with three diagram types: overview (flowchart TB), block detail (per F-block),
      and dependency (flowchart LR). 178 lines.'
    files:
    - src/architecture_model/cli/visualize.py
    signatures:
    - name: generate_overview_diagram
      params:
      - 'model: ArchitectureModel'
      returns: str
      body_hint: 'lines = [''flowchart TB'']; fblock_groups: dict[str, list] = defaultdict(list); for comp in model.entities.components:
