        ''is_relative'': i.is_relative} for i in self.imports_detailed], ''module_constants'': self.module_constants, ''module_assignments'':
        self.module_assignments}'
    - name: success_rate
      returns: float
      decorators:
      - property
      body_hint: "if self.files_attempted == 0:\n    return 1.0; return self.files_succeeded / self.files_attempted"
    - name: log_summary
      returns: None
      body_hint: 'logger.info(''Scan complete: %d/%d files (%.1f%%), %d funcs, %d classes, %d constants, %d interfaces, %d
        blocks, %d unclaimed, %d errors'', self.files_succeeded, self.files_attempted, self.success_rate * 100, self.functions_extracted,
        self.classes_extracted, self.constants_extracted, self.interfaces_derived, self.blocks_processed, self.unclaimed_files,
        len(self.parse_errors))'
