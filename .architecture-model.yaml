meta:
  project: architecture-model-standard
  schema_version: '1.4'
  source_artifacts:
    - .architecture-model.yaml

entities:
  actors:
    - id: ACT-DEV
      name: Developer
      status: ACTIVE
      description: Software engineer using CLI to manage architecture models
    - id: ACT-LLM
      name: LLM Agent
      status: ACTIVE
      description: AI agent consuming architecture models via opencode-arch MCP tools

  layers:
    - id: L-APP
      name: Application Layer
      status: ACTIVE

  capabilities:
    - id: CAP-F1
      name: Model Parsing & Validation
      status: ACTIVE
      f_block: F3
      description: Parse YAML models and validate structural correctness (score 0-100)
    - id: CAP-F2
      name: Reality Manifest Generation
      status: ACTIVE
      f_block: F4
      description: AST scanning to produce ground-truth code inventories with metrics, body hints, and test contracts
    - id: CAP-F3
      name: Model Slicing & Diffing
      status: ACTIVE
      f_block: F3
      description: Subset extraction by F-block/layer, model version comparison, and enriched model composition
    - id: CAP-F4
      name: CLI Operations
      status: ACTIVE
      f_block: F1
      description: "Command-line interface for init, validate, slice, diff, stats, impact, manifest"
    - id: CAP-F5
      name: Configuration Management
      status: ACTIVE
      f_block: F2
      description: Auto-discovery config loading and project configuration schema
    - id: CAP-F6
      name: Schema Specification
      status: ACTIVE
      f_block: F5
      description: JSON Schema definitions for architecture model validation

  behaviors:
    - id: BEH-INIT
      name: Project Initialization
      status: ACTIVE
      description: Scan directory structure, discover source root, auto-generate .architecture-model.yaml
    - id: BEH-VALIDATE
      name: Model Validation
      status: ACTIVE
      description: Check architectural claims against schema and structural invariants, produce score 0-100
    - id: BEH-MANIFEST
      name: Manifest Generation
      status: ACTIVE
      description: Walk source tree, parse ASTs, extract functions/classes/imports, compute metrics, discover blocks

  interfaces:
    - id: IF-CLI
      name: CLI Interface
      status: ACTIVE
      description: "Entry point: architecture-model {init,validate,slice,diff,stats,impact,manifest}"
    - id: IF-PARSE-API
      name: Parser API
      status: ACTIVE
      description: "load_model(path) -> ArchitectureModel, save_model(model, path), dump_model(model) -> str"
    - id: IF-VALIDATE-API
      name: Validator API
      status: ACTIVE
      description: "validate_model(model) -> ValidationResult (score, issues, is_valid)"
    - id: IF-MANIFEST-API
      name: Manifest API
      status: ACTIVE
      description: "generate_manifest(project_root) -> dict with modules, metrics, functional_blocks, interfaces"
    - id: IF-SLICER-API
      name: Slicer API
      status: ACTIVE
      description: "slice_by_fblock(model, id), slice_by_layer(model, id), slice_for_artifact(model, artifact)"

  constraints:
    - id: CON-SCHEMA
      name: Schema Compliance
      status: ACTIVE
      description: All models must conform to JSON Schema v1.4 with 7 entity types and 8 relationship types
    - id: CON-NO-ORPHANS
      name: No Orphaned Entities
      status: ACTIVE
      description: Every entity must participate in at least one relationship

  components:
    - id: COMP-CORE
      name: core
      status: ACTIVE
      description: "Parser, validator, slicer, differ, merger, decomposer, type system (ArchitectureModel, Component, Capability, etc.)"
    - id: COMP-MANIFEST
      name: manifest
      status: ACTIVE
      description: "AST scanner, block discovery, metrics, interface detection, body hints, test analyzer, display, slicers"
    - id: COMP-CONFIG
      name: config
      status: ACTIVE
      description: Configuration loader (auto-discovery) and schema definition
    - id: COMP-SPEC
      name: spec
      status: ACTIVE
      description: JSON Schema definitions for architecture model validation
    - id: COMP-CLI
      name: cli
      status: ACTIVE
      description: "CLI entry point and command dispatch (7 commands: init, validate, slice, diff, stats, impact, manifest)"

relationships:
  # Layer containment
  - from: L-APP
    to: COMP-CORE
    type: contains
  - from: L-APP
    to: COMP-MANIFEST
    type: contains
  - from: L-APP
    to: COMP-CLI
    type: contains
  - from: L-APP
    to: COMP-CONFIG
    type: contains
  - from: L-APP
    to: COMP-SPEC
    type: contains
  # Capability realization
  - from: COMP-CORE
    to: CAP-F1
    type: realizes
  - from: COMP-CORE
    to: CAP-F3
    type: realizes
  - from: COMP-MANIFEST
    to: CAP-F2
    type: realizes
  - from: COMP-CLI
    to: CAP-F4
    type: realizes
  - from: COMP-CONFIG
    to: CAP-F5
    type: realizes
  - from: COMP-SPEC
    to: CAP-F6
    type: realizes
  # Interface exposure
  - from: COMP-CLI
    to: IF-CLI
    type: exposes
  - from: COMP-CORE
    to: IF-PARSE-API
    type: exposes
  - from: COMP-CORE
    to: IF-VALIDATE-API
    type: exposes
  - from: COMP-CORE
    to: IF-SLICER-API
    type: exposes
  - from: COMP-MANIFEST
    to: IF-MANIFEST-API
    type: exposes
  # Constraint application
  - from: COMP-CORE
    to: CON-SCHEMA
    type: constrained-by
  - from: COMP-SPEC
    to: CON-SCHEMA
    type: constrained-by
  - from: COMP-CORE
    to: CON-NO-ORPHANS
    type: constrained-by
  # Dependencies
  - from: COMP-CLI
    to: COMP-CORE
    type: depends-on
  - from: COMP-CLI
    to: COMP-CONFIG
    type: depends-on
  - from: COMP-CLI
    to: COMP-MANIFEST
    type: depends-on
  - from: COMP-CORE
    to: COMP-CONFIG
    type: depends-on
  - from: COMP-CORE
    to: COMP-SPEC
    type: depends-on
  - from: COMP-MANIFEST
    to: COMP-CONFIG
    type: depends-on
  # Behavior implementation
  - from: COMP-CLI
    to: BEH-INIT
    type: traces-to
  - from: COMP-CORE
    to: BEH-VALIDATE
    type: traces-to
  - from: COMP-MANIFEST
    to: BEH-MANIFEST
    type: traces-to
  # Actor interactions
  - from: ACT-DEV
    to: IF-CLI
    type: consumes
  - from: ACT-LLM
    to: IF-PARSE-API
    type: consumes
  - from: ACT-LLM
    to: IF-SLICER-API
    type: consumes
