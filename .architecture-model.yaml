  - id: COMP-5
    name: Orchestration
    status: ACTIVE
    description: High-level workflows — enrichment, decomposition, behavior analysis
    intent: Compose lower-level operations into complete workflows that transform models end-to-end
    goals:
    - Enrich models with signatures, constants, and test contracts from manifests
    - Decompose models into hierarchical per-system sub-models
    - Detect and wire cross-component behavior flows
    failure_modes:
    - Enrichment overwrites manually curated model data
    - Decomposition creates too many tiny sub-models that fragment context
    - Behavior inference produces spurious flows from coincidental call patterns
    trade_offs:
    - Automated enrichment (convenient) vs. manual curation (precise)
    - Aggressive decomposition vs. keeping small systems inline
    - Behavior cap (40 per component) vs. complete behavioral coverage
    layer: application
    files:
    - src/architecture_model/orchestration/__init__.py
    evidence:
      test_coverage:
        test_count: 10
        source: component_test_map.json
