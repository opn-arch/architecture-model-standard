  - id: COMP-3.2
    name: Graph & Analysis
    status: ACTIVE
    description: Import resolution, call graphs, interface extraction, behavior detection
    intent: Call graph infrastructure for multi-hop behavior flow tracing
    layer: domain
    files:
    - src/architecture_model/manifest/call_graph.py
    - src/architecture_model/manifest/interfaces.py
    - src/architecture_model/manifest/behavior.py
    - src/architecture_model/manifest/chains.py
    - src/architecture_model/manifest/test_analyzer.py
    kind: library
    contract: resolve_imports() → edges, extract_interfaces() → InterfaceInfo
    constants:
    - name: _BUILTINS
      value: frozenset({'print', 'len', 'str', 'int', 'float', 'bool', 'list', 'dict', 'set', 'tuple', 'range', 'enumerate',
        'zip', 'map', 'filter', 'sorted', 'reversed', 'min', 'max', 'sum', 'abs', 'round', 'isinstance', 'issubclass', 'hasattr',
        'getattr', 'setattr', 'delattr', 'type', 'id', 'repr', 'hash', 'iter', 'next', 'super', 'object', 'property', 'staticmethod',
        'classmethod', 'vars', 'dir', 'any', 'all', 'ord', 'chr', 'hex', 'oct', 'bin', 'format', 'input', 'open'})
    - name: _EXCLUDED_MODULES
      value: frozenset({'unittest', 'pytest', 'sys', 'os', 'io', 're', 'math', 'collections', 'itertools', 'functools', 'pathlib',
        'typing', 'tempfile', 'shutil', 'json', 'copy', 'contextlib', 'textwrap', 'unittest.mock', 'mock'})
    - name: _ESCAPE_CODE_RE
      value: re.compile('\\\\(?:033|x1b)\\[(\\d+)m')
    signatures:
    - name: build_call_graph
      params:
      - 'manifest: Manifest'
      returns: CallGraph
      body_hint: 'graph = CallGraph(); name_index: dict[str, list[str]] = {}; for mod in manifest.modules: ...; mod_path_to_file:
        dict[str, str] = {}; for mod in manifest.modules: ...; for mod in manifest.modules: ...; return graph'
    - name: trace_flow
      params:
      - 'graph: CallGraph'
      - 'entry: str'
      - 'max_depth: int'
      returns: FlowTrace
      body_hint: 'steps: list[tuple[str, str]] = []; visited: set[str] = set(); queue: deque[tuple[str, int]] = deque(); queue.append((entry,
        0)); truncated = False; actual_depth = 0; while queue: ...; return FlowTrace(entry=entry, steps=steps, components_crossed=[],
        depth=actual_depth, truncated=truncated)'
    - name: map_flow_to_components
      params:
      - 'flow: FlowTrace'
      - 'file_to_comp: dict[str, str]'
      returns: FlowTrace
      body_hint: "crossed: list[str] = []; prev: str | None = None; for file, _ in flow.steps:\n    comp = file_to_comp.get(file)\n\
        \    if comp and comp != prev:\n        crossed.append(comp)\n        prev = comp; return FlowTrace(entry=flow.entry,\
        \ steps=flow.steps, components_crossed=crossed, depth=flow.depth, truncated=flow.truncated)"
    - name: derive_interfaces
      params:
      - 'modules: list[ModuleInfo]'
      - 'root: Path'
      returns: list[InterfaceEdge]
      body_hint: "file_to_module: dict[str, str] = {}; for mod in modules: ...; module_to_file: dict[str, str] = {v: k for\
        \ k, v in file_t...; file_set: set[str] = {f.removesuffix('.py') for f in file...; interfaces: list[InterfaceEdge]\
        \ = []; seen: set[tuple[str, str]] = set(); def _add_edge(source: str, target: str, import_path: str)...; def _resolve_dotted(dotted:\
        \ str) -> str | None:\n    \"\"\"Re...; for mod in modules: ...; logger.debug('Derived %d interface edges from %d\
        \ modules', len(interfaces), len(modules)); return interfaces"
    - name: extract_call_order
      params:
      - 'func_node: Union[ast.FunctionDef, ast.AsyncFunctionDef]'
      returns: list[str]
      body_hint: 'calls: list[str] = []; _walk_body_for_calls(func_node.body, calls); return calls'
    - name: extract_control_flow
      params:
      - 'func_node: Union[ast.FunctionDef, ast.AsyncFunctionDef]'
      returns: list[str]
      body_hint: "patterns: set[str] = set(); func_name = func_node.name; for node in ast.walk(func_node):\n    if isinstance(node,\
        \ ast.Try):\n        patterns.add('try_except')\n    elif isinstance(node, ast.For):\n        patterns.add('for_loop')\n\
        \    elif isinstance(node, ast.AsyncFor):\n        patterns.add('async_for')\n    elif isinstance(node, ast.While):\n\
        \        patterns.add('while_loop')\n    elif isinstance(node, ast.With):\n        patterns.add('with_context')\n\
        \    elif isinstance(node, ast.AsyncWith):\n        patterns.add('async_with')\n    elif isinstance(node, (ast.Yield,\
        \ ast.YieldFrom)):\n        patterns.add('generator')\n    elif isinstance(node, ast.If):\n        if _count_if_branches(node)\
        \ >= 3:\n            patterns.add('if_chain')\n    elif isinstance(node, ast.Call):\n        name = _call_name(node)\n\
        \        if name == func_name:\n            patterns.add('recursion')\n    elif hasattr(ast, 'Match') and isinstance(node,\
        \ ast.Match):\n        patterns.add('match_case')\n    elif hasattr(ast, 'TryStar') and isinstance(node, ast.TryStar):\n\
        \        patterns.add('try_except'); order = ['try_except', 'for_loop', 'async_for', 'while_loop', 'if_chain', 'with_context',\
        \ 'async_with', 'generator', 'match_case', 'recursion']; return [p for p in order if p in patterns]"
    - name: extract_guards
      params:
      - 'func_node: Union[ast.FunctionDef, ast.AsyncFunctionDef]'
      returns: list[str]
      body_hint: "guards: list[str] = []; first_stmts = func_node.body[:6]; for stmt in first_stmts:\n    if isinstance(stmt,\
        \ ast.Assert):\n        cond_text = ast.unparse(stmt.test)\n        guards.append(f'assert {cond_text}')\n    elif\
        \ isinstance(stmt, ast.If):\n        if len(stmt.body) == 1:\n            inner = stmt.body[0]\n            cond_text\
        \ = ast.unparse(stmt.test)\n            if isinstance(inner, ast.Raise):\n                exc = ast.unparse(inner.exc)\
        \ if inner.exc else 'Exception'\n                guards.append(f'raise {exc} if {cond_text}')\n            elif isinstance(inner,\
        \ ast.Return):\n                val = ast.unparse(inner.value) if inner.value else 'None'\n                guards.append(f'return\
        \ {val} if {cond_text}'); return guards"
