meta:
  project: architecture-model-standard
  schema_version: '1.3'

entities:
  layers:
    - id: L-APP
      name: Application Layer
      status: ACTIVE

  capabilities:
    - id: CAP-F1
      name: Model Parsing & Validation
      status: ACTIVE
      description: Parse YAML models and validate structural correctness
    - id: CAP-F2
      name: Reality Manifest Generation
      status: ACTIVE
      description: AST scanning to produce ground-truth code inventories
    - id: CAP-F3
      name: LLM Context Integration
      status: ACTIVE
      description: Token-compressed context formatting for LLM consumption
    - id: CAP-F4
      name: CLI Operations
      status: ACTIVE
      description: Command-line interface for init, validate, slice, extract
    - id: CAP-F5
      name: Configuration & Schema
      status: ACTIVE
      description: Auto-discovery config loading and JSON Schema definitions
    - id: CAP-F6
      name: Model Extraction
      status: ACTIVE
      description: Extract architecture model from generated artifacts

  components:
    - id: COMP-CORE
      name: core
      status: ACTIVE
      description: Parser, validator, slicer, differ, merger, decomposer, types
    - id: COMP-MANIFEST
      name: manifest
      status: ACTIVE
      description: AST scanner, block discovery, metrics, interface detection
    - id: COMP-INTEG
      name: integrations
      status: ACTIVE
      description: LLM context formatter and pipeline bridge
    - id: COMP-CLI
      name: cli
      status: ACTIVE
      description: CLI entry point and command dispatch
    - id: COMP-CONFIG
      name: config
      status: ACTIVE
      description: Configuration loader and schema definition
    - id: COMP-EXTRACT
      name: extract
      status: ACTIVE
      description: Model extraction from Tier-1 artifacts

relationships:
  - from: L-APP
    to: COMP-CORE
    type: contains
  - from: L-APP
    to: COMP-MANIFEST
    type: contains
  - from: L-APP
    to: COMP-INTEG
    type: contains
  - from: COMP-CORE
    to: CAP-F1
    type: realizes
  - from: COMP-MANIFEST
    to: CAP-F2
    type: realizes
  - from: COMP-INTEG
    to: CAP-F3
    type: realizes
  - from: COMP-CLI
    to: CAP-F4
    type: realizes
  - from: COMP-CONFIG
    to: CAP-F5
    type: realizes
  - from: COMP-EXTRACT
    to: CAP-F6
    type: realizes
  - from: COMP-INTEG
    to: COMP-CORE
    type: depends-on
  - from: COMP-CLI
    to: COMP-CORE
    type: depends-on
  - from: COMP-EXTRACT
    to: COMP-CORE
    type: depends-on
