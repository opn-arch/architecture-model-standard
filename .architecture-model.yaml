    type: internal
    provider: COMP-CORE
  - id: IF-SLICE
    name: Slicer API
    status: ACTIVE
    description: slice_by_fblock(model, fblock_id), slice_by_layer(model, layer_id) -> ArchitectureModel
    type: internal
    provider: COMP-CORE
  - id: IF-MANIFEST
    name: Manifest Generator API
    status: ACTIVE
    description: generate_manifest(project_root, config?) -> Manifest
    type: internal
    provider: COMP-MANIFEST
  - id: IF-CONFIG
    name: Config Loader API
    status: ACTIVE
    description: get_config(root), discover_config(root), write_config(config, root)
    type: internal
    provider: COMP-CONFIG
  - id: IF-PIPELINE
    name: Pipeline API
    status: ACTIVE
    description: run_pipeline(project_root, deep?, compact?, from_scratch?) -> PipelineResult
    type: internal
    provider: COMP-ORCHESTRATION
  - id: IF-ENRICH
    name: Enrichment API
    status: ACTIVE
    description: enrich_model(model, project_root) -> ArchitectureModel with signatures/constants/test_contracts
    type: internal
    provider: COMP-ORCHESTRATION
  - id: IF-DECOMPOSE
    name: Decomposition API
    status: ACTIVE
    description: decompose_model(model) -> dict[str, ArchitectureModel], write_sub_models()
    type: internal
    provider: COMP-ORCHESTRATION
  - id: IF-EXTRACT
    name: Extract API
    status: ACTIVE
    description: extract_from_code(project_root, config?, manifest?) -> ArchitectureModel
    type: internal
    provider: COMP-EXTRACT
  - id: IF-GATE
    name: Development Gate API
    status: ACTIVE
    description: check_development_gate(model, manifest, phase?) -> GateResult
    type: internal
    provider: COMP-AUTHORING
  - id: IF-DOCS
    name: Docs Generator API
    status: ACTIVE
    description: generate_docs(model, output_dir, manifest?, previous_model?) -> docs site
    type: internal
    provider: COMP-DOCS
  - id: IF-EXPORT
    name: Export API
    status: ACTIVE
    description: build_flat_export(repo_path, prefix?) -> ExportResult
    type: internal
    provider: COMP-EXPORT
  - id: IF-CLI
    name: CLI Interface
    status: ACTIVE
    description: '13 commands: init, validate, slice, diff, stats, impact, manifest, enrich, decompose, coverage, docs, visualize,
      author'
    type: external
    provider: COMP-CLI
  - id: IF-LLM-CONTEXT
    name: LLM Context API
    status: ACTIVE
    description: format_model_context(model, max_tokens, detail_level), format_fblock_context(model, f_block, max_tokens)
    type: internal
    provider: COMP-CORE
  - id: IF-PERSIST
    name: Persistence API
    status: ACTIVE
    description: save_project(root, model, manifest) -> Path
    type: internal
    provider: COMP-PERSISTENCE
  constraints:
  - id: CON-SCHEMA
    name: Schema Version
    status: ACTIVE
    description: Models must declare schema_version 2.0 in meta section
    type: technology
    threshold: '2.0'
  - id: CON-PYTHON
    name: Python Version
    status: ACTIVE
    description: Requires Python >= 3.10 (union syntax, match statements)
    type: technology
    threshold: '>=3.10'
  - id: CON-INTEGRITY
    name: Referential Integrity
    status: ACTIVE
    description: All relationship from/to IDs must reference existing entities
    type: reliability
    rationale: Broken references make model unusable for impact analysis
  - id: CON-UNIQUENESS
    name: ID Uniqueness
    status: ACTIVE
    description: Entity IDs must be unique across all entity types
    type: reliability
    rationale: Duplicate IDs cause ambiguous references
  - id: CON-SCORE
    name: Validation Score Threshold
    status: ACTIVE
    description: Production models should achieve validation score >= 90/100
    type: reliability
    threshold: '90'
  - id: CON-REGEN
    name: Regeneration Readiness
    status: ACTIVE
    description: Enriched models must have sufficient signatures, constants, test_contracts for blind regeneration
    type: technology
    rationale: Enables lossless behavioral representation (100% fidelity in blind regen)
