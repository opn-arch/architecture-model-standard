    status: ACTIVE
    behavior_type: workflow_step
    description: For layer scopes, invoke slice_by_layer(model, layer_id).
    preconditions: Scope names a layer id
    postconditions: Sub-model containing that layer + contained components
  - id: BEH-26.6
    name: Prune by Depth
    status: ACTIVE
    behavior_type: workflow_step
    description: Walk contains graph BFS from scope root and drop nodes past depth; honor expand_kinds.
    preconditions: ViewSpec.depth is set on entity-scoped slice
    postconditions: Depth-bounded sub-model
  - id: BEH-26.7
    name: Merge Descendants
    status: ACTIVE
    behavior_type: workflow_step
    description: For descendants-scopes, merge root + all transitive contained entities into a single fragment.
    preconditions: Scope is descendants or descendants:each
    postconditions: Merged fragment
  - id: BEH-26.8
    name: Resolve Federated Refs
    status: ACTIVE
    behavior_type: workflow_step
    description: For federated slices, resolve child_refs (file:// or repo://) to PackageBundle and merge.
    preconditions: child_refs is non-empty
    postconditions: External child fragments materialized and merged
  - id: BEH-26.9
    name: Attach Supplementary
    status: ACTIVE
    behavior_type: workflow_step
    description: Load supplementary refs (sil, gates, drift, test_results) into MaterializedSlice.supplementary_fragments.
    preconditions: supplementary_refs is non-empty
    postconditions: Supplementary fragments loaded
  - id: BEH-26.10
    name: Compute Scope Metadata
    status: ACTIVE
    behavior_type: workflow_step
    description: For entity-scoped slices, compute parent, peers, scope_chain, inbound/outbound edges, contains_descendants.
    preconditions: Slice is entity-scoped
    postconditions: MaterializedSlice.provenance.scope_metadata populated
  - id: BEH-26.11
    name: Emit Materialized Slice
    status: ACTIVE
    behavior_type: workflow_step
    description: Serialize MaterializedSlice with digest for downstream projection.
    preconditions: All scope + closure + supplementary steps complete
    postconditions: MaterializedSlice with stable digest
  - id: BEH-27.1
    name: Load Lesson History
    status: ACTIVE
    behavior_type: workflow_step
    description: Read .architecture/learning/history.json — accumulated lessons from prior pipeline runs.
    preconditions: history.json is readable
    postconditions: In-memory lesson index with content-hashed IDs
  - id: BEH-27.2
    name: Apply Learned Heuristics
    status: ACTIVE
    behavior_type: workflow_step
    description: Consult stored heuristics (contract count thresholds, signature correlations) during current run.
    preconditions: Lesson history loaded
    postconditions: Pipeline stages have access to learned rules
  - id: BEH-27.3
    name: Detect Novel Patterns
    status: ACTIVE
    behavior_type: workflow_step
    description: Compare current-run observations against known patterns; flag anything outside known archetypes.
    preconditions: Extraction complete
    postconditions: Novel-pattern list with per-pattern evidence
  - id: BEH-27.4
    name: Extract Lessons
    status: ACTIVE
    behavior_type: workflow_step
    description: Distill new lessons from novel patterns + successful heuristics; dedupe by content hash.
    preconditions: Novel patterns identified
    postconditions: New lesson candidates ready for persistence
  - id: BEH-27.5
    name: Detect Dominant Patterns
    status: ACTIVE
    behavior_type: workflow_step
    description: Identify pattern that dominates the current run (e.g., systemic constant-value issue).
    preconditions: Report card + pattern log available
    postconditions: Dominant pattern flagged with confidence score
  - id: BEH-27.6
    name: Flag Systemic Issues
    status: ACTIVE
    behavior_type: workflow_step
    description: Escalate dominant patterns that cross severity threshold to the drift-report list.
    preconditions: Dominant pattern crosses threshold
    postconditions: Drift flag written to .architecture/
  - id: BEH-27.7
    name: Check Doc Drift
    status: ACTIVE
    behavior_type: workflow_step
    description: Run 4 doc-drift checks (test count, version sync, schema version, Python version) against CONTEXT.md.
    preconditions: Docs and model both exist
    postconditions: Drift issues logged; simple cases auto-fixed
  - id: BEH-27.8
    name: Auto-Fix Simple Drift
    status: ACTIVE
    behavior_type: workflow_step
    description: Apply automatic fixes for version-number/test-count drifts.
    preconditions: Drift issue flagged auto-fixable
    postconditions: Doc file updated with correction
  - id: BEH-27.9
    name: Generate Report Card
    status: ACTIVE
    behavior_type: workflow_step
    description: Score run (A-F grade) on fidelity, compression, novel-pattern rate; compare to trend.
    preconditions: Regen/extract run complete
    postconditions: Report card persisted; trend delta computed
  - id: BEH-27.10
    name: Append to Learning Curve
    status: ACTIVE
    behavior_type: workflow_step
    description: Append current run metrics to learning_curve table for cross-run trend analysis.
    preconditions: Report card generated
    postconditions: learning_curve row appended
  - id: BEH-27.11
    name: Persist Lessons
    status: ACTIVE
    behavior_type: workflow_step
    description: Write new lessons back to history.json with atomic write + content-hash dedupe.
    preconditions: Lesson candidates ready
    postconditions: history.json updated
  - id: BEH-LLM
    name: LLM Provider Routing
    status: ACTIVE
    behavior_type: orchestrator
    description: Route LLM calls through a task-class-keyed policy that picks provider + model, enforces cost caps, and falls back on error.
    preconditions: LLM policy file exists at .architecture/llm/policy.yaml
    postconditions: Call routed to concrete provider or fallback fired
    trigger: Any component requesting text completion, structured output, streaming, or tokenization via LLMProvider Protocol
    goals:
    - Route model calls to the right provider under a global cost budget
    - Record provenance so outputs are reproducible
    success_criteria:
    - policy respected on every call
    - per-call cost cap enforced
    - meta.provider stamped on generated artifacts
  - id: BEH-LLM.1
    name: Load Policy
    status: ACTIVE
    behavior_type: workflow_step
    description: Read .architecture/llm/policy.yaml; parse RoutingRule per TaskClass with max_cost_usd_per_call + fallback.
    preconditions: policy.yaml exists and is well-formed
    postconditions: Policy in memory keyed by TaskClass
  - id: BEH-LLM.2
    name: Resolve TaskClass
    status: ACTIVE
    behavior_type: workflow_step
    description: Given caller task_class_name, look up the matching RoutingRule.
    preconditions: Policy loaded
    postconditions: RoutingRule selected
  - id: BEH-LLM.3
    name: Select Provider
    status: ACTIVE
    behavior_type: workflow_step
    description: Instantiate the provider adapter (MCPProvider|FrontierProvider|RelayExtProvider) per the rule.
    preconditions: RoutingRule identifies provider name
    postconditions: Concrete LLMProvider instance ready
  - id: BEH-LLM.4
    name: Enforce Cost Cap
    status: ACTIVE
    behavior_type: workflow_step
    description: Check per-call cost estimate against max_cost_usd_per_call before dispatch.
    preconditions: Provider tokenize() gives token estimate
    postconditions: Call proceeds or is denied with CostCapExceededError
  - id: BEH-LLM.5
    name: Dispatch Call
    status: ACTIVE
    behavior_type: workflow_step
    description: Invoke provider.complete/stream/structured; capture response + metadata.
    preconditions: Cost check passed
    postconditions: Response bytes + token usage recorded
  - id: BEH-LLM.6
    name: Fallback on Error
    status: ACTIVE
    behavior_type: workflow_step
    description: On provider error, retry via fallback provider named in RoutingRule.
    preconditions: Primary provider raised
    postconditions: Fallback response OR final error propagated
  - id: BEH-LLM.7
    name: Stamp Provenance
    status: ACTIVE
    behavior_type: workflow_step
    description: Record meta.provider = {name, model, policy_ref} on any model output generated by this call.
    preconditions: Successful response
    postconditions: Output artifact stamped with provider provenance
  - id: BEH-LLM.8
    name: Update Global Budget
    status: ACTIVE
    behavior_type: workflow_step
    description: Deduct call cost from global_budget_usd; log to .architecture/llm/spend.jsonl.
    preconditions: Call successful
    postconditions: Budget counter decremented; spend event journaled
  - id: BEH-SIL
    name: SI&L Telemetry Recording
    status: ACTIVE
    behavior_type: orchestrator
    description: Instrumented call sites emit telemetry events into .architecture/sil.sqlite (ring buffer, 50 events per component), rolled up per-component to yaml snapshots.
    preconditions: sil.sqlite is writable
    postconditions: Event appended and rollup snapshot refreshed
    trigger: Any instrumented pipeline stage, renderer, validator, or MCP tool invocation
    goals:
    - Give operators a live, component-scoped view of system health
    success_criteria:
    - ring buffer retains 50 most recent per component
    - rollup snapshots refreshed within SLA
    - architect_evaluate sil_summary non-empty
  - id: BEH-SIL.1
    name: Bind Store to Context
    status: ACTIVE
    behavior_type: workflow_step
    description: Bind SILStore to current call context; without a bound store the @sil_instrument decorator is a no-op.
    preconditions: SILStore instance available
    postconditions: Context carries active store
  - id: BEH-SIL.2
    name: Instrument Call Site
    status: ACTIVE
    behavior_type: workflow_step
    description: Decorate the target function with @sil_instrument specifying component_id + kind (stage:|renderer:|validator:|mcp_tool:).
    preconditions: Function is architecturally significant
    postconditions: Function wrapped with SI&L capture
  - id: BEH-SIL.3
    name: Capture Invocation
    status: ACTIVE
    behavior_type: workflow_step
    description: 'On call entry: record start_ts, args-fingerprint, component_id, kind.'
    preconditions: Instrumented function invoked
    postconditions: Start event buffered
  - id: BEH-SIL.4
    name: Capture Outcome
    status: ACTIVE
    behavior_type: workflow_step
    description: 'On call exit: record duration, success|error, error class if raised.'
    preconditions: Function exit or raise
    postconditions: Outcome event buffered
  - id: BEH-SIL.5
    name: Persist to SQLite
    status: ACTIVE
    behavior_type: workflow_step
    description: Append event to sil.sqlite ring buffer via WAL-safe transaction.
    preconditions: Outcome event buffered
    postconditions: Event durable in sil.sqlite
  - id: BEH-SIL.6
    name: Roll Up Metrics
    status: ACTIVE
    behavior_type: workflow_step
    description: Aggregate last-N events per component into invocations_7d, failure_rate_7d, avg_duration_ms.
    preconditions: Events persisted
    postconditions: Rollup snapshot written to .architecture/sil/<component_id>.yaml
  - id: BEH-SIL.7
    name: Serve Health Query
    status: ACTIVE
    behavior_type: workflow_step
    description: Respond to architect_component_health MCP call with {record, trend} envelope.
    preconditions: Rollup snapshot exists
    postconditions: JSON envelope returned to caller
  - id: BEH-SIL.8
    name: Merge Evaluate Summary
    status: ACTIVE
    behavior_type: workflow_step
    description: When architect_evaluate runs, inject sil_summary key with per-component metrics into its report.
    preconditions: evaluate tool invoked
    postconditions: sil_summary present in evaluate response
  - id: BEH-FBK
    name: Feedback Journal Append
    status: ACTIVE
    behavior_type: orchestrator
    description: Append-only journals (gates.jsonl, drift.jsonl, test_results.jsonl) under .architecture/ record outcomes for surgical view invalidation.
    preconditions: Feedback event ready
    postconditions: Event durably appended with content_kind
    trigger: Gate execution, drift detection, or JUnit test batch ingest
    goals:
    - Persist verification evidence outside the model for temporal slicing
    success_criteria:
    - append-only JSONL never rewritten
    - materialize picks up refs deterministically
    - counts flow into architect_evaluate
  - id: BEH-FBK.1
    name: Append Gate Event
    status: ACTIVE
    behavior_type: workflow_step
    description: Write GateEvent(gate_id, outcome, findings, model_revision, ts) to gates.jsonl (fail-soft on write error).
    preconditions: Gate tool ran
    postconditions: Event appended to .architecture/gates.jsonl
  - id: BEH-FBK.2
    name: Append Drift Snapshot
    status: ACTIVE
    behavior_type: workflow_step
    description: Write drift snapshot (broken_ref, unrealized_capability, orphan, missing_impl) to drift.jsonl after every pipeline run.
    preconditions: Pipeline stage completed
    postconditions: Snapshot appended to .architecture/drift.jsonl
  - id: BEH-FBK.3
    name: Ingest JUnit Batch
    status: ACTIVE
    behavior_type: workflow_step
    description: Parse pytest/JUnit XML into TestResult batch and append to test_results.jsonl via feedback.junit_ingest.ingest_junit.
    preconditions: JUnit XML file exists
    postconditions: Batch appended to .architecture/test_results.jsonl
  - id: BEH-FBK.4
    name: Invalidate Views
    status: ACTIVE
    behavior_type: workflow_step
    description: When new events land, mark dependent projected views stale via lifecycle.invalidation.stale_entity_view_ids.
    preconditions: New feedback event appended
    postconditions: Affected view ids added to stale set
  - id: BEH-UC-ENRICH
    name: Enrich Model with Manifest Data
    status: ACTIVE
    type: use_case
    description: Copy AST-derived signatures, constants, and test contracts from the Reality Manifest onto model components to raise regen readiness.
    trigger: Architect invokes architecture-model enrich <path> after a pipeline run
    preconditions:
    - model exists at path
    - manifest.json is present or generatable
    postconditions:
    - components carry signatures[]
    - components carry test_contracts[]
    - regen_readiness score improves
    goals:
    - Bridge the abstract architecture model to code-level reality for downstream regen
    success_criteria:
    - signature coverage >= 60%
    - test_contract count grows
  - id: BEH-UC-VALIDATE
    name: Validate Architecture Model
    status: ACTIVE
    type: use_case
    description: Run structural validation over an architecture model and report a 0-100 score with categorized issues.
    trigger: Architect or CI invokes architecture-model validate <path>
    preconditions:
    - model file parses as YAML
    - schema_version present
    postconditions:
    - score reported
    - issues categorized by severity
    - exit code reflects validity
    goals:
    - Ensure model integrity before downstream doc generation or publication
    success_criteria:
    - score >= threshold configured by caller
    - 0 ERROR-severity issues
  - id: BEH-UC-DOCS
    name: Generate SE Documentation
    status: ACTIVE
    type: use_case
    description: Emit the 11-doc Systems Engineering suite (ConOps, Functional Analysis, Requirements, V&V, Ops Manual, etc.) from the architecture model.
    trigger: Architect invokes architecture-model docs <path> --formats se_all
    preconditions:
    - valid model
    - manifest available for enrichment
    postconditions:
    - .architecture-models/docs/se/ populated with 11 markdown files
    goals:
    - Produce auditable SE deliverables that trace to model entities
    success_criteria:
    - all requested formats emitted
    - no broken cross-refs between docs
  - id: BEH-UC-VIEWER
    name: Generate Interactive HTML Viewer
    status: ACTIVE
    type: use_case
    description: Produce a self-contained HTML viewer embedding all entities, relationships, evidence, and SE docs for offline review.
    trigger: Architect invokes architecture-model viewer <path>
    preconditions:
    - valid model
    - optionally SE docs generated
    postconditions:
    - .architecture/diagrams/viewer.html written
    - single file opens in any browser
    goals:
    - Give reviewers a one-file, no-server way to explore the architecture
    success_criteria:
    - file opens < 5MB by default
    - all entity pages navigable
  - id: BEH-UC-AUDIT
    name: Audit Six Operational Pipelines
    status: ACTIVE
    type: use_case
    description: Report per-pipeline gaps (missing descriptions, missing traces-to, isolated sub-behaviors, containment holes) across EXTRACT/SLICE/SELF-IMPROVEMENT/DEV-LOOP/LLM-PROVIDER/LOGGING pipelines.
    trigger: Architect or CI invokes architecture-model audit [--pipeline ID] [--strict]
    preconditions:
    - valid model
    postconditions:
    - markdown gap report written to stdout
    - strict mode sets exit code on any gap
    goals:
    - Enforce completeness of operational pipelines as a first-class quality gate
    success_criteria:
    - zero gaps on curated pipelines under strict mode
  - id: BEH-UC-PUBLISH
    name: Publish Architecture Package Generation
    status: ACTIVE
    type: use_case
    description: Commit a new generation of the root architecture package to the lifecycle store with a stable digest and revision id.
    trigger: Architect (or automation) invokes package_publish on a validated model
    preconditions:
    - model parses and validates
    - package directory writable
    postconditions:
    - new .architecture/lifecycle/<pkg>/<rev>/ generation written
    - CURRENT pointer advanced
    - digest.json emitted
    goals:
    - Preserve reproducible, digest-addressable snapshots of every model iteration
    success_criteria:
    - identical inputs yield identical digests
    - CURRENT always points to a valid generation
  - id: BEH-UC-MATERIALIZE
    name: Materialize Slice and Project View
    status: ACTIVE
    type: use_case
    description: Reduce the root package to a scoped ModelSlice, then run a registered projector to yield a DiagramSpec ready for rendering.
    trigger: LLM agent or renderer requests a scoped fragment via slice_materialize + view_project
    preconditions:
    - published package generation exists
    - slice + view specs valid
    postconditions:
    - MaterializedSlice with digest returned
    - ProjectedView carries freshness stamp
    goals:
    - Substrate every doc, diagram, and derived artifact through a single deterministic pipeline
    success_criteria:
    - byte-identical outputs for identical inputs
    - no dangling refs post-closure
  - id: BEH-UC-APPLY
    name: Apply Validated AI Proposal
    status: ACTIVE
    type: use_case
    description: Apply a completed, validated LLM-authored proposal to the lifecycle store, publishing a new generation with an ai.proposal.apply journal event.
    trigger: LLM agent completes a job and requests proposal_apply against a submitted work-order
    preconditions:
    - WorkOrder persisted
    - Job in state completed with matching result_ref
    - proposal identity matches work-order
    postconditions:
    - new generation published
    - journal event recorded
    - digest advances
    goals:
    - Close the LLM-driven authoring loop with cryptographic identity + drift protection
    success_criteria:
    - identity match enforced
    - drift check passes
    - journal event exactly-once
