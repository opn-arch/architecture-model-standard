meta:
  schema_version: '1.3'
  project: architecture-model-standard
  generated_at: '2026-08-16'
  lifecycle_phase: production
  domain_profile: library

entities:
  capabilities:
  - id: CAP-1
    name: Validate Architecture Models
    status: ACTIVE
    description: Check model correctness, completeness, hierarchy consistency, and domain rules
  - id: CAP-2
    name: Extract Architecture from Code
    status: ACTIVE
    description: Scan source code AST and derive components, relationships, behaviors automatically
  - id: CAP-3
    name: Run Modular Extraction Pipeline
    status: ACTIVE
    description: Execute 10-stage pipeline (observe→infer→allocate→relate→specify→contract→validate→decompose→synthesize→emit)
  - id: CAP-4
    name: Generate Reality Manifest
    status: ACTIVE
    description: Scan source files to produce structural facts (functions, imports, classes, routes, tests)
  - id: CAP-5
    name: Generate SE Documentation
    status: ACTIVE
    description: Produce functional analysis, logical architecture, use cases, requirements, V&V, operations docs
  - id: CAP-6
    name: Author Model from Requirements
    status: ACTIVE
    description: Parse requirements document into a concept-phase architecture model
  - id: CAP-7
    name: Slice and Query Models
    status: ACTIVE
    description: Filter model by block, layer, status, artifact for focused context delivery
  - id: CAP-8
    name: Diff Model Versions
    status: ACTIVE
    description: Compare two model versions showing additions, removals, and changes
  - id: CAP-9
    name: Decompose Models Hierarchically
    status: ACTIVE
    description: Break coarse models into per-system sub-models with parent/child relationships
  - id: CAP-10
    name: Enrich Models with Code Intelligence
    status: ACTIVE
    description: Auto-populate signatures, constants, test contracts, behaviors from source
  - id: CAP-11
    name: Assess Regen Readiness
    status: ACTIVE
    description: Score how well a model captures enough detail to regenerate code
  - id: CAP-12
    name: Check Development Gate
    status: ACTIVE
    description: Verify code reality is tracking toward authored architecture intent
  - id: CAP-13
    name: Detect and Fix Model Drift
    status: ACTIVE
    description: Compare model against current code, report coverage gaps
  - id: CAP-14
    name: Manage Global Learnings
    status: ACTIVE
    description: Store, retrieve, and apply heuristics/archetypes/workflows across pipeline runs
  - id: CAP-15
    name: Export for AI Consumption
    status: ACTIVE
    description: Produce flat-file exports optimized for token-limited AI environments

  components:
  # === CORE (foundation types and operations) ===
  - id: COMP-1
    name: Core
    status: ACTIVE
    description: Foundation types, validation, parsing, and model operations
    layer: foundation
    kind: library
    children: [COMP-1.1, COMP-1.2, COMP-1.3, COMP-1.4, COMP-1.5]
    files: [src/architecture_model/core/__init__.py]

  - id: COMP-1.1
    name: Type System
    status: ACTIVE
    description: All dataclasses, enums, and type definitions for the architecture model
    layer: foundation
    kind: library
    parent_id: COMP-1
    files:
    - src/architecture_model/core/types.py
    contract: Defines ArchitectureModel, Component, Relationship, Behavior, System, and 17 entity types

  - id: COMP-1.2
    name: Validation
    status: ACTIVE
    description: Model validation — JSON schema, referential integrity, hierarchy, cycles, domain rules
    layer: foundation
    kind: library
    parent_id: COMP-1
    files:
    - src/architecture_model/core/validator.py
    - src/architecture_model/spec/__init__.py
    contract: validate_model() → ValidationResult with scored issues (100 - 10*errors - 2*warnings)

  - id: COMP-1.3
    name: Parser & Persistence
    status: ACTIVE
    description: YAML parsing, serialization, round-trip preservation
    layer: foundation
    kind: library
    parent_id: COMP-1
    files:
    - src/architecture_model/core/parser.py
    - src/architecture_model/core/compression.py
    - src/architecture_model/core/merger.py
    - src/architecture_model/persistence/__init__.py
    - src/architecture_model/persistence/store.py
    contract: load_model(path) → ArchitectureModel, dump_model(model, path), compact_for_storage()

  - id: COMP-1.4
    name: Model Operations
    status: ACTIVE
    description: Slice, diff, coverage, impact analysis, clustering, source block assignment
    layer: foundation
    kind: library
    parent_id: COMP-1
    files:
    - src/architecture_model/core/slicer.py
    - src/architecture_model/core/differ.py
    - src/architecture_model/core/coverage.py
    - src/architecture_model/core/cluster.py
    - src/architecture_model/core/source_block_assign.py
    - src/architecture_model/core/source_block_quality.py
    - src/architecture_model/core/representativeness.py
    - src/architecture_model/core/test_affinity.py
    contract: slice_model(focus), diff_models(a, b), compute_coverage(model, manifest)

  - id: COMP-1.5
    name: Quality Metrics
    status: ACTIVE
    description: Confidence scoring, regen readiness, corrections tracking
    layer: foundation
    kind: library
    parent_id: COMP-1
    files:
    - src/architecture_model/core/confidence.py
    - src/architecture_model/core/regen_readiness.py
    - src/architecture_model/core/corrections.py
    - src/architecture_model/core/decomposer.py
    - src/architecture_model/core/visualize.py
    contract: compute_model_confidence(), compute_regen_readiness_score()

  # === PIPELINE (10-stage extraction pipeline) ===
  - id: COMP-2
    name: Pipeline
    status: ACTIVE
    description: Modular 10-stage extraction pipeline with coordination and caching
    layer: domain
    kind: service
    children: [COMP-2.1, COMP-2.2, COMP-2.3, COMP-2.4, COMP-2.5]
    files: [src/architecture_model/pipeline/__init__.py]

  - id: COMP-2.1
    name: Pipeline Coordination
    status: ACTIVE
    description: Stage orchestration, context management, caching, reporting
    layer: domain
    kind: service
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/coordinator.py
    - src/architecture_model/pipeline/protocol.py
    - src/architecture_model/pipeline/cache.py
    - src/architecture_model/pipeline/context_gen.py
    - src/architecture_model/pipeline/report.py
    - src/architecture_model/pipeline/artifacts.py
    - src/architecture_model/pipeline/corrections.py
    contract: PipelineCoordinator.run(repo_path) orchestrates all stages in dependency order

  - id: COMP-2.2
    name: Observation Stages
    status: ACTIVE
    description: "observe + infer: scan codebase and infer components/behaviors"
    layer: domain
    kind: service
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/observe.py
    - src/architecture_model/pipeline/observe_types.py
    - src/architecture_model/pipeline/infer.py
    - src/architecture_model/pipeline/infer_types.py
    contract: observe() → ObserveResult, infer() → InferResult with components and behaviors

  - id: COMP-2.3
    name: Allocation & Relation Stages
    status: ACTIVE
    description: "allocate + relate: assign modules to blocks, discover relationships"
    layer: domain
    kind: service
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/allocate.py
    - src/architecture_model/pipeline/allocate_types.py
    - src/architecture_model/pipeline/relate.py
    - src/architecture_model/pipeline/relate_types.py
    contract: allocate() → AllocateResult, relate() → RelateResult with typed edges

  - id: COMP-2.4
    name: Specification & Contract Stages
    status: ACTIVE
    description: "specify + contract + validate: add interfaces, test contracts, validate"
    layer: domain
    kind: service
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/specify.py
    - src/architecture_model/pipeline/specify_types.py
    - src/architecture_model/pipeline/contract.py
    - src/architecture_model/pipeline/contract_types.py
    - src/architecture_model/pipeline/validate.py
    - src/architecture_model/pipeline/validate_types.py
    contract: specify() → SpecifyResult, contract() → ContractResult, validate() → ValidateResult

  - id: COMP-2.5
    name: Synthesis & Emit Stages
    status: ACTIVE
    description: "decompose + synthesize + emit: break down, merge, output final model"
    layer: domain
    kind: service
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/decompose.py
    - src/architecture_model/pipeline/decompose_types.py
    - src/architecture_model/pipeline/synthesize.py
    - src/architecture_model/pipeline/synthesize_types.py
    - src/architecture_model/pipeline/emit.py
    - src/architecture_model/pipeline/emit_types.py
    - src/architecture_model/pipeline/regen_score.py
    contract: decompose() → systems, synthesize() → merged model, emit() → final YAML

  # === MANIFEST (code scanning) ===
  - id: COMP-3
    name: Manifest
    status: ACTIVE
    description: Source code scanning — AST analysis, import resolution, grouping
    layer: domain
    kind: library
    children: [COMP-3.1, COMP-3.2, COMP-3.3]
    files: [src/architecture_model/manifest/__init__.py, src/architecture_model/manifest/types.py]

  - id: COMP-3.1
    name: Scanners
    status: ACTIVE
    description: Language-specific source file scanners (Python, TypeScript, Kotlin)
    layer: domain
    kind: library
    parent_id: COMP-3
    files:
    - src/architecture_model/manifest/scanner.py
    - src/architecture_model/manifest/multi_scanner.py
    - src/architecture_model/manifest/ts_scanner.py
    - src/architecture_model/manifest/kt_scanner.py
    - src/architecture_model/manifest/body_hints.py
    - src/architecture_model/manifest/metrics.py
    - src/architecture_model/manifest/scan_cache.py
    - src/architecture_model/manifest/protocol.py
    contract: scan_module(path) → ModuleInfo with functions, classes, imports, metrics

  - id: COMP-3.2
    name: Graph & Analysis
    status: ACTIVE
    description: Import resolution, call graphs, interface extraction, behavior detection
    layer: domain
    kind: library
    parent_id: COMP-3
    files:
    - src/architecture_model/manifest/call_graph.py
    - src/architecture_model/manifest/interfaces.py
    - src/architecture_model/manifest/behavior.py
    - src/architecture_model/manifest/chains.py
    - src/architecture_model/manifest/test_analyzer.py
    contract: resolve_imports() → edges, extract_interfaces() → InterfaceInfo

  - id: COMP-3.3
    name: Grouping & Generation
    status: ACTIVE
    description: Component grouping logic, manifest generation, recursive scanning
    layer: domain
    kind: library
    parent_id: COMP-3
    files:
    - src/architecture_model/manifest/grouping.py
    - src/architecture_model/manifest/generator.py
    - src/architecture_model/manifest/recursive.py
    - src/architecture_model/manifest/blocks.py
    - src/architecture_model/manifest/slicers.py
    - src/architecture_model/manifest/display.py
    contract: group_modules() → component assignments, generate_manifest() → full manifest

  # === DOCUMENTATION ===
  - id: COMP-4
    name: Documentation
    status: ACTIVE
    description: Architecture documentation generation — component specs, SE docs, diagrams
    layer: application
    kind: library
    children: [COMP-4.1, COMP-4.2]
    files: [src/architecture_model/docs/__init__.py]

  - id: COMP-4.1
    name: Core Doc Generators
    status: ACTIVE
    description: Component spec, ICD, dependency matrix, health report, drift, diagrams
    layer: application
    kind: library
    parent_id: COMP-4
    files:
    - src/architecture_model/docs/generator.py
    - src/architecture_model/docs/component_spec.py
    - src/architecture_model/docs/icd.py
    - src/architecture_model/docs/dependency_matrix.py
    - src/architecture_model/docs/health.py
    - src/architecture_model/docs/drift.py
    - src/architecture_model/docs/diagrams.py
    - src/architecture_model/docs/index.py
    - src/architecture_model/docs/behavior_spec.py
    - src/architecture_model/docs/integration_flows.py
    - src/architecture_model/docs/system_design.py
    contract: generate_docs(model, formats) → dict of doc_type → markdown content

  - id: COMP-4.2
    name: SE Document Suite
    status: ACTIVE
    description: Full systems engineering document suite (15 document types)
    layer: application
    kind: library
    parent_id: COMP-4
    files:
    - src/architecture_model/docs/se/__init__.py
    - src/architecture_model/docs/se/generator.py
    - src/architecture_model/docs/se/frontmatter.py
    - src/architecture_model/docs/se/detect.py
    - src/architecture_model/docs/se/conops.py
    - src/architecture_model/docs/se/functional_analysis.py
    - src/architecture_model/docs/se/logical_architecture.py
    - src/architecture_model/docs/se/requirements_analysis.py
    - src/architecture_model/docs/se/use_cases.py
    - src/architecture_model/docs/se/verification_validation.py
    - src/architecture_model/docs/se/interface_spec.py
    - src/architecture_model/docs/se/operations_manual.py
    - src/architecture_model/docs/se/maintenance_manual.py
    - src/architecture_model/docs/se/risk_assessment.py
    - src/architecture_model/docs/se/security_analysis.py
    - src/architecture_model/docs/se/data_model.py
    - src/architecture_model/docs/se/deployment_guide.py
    - src/architecture_model/docs/se/api_reference.py
    - src/architecture_model/docs/se/cli_reference.py
    - src/architecture_model/docs/se/changelog.py
    - src/architecture_model/docs/se/plugin_guide.py
    contract: generate_se_docs(model, manifest) → 15 SE document types as markdown

  # === ORCHESTRATION ===
  - id: COMP-5
    name: Orchestration
    status: ACTIVE
    description: High-level workflows — enrichment, decomposition, behavior analysis
    layer: application
    kind: service
    children: [COMP-5.1, COMP-5.2]
    files: [src/architecture_model/orchestration/__init__.py]

  - id: COMP-5.1
    name: Enrichment
    status: ACTIVE
    description: Auto-enrich models with signatures, constants, test contracts, capabilities
    layer: application
    kind: service
    parent_id: COMP-5
    files:
    - src/architecture_model/orchestration/enrich.py
    - src/architecture_model/orchestration/auto_enrich.py
    - src/architecture_model/orchestration/enrichment_context.py
    - src/architecture_model/orchestration/capability_inference.py
    - src/architecture_model/orchestration/trigger_detection.py
    - src/architecture_model/orchestration/use_case_inference.py
    - src/architecture_model/orchestration/naming_context.py
    contract: enrich_model(model, manifest) → enriched model with populated signatures/contracts

  - id: COMP-5.2
    name: Decomposition
    status: ACTIVE
    description: Model decomposition, behavior flows, compaction
    layer: application
    kind: service
    parent_id: COMP-5
    files:
    - src/architecture_model/orchestration/decompose.py
    - src/architecture_model/orchestration/deep_decompose.py
    - src/architecture_model/orchestration/behavior_decompose.py
    - src/architecture_model/orchestration/behavior_flows.py
    - src/architecture_model/orchestration/compaction.py
    - src/architecture_model/orchestration/pipeline.py
    contract: decompose_model() → per-system sub-models, compact_for_storage()

  # === EXTRACT ===
  - id: COMP-6
    name: Extract
    status: ACTIVE
    description: Code-to-model extraction — route detection, constraint detection, artifact parsing
    layer: domain
    kind: library
    files:
    - src/architecture_model/extract/from_code.py
    - src/architecture_model/extract/from_artifacts.py
    - src/architecture_model/extract/route_detector.py
    - src/architecture_model/extract/constraint_detector.py
    - src/architecture_model/extract/table_parser.py
    contract: extract_from_code(path) → partial model, detect_routes() → route info

  # === AUTHORING ===
  - id: COMP-7
    name: Authoring
    status: ACTIVE
    description: Forward-author models from requirements, check development gates
    layer: application
    kind: library
    files:
    - src/architecture_model/authoring/__init__.py
    - src/architecture_model/authoring/parser.py
    - src/architecture_model/authoring/gate.py
    contract: parse_requirements_doc(text) → ArchitectureModel, check_development_gate(model, manifest)

  # === CLI ===
  - id: COMP-8
    name: CLI
    status: ACTIVE
    description: Command-line interface — all user-facing commands
    layer: interface
    kind: service
    files:
    - src/architecture_model/__init__.py
    - src/architecture_model/__main__.py
    - src/architecture_model/cli/__init__.py
    - src/architecture_model/cli/main.py
    - src/architecture_model/cli/visualize.py
    contract: "CLI commands: validate, slice, diff, manifest, enrich, decompose, docs, coverage, etc."

  # === CONFIG & PROFILES ===
  - id: COMP-9
    name: Configuration
    status: ACTIVE
    description: Configuration loading, domain profiles, schema definitions
    layer: infrastructure
    kind: library
    files:
    - src/architecture_model/config/__init__.py
    - src/architecture_model/config/loader.py
    - src/architecture_model/config/schema.py
    - src/architecture_model/profiles/__init__.py
    - src/architecture_model/profiles/builtins/__init__.py
    - src/architecture_model/profiles/schema.py
    contract: load_config(repo_path) → ProjectConfig with profile and domain settings

  # === EXPORT ===
  - id: COMP-10
    name: Export
    status: ACTIVE
    description: Flat-file export for AI consumption, reference doc generation
    layer: application
    kind: library
    files:
    - src/architecture_model/export/__init__.py
    - src/architecture_model/export/flatfiles.py
    - src/architecture_model/export/reference.py
    contract: export_flat_files(model, output_dir) → portable architecture package

  # === PIPELINE LEARNING ===
  - id: COMP-11
    name: Pipeline Learning
    status: ACTIVE
    description: Global learning store, heuristics, lessons extraction
    layer: domain
    kind: library
    parent_id: COMP-2
    files:
    - src/architecture_model/pipeline/global_learning.py
    - src/architecture_model/pipeline/learning.py
    - src/architecture_model/pipeline/lessons.py
