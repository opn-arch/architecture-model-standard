    name: Detect and Fix Model Drift
    status: ACTIVE
    description: Compare model against current code, report coverage gaps
  - id: CAP-14
    name: Manage Global Learnings
    status: ACTIVE
    description: Store, retrieve, and apply heuristics/archetypes/workflows across
