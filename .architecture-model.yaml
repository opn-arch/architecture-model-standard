  - id: COMP-MONITORING
    name: Monitoring
    status: ACTIVE
    description: Per-function observability via @monitored decorator; timing and quality metrics drained by MCP
    layer: LAYER-INFRA
    source_block: S10
    technology: python
    files:
    - src/architecture_model/monitoring.py
    responsibilities:
    - Provide @monitored decorator
    - Collect timing/quality metrics
    - Expose metrics for MCP drain
    kind: library
    signatures:
    - name: MetricsCollector.__init__
      body_hint: 'self.metrics: list[FunctionMetrics] = []; self._lock = threading.Lock()'
    - name: MetricsCollector.record
      params:
      - 'm: FunctionMetrics'
      returns: None
      body_hint: "with self._lock:\n    self.metrics.append(m)"
    - name: MetricsCollector.drain
      returns: list[FunctionMetrics]
      body_hint: "with self._lock:\n    result = self.metrics[:]\n    self.metrics.clear()\n    return result"
    - name: get_collector
      returns: MetricsCollector
      body_hint: "if not hasattr(_thread_local, 'collector'):\n    _thread_local.collector = MetricsCollector(); return _thread_local.collector"
    - name: monitored
      params:
      - 'module: str'
      - 'quality: Callable[[Any], dict[str, Any]] | None'
      - 'inputs: Callable[[tuple, dict], dict[str, Any]] | None'
      - 'outputs: Callable[[Any], dict[str, Any]] | None'
      returns: Callable
      body_hint: "def decorator(fn: Callable) -> Callable:\n\n    @functools.wraps(fn)\n    def wrapper(*args, **kwargs):\n\
        \        input_m = {}\n        if inputs:\n            try:\n                input_m = inputs(args, kwargs)\n    \
        \        except Exception:\n                pass\n        start = time.perf_counter()\n        result = fn(*args,\
        \ **kwargs)\n        elapsed_ms = (time.perf_counter() - start) * 1000\n        quality_m = {}\n        if quality:\n\
        \            try:\n                quality_m = quality(result)\n            except Exception:\n                pass\n\
        \        output_m = {}\n        if outputs:\n            try:\n                output_m = outputs(result)\n      \
        \      except Exception:\n                pass\n        m = FunctionMetrics(function=fn.__name__, module=module, time_ms=elapsed_ms,\
        \ quality_scores=quality_m, input_metrics=input_m, output_metrics=output_m)\n        get_collector().record(m)\n \
        \       return result\n    return wrapper; return decorator"
    test_contracts:
    - test_file: test_monitoring.py
      test_method: test_function_metrics_dataclass
      assertion: m.function == 'test_fn'
      contract_type: value_equality
    - test_file: test_monitoring.py
      test_method: test_collector_accumulates_metrics
      assertion: len(collector.metrics) == 2
      contract_type: value_equality
    - test_file: test_monitoring.py
      test_method: test_monitored_decorator_records_timing
      assertion: result == 10
      contract_type: value_equality
    - test_file: test_monitoring.py
      test_method: test_monitored_with_quality_extractor
      assertion: result == [1, 2, 3]
      contract_type: value_equality
    - test_file: test_monitoring.py
      test_method: test_monitored_with_input_extractor
      assertion: square(4) == 16
      contract_type: value_equality
