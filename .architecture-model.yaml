      body_hint: 'return {''entity_id'': self.entity_id, ''kind'': self.kind, ''detail'': self.detail}'
    - name: DriftSnapshot.to_json_line
      returns: str
      body_hint: 'payload: dict = {''timestamp'': self.timestamp or _now_iso(), ''model_revision'': self.model_revision, ''flags'':
        [f.to_dict() for f in self.flags]}; return json.dumps(payload, ensure_ascii=False) + ''\n'''
    - name: append
      params:
      - 'repo_path: Path'
      - 'snapshot: DriftSnapshot'
      returns: None
      body_hint: "target = repo_path / _JOURNAL_RELPATH; target.parent.mkdir(parents=True, exist_ok=True); line = snapshot.to_json_line().encode('utf-8');\
        \ fd = os.open(target, os.O_APPEND | os.O_CREAT | os.O_WRONLY, 420); try:\n    os.write(fd, line)\n    os.fsync(fd)\n\
        finally:\n    os.close(fd)"
    - name: GateEvent.to_json_line
      returns: str
      body_hint: "payload: dict = {'timestamp': self.timestamp or _now_iso(), 'gate_id': self.gate_id, 'outcome': self.outcome,\
        \ 'findings': list(self.findings)}; if self.model_revision is not None:\n    payload['model_revision'] = self.model_revision;\
        \ return json.dumps(payload, ensure_ascii=False) + '\\n'"
