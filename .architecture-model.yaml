        print(f''  Entities: {model.entity_count}''); print(f''    Actors: {len(model.entities.actors)}''); print(f''    Capabilities:
        {len(model.entities.capabilities)}''); print(f''    Behaviors: {len(model.entities.behaviors)}''); print(f''    Interfaces:
