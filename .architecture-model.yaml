        \ for comp in components:\n    if _enum_str(comp.status) != 'ACTIVE':\n        continue\n    if not comp.files:\n\
        \        continue\n    _enrich_signatures(comp, project_root)\n    _enrich_constants(comp, project_root)\n    _enrich_test_contracts(comp,\
