        \ glob_fn = directory.rglob if recursive else directory.glob; files = sorted((p for p in glob_fn('*.py') if not any((part\
        \ in EXCLUDED_DIRS for part in p.parts)) and (not exclude_init or p.name != '__init__.py'))); logger.debug('Collected\
        \ %d .py files from %s (recursive=%s)', len(files), directory, recursive); return files"
