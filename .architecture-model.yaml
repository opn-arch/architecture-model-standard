  - id: COMP-11
    name: Pipeline Learning
    status: ACTIVE
    description: Global learning store, heuristics, lessons extraction
    intent: Cross-project global learning persistence
    layer: domain
    files:
    - src/architecture_model/pipeline/global_learning.py
    - src/architecture_model/pipeline/learning.py
    - src/architecture_model/pipeline/lessons.py
    kind: library
    contract: GlobalLearningStore — persist and retrieve heuristics/archetypes/workflows
    signatures:
    - name: GlobalLearningStore.__init__
      params:
      - 'path: Path'
      body_hint: self.path = path; self.path.mkdir(parents=True, exist_ok=True)
    - name: GlobalLearningStore.add_heuristic
      params:
      - 'rule: HeuristicRule'
      returns: None
      body_hint: rules = self._load_json('heuristics.json', []); rules = [r for r in rules if r['id'] != rule.id]; rules.append(asdict(rule));
        self._save_json('heuristics.json', rules)
    - name: GlobalLearningStore.get_heuristics
      params:
      - 'stage: str | None'
      returns: list[HeuristicRule]
      body_hint: "data = self._load_json('heuristics.json', []); rules = [HeuristicRule(**d) for d in data]; if stage:\n \
        \   rules = [r for r in rules if r.stage == stage]; return rules"
    - name: GlobalLearningStore.validate_heuristic
      params:
      - 'rule_id: str'
      - 'repo: str'
