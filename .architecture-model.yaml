meta:
  schema_version: '2.0'
  project: architecture-model-standard
  system: Architecture Model Standard
  generated_at: '2026-07-21T17:00:00.000000+00:00'
entities:
  actors:
  - id: ACT-DEV
    name: Developer
    status: ACTIVE
    description: Software engineer using CLI to manage architecture models
    type: human
    goals:
    - Validate architecture model correctness
    - Generate manifest from source code
    - Slice model for focused analysis
    - Track model changes over time
    - Enrich model with AST-derived data
    - Decompose model into per-subsystem models
  - id: ACT-LLM
    name: LLM Agent
    status: ACTIVE
    description: AI agent consuming architecture models via opencode-arch MCP tools
    type: system
    goals:
    - Load compressed architecture context
    - Generate code from architecture model
    - Update model based on code changes
    - Extract architecture from unfamiliar codebases
  - id: ACT-MCP
    name: opencode-arch MCP Server
    status: ACTIVE
    description: MCP extension wrapping this package's APIs for LLM consumption
    type: system
    goals:
    - Expose scan/slice/validate/extract as MCP tools
    - Compress context within token budgets
  capabilities:
  - id: CAP-PARSE-VALIDATE
    name: Model Parsing & Validation
    status: ACTIVE
    description: Parse YAML models and validate structural correctness (score 0-100)
  - id: CAP-MANIFEST
    name: Reality Manifest Generation
    status: ACTIVE
    description: AST scanning to produce ground-truth code inventories with metrics, body hints, and test contracts
  - id: CAP-SLICE-DIFF
    name: Model Slicing & Diffing
    status: ACTIVE
    description: Subset extraction by F-block/layer, model version comparison, and enriched model composition
  - id: CAP-CLI
    name: CLI Operations
    status: ACTIVE
    description: Command-line interface for init, validate, slice, diff, stats, impact, manifest, coverage, enrich, decompose
  - id: CAP-CONFIG
    name: Configuration Management
    status: ACTIVE
    description: Auto-discovery config loading and project configuration schema
  - id: CAP-EXTRACT
    name: Model Extraction
    status: ACTIVE
    description: Extract architecture model directly from source code analysis
  - id: CAP-ENRICH
    name: Auto-Enrichment & Decomposition
    status: ACTIVE
    description: Populate signatures, constants, test_contracts from AST and decompose into recursive sub-models
  - id: CAP-PROFILES
    name: Domain Profiles
    status: ACTIVE
    description: Cross-domain architecture modeling via domain profiles (software, controls, mechanical, electrical)
  - id: CAP-SCHEMA
    name: Schema Specification
    status: ACTIVE
    description: JSON Schema definitions for architecture model validation
  behaviors:
  - id: BEH-INIT
    name: Initialize Project
    status: ACTIVE
    description: Bootstrap a new project with auto-discovered configuration and initial architecture model
    trigger: 'CLI: architecture-model init <path>'
    preconditions:
    - Project directory exists with Python source
    postconditions:
    - .architecture-model.yaml written with discovered F-blocks and layers
    steps:
    - Config auto-discovers project structure (source root, packages, F-blocks)
    - Config writes .architecture-model.yaml
  - id: BEH-VALIDATE
    name: Validate Architecture Model
    status: ACTIVE
    description: Load a model and check structural correctness, producing a score 0-100
    trigger: 'CLI: architecture-model validate <model.yaml>'
    preconditions:
    - Model YAML file exists
    postconditions:
    - Validation score and issues reported
    steps:
    - Core parses YAML into ArchitectureModel
    - Core validates (ID uniqueness, referential integrity, orphan detection, capability realization)
    - Score computed and issues listed
  - id: BEH-MANIFEST
    name: Generate Reality Manifest
    status: ACTIVE
    description: Scan source code via AST to produce ground-truth inventory
    trigger: 'CLI: architecture-model manifest <path>'
    preconditions:
    - Project root with Python source files
    postconditions:
    - Manifest with modules, functions, classes, imports, metrics, body hints
    steps:
    - Config provides project configuration
    - Manifest scans all Python files via AST
    - Manifest extracts functions, classes, imports, body hints
    - Manifest derives interfaces from import analysis
    - Manifest computes project metrics
  - id: BEH-EXTRACT
    name: Extract Model from Code
    status: ACTIVE
    description: Analyze source code to produce an architecture model automatically
    trigger: 'MCP tool: architect_extract'
    preconditions:
    - Project root with source code
    postconditions:
    - ArchitectureModel with components, capabilities, and relationships
    steps:
    - Config provides project configuration
    - Manifest generates code inventory
    - Extract derives entities and relationships from inventory
    - Core validates the produced model
  - id: BEH-SLICE
    name: Slice Model for Context
    status: ACTIVE
    description: Extract a subset of the model focused on a specific F-block, layer, or artifact
    trigger: 'CLI or MCP: architect_slice'
    preconditions:
    - Valid architecture model loaded
    postconditions:
    - Subset model containing only relevant entities and relationships
    steps:
    - Core loads model
    - Core slices by fblock/layer/status/artifact
    - Context formatter compresses to token budget
  - id: BEH-ENRICH-DECOMPOSE
    name: Enrich and Decompose Model
    status: ACTIVE
    description: Populate AST-derived data on components and generate recursive sub-models
    trigger: 'CLI: architecture-model enrich / decompose'
    preconditions:
    - Architecture model exists
    - Source code accessible
    postconditions:
    - Components enriched with signatures, constants, test_contracts
    - Sub-models written to .architecture-models/
    steps:
    - Orchestration enriches model from Manifest AST data
    - Orchestration decomposes into per-subsystem models
    - Core validates each sub-model
  - id: BEH-DIFF
    name: Compare Model Versions
    status: ACTIVE
    description: Produce structured diff between two model versions
    trigger: 'CLI: architecture-model diff <old.yaml> <new.yaml>'
    preconditions:
    - Two model YAML files exist
    postconditions:
    - Structured diff with added/removed/changed entities and relationships
  - id: BEH-COVERAGE
    name: Assess Model Coverage
    status: ACTIVE
    description: Compare architecture model against manifest to find gaps
    trigger: 'CLI: architecture-model coverage'
    preconditions:
    - Architecture model and manifest available
    postconditions:
    - Coverage report with component, capability, interface, and relationship coverage
  interfaces:
  - id: IF-GENERATE-MANIFEST
    name: generate_manifest
    status: ACTIVE
    description: 'generate_manifest(project_root: Path) -> Manifest'
    type: function
  - id: IF-LOAD-MODEL
    name: load_model
    status: ACTIVE
    description: 'load_model(path: Path) -> ArchitectureModel'
    type: function
  - id: IF-VALIDATE-MODEL
    name: validate_model
    status: ACTIVE
    description: 'validate_model(model: ArchitectureModel) -> ValidationResult'
    type: function
  - id: IF-SLICE-FBLOCK
    name: slice_by_fblock
    status: ACTIVE
    description: slice_by_fblock(model, f_block, include_relationships) -> ArchitectureModel
    type: function
  - id: IF-FORMAT-CONTEXT
    name: format_model_context
    status: ACTIVE
    description: format_model_context(model, max_tokens, detail_level) -> str
    type: function
  - id: IF-EXTRACT-FROM-CODE
    name: extract_from_code
    status: ACTIVE
    description: extract_from_code(project_root, config, manifest) -> ArchitectureModel
    type: function
  - id: IF-LOAD-PROFILE
    name: load_profile
    status: ACTIVE
    description: 'load_profile(name_or_path: str) -> DomainProfile'
    type: function
  - id: IF-DISCOVER-FILES
    name: discover_source_files
    status: ACTIVE
    description: 'discover_source_files(project_root: Path) -> list[Path]'
    type: function
  - id: IF-CLI-MAIN
    name: CLI Entry Point
    status: ACTIVE
    description: 'main(argv: list[str] | None) -> int — architecture-model command'
    type: function
  constraints:
  - id: CON-SCHEMA-VERSION
    name: Schema Version 2.0
    status: ACTIVE
    description: All models must conform to schema version 2.0 with 7 entity types
    type: standard
  - id: CON-SELF-BOOTSTRAP
    name: Zero Configuration
    status: ACTIVE
    description: Package must work on any Python project without manual configuration
    type: design
  - id: CON-HIERARCHICAL-MODELS
    name: Hierarchical Model Composition
    status: ACTIVE
    description: Each subsystem has its own complete model. The top-level model references subsystem models — it does not
      contain slices or reduced views.
    type: design
  - id: CON-ROUND-TRIP
    name: Round-Trip Fidelity
    status: ACTIVE
    description: load_model(save_model(model)) must produce identical model
    type: design
  layers:
  - id: LAYER-LIB
    name: Library
    status: ACTIVE
    description: Core libraries (Core, Manifest, Config, Utils, Profiles, Spec)
    order: 0
  - id: LAYER-ORCH
    name: Orchestration
    status: ACTIVE
    description: Workflow orchestration (Orchestration, Extract)
    order: 0
  - id: LAYER-UI
    name: User Interface
    status: ACTIVE
    description: CLI and visualization
    order: 0
  components:
  - id: COMP-CORE
    name: Core
    status: ACTIVE
    description: Central library — type system, parser, validator, slicer, differ, merger, decomposer, coverage
  - id: COMP-MANIFEST
    name: Manifest
    status: ACTIVE
    description: Reality Manifest Generator — AST scanning, body hints, test contracts, metrics
  - id: COMP-CONFIG
    name: Config
    status: ACTIVE
    description: Self-bootstrapping configuration — auto-discovery, schema, loader
  - id: COMP-CLI
    name: CLI
    status: ACTIVE
    description: Command-line interface — argparse dispatch, Mermaid visualization
  - id: COMP-ORCHESTRATION
    name: Orchestration
    status: ACTIVE
    description: Workflow orchestration — enrichment and decomposition pipelines
  - id: COMP-EXTRACT
    name: Extract
    status: ACTIVE
    description: Model extraction from source code analysis
  - id: COMP-UTILS
    name: Utils
    status: ACTIVE
    description: Shared file discovery and exclusion patterns (72 lines)
    files:
    - src/architecture_model/utils/discovery.py
    signatures:
    - name: is_excluded_dir
      params:
      - 'path: Path'
      returns: bool
      body_hint: name = path.name; return name in EXCLUDED_DIRS or name.startswith('.')
    - name: collect_py_files
      params:
      - 'directory: Path'
      - 'recursive: bool'
      - 'exclude_init: bool'
      returns: list[Path]
      body_hint: "if not directory.is_dir():\n    logger.debug('Directory does not exist: %s', directory)\n    return [];\
        \ glob_fn = directory.rglob if recursive else directory.glob; files = sorted((p for p in glob_fn('*.py') if not any((part\
        \ in EXCLUDED_DIRS for part in p.parts)) and (not exclude_init or p.name != '__init__.py'))); logger.debug('Collected\
        \ %d .py files from %s (recursive=%s)', len(files), directory, recursive); return files"
    - name: discover_source_files
      params:
      - 'project_root: Path'
      returns: list[Path]
      body_hint: all_py = collect_py_files(project_root, recursive=True); sources = [f for f in all_py if not _is_test_file(f,
        project_root)]; logger.info('Discovered %d source files (of %d total .py)', len(sources), len(all_py)); return sources
    - name: discover_test_files
      params:
      - 'project_root: Path'
      returns: list[Path]
      body_hint: all_py = collect_py_files(project_root, recursive=True); tests = [f for f in all_py if _is_test_file(f, project_root)];
        logger.info('Discovered %d test files', len(tests)); return tests
    test_contracts:
    - test_file: test_discovery.py
      test_method: test_collect_py_files_excludes_pycache
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_recursive
      assertion: len(result) == 2
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_non_recursive
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_exclude_init
      assertion: len(result) == 1
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_collect_py_files_nonexistent_dir
      assertion: result == []
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_discover_test_files
      assertion: len(result) == 2
      contract_type: value_equality
    - test_file: test_discovery.py
      test_method: test_discover_test_files_by_name
      assertion: len(result) == 2
      contract_type: value_equality
  - id: COMP-PROFILES
    name: Profiles
    status: ACTIVE
    description: Domain profile loading — software, controls, mechanical, electrical (85 lines)
    files:
    - src/architecture_model/profiles/schema.py
    - src/architecture_model/profiles/builtins/
    constants:
    - name: PROFILES_DIR
      value: Path(__file__).parent / 'builtins'
    signatures:
    - name: from_dict
      params:
      - 'data: dict[str, Any]'
      returns: DomainProfile
      decorators:
      - classmethod
      body_hint: return cls(domain=data['domain'], extends_schema=data.get('extends_schema', '1.4'), enum_extensions=[EnumExtension(**e)
        for e in data.get('enum_extensions', [])], entity_extensions=[EntityExtension(**e) for e in data.get('entity_extensions',
        [])], validation_rules=[ConditionalRule(**r) for r in data.get('validation_rules', [])])
    - name: get_extended_values
      params:
      - 'enum_name: str'
      returns: list[str]
      body_hint: "for ext in self.enum_extensions:\n    if ext.enum_name == enum_name:\n        return ext.values; return\
        \ []"
    - name: load_profile
      params:
      - 'name_or_path: str'
      returns: DomainProfile
      body_hint: 'if name_or_path in BUILTIN_PROFILES: ...; if not path.exists(): ...; data = yaml.safe_load(path.read_text(encoding=''utf-8''));
        profile = DomainProfile.from_dict(data); logger.info(''Loaded domain profile: %s'', profile.domain); return profile'
  - id: COMP-SPEC
    name: Spec
    status: ACTIVE
    description: JSON Schema definitions for model validation (data only, no code)
    files:
    - src/architecture_model/spec/schema.json
