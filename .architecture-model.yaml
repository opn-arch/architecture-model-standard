  - id: COMP-MANIFEST
    name: Manifest
    status: ACTIVE
    description: AST scanning engine producing reality manifests with modules, functions, classes, imports, call graphs, body
      hints, test contracts
    layer: LAYER-INFRA
    source_block: S9
    technology: python ast
    files:
    - src/architecture_model/manifest/generator.py
    - src/architecture_model/manifest/scanner.py
    - src/architecture_model/manifest/blocks.py
    - src/architecture_model/manifest/body_hints.py
    - src/architecture_model/manifest/test_analyzer.py
    - src/architecture_model/manifest/metrics.py
    - src/architecture_model/manifest/interfaces.py
    - src/architecture_model/manifest/call_graph.py
    - src/architecture_model/manifest/recursive.py
    - src/architecture_model/manifest/types.py
    - src/architecture_model/manifest/scan_cache.py
    - src/architecture_model/manifest/behavior.py
    - src/architecture_model/manifest/chains.py
    - src/architecture_model/manifest/grouping.py
    - src/architecture_model/manifest/slicers.py
    - src/architecture_model/manifest/display.py
    - src/architecture_model/manifest/multi_scanner.py
    - src/architecture_model/manifest/kt_scanner.py
    - src/architecture_model/manifest/ts_scanner.py
    - src/architecture_model/manifest/protocol.py
    responsibilities:
    - AST-scan Python/Kotlin/TypeScript files
    - Extract function signatures and body hints
    - Analyze test files for contracts
    - Derive import-based interfaces
    - Compute project metrics
    - Build call graphs
    - Generate recursive per-block manifests
    kind: library
    constants:
    - name: _RE_CLASS
      value: re.compile('^class\\s+([A-Z]\\w*)\\s*(?:\\(([^)]*)\\))?:', re.MULTILINE)
    - name: _RE_FUNC
      value: re.compile('^(?:async\\s+)?def\\s+([a-zA-Z]\\w*)\\s*\\(', re.MULTILINE)
    - name: _RE_IMPORT
      value: re.compile('^(?:import\\s+([\\w.]+)|from\\s+([\\w.]+)\\s+import)', re.MULTILINE)
    - name: _RE_DOCSTRING
      value: re.compile('^(?:\\s*#[^\\n]*\\n)*\\s*(?:\\"\\"\\"(.*?)(?:\\"\\"\\"|$)|\'\'\'(.*?)(?:\'\'\'|$))', re.DOTALL)
    - name: BodyComplexity.TRIVIAL
      value: trivial
    - name: BodyComplexity.SHORT
      value: short
    - name: BodyComplexity.COMPLEX
      value: complex
    - name: _EXCLUDED_MODULES
      value: frozenset({'unittest', 'pytest', 'sys', 'os', 'io', 're', 'math', 'collections', 'itertools', 'functools', 'pathlib',
        'typing', 'tempfile', 'shutil', 'json', 'copy', 'contextlib', 'textwrap', 'unittest.mock', 'mock'})
    - name: _ESCAPE_CODE_RE
      value: re.compile('\\\\(?:033|x1b)\\[(\\d+)m')
    - name: ModuleStatus.ACTIVE
      value: active
    - name: ModuleStatus.DORMANT
      value: dormant
    - name: ModuleStatus.MISSING
      value: missing
    - name: _BUILTINS
      value: frozenset({'print', 'len', 'str', 'int', 'float', 'bool', 'list', 'dict', 'set', 'tuple', 'range', 'enumerate',
        'zip', 'map', 'filter', 'sorted', 'reversed', 'min', 'max', 'sum', 'abs', 'round', 'isinstance', 'issubclass', 'hasattr',
        'getattr', 'setattr', 'delattr', 'type', 'id', 'repr', 'hash', 'iter', 'next', 'super', 'object', 'property', 'staticmethod',
        'classmethod', 'vars', 'dir', 'any', 'all', 'ord', 'chr', 'hex', 'oct', 'bin', 'format', 'input', 'open'})
    - name: _TRIVIAL_NAMES
      value: '{''__version__'', ''__main__''}'
    - name: _JVM_EXCLUDE
      value: frozenset({'build', '.gradle', '.idea', 'generated', 'ksp', 'kspCaches', '__pycache__', '.git', 'node_modules'})
    - name: _KOTLIN_LANGUAGE
      value: None
    - name: EXCLUDE_DIRS
      value: frozenset({'build', '.gradle', '.idea', 'generated', 'ksp', 'kspCaches', '__pycache__', '.git', 'node_modules'})
    - name: _JAVA_LANGUAGE
      value: None
    signatures:
    - name: generate_manifest
      params:
      - 'project_root: Path'
      - 'config: Optional[Any]'
      returns: Manifest
      decorators:
      - 'monitored(module=''manifest.generator'', outputs=lambda r: {''module_count'': len(r.modules), ''parse_failures'':
        sum((1 for m in r.modules if m.status.value == ''missing''))})'
      body_hint: 'root = project_root.resolve(); report = ScanReport(); cache = ScanCache(); if config is None: ...; logger.info(''Computing
        project metrics for %s'', root); metrics_result = compute_metrics(root, config); logger.info(''Metrics computed: %s'',
        metrics_result.values); blocks_dict = config.source_block_dict; logger.info(''Processing %d functional blocks'', len(blocks_dict));
        from architecture_model.manifest.types import BlockManifest; functional_blocks: dict[str, BlockManifest] = {}; scanned_files:
        set[str] = set(); for (block_id, block_def) in blocks_dict.items(): ...; logger.info(''Processed %d blocks, found
        %d files'', report.blocks_processed, len(scanned_files)); extra_dirs: set[str] = set(); for layer in config.layers:
        ...; for dir_path in sorted(extra_dirs): ...; logger.info(''Scanning %d files for module metadata'', len(scanned_files));
        from architecture_model.manifest.types import ModuleInfo; all_modules: list[ModuleInfo] = []; for rel_path in sorted(scanned_files):
        ...; logger.info(''Deriving interfaces from %d modules'', len(all_modules)); interfaces = derive_interfaces(all_modules,
        root); report.interfaces_derived = len(interfaces); report.log_summary(); return Manifest(generated_at=datetime.now(timezone.utc).strftime(''%Y-%m-%dT%H:%M:%S''),
        project_root=str(root), metrics=metrics_result, functional_blocks=functional_blocks, modules=all_modules, interfaces=interfaces,
        scan_report=report)'
    - name: load_or_generate_manifest
      params:
      - 'project_root: Path'
      - 'output_dir: Path | None'
      returns: dict[str, Any]
      body_hint: 'from architecture_model.config.loader import get_config; config = get_config(project_root); if output_dir
        is None: ...; if manifest_path.exists(): ...; manifest = generate_manifest(project_root, config); manifest_dict =
        manifest.to_dict(); manifest_path.parent.mkdir(parents=True, exist_ok=True); manifest_path.write_text(json.dumps(manifest_dict,
        indent=2, ensure_ascii=False), encoding=''utf-8''); return manifest_dict'
    - name: scan_file
      params:
      - 'root: Path'
      - 'filepath: Path'
      - cache
      returns: ModuleInfo
      body_hint: 'if cache is not None: ...; rel_path = str(filepath.relative_to(root)); line_count = _file_line_count(filepath);
        status = _determine_status(filepath, line_count); tree = _parse_file_ast(filepath); docstring = None; functions: list[FunctionInfo]
        = []; imports: list[str] = []; if tree is not None: ...; name = _derive_name_from_docstring(docstring, filepath);
        logger.debug(''Scanned %s: %d funcs, %d classes, %d constants'', rel_path, len(functions), len(classes), len(constants));
        result = ModuleInfo(file=rel_path, name=name, docstring=docstring,...; if cache is not None: ...; return result'
    - name: process_block
      params:
      - 'root: Path'
      - 'block_id: str'
      - 'block_def: dict'
      - 'sub_block_configs: list | None'
      returns: BlockManifest
      body_hint: 'sub_functions: list[SubFunctionEntry] = []; all_files: list[Path] = []; for dir_path in block_def[''dirs'']:
        ...; for file_path in block_def[''files'']: ...; logger.debug(''Block %s: %d files from %d dirs'', block_id, len(all_files),
        len(block_def[''dirs''])); for (idx, filepath) in enumerate(all_files, 1): ...; block_status = ''active'' if any((sf.status
        == ''active'' for sf in sub_func...; sub_blocks_manifest: list[dict[str, Any]] = []; if sub_block_configs: ...; logger.debug(''Block
        %s: %d sub_functions, %d sub_blocks'', block_id, len(sub_functions), len(sub_blocks_manifest)); return BlockManifest(name=block_def[''name''],
        status=block_status, description_source=block_def[''description_source''], sub_functions=sub_functions, sub_blocks=sub_blocks_manifest)'
    - name: classify_function
      params:
      - 'source: str'
      - 'func_name: str'
      returns: BodyComplexity
      body_hint: "tree = ast.parse(source); node = _find_function(tree, func_name); body = _strip_docstring(node.body); count\
        \ = len(body); if count <= 1:\n    return BodyComplexity.TRIVIAL\nelif count <= 5:\n    return BodyComplexity.SHORT\n\
        else:\n    return BodyComplexity.COMPLEX"
    - name: extract_body_hint
      params:
      - 'source: str'
      - 'func_name: str'
      - 'class_name: str | None'
      returns: str
      body_hint: "tree = ast.parse(source); node = _find_function(tree, func_name, class_name); body = _strip_docstring(node.body);\
        \ count = len(body); if count <= 1:\n    return ast.unparse(body[0]) if body else ''\nelif count <= 5:\n    return\
        \ '; '.join((ast.unparse(s) for s in body))\nelse:\n    return _summarize_complex_body(body)"
    - name: extract_file_hints
      params:
      - 'filepath: Path'
