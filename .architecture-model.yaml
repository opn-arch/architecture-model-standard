      body_hint: 'tree = ET.parse(junit_xml_path); root = tree.getroot(); testsuites = _collect_testsuites(root); if not testsuites:
        ...; total = 0; failed = 0; skipped = 0; duration = 0.0; failures: list[TestFailure] = []; for ts in testsuites: ...;
        passed = max(0, total - failed - skipped); if suite is None: ...; mtime = junit_xml_path.stat().st_mtime; timestamp
        = datetime.fromtimestamp(mtime, tz=timezone.utc).isoformat(); return TestResultBatch(suite=suite, total=total, passed=passed,
        failed=failed, skipped=skipped, duration_s=duration, failures=tuple(failures), timestamp=timestamp)'
    - name: TestFailure.to_dict
      returns: dict
      body_hint: 'return {''nodeid'': self.nodeid, ''message'': self.message}'
    - name: TestResultBatch.to_json_line
      returns: str
      body_hint: 'payload: dict = {''timestamp'': self.timestamp or _now_iso(), ''suite'': self.suite, ''total'': self.total,
        ''passed'': self.passed, ''failed'': self.failed, ''skipped'': self.skipped, ''duration_s'': self.duration_s, ''failures'':
        [f.to_dict() for f in self.failures]}; return json.dumps(payload, ensure_ascii=False) + ''\n'''
