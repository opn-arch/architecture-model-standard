meta:
  project: architecture-model-standard
  schema_version: '1.4'
  source_artifacts:
    - .architecture-model.yaml
entities:
  actors:
    - id: ACT-1
      name: LLM Agent
      status: ACTIVE
      type: system
    - id: ACT-2
      name: Developer
      status: ACTIVE
      type: human
  capabilities:
    - id: CAP-F1
      name: Model Validation
      status: ACTIVE
      f_block: F1
      priority: high
    - id: CAP-F2
      name: Manifest Generation
      status: ACTIVE
      f_block: F2
      priority: high
    - id: CAP-F3
      name: Model Parsing
      status: ACTIVE
      f_block: F3
      priority: high
    - id: CAP-F4
      name: Context Formatting
      status: ACTIVE
      f_block: F4
      priority: medium
    - id: CAP-F5
      name: Config Discovery
      status: ACTIVE
      f_block: F5
      priority: high
    - id: CAP-F6
      name: CLI Interface
      status: ACTIVE
      f_block: F6
      priority: medium
  layers:
    - id: cli-layer
      name: CLI Layer
      status: ACTIVE
      order: 1
    - id: core-layer
      name: Core Layer
      status: ACTIVE
      order: 2
    - id: manifest-layer
      name: Manifest Layer
      status: ACTIVE
      order: 3
    - id: config-layer
      name: Config Layer
      status: ACTIVE
      order: 4
  components:
    - id: COMP-CLI
      name: CLI Commands
      status: ACTIVE
      kind: service
      layer: cli-layer
      f_block: F6
    - id: COMP-PARSER
      name: Model Parser
      status: ACTIVE
      kind: library
      layer: core-layer
      f_block: F3
    - id: COMP-VALIDATOR
      name: Model Validator
      status: ACTIVE
      kind: library
      layer: core-layer
      f_block: F1
    - id: COMP-SLICER
      name: Model Slicer
      status: ACTIVE
      kind: library
      layer: core-layer
      f_block: F4
    - id: COMP-SCANNER
      name: AST Scanner
      status: ACTIVE
      kind: library
      layer: manifest-layer
      f_block: F2
    - id: COMP-GENERATOR
      name: Manifest Generator
      status: ACTIVE
      kind: service
      layer: manifest-layer
      f_block: F2
    - id: COMP-BLOCKS
      name: Block Processor
      status: ACTIVE
      kind: library
      layer: manifest-layer
      f_block: F2
    - id: COMP-CONFIG
      name: Config Loader
      status: ACTIVE
      kind: library
      layer: config-layer
      f_block: F5
    - id: COMP-UTILS
      name: Shared Utilities
      status: ACTIVE
      kind: library
      layer: core-layer
      f_block: F3
  interfaces:
    - id: IF-CLI
      name: CLI Entry Point
      status: ACTIVE
      type: external
    - id: IF-MCP
      name: MCP Server Integration
      status: ACTIVE
      type: external
    - id: IF-MANIFEST
      name: Manifest JSON Output
      status: ACTIVE
      type: internal
  constraints:
    - id: CON-1
      name: Python-Only AST
      status: ACTIVE
      type: technology
      description: AST scanning limited to Python source files
    - id: CON-2
      name: Backward Compatibility
      status: ACTIVE
      type: operational
      description: All typed returns must have to_dict() for legacy callers
  behaviors:
    - id: BEH-INIT
      name: Bootstrap Project
      status: ACTIVE
      pattern: pipeline
    - id: BEH-SCAN
      name: AST Scan Pipeline
      status: ACTIVE
      pattern: pipeline
    - id: BEH-VALIDATE
      name: Model Validation
      status: ACTIVE
      pattern: sequential
    - id: BEH-SLICE
      name: Context Slicing
      status: ACTIVE
      pattern: sequential
relationships:
  - type: realizes
    from: COMP-VALIDATOR
    to: CAP-F1
  - type: realizes
    from: COMP-SCANNER
    to: CAP-F2
  - type: realizes
    from: COMP-GENERATOR
    to: CAP-F2
  - type: realizes
    from: COMP-BLOCKS
    to: CAP-F2
  - type: realizes
    from: COMP-PARSER
    to: CAP-F3
  - type: realizes
    from: COMP-SLICER
    to: CAP-F4
  - type: realizes
    from: COMP-CONFIG
    to: CAP-F5
  - type: realizes
    from: COMP-CLI
    to: CAP-F6
  - type: depends-on
    from: COMP-GENERATOR
    to: COMP-SCANNER
  - type: depends-on
    from: COMP-GENERATOR
    to: COMP-BLOCKS
  - type: depends-on
    from: COMP-GENERATOR
    to: COMP-CONFIG
  - type: depends-on
    from: COMP-CLI
    to: COMP-PARSER
  - type: depends-on
    from: COMP-CLI
    to: COMP-VALIDATOR
  - type: depends-on
    from: COMP-CLI
    to: COMP-GENERATOR
  - type: depends-on
