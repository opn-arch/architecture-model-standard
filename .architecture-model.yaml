  - id: BEH-26
    name: Slice-Scoped Context
    status: ACTIVE
    behavior_type: use_case
    actor_id: ACT-1
    description: 'AI agent loads a focused architectural context (single F-block, layer,

      or entity) within its token budget via architect_slice, then produces

      informed edits without loading the full model.

      '
    goal: Compressed architecture context under agent token budget
    trigger: AI agent invokes architect_slice with a focus target
    preconditions: A published architecture model exists at .architecture-model.yaml
    postconditions: Agent receives compressed context under budget
    success_outcome: Agent produces informed edits without loading full model
    goals:
    - Deliver focused architecture context within an LLM token budget
    success_criteria:
    - fragment digest stable across identical inputs
    - no dangling refs after closure
    - renderer emits deterministic bytes
  - id: BEH-27
    name: Learning Loop
    status: ACTIVE
    behavior_type: use_case
    actor_id: ACT-2
    description: 'Pipeline accumulates lessons from prior runs (heuristics, archetypes,

      workflows) and applies them to subsequent extractions, monotonically

      improving quality across runs.

      '
    goal: Monotonic quality improvement across successive pipeline runs
    trigger: Developer runs `architecture-model pipeline .`
    preconditions: .architecture/learning/history.json is readable
    postconditions: New lessons appended; drift flags updated
    success_outcome: Successive runs show reduced novel-pattern rate
    goals:
    - Reduce repeat mistakes and encode institutional knowledge across pipeline runs
    success_criteria:
    - pattern hit-rate rising across runs
    - regen readiness grade improving
    - no oscillation in learning curve
  - id: BEH-28
    name: Development Loop
    status: ACTIVE
    behavior_type: use_case
    actor_id: ACT-2
    description: 'Developer edits code, regenerates architecture artifacts, reviews the

      viewer, captures a comment, and files an issue — all without leaving

      the tool suite.

      '
    goal: Close code-review feedback loop within one session
    trigger: Developer modifies source files
    preconditions: Architecture model exists; MCP tools available
    postconditions: Comment persisted; issue optionally filed via logs-db
    success_outcome: Feedback loop closes within one review session
    goals:
    - Close the loop from issue -> proposal -> validated model change
    success_criteria:
    - proposal applied without drift
    - gate passes post-apply
    - SI&L failure_rate not regressing
  - id: BEH-29
    name: Comment-Driven Collaboration
    status: ACTIVE
    behavior_type: use_case
    actor_id: ACT-2
    description: 'Users leave free-text feedback on any rendered artifact and downstream

      workflows (logs-db issue triage) consume the comments as issue seeds.

      '
    goal: Trace decisions back to specific artifact versions
    trigger: User invokes `architecture-model comment <artifact>`
    preconditions: The artifact exists under .architecture/lifecycle/artifacts/
    postconditions: Comment record persisted with artifact digest reference
    success_outcome: Reviewers can trace decisions back to artifact versions
  - id: BEH-P1
    name: Run Extraction Pipeline
    status: ACTIVE
    description: Orchestrates the 10-stage extraction pipeline (observe->infer->allocate->relate->specify->contract->validate->decompose->synthesize->emit) producing .architecture-model.yaml.
    steps:
    - observe
    - infer
    - allocate
    - relate
    - specify
    - contract
    - validate
    - decompose
    - synthesize
    - emit
    trigger: Operator invokes architect_pipeline MCP tool or architecture-model pipeline CLI on a repository
    goals:
    - Extract auditable architecture model from source code with zero manual configuration
    success_criteria:
    - validator score >= 80/100
    - component coverage >= 90%
    - 0 broken references
    - all 10 stages complete
    postconditions:
    - .architecture-model.yaml written
    - Reality manifest generated at .architecture-models/manifest.json
    - All 10 stages recorded in pipeline-report.md
    - Validator score >= configured threshold
  - id: BEH-P1.1
    name: Run Observe Stage
    status: ACTIVE
    description: AST-scan all source files to produce module inventory, function/class signatures, imports, routes, and constraints.
  - id: BEH-P1.2
    name: Run Infer Stage
    status: ACTIVE
    description: Infer semantic entities (actors, capabilities, behaviors) from raw observations using pattern rules.
  - id: BEH-P1.3
    name: Run Allocate Stage
    status: ACTIVE
    description: Allocate observed files/modules to components using multi-signal affinity (imports, name-prefix, directory).
  - id: BEH-P1.4
    name: Run Relate Stage
    status: ACTIVE
    description: Derive typed relationships (realizes, depends-on, contains, exposes, constrained-by) between entities.
  - id: BEH-P1.5
    name: Run Specify Stage
    status: ACTIVE
    description: Specify interface contracts (routes -> REST spec, argparse -> CLI spec, public API -> library spec).
  - id: BEH-P1.6
    name: Run Contract Stage
    status: ACTIVE
    description: Bind test contracts to components by mapping test files to their targets.
  - id: BEH-P1.7
    name: Run Validate Stage
    status: ACTIVE
    description: Validate the assembled model against structural rules; compute quality score.
  - id: BEH-P1.8
    name: Run Decompose Stage
    status: ACTIVE
    description: Decompose oversized components into autonomous subsystems when they exceed thresholds.
  - id: BEH-P1.9
    name: Run Synthesize Stage
    status: ACTIVE
    description: For each detected subsystem, run a scoped sub-pipeline (observe->validate) producing a subsystem model.
