  components:
  - id: COMP-1
    name: Core
    status: ACTIVE
    description: Foundation types, validation, parsing, and model operations
    intent: Provide the canonical type system and fundamental operations that all other subsystems depend on
    goals:
    - Define a complete, extensible type system for architecture entities
    - Validate models with scored, actionable feedback
    - Support lossless YAML round-trip parsing
    trade_offs:
    - Rich type system vs. schema simplicity for external consumers
    - Strict validation vs. permissive parsing for backward compatibility
    - Monolithic core vs. fine-grained packages (chose monolithic for import simplicity)
    failure_modes:
    - Type system changes break downstream parsers and MCP tools
    - Validation false positives block valid models from progressing
    - Parser loses data on round-trip due to YAML serialization edge cases
