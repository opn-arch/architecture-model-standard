      - 'model: ArchitectureModel'
      - 'strict: bool'
      - 'raw_dict: dict | None'
      returns: ValidationResult
      decorators:
      - instrumented('validator:validate')
      - 'monitored(module=''core.validator'', quality=lambda r: {''score'': r.score, ''issue_count'': len(r.issues)}, outputs=lambda
        r: {''error_count'': r.error_count, ''warning_count'': r.warning_count})'
      body_hint: 'result = ValidationResult(); if raw_dict is not None: ...; _check_id_uniqueness(model, result); _check_referential_integrity(model,
        result); _check_orphan_entities(model, result); _check_status_consistency(model, result); _check_capability_realization(model,
        result); _check_meta_completeness(model, result); _check_v11_semantics(model, result); _check_regen_readiness(model,
        result); _check_domain_profile(model, result); _check_improvement_opportunities(model, result); _check_requirements_verification(model,
        result); _check_dependency_cycles(model, result); _check_operational_fields(model, result); _check_hierarchy_consistency(model,
        result); _check_semantic_completeness(model, result); _check_interface_subkinds(model, result); lifecycle_phase =
        getattr(model.meta, ''lifecycle_phase'', ''production''); if lifecycle_phase == ''concept'': ...; if strict: ...;
        from architecture_model.core.confidence import compute_mo...; compute_model_confidence(model); try/except: ...; return
        result'
