      body_hint: 'name = root.name; report = DiscoveryReport(); layers = _discover_layers(root, report); metrics = _discover_metrics(root);
        functional_blocks = _discover_functional_blocks(root, report); if not layers and functional_blocks: ...; report.layers_discovered
        = len(layers); report.metrics_discovered = len(metrics); config = ProjectConfig(name=name, system=name, output=OutputConfig...;
        logger.info(''Discovery complete: %s'', report.summary()); return (config, report)'
    - name: get_config
      params:
      - 'root: Path'
      returns: ProjectConfig
      body_hint: "config_path = root / CONFIG_FILENAME; if config_path.exists():\n    config = load_config(root)\n    if not\
        \ config.functional_blocks:\n        config, _report = discover_config(root)\n        return config\n    for block\
        \ in config.functional_blocks:\n        if not block.sub_blocks and block.dirs:\n            block_path = root / block.dirs[0]\n\
        \            if block_path.is_dir():\n                block.sub_blocks = _discover_sub_blocks(block_path, block.id,\
        \ root)\n    return config; config, _report = discover_config(root); return config"
    - name: write_config
      params:
      - 'config: ProjectConfig'
      - 'root: Path | None'
      returns: Path
      body_hint: 'if root is None: ...; config_path = root / CONFIG_FILENAME; data = config.to_dict(); header = "# Architecture
        Model Standard - Project Descriptor\n# Au...; yaml_content = yaml.dump(data, default_flow_style=False, sort_keys=False...;
        config_path.write_text(header + yaml_content, encoding=''utf-8''); return config_path'
    - name: OutputConfig.resolve
