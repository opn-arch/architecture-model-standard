        \ found in {root}. Run `architecture-model init` to generate one, or use get_config() for auto-discovery.'); data\
        \ = yaml.safe_load(config_path.read_text(encoding='utf-8')); if not data:\n    data = {}; return ProjectConfig.from_dict(data,\
        \ root=root)"
    - name: discover_config
      params:
      - 'root: Path'
