    - name: generate_custom_instructions
      params:
      - 'repo_name: str'
      - 'stats: dict'
      returns: str
      body_hint: 'components = stats.get(''components'', ''?''); behaviors = stats.get(''behaviors'', ''?''); relationships
        = stats.get(''relationships'', ''?''); file_count = stats.get(''file_count'', ''?''); return f"""# Custom Instructions
        for Claude\n\nPaste the following into your Claude Project''s "Set custom instructions" field:\n\n---\n\nYou have
        access to architecture model artifacts for the **{repo_name}** repository. These artifacts compress the full codebase
        into structured models that let you reason about system architecture without reading source code.\n\n## Repository
        stats\n\n- Components: {components}\n- Behaviors: {behaviors}\n- Relationships: {relationships}\n- Export files: {file_count}\n\n##
        How to navigate the artifacts\n\n1. **Start with CONTEXT.md** — gives purpose, structure, decisions, current state\n2.
        **Read the model YAML** — components, relationships, and behaviors\n3. **Use behavior specs** — for cross-component
        flow understanding (if present)\n4. **Reference manifests** — for ground-truth function signatures and call edges\n5.
        **Check SCHEMA.md** — for valid entity types and relationship types\n6. **Check API.md** — for tool capabilities and
        token-saving patterns\n\n## File naming convention\n\nFiles are named `{{prefix}}--{{category}}.{{ext}}` where prefix
        identifies the repository.\n\n## Key concepts\n\n- **Token arbitrage**: Compress full repo into ~430 tokens of model
        context\n- **Behavior flows**: Cross-component call chains traced from AST data\n- **Sub-models**: Scoped architecture
        models for one component or behavior\n- **Manifests**: AST-scanned code facts (functions, imports, calls)\n\n## When
        asked about architecture or planning\n\n- Reference the model YAML for component boundaries\n- Reference behavior
        specs for understanding cross-cutting flows\n- Use manifests to ground claims in actual code structure\n- Use SCHEMA.md
        to validate any model changes proposed\n- Use API.md token-saving strategies when suggesting efficient approaches\n\n##
        When asked about next steps\n\nReference the "In Progress" section of the CONTEXT.md for current work and approved
        plans.\n"""'
