    to: COMP-UTILS
  - type: exposes
    from: COMP-CLI
    to: IF-CLI
  - type: exposes
    from: COMP-GENERATOR
    to: IF-MANIFEST
  - type: consumes
    from: ACT-1
    to: IF-MCP
  - type: consumes
    from: ACT-2
    to: IF-CLI
  - type: traces-to
    from: COMP-CONFIG
    to: BEH-INIT
  - type: traces-to
    from: COMP-SCANNER
    to: BEH-SCAN
  - type: traces-to
    from: COMP-VALIDATOR
    to: BEH-VALIDATE
  - type: traces-to
    from: COMP-SLICER
    to: BEH-SLICE
  - type: constrained-by
    from: COMP-SCANNER
    to: CON-1
  - type: constrained-by
    from: COMP-SCANNER
    to: CON-2
  - type: constrained-by
    from: COMP-GENERATOR
    to: CON-2
  - type: contains
    from: cli-layer
    to: COMP-CLI
  - type: contains
    from: core-layer
    to: COMP-PARSER
  - type: contains
    from: core-layer
    to: COMP-VALIDATOR
  - type: contains
    from: core-layer
    to: COMP-SLICER
  - type: contains
    from: core-layer
    to: COMP-UTILS
  - type: contains
    from: manifest-layer
    to: COMP-SCANNER
  - type: contains
    from: manifest-layer
    to: COMP-GENERATOR
  - type: contains
    from: manifest-layer
    to: COMP-BLOCKS
  - type: contains
    from: config-layer
    to: COMP-CONFIG
