        _diff_entity_list(old_model.entities.capabilities, new_model.entities.capabilities, 'capability', result); _diff_entity_list(old_model.entities.behaviors,
        new_model.entities.behaviors, 'behavior', result); _diff_entity_list(old_model.entities.interfaces, new_model.entities.interfaces,
        'interface', result); _diff_entity_list(old_model.entities.constraints, new_model.entities.constraints, 'constraint',
        result); _diff_entity_list(old_model.entities.layers, new_model.entities.layers, 'layer', result); _diff_entity_list(old_model.entities.components,
        new_model.entities.components, 'component', result); _diff_relationships(old_model.relationships, new_model.relationships,
        result); return result
