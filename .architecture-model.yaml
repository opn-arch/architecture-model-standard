    - name: ValidationResult.error_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.ERROR))
    - name: ValidationResult.warning_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.WARNING))
    - name: ValidationResult.info_count
      returns: int
      decorators:
      - property
      body_hint: return sum((1 for i in self.issues if i.severity == Severity.INFO))
    - name: ValidationResult.is_valid
      returns: bool
      decorators:
      - property
      body_hint: return self.error_count == 0
    - name: ValidationResult.score
      returns: int
      decorators:
      - property
      body_hint: penalty = self.error_count * 10 + self.warning_count * 2; return max(0, 100 - penalty)
    - name: ValidationResult.summary
      returns: str
      body_hint: 'completeness = f'' | Completeness: {self.completeness_grade} ({self.completeness_score:.0f}%)'' if self.completeness_grade
        else ''''; return f''Score: {self.score}/100 | Errors: {self.error_count}, Warnings: {self.warning_count}, Info: {self.info_count}{completeness}'''
