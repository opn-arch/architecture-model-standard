        for e in data.get('enum_extensions', [])], entity_extensions=[EntityExtension(**e) for e in data.get('entity_extensions',
        [])], validation_rules=[ConditionalRule(**r) for r in data.get('validation_rules', [])])
    - name: DomainProfile.get_extended_values
