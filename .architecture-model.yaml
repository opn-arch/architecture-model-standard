meta:
  schema_version: '2.0'
  project: architecture-model-standard
  system: Architecture Model Standard
  generated_at: '2026-08-06T21:52:00'
  source_artifacts:
  - .architecture-models/manifest.json
  source_language: python
entities:
  actors:
  - id: ACT-CLI
    name: CLI User
    status: ACTIVE
    description: Developer using architecture-model CLI commands
    type: human
    goals:
    - Generate architecture models from code
    - Validate model correctness
    - Visualize system structure
  - id: ACT-LLM
    name: LLM Agent
    status: ACTIVE
    description: AI agent consuming compressed model context via LOAD/QUERY/IMPACT/VALIDATE/UPDATE/PROJECT verbs
    type: system
    goals:
    - Load and query architecture models
    - Propose model updates
    - Trace change impact
  - id: ACT-MCP
    name: MCP Server
    status: ACTIVE
    description: opencode-arch MCP extension wrapping APIs as tools
    type: system
    goals:
    - Expose scan/slice/validate/extract as MCP tools
    - Drain observability metrics
  - id: ACT-CI
    name: CI/CD Pipeline
    status: ACTIVE
    description: Automated pipeline running validation and gate checks
    type: system
    goals:
    - Enforce model quality gates
    - Detect architectural drift
  capabilities:
  - id: CAP-PARSE
    name: Model Parsing
    status: ACTIVE
    description: Parse YAML architecture models into typed ArchitectureModel instances
    source_block: S4
    priority: high
  - id: CAP-VALIDATE
    name: Model Validation
    status: ACTIVE
    description: Validate structural correctness, referential integrity, regen-readiness (score 0-100)
    source_block: S4
    priority: high
  - id: CAP-SLICE
    name: Model Slicing
    status: ACTIVE
    description: Extract model subsets by F-block, layer, artifact, or status
    source_block: S4
    priority: high
  - id: CAP-DIFF
    name: Model Diffing
    status: ACTIVE
    description: Compare two model versions and report structural changes
    source_block: S4
  - id: CAP-MANIFEST
    name: Reality Manifest Generation
    status: ACTIVE
    description: AST-scan source code to produce ground-truth inventory (modules, functions, classes, imports, call graphs)
    source_block: S9
    priority: high
  - id: CAP-ENRICH
    name: Model Enrichment
    status: ACTIVE
    description: Populate model components with signatures, constants, test_contracts, body_hints from manifest
    source_block: S10
    priority: high
  - id: CAP-DECOMPOSE
    name: Model Decomposition
    status: ACTIVE
    description: Split parent model into self-contained per-subsystem sub-models with traced relationships
    source_block: S10
    priority: high
  - id: CAP-EXTRACT
    name: Code-to-Model Extraction
    status: ACTIVE
    description: Derive architecture model from source code via AST analysis and import graphs
    source_block: S8
    priority: high
  - id: CAP-BOOTSTRAP
    name: Self-Bootstrapping
    status: ACTIVE
    description: Auto-generate project descriptor from directory structure without manual config
    source_block: S3
    priority: high
  - id: CAP-CONTEXT
    name: LLM Context Formatting
    status: ACTIVE
    description: Compress model into token-efficient format for LLM consumption (2.8x-86x compression)
    source_block: S4
    priority: high
  - id: CAP-VISUALIZE
    name: Diagram Generation
    status: ACTIVE
    description: Generate Mermaid diagrams (context, components, behaviors, dependencies)
    source_block: S4
  - id: CAP-DOCS
    name: Documentation Generation
    status: ACTIVE
    description: Generate architecture documentation site (component specs, ICDs, health reports, drift reports)
    source_block: S6
  - id: CAP-GATE
    name: Development Gate
    status: ACTIVE
    description: Check if code reality tracks toward authored architecture intent (capability realization %, file coverage
      %)
    source_block: S1
  - id: CAP-PROFILE
    name: Domain Profile System
    status: ACTIVE
    description: Support cross-domain modeling via pluggable profiles (software, controls, mechanical, electrical)
    source_block: S12
  - id: CAP-EXPORT
    name: Flat-File Export
    status: ACTIVE
    description: Export model artifacts as flat files for cross-repo sharing
    source_block: S7
    priority: low
  - id: CAP-PERSIST
    name: Project Persistence
    status: ACTIVE
    description: Save/load project snapshots (model + manifest + telemetry) to .architecture/ directory
    source_block: S11
    priority: low
  - id: CAP-AUTHOR
    name: Requirements Authoring
    status: ACTIVE
    description: Parse requirements documents into architecture model entities
    source_block: S1
  - id: CAP-COVERAGE
    name: Coverage Analysis
    status: ACTIVE
    description: Analyze model coverage against code reality (files claimed vs existing)
    source_block: S4
  - id: CAP-IMPACT
    name: Impact Analysis
    status: ACTIVE
    description: Trace change impact through relationship graph for a given entity
    source_block: S4
  - id: CAP-MONITOR
    name: Observability
    status: ACTIVE
    description: Per-function timing and quality metrics via @monitored decorator, drained by MCP
    source_block: S10
    priority: low
  behaviors:
  - id: BEH-INIT
    name: Project Initialization
    status: ACTIVE
    description: Auto-generate architecture model from directory structure
    trigger: architecture-model init <path>
    actor: ACT-CLI
    steps:
    - Scan directory structure
    - Discover source layout (src/flat/lib)
    - Create FunctionalBlockConfig per subpackage
    - Write .architecture-model.yaml
    - Optionally run pipeline + docs
  - id: BEH-VALIDATE
    name: Model Validation
    status: ACTIVE
    description: Check model structural correctness and report score
    trigger: architecture-model validate <model>
    actor: ACT-CLI
    steps:
    - Load model from YAML
    - Check referential integrity
    - Check ID uniqueness
    - Check status consistency
    - Check completeness
    - Compute score 0-100
    - Report issues by severity
  - id: BEH-MANIFEST
    name: Manifest Generation
    status: ACTIVE
    description: AST-scan source code to produce ground-truth inventory
    trigger: architecture-model manifest <path>
    actor: ACT-CLI
    steps:
    - Load config via get_config()
    - Collect Python files
    - AST-scan each file (with ScanCache)
    - Process functional blocks
    - Derive interfaces from imports
    - Compute project metrics
    - Return typed Manifest
    pattern: pipeline
  - id: BEH-ENRICH
    name: Model Enrichment
    status: ACTIVE
    description: Populate model components with AST-level detail from manifest
    trigger: architecture-model enrich <model>
    actor: ACT-CLI
    steps:
    - Load model and manifest
    - 'For each ACTIVE component with files:'
    - Extract function signatures with body_hints
    - Extract module-level constants
    - Discover and analyze test files
    - Attach signatures/constants/test_contracts to component
  - id: BEH-DECOMPOSE
    name: Model Decomposition
    status: ACTIVE
    description: Split parent model into per-subsystem self-contained sub-models
    trigger: architecture-model decompose <model>
    actor: ACT-CLI
    steps:
    - Generate recursive manifests per F-block
    - Trace relationships from block components outward
    - Copy related capabilities, interfaces, behaviors, constraints
    - Write sub-models to .architecture-models/<block>/
  - id: BEH-EXTRACT
    name: Code-to-Model Extraction
    status: ACTIVE
    description: Derive architecture model from source code (backward pass)
    trigger: architect_extract MCP tool call
    actor: ACT-MCP
    steps:
    - Load config and generate manifest
    - Detect HTTP routes
    - Detect constraints from code patterns
    - Derive actors from routes/manifest
    - Build components from functional blocks
    - Infer capabilities and relationships
    - Return ArchitectureModel
    pattern: pipeline
  - id: BEH-GATE
    name: Development Gate Check
    status: ACTIVE
    description: Verify code reality tracks toward architectural intent
    trigger: Gate check in CI or CLI
    actor: ACT-CI
    steps:
    - Load authored model and manifest
    - Compute capability realization %
    - Compute constraint allocation %
    - Compute file coverage %
    - Compare against phase thresholds
    - Return GateResult with pass/fail
  - id: BEH-PIPELINE
    name: Full Pipeline Execution
    status: ACTIVE
    description: 'End-to-end pipeline: scan, init, decompose, enrich, validate, visualize'
    trigger: run_pipeline() or init with pipeline flag
    actor: ACT-CLI
    steps:
    - Generate manifest
    - Bootstrap/update model
    - Generate recursive manifests
    - Decompose into sub-models
    - Enrich sub-models
    - Validate all models
    - Generate visualizations
    pattern: pipeline
  - id: BEH-LLM-QUERY
    name: LLM Model Query
    status: ACTIVE
    description: LLM agent loads compressed model context and queries architecture
    trigger: LOAD/QUERY/IMPACT verb from LLM agent
    actor: ACT-LLM
    steps:
    - Format model context with token budget
    - Slice to relevant subset if needed
    - Return compressed representation
    - Agent queries structural questions
  interfaces:
  - id: IF-PARSE
    name: Model Parser API
    status: ACTIVE
    description: load_model(path) -> ArchitectureModel, save_model(model, path), _parse_raw(raw) -> ArchitectureModel
    type: internal
    provider: COMP-CORE
  - id: IF-VALIDATE
    name: Validation API
    status: ACTIVE
