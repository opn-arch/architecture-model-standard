  - id: COMP-7
    name: Authoring
    status: ACTIVE
    description: Forward-author models from requirements, check development gates
    intent: Enable architecture-first development by creating models before code and gating progress against them
    goals:
    - Parse freeform requirements documents into concept-phase models
    - Gate development milestones on architecture coverage
    - Bridge the gap between stakeholder intent and technical architecture
    failure_modes:
    - Requirements parser misinterprets ambiguous natural language
    - Gate check produces false failures due to naming mismatches
    - Authored model diverges from implementation reality over time
    trade_offs:
    - Structured parsing (reliable) vs. LLM-based understanding (flexible)
    - Strict gate enforcement vs. advisory-only feedback
    - Requirements granularity vs. model abstraction level
    layer: application
    files:
    - src/architecture_model/authoring/__init__.py
    - src/architecture_model/authoring/parser.py
    - src/architecture_model/authoring/gate.py
    kind: library
    contract: parse_requirements_doc(text) → ArchitectureModel, check_development_gate(model, manifest)
    signatures:
    - name: parse_requirements_doc
      params:
      - 'text: str'
      returns: ArchitectureModel
      body_hint: 'sections = _split_sections(text); actors: list[Actor] = []; capabilities: list[Capability] = []; constraints:
        list[Constraint] = []; relationships: list[Relationship] = []; if ''actors'' in sections: ...; if ''capabilities''
        in sections: ...; if ''constraints'' in sections: ...; return ArchitectureModel(meta=ModelMeta(project=''authored'',
        schema_version=''1.3''), entities=Entities(actors=actors, capabilities=capabilities, constraints=constraints), relationships=relationships)'
    - name: check_development_gate
      params:
      - 'model: ArchitectureModel'
      - 'manifest: Manifest'
      - 'phase: str | None'
      returns: GateResult
      decorators:
      - instrumented('validator:gate')
      body_hint: 'if phase is None: ...; from architecture_model.core.hierarchy import load_model_...; (models, hierarchy_issues)
