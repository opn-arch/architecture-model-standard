  - id: COMP-13
    name: SI&L Instrumentation
    status: ACTIVE
    description: 'Structural Interface Layer: SQLite-backed ring buffer at

      .architecture/sil.sqlite retaining the 50 most recent events per

      component_id, plus YAML rollup snapshots under .architecture/sil/. The

      @sil_instrument decorator is applied to 10 pipeline stages, 5 lifecycle

      renderers, 3 validators, and all 19 MCP *_tool handlers.

      '
    intent: SI&L (Self-Improvement & Logging) package
    layer: observability
    files:
    - src/architecture_model/sil/__init__.py
    - src/architecture_model/sil/decorators.py
    - src/architecture_model/sil/record.py
    - src/architecture_model/sil/rollup.py
    kind: library
    contract: SILStore — append events, roll up per-component metrics for dashboards and evaluate
    constants:
    - name: MAX_EVENTS
      value: '50'
    - name: VALID_KINDS
      value: frozenset({'architecture-component', 'runtime-component'})
    signatures:
    - name: bind_store
      params:
      - 'store: Any'
      returns: None
      body_hint: global _STORE; _STORE = store
    - name: instrumented
      params:
      - 'component_id: str'
      returns: Callable
      body_hint: "def deco(fn: Callable) -> Callable:\n    if asyncio.iscoroutinefunction(fn):\n\n        @functools.wraps(fn)\n\
        \        async def async_wrapper(*args, **kwargs):\n            if _STORE is None:\n                return await fn(*args,\
        \ **kwargs)\n            t0 = time.perf_counter()\n            try:\n                result = await fn(*args, **kwargs)\n\
        \                _STORE.emit(component_id, 'invocation', 'ok', int((time.perf_counter() - t0) * 1000))\n         \
        \       return result\n            except BaseException as e:\n                _STORE.emit(component_id, 'invocation',\
        \ 'error', int((time.perf_counter() - t0) * 1000), ref=type(e).__name__)\n                raise\n        async_wrapper.__sil_instrumented__\
        \ = True\n        async_wrapper.__sil_component_id__ = component_id\n        return async_wrapper\n\n    @functools.wraps(fn)\n\
        \    def wrapper(*args, **kwargs):\n        if _STORE is None:\n            return fn(*args, **kwargs)\n        t0\
        \ = time.perf_counter()\n        try:\n            result = fn(*args, **kwargs)\n            _STORE.emit(component_id,\
        \ 'invocation', 'ok', int((time.perf_counter() - t0) * 1000))\n            return result\n        except BaseException\
        \ as e:\n            _STORE.emit(component_id, 'invocation', 'error', int((time.perf_counter() - t0) * 1000), ref=type(e).__name__)\n\
        \            raise\n    wrapper.__sil_instrumented__ = True\n    wrapper.__sil_component_id__ = component_id\n   \
        \ return wrapper; return deco"
    - name: SILRecord.add_event
      params:
      - 'event: Event'
      returns: None
      body_hint: "self.events.append(event); if len(self.events) > MAX_EVENTS:\n    del self.events[:len(self.events) - MAX_EVENTS]"
    - name: dump_yaml
      params:
      - 'record: SILRecord'
      returns: str
      body_hint: return yaml.safe_dump(_record_to_dict(record), default_flow_style=False, sort_keys=False, allow_unicode=True,
        width=120)
    - name: load_yaml
      params:
      - 'text: str'
      returns: SILRecord
      body_hint: 'raw = yaml.safe_load(text) or {}; if not isinstance(raw, dict): ...; metrics_raw = raw.get(''metrics'')
        or {}; metrics = Metrics(**_filter_kwargs(Metrics, metrics_raw)); events_raw = raw.get(''events'') or []; events =
        [Event(**_filter_kwargs(Event, e or {})) for e in events_...; rollup_raw = raw.get(''rollup''); rollup = Rollup(**_filter_kwargs(Rollup,
        rollup_raw)) if rollup_ra...; return SILRecord(component_id=raw[''component_id''], kind=raw[''kind''], name=raw[''name''],
        metrics=metrics, last_touched_revision=raw.get(''last_touched_revision''), last_touched_at=raw.get(''last_touched_at''),
        events=events, rollup=rollup)'
    - name: rollup_component
      params:
      - 'arch: SILRecord'
      - 'runtime: list[SILRecord]'
      - 'allocation_map: dict[str, list[str]]'
      - 'module_to_runtime: dict[str, list[str]]'
      returns: SILRecord
      body_hint: 'modules = allocation_map.get(arch.component_id, []); runtime_ids: list[str] = []; seen: set[str] = set();
        for module in modules: ...; by_id = {r.component_id: r for r in runtime if r.component_id in ...; relevant = [by_id[rid]
        for rid in runtime_ids if rid in by_id]; total_inv = sum((r.metrics.invocations_7d for r in relevant)); if total_inv
        > 0: ...; merged_metrics = replace(arch.metrics, invocations_7d=total_inv, avg_durat...; return SILRecord(component_id=arch.component_id,
        kind=arch.kind, name=arch.name, metrics=merged_metrics, last_touched_revision=arch.last_touched_revision, last_touched_at=arch.last_touched_at,
        events=copy.deepcopy(arch.events), rollup=Rollup(runtime_components=runtime_ids, aggregated_at=_now_iso()))'
