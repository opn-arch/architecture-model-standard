    - Zero false-positives on typed-gap entities
    - CI blocks merge on regression
    failure_modes:
    - Harness too slow blocks CI
    - Typed-gap syntax ambiguous causes false-positive
    - Override abused (audit gap)
    trade_offs:
    - Rich slice metadata increases storage cost; accepted for verify-up traceability
    - LLM-required projector variants improve documentation but add cost; guarded by closure_pct threshold
    assumptions:
