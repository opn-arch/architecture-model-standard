meta:
  schema_version: '2.1'
  project: architecture-model-standard-plan-b
  generated_at: '2026-09-12'
  domain_profile: library
  description: Architecture model of Plan B refactor (promise-graph schema 3.0 + 7-stage pipeline + legacy-adapter
    plugin). Modeled in AMS 2.1 before any code change; approval gate at Phase B'-0c unlocks first code
    commit. See docs/plans/2026-09-12-plan-b-architecture-first-refactor.md.
entities:
  actors:
  - id: ACT-PB-1
    name: Human Architect
    status: ACTIVE
    type: human
    description: Primary curator of Plan B; reviews the architecture model, approves the first coding
      commit, drives iterative refinement during Phase B'-4.
    intent: Steer AMS toward a promise-graph schema that models any system's promises with delivery-down/verify-up
      closure
    goals:
    - Approve Plan B architecture at Phase B'-0c gate
    - Review each code commit's architecture-refs closure
    - Iterate model when new promises are discovered
    - Preserve existing test surface via legacy adapters
    stakeholders:
    - Human Architect (self)
    - Downstream AMS users
    success_criteria:
    - Every code commit references a verified architecture entity
    - Chain-closure on Plan B model reaches >=70% before first code
    - Legacy tests continue to pass under adapter
    failure_modes:
    - Approval given without slice-by-slice verification
    - Model diverges from code silently
  - id: ACT-PB-2
    name: LLM Agent (frontier model via MCP)
    status: ACTIVE
    type: human
    description: Any frontier LLM (Anthropic/OpenAI/local) invoked through OpenCode MCP substrate; consumes
      compressed context and produces model updates, proposals, prose narratives, and gap classifications.
    intent: Author and refine architecture-model content via write-back projectors and proposal workflow
    goals:
    - Enrich entities with intent/goals/failure-modes from code + docs
    - Classify open promises as external-dep, genuinely-unclosed, or spurious
    - Produce delivery-chain narrative for entity pages
    - Adjudicate fuzzy duplicate-capability pairs
    stakeholders:
    - Human Architect
    - Users of AMS-derived docs
    success_criteria:
    - Every LLM proposal validates via proposal_validators
    - Chain-closure improves monotonically per proposal batch
    - Prompt digest stable per prompt-library version
    failure_modes:
    - Hallucinated entity IDs
    - Prompt drift breaking provenance chain
    - Budget overrun during pipeline run
  - id: ACT-PB-3
    name: OCA MCP Consumer
    status: ACTIVE
    type: human
    description: opencode-arch MCP server wrapping this package's APIs; exposes architect_slice / architect_validate
      / architect_propose / architect_work_issue to OpenCode sessions.
    intent: Serve AMS capabilities to OpenCode sessions with schema-3.0 awareness
    goals:
    - Route write-back projector calls through .llm variants
    - Enforce WorkOrder expected_closure_delta on apply
    - Bridge SI&L records as promise evidence
    stakeholders:
    - OpenCode session users
    - Human Architect
    success_criteria:
    - Schema 2.1 and 3.0 both work through adapter during migration window
    - MCP tool contracts unchanged (backwards-compatible surface)
    failure_modes:
    - Downstream OCA repo unable to consume 3.0 without upgrade
    - Coordination breakage during release
  - id: ACT-PB-4
    name: arch-agent Trainer
    status: ACTIVE
    type: human
    description: Training pipeline in ../arch-agent/ that consumes architecture models to train surrogate
      agents. Depends on 2.1 parse path; will need coordination for 3.0.
    intent: Train surrogate agents on architecture-model outputs across the 4 e2e benchmark repos
    goals:
    - Consume both 2.1 and 3.0 models via unified loader
    - Preserve training curves through schema migration
    stakeholders:
    - arch-agent maintainers
    - Human Architect
    success_criteria:
    - 4 e2e benchmarks (colorama, structlog, tqdm, click) reproduce prior results under schema 3.0
    failure_modes:
    - Training data drift from schema change
    - Loss of promise-attribute fidelity in 3.0 migration
  - id: ACT-PB-5
    name: CI/CD Pipeline
    status: ACTIVE
    type: human
    description: Automated pipeline running validation + verify_entity_standalone on every PR; blocks
      merge on open promises without typed-gap classification.
    intent: Enforce chain-closure discipline at merge time; prevent silent architecture drift
    goals:
    - Run full test suite on every commit
    - Run verify_entity_standalone parametrized over all entities
    - Block merge on chain-closure regression
    - Emit chain-closure history to .architecture/chain-closure-history.jsonl
    stakeholders:
    - Human Architect
    - Downstream consumers
    success_criteria:
    - No merge with open promises (must be closed or typed-gap)
    - Chain-closure never regresses without explicit override
    failure_modes:
    - Gate too strict blocks legitimate WIP
    - Gate too lax admits silent drift
  behaviors:
  - id: BEH-PB-UC-1
    name: 'Use Case: Extract Architecture from Source Code'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: Human architect runs the 7-stage promise-graph pipeline against a target repo; receives
      an architecture model where every promise is closed or typed-gap; reviews via viewer.html and slice-per-entity
      drill-down.
    intent: Produce a schema-3.0 architecture model from source code with per-entity chain-closure computed
    goals:
    - Pipeline runs deterministically (fixed AMS_DETERMINISTIC_NOW)
    - Every entity's slice stands on its own
    - LLM enrichment stays under budget
    success_criteria:
    - Chain-closure >=70% on first extraction pass
    - 4 e2e benchmarks match prior extraction shape via adapter
    - viewer.html renders without errors
    failure_modes:
    - Cluster stage over-merges promises (loss of fidelity)
    - Cluster stage under-merges (duplicate caps resurface)
    - LLM budget exhausted before publish stage
    verification:
    - id: VRF-BEH-PB-UC-1-1
      method:
        E2E benchmark: colorama extract + chain-closure >=70%
    - id: VRF-BEH-PB-UC-1-2
      method:
        E2E benchmark: structlog extract + chain-closure >=70%
    - id: VRF-BEH-PB-UC-1-3
      method:
        E2E benchmark: tqdm extract + chain-closure >=70%
    - id: VRF-BEH-PB-UC-1-4
      method:
        E2E benchmark: click extract + chain-closure >=70%
    steps:
    - scan repo modules via AST
    - derive_promises from docstrings + type hints + tests + git history
    - cluster promises by semantic similarity
    - link delivered_from / verified_by edges
    - containerize promise families into capabilities / behaviors / components / interfaces
    - verify chain-closure per entity
    - publish package generation via lifecycle substrate
  - id: BEH-PB-UC-2
    name: 'Use Case: Migrate 2.1 Model to 3.0'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: One-way migration reads a 2.1 model, materializes Promise records from semantic fields
      (intent, goals, requirements, slos, ...), emits 3.0 model. Adapter path preserves 2.1 fallback during
      migration window.
    intent: Convert existing 2.1 models to 3.0 schema without silent loss of semantic content
    goals:
    - Deterministic field-by-field migration for closed-form promises
    - LLM re-derivation for lossy prose fields with digest-locked prompts
    - Round-trip contract on 4 e2e benchmark models
    success_criteria:
    - Round-trip test passes for every 2.1 fixture in tests/fixtures
    - Adapter path continues to serve 2.1 consumers unchanged
    failure_modes:
    - Prose intent loses subtle semantic content
    - Migration non-idempotent (re-running produces different output)
    - LLM re-derivation produces hallucinated promise IDs
    verification:
    - id: VRF-BEH-PB-UC-2-1
      method: Snapshot test on every existing 2.1 fixture
    - id: VRF-BEH-PB-UC-2-2
      method: Backwards-compat declaration in spec/migration-2.1-to-3.0.md
    steps:
    - load 2.1 model
    - enumerate semantic fields per entity
    - materialize Promise records deterministically for structured fields
    - LLM-assisted re-derivation for prose fields (digest-locked prompts)
    - validate 3.0 output against schema-3.0.json
    - emit 3.0 model
  - id: BEH-PB-UC-3
    name: 'Use Case: Verify Entity Standalone'
    status: ACTIVE
    actor_id: ACT-PB-5
    description: CI + developers invoke verify_entity_standalone(entity_id) on any entity at any decomposition
      level. Materializes slice, checks every promise is closed or typed-gap, checks every verified_by
      reference resolves inside slice or declares external boundary.
    intent: Guarantee every entity stands on its own as a documented and verified unit at any decomposition
      level
    goals:
    - Parametrize over all entities in model
    - Fail loudly on open promises
    - Tolerate typed-gaps with explicit boundary declaration
    success_criteria:
    - Test runs in <30s over full model
    - Zero false-positives (typed-gap correctly recognized)
    - Zero false-negatives (open promise never masked)
    failure_modes:
    - Slice materialization too slow (>1s per entity)
    - External boundary declaration syntax ambiguous
    verification:
    - id: VRF-BEH-PB-UC-3-1
      method: Parametrized pytest over all entities
    - id: VRF-BEH-PB-UC-3-2
      method: CI gate blocks merge on regression
    steps:
    - materialize slice via slice_by_entity
    - enumerate promises per entity in slice
    - assert every promise status in {closed, typed-gap}
    - assert every verified_by ref resolves inside slice or is external-boundary
    - render delivery_chain projector without errors
  - id: BEH-PB-UC-4
    name: 'Use Case: Project View Over Slice'
    status: ACTIVE
    actor_id: ACT-PB-2
    description: Any consumer (LLM, human, CI) requests a projected view over a slice. Projector matrix
      maps family x kind x (deterministic | llm) to output. LLM variants only invoked when closure_pct
      < 1.0.
    intent: Render any slice through any registered projector with determinism guarantees
    goals:
    - Projector output byte-stable under fixed inputs
    - LLM variants skipped for clean entities
    - Every projection cites prompt version + model + policy in provenance
    success_criteria:
    - Snapshot tests pass for every projector variant
    - Rebuild determinism test passes
    failure_modes:
    - Prompt drift breaks byte-stability
    - LLM invoked on clean entity (cost waste)
    verification:
    - id: VRF-BEH-PB-UC-4-1
      method: tests/lifecycle/test_projector_determinism.py
    - id: VRF-BEH-PB-UC-4-2
      method: tests/lifecycle/test_dashboard_rebuild.py (existing)
    steps:
    - resolve slice via ModelSlice materialize
    - resolve projector by name from registry
    - invoke projector (deterministic or LLM variant based on closure state)
    - stamp provenance {freshness, revision, produced_at, projector, prompt_digest}
    - return ProjectedView
  - id: BEH-PB-UC-5
    name: 'Use Case: LLM Proposes Model Change'
    status: ACTIVE
    actor_id: ACT-PB-2
    description: LLM agent generates a Proposal via write-back projector or dedicated proposer plugin;
      WorkOrder declares expected_closure_delta; proposal validators run before apply; PROPOSAL_CLOSURE_MISMATCH
      journal event on estimation error >20%.
    intent: Enable LLM-authored model updates with measurable closure-progress enforcement
    goals:
    - Every proposal declares expected closure impact
    - Validators reject dangling refs + orphan entity creation
    - Provenance chain preserved end-to-end
    success_criteria:
    - Zero apply operations succeed with unclosed dangling references
    - Closure estimation error <20% in 80% of proposals (learning target)
    failure_modes:
    - LLM overpromises closure delta
    - Validator too permissive lets bad proposal through
    - Journal event lost due to fail-soft write
    verification:
    - id: VRF-BEH-PB-UC-5-1
      method: tests/ai/test_workorder_closure_delta.py
    - id: VRF-BEH-PB-UC-5-2
      method: tests/ai/test_proposal_validators_closure.py
    steps:
    - agent authors Proposal with expected_closure_delta on WorkOrder
    - submit WorkOrder via architect_workorder_submit
    - run proposer via architect_job_run
    - validate proposal via proposal_validators
    - apply proposal (or reject) via architect_proposal_apply
    - recompute actual closure; emit PROPOSAL_CLOSURE_MISMATCH if >20% drift
  - id: BEH-PB-UC-6
    name: 'Use Case: Publish Package Generation'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: Architect publishes new generation of architecture package via existing lifecycle substrate
      (architect_package_publish); digest-locked; generation number auto-incremented; downstream artifacts
      rebuild.
    intent: Version the architecture model as an immutable package generation with digest-anchored provenance
    goals:
    - Generation immutable once published
    - Digest computation deterministic
    - Downstream artifacts rebuild deterministically
    success_criteria:
    - Two publish calls with identical model produce identical digest
    - Downstream slices/views bind to generation revision correctly
    failure_modes:
    - Non-deterministic timestamp leaks into digest
    - Concurrent publish creates conflicting generations
    verification:
    - id: VRF-BEH-PB-UC-6-1
      method: tests/lifecycle/test_package_publish.py (existing)
    - id: VRF-BEH-PB-UC-6-2
      method: tests/lifecycle/test_generation_diff.py (existing)
    steps:
    - validate model via architect_validate
    - compute canonical serialization
    - compute root digest via SHA-256
    - allocate next generation number
    - write to .architecture/lifecycle/<generation>/
    - update CURRENT pointer
    - record lifecycle.package.publish journal event
  - id: BEH-PB-UC-7
    name: 'Use Case: Human Reviews Architecture Before Code'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: Approval gate at Phase B'-0c. Human walks through viewer.html of .architecture-model.plan-b.yaml;
      drills into each of 4 umbrella caps + 7 sub-caps + all behaviors + components; approves or requests
      iteration.
    intent: Gate the first Plan B code commit on human review of a verifiable architecture model
    goals:
    - Every umbrella cap slice reviewed
    - Every sub-cap slice reviewed
    - Chain-closure baseline >=70% at approval time
    - Approved model published as v1 via architect_package_publish
    success_criteria:
    - Approval recorded as journal event architecture.approval
    - Approved model becomes reference for all subsequent code commits
    failure_modes:
    - Approval given without slice-by-slice review
    - Approved model not published (drift risk)
    verification:
    - id: VRF-BEH-PB-UC-7-1
      method: Manual walkthrough of viewer.html
    - id: VRF-BEH-PB-UC-7-2
      method: Approval journal event
    steps:
    - render viewer.html from .architecture-model.plan-b.yaml
    - human reviews each umbrella cap slice
    - human reviews each sub-cap slice
    - human runs verify_entity_standalone on sub-caps
    - iterate model if gaps unacceptable
    - publish v1 via architect_package_publish
    - record approval journal event
  - id: BEH-PB-UC-8
    name: 'Use Case: CI Enforces Standalone Verification Gate'
    status: ACTIVE
    actor_id: ACT-PB-5
    description: Every PR runs full test suite + verify_entity_standalone + chain-closure diff vs base.
      Merge blocked on open promises without typed-gap or on chain-closure regression without explicit
      override flag.
    intent: Automate the entity-standalone verification discipline as a merge-time gate
    goals:
    - Zero silent architecture drift
    - Fast feedback (<10min CI cycle)
    - Explicit override path for exceptional cases
    success_criteria:
    - Merge blocked on regression in 100% of cases
    - Override flag audited via journal event
    failure_modes:
    - CI too slow (>15min) causes bypass culture
    - Override flag abused
    verification:
    - id: VRF-BEH-PB-UC-8-1
      method: CI logs
    - id: VRF-BEH-PB-UC-8-2
      method: Journal events audit
    steps:
    - run pytest tests/ full suite
    - run verify_entity_standalone parametrized
    - compute chain-closure on head vs base
    - block merge on regression or open promises
    - append to .architecture/chain-closure-history.jsonl
  - id: BEH-PB-STAGE-1
    name: 'Stage: scan'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      AST scan produces raw code inventory (modules, functions, classes,
      imports, routes, tests, docs). Reuses existing observe stage via
      LegacyPipelineAdapter.
    intent: Produce raw code inventory from AST scan of target repo
    goals:
    - Deterministic ordering (sort by file path)
    - Reuse existing observe stage via adapter
    - Emit CodeInventory dataclass
    success_criteria:
    - Ordering byte-stable across runs
    - CodeInventory schema matches existing observe output shape
    failure_modes:
    - Non-deterministic file iteration
    - AST parse errors silently swallowed
    steps:
    - discover source files via utils.discovery.collect_py_files
    - parse each file via ast module
    - extract modules, functions, classes, imports, routes
    - build CodeInventory
  - id: BEH-PB-STAGE-2
    name: 'Stage: derive_promises'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Extract Promise records from docstrings, type hints, test names, SI&L
      history, git commit messages. Each promise gets provenance = inferred.
    intent: Extract Promise records from code artifacts with inferred provenance
    goals:
    - LLM-assisted derivation on prose fields
    - Deterministic derivation on structured fields (type hints, test names)
    - Every promise has provenance chain
    success_criteria:
    - Every promise references its source artifact
    - LLM cost bounded by budget cap
    failure_modes:
    - LLM hallucinates promises without code backing
    - Deterministic derivation misses subtle signals
    steps:
    - iterate CodeInventory
    - for each artifact extract structured promises (type hints, test names)
    - LLM-derive prose promises from docstrings (batched, cached)
    - stamp provenance on every Promise
  - id: BEH-PB-STAGE-3
    name: 'Stage: cluster'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Group Promise records by semantic similarity (embedding-based) into
      promise families. Families become candidate capabilities. Consolidation
      happens by construction here.
    intent: Group promises into semantic families via embedding-based clustering
    goals:
    - Deterministic clustering under fixed embedding model
    - Stable family assignment across runs
    - Duplicate capabilities structurally prevented
    success_criteria:
    - Cluster assignment byte-stable
    - Zero duplicate families in output
    failure_modes:
    - Embedding model non-deterministic
    - Over-merging loses fidelity
    - Under-merging leaves duplicates
    steps:
    - compute embeddings for every Promise.content
    - run deterministic clustering (fixed random seed if needed)
    - assign family ID to each Promise
    - emit PromiseFamilies dataclass
  - id: BEH-PB-STAGE-4
    name: 'Stage: link'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Build delivered_from and verified_by edges between promises. LLM
      adjudicates ambiguous middle band; exact and near-exact matches are
      deterministic.
    intent: Build delivery-down and verify-up edges between promises across families
    goals:
    - Deterministic linking on exact/near-exact matches
    - LLM adjudication on ambiguous middle band only
    - Provenance stamped on every edge
    success_criteria:
    - Edge determinism 100% on exact matches
    - LLM cost bounded by budget
    failure_modes:
    - LLM hallucinates edges
    - Middle-band threshold set too wide (cost) or narrow (missed edges)
    steps:
    - enumerate promise pairs
    - compute similarity score per pair
    - deterministic link on score >=0.85 or =0.0
    - LLM adjudicate on 0.5<score<0.85 band
    - emit LinkedPromiseGraph
  - id: BEH-PB-STAGE-5
    name: 'Stage: containerize'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Decide which entity kind (capability, behavior, component, interface)
      each promise family belongs to. Rules driven by evidence type (test
      contracts -> behaviors; module structure -> components; API signatures
      -> interfaces; abstract goals -> capabilities).
    intent: Assign entity kind to each promise family based on evidence type
    goals:
    - Deterministic kind assignment by evidence rules
    - LLM fallback only when evidence is ambiguous
    - Emit fully-typed entity records
    success_criteria:
    - Kind assignment byte-stable
    - Every entity has structural container relationship (contains edges)
    failure_modes:
    - Rule set incomplete (kinds unresolved)
    - LLM fallback rate too high
    steps:
    - iterate promise families
    - apply evidence-type rules
    - LLM fallback on ambiguous families
    - emit ContainedModel
  - id: BEH-PB-STAGE-6
    name: 'Stage: verify'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Run promise_closure per entity. Emit chain-closure report. Every entity
      gets closure_pct + list of open/typed-gap promises.
    intent: Compute per-entity chain-closure and emit closure report
    goals:
    - Per-entity closure computed in <10ms
    - Report includes closure_pct + gap breakdown per entity
    - System-level score = mean over entities
    success_criteria:
    - Report format stable
    - Closure computation deterministic
    failure_modes:
    - Closure algorithm incorrect (miscount)
    - Report too verbose for LLM to consume
    steps:
    - for each entity call promise_closure
    - aggregate to system score
    - emit ClosureReport
  - id: BEH-PB-STAGE-7
    name: 'Stage: publish'
    status: ACTIVE
    actor_id: ACT-PB-1
    description: >-
      Write model + all derived views via lifecycle substrate
      (architect_package_publish). Auto-increment generation. Digest-locked.
    intent: Publish immutable model generation via existing lifecycle substrate
    goals:
    - Idempotent publish (same input -> same digest)
    - Auto-increment generation number
    - CURRENT pointer updated atomically
    success_criteria:
    - Digest deterministic under fixed inputs
    - CURRENT pointer never inconsistent
    failure_modes:
    - Race on concurrent publish
    - Digest non-determinism (timestamp leak)
    steps:
    - canonicalize model serialization
    - compute SHA-256 root digest
    - allocate next generation number
    - write to .architecture/lifecycle/<generation>/
    - update CURRENT pointer
    - record lifecycle.package.publish journal event
  capabilities:
  - id: CAP-PB-SLICE
    name: Slice Any Entity at Any Decomposition Level
    status: ACTIVE
    description: >-
      Umbrella capability guaranteeing every entity in the model can be sliced
      into a self-contained package that documents and verifies its own promises,
      with external dependencies explicitly typed at slice boundaries.
    intent: Guarantee entity-as-standalone-unit at every decomposition level via slice_by_entity primitive
    goals:
    - Every entity produces a self-contained slice
    - Every promise reference resolves inside slice or declares external boundary
    - Slice materialization runs in <1s per entity
    - Slice output renders through delivery_chain projector without errors
    stakeholders:
    - Human Architect
    - LLM Agent
    - CI/CD Pipeline
    success_criteria:
    - verify_entity_standalone passes parametrized over all entities
    - Slice byte-stable under identical inputs
    - Zero silent external references
    failure_modes:
    - Slice materialization too slow (>1s per entity)
    - External boundary syntax ambiguous
    - Slice contains dangling refs (broken chain-closure)
    moes:
    - Slice materialization latency p95 <1s
    - Zero dangling references across all slices
    - 100% of entities have passing verify_entity_standalone
    assumptions:
    - Promise-graph schema (3.0) provides delivered_from + verified_by primitives
    - slice_by_entity from Phase 3 substrate extends cleanly to promise-graph
    trade_offs:
    - Rich slice metadata increases storage cost; accepted for verify-up traceability
    - LLM-required projector variants improve documentation but add cost; guarded by closure_pct threshold
    open_questions:
    - How to handle circular delivery dependencies (parent A delivers to child B which delivers to A)?
    - What is the correct external-boundary syntax for cross-repo references?
  - id: CAP-PB-MODEL
    name: Model Any System via Promise Graph
    status: ACTIVE
    description: >-
      Umbrella capability providing the promise-graph schema 3.0 substrate.
      Promises are first-class; entities are containers; relationships derived
      from delivery-source and verification-evidence links.
    intent: Represent any system as a graph of promises with delivery-down source and verify-up evidence
    goals:
    - Promise type is first-class in schema 3.0
    - Every semantic field (intent/goals/slos/...) becomes a Promise record
    - Entity kinds are structural containers, not attribute owners
    - Semantic relationships (realizes, traces-to, exercised-by) derived from promise graph
    stakeholders:
    - Human Architect
    - LLM Agent
    - arch-agent Trainer
    - Downstream domain profiles (controls, mechanical, electrical)
    success_criteria:
    - 2.1 -> 3.0 migration round-trips for every existing fixture
    - Promise closure computable per-entity in <10ms
    - Domain profiles express promise-attribute extensions without base-schema change
    failure_modes:
    - Schema 3.0 migration lossy on prose fields
    - Promise graph too complex for LLM to reason about
    - Domain profiles pollute base promise vocabulary
    moes:
    - Round-trip fidelity 100% on structured fields
    - Round-trip fidelity >90% on prose fields via LLM re-derivation
    - Migration idempotency (re-run produces identical output)
    assumptions:
    - Existing AMS 2.1 fixtures have parseable semantic content
    - LLM re-derivation with digest-locked prompts is cost-viable
    trade_offs:
    - Schema 3.0 breaks 2.1 wire compat; adapter path preserves fallback
    - Promise graph adds indirection; accepted for verify-up traceability
    open_questions:
    - Do embedding-based clustering approaches produce stable promise families across runs?
    - How to version prompt library (semver? content-hash?) for provenance
  - id: CAP-PB-EXTRACT
    name: Extract Architecture from Source Code
    status: ACTIVE
    description: >-
      Umbrella capability providing the 7-stage promise-graph pipeline (scan ->
      derive_promises -> cluster -> link -> containerize -> verify -> publish)
      that replaces the 10-stage 2.1 pipeline. Duplicates prevented by
      construction via cluster stage.
    intent: Produce a schema-3.0 architecture model from any codebase with per-entity chain-closure computed
    goals:
    - Pipeline determinism under fixed AMS_DETERMINISTIC_NOW
    - Consolidation-by-construction (no post-hoc duplicate merging)
    - LLM budget bounded per pipeline run
    - Chain-closure baseline computed on first pass
    stakeholders:
    - Human Architect
    - LLM Agent
    - CI/CD Pipeline
    - arch-agent Trainer (consumes benchmark outputs)
    success_criteria:
    - 4 e2e benchmarks (colorama, structlog, tqdm, click) extract with chain-closure >=70%
    - Pipeline runs in <5min on 10k-LOC repo
    - Zero duplicate capabilities in output
    failure_modes:
    - Cluster stage over-merges (loss of fidelity)
    - Cluster stage under-merges (duplicates resurface)
    - LLM budget exhausted mid-pipeline
    - Non-deterministic timestamp leaks
    moes:
    - Chain-closure >=70% on benchmark repos
    - Pipeline run cost <$5 on 10k-LOC repo
    - Deterministic output under fixed inputs (byte-stable)
    assumptions:
    - Existing scan stage from 2.1 pipeline reusable as-is via adapter
    - Embedding-based clustering produces stable families across runs
    trade_offs:
    - LLM-required stages improve extraction but add cost; budget cap enforces ceiling
    - Consolidation-by-construction removes need for Phase 2 A/B post-hoc merger
    open_questions:
    - Which embedding model produces most stable clusters?
    - How to handle codebases with mixed documentation quality (rich docstrings vs. bare code)?
  - id: CAP-PB-DEV
    name: Dev Loop with Continuous Modeling
    status: ACTIVE
    description: >-
      Umbrella capability providing the dev-loop discipline where modeling
      co-evolves with coding + testing. Every code commit references its
      architecture entity; every entity's chain-closure recomputed on affected
      slice; new promises discovered during coding added to model with
      validators enforcing closure before merge.
    intent: Enforce model-code co-evolution via commit-msg refs + CI gate + continuous chain-closure measurement
    goals:
    - Every code commit references an architecture entity via commit-msg
    - CI runs verify_entity_standalone on every PR
    - Chain-closure history persisted per pipeline run
    - LLM reviewers audit model-vs-code alignment on every PR
    stakeholders:
    - Human Architect
    - LLM Agent
    - CI/CD Pipeline
    success_criteria:
    - Zero silent drift between model and code
    - Chain-closure monotonically improves per release
    - Merge blocked 100% of times on regression
    - Explicit override audited via journal event
    failure_modes:
    - Commit-msg convention not enforced
    - CI too slow (>15min) causes bypass culture
    - Override flag abused
    - Drift discovered only at release time
    moes:
    - Time to detect drift <1 commit
    - CI cycle time <10min
    - Override rate <5% of PRs
    - Chain-closure trend monotone non-decreasing per week
    assumptions:
    - Developers follow commit-msg convention
    - CI infra supports fast feedback (<10min)
    - Journal events reliably persisted (fail-soft acceptable)
    trade_offs:
    - Strict CI gate slows individual PRs; accepted for architecture integrity
    - Continuous modeling adds work per commit; accepted for zero-drift guarantee
    open_questions:
    - Should commit-msg convention be enforced via git hook or CI check?
    - How to weight open-promise vs typed-gap in CI regression threshold?
    - What's the correct chain-closure threshold to enter/exit override mode?
  - id: CAP-PB-PROMISE-GRAPH
    name: Promise as First-Class Type
    status: ACTIVE
    parent_id: CAP-PB-MODEL
    description: >-
      Sub-capability of CAP-PB-MODEL. Provides the Promise dataclass, its
      YAML/JSON serialization, and the primitives for delivered_from and
      verified_by traversal.
    intent: Provide first-class Promise type with delivered_from/verified_by primitives
    goals:
    - Promise dataclass with attribute/content/owner_entity/status/gap_type fields
    - Round-trip parser for Promise records
    - Deterministic PR-<sha1> ID computation
    - JSON Schema fragment for Promise
    stakeholders:
    - CAP-PB-MODEL
    - Human Architect
    - LLM Agent
    success_criteria:
    - Promise round-trip lossless via parser
    - PR ID stable across runs on identical content
    failure_modes:
    - PR ID collision on different content
    - Round-trip loses status or gap_type
    moes:
    - PR ID collision rate 0
    - Round-trip fidelity 100%
  - id: CAP-PB-PIPELINE
    name: 7-Stage Promise-Graph Pipeline
    status: ACTIVE
    parent_id: CAP-PB-EXTRACT
    description: >-
      Sub-capability of CAP-PB-EXTRACT. Provides the 7-stage pipeline
      (scan -> derive_promises -> cluster -> link -> containerize -> verify ->
      publish) with per-stage cache + deterministic replay.
    intent: Execute 7-stage extraction pipeline with per-stage caching and deterministic replay
    goals:
    - Each stage isolated with typed input/output
    - Cache resumability at any stage boundary
    - Deterministic under fixed AMS_DETERMINISTIC_NOW
    - LLM invocations only at derive_promises + link + containerize
    stakeholders:
    - CAP-PB-EXTRACT
    - Human Architect
    - CI/CD Pipeline
    success_criteria:
    - Full pipeline runs in <5min on 10k-LOC repo
    - Deterministic replay produces byte-identical output
    - Stage-by-stage cache resume works after failure
    failure_modes:
    - Non-deterministic ordering in cluster stage
    - Cache invalidation logic incorrect
    - LLM budget exhaustion mid-pipeline
    moes:
    - Deterministic replay success rate 100%
    - Cache hit rate >80% on incremental runs
  - id: CAP-PB-PROJECTORS
    name: Projector Matrix (family x kind x det|llm)
    status: ACTIVE
    parent_id: CAP-PB-SLICE
    description: >-
      Sub-capability of CAP-PB-SLICE. Provides the full projector matrix
      auto-generated from schema declaration. Deterministic base + LLM
      write-back variant for every family x kind combination.
    intent: Provide exhaustive projector coverage over family x kind matrix with LLM write-back variants
    goals:
    - Deterministic projector per family x kind
    - LLM write-back variant per family x kind (guarded by closure_pct)
    - Auto-generation from schema declaration
    - Snapshot-locked byte-stable output
    stakeholders:
    - CAP-PB-SLICE
    - LLM Agent
    - Human Architect
    success_criteria:
    - Every family x kind combination has a registered projector
    - Snapshot tests pass for every variant
    - LLM variant skipped when closure_pct >= 1.0
    failure_modes:
    - Projector matrix incomplete (missing family x kind entry)
    - Snapshot drift breaks determinism
    - LLM variant invoked on clean entity (cost waste)
    moes:
    - Projector matrix coverage 100%
    - Snapshot stability 100%
    - LLM cost per rebuild bounded by policy.yaml
  - id: CAP-PB-LLM
    name: LLM Layer Required at Construction
    status: ACTIVE
    parent_id: CAP-PB-MODEL
    description: >-
      Sub-capability of CAP-PB-MODEL. LLMProvider required at pipeline
      construction (no fallback to static). Prompt library versioned as data.
      Budget enforced per pipeline run. Cache by (prompt_digest, model,
      temperature=0).
    intent: Enforce LLM provider as required dependency with budget cap and digest-locked prompts
    goals:
    - LLMProvider required at Pipeline() construction
    - Prompt library at .architecture/llm/prompts/*.yaml versioned + digest-locked
    - Budget cap per pipeline run in policy.yaml
    - Cache by (prompt_digest, model, temperature=0)
    stakeholders:
    - CAP-PB-MODEL
    - LLM Agent
    - Human Architect
    success_criteria:
    - Pipeline construction fails without provider
    - Prompt version stamped in every proposal provenance
    - Cache hit rate >90% on incremental runs
    - Budget cap enforced (pipeline aborts on breach)
    failure_modes:
    - Provider unavailable at construction
    - Prompt drift breaks cache
    - Budget cap set too low blocks legitimate work
    moes:
    - Cache hit rate >90%
    - Budget breach rate <1% of runs
  - id: CAP-PB-EVIDENCE
    name: SI&L Records as Promise Evidence
    status: ACTIVE
    parent_id: CAP-PB-SLICE
    description: >-
      Sub-capability of CAP-PB-SLICE (also delivers to CAP-PB-DEV). SI&L
      telemetry records become promise evidence. Stale telemetry reopens
      promises. Verify-up loop closed automatically.
    intent: Bind SI&L telemetry records as verify-up evidence for entity promises
    goals:
    - SIL record -> Promise.verified_by mapping declared per attribute
    - Stale telemetry (>7d) reopens promise status
    - Verify-up loop closes without human intervention
    stakeholders:
    - CAP-PB-SLICE
    - CAP-PB-DEV
    - CI/CD Pipeline
    success_criteria:
    - slos.availability = 99.9% promise closed only when 7d SIL confirms
    - Stale reopen fires within 1 pipeline run of data expiry
    failure_modes:
    - SIL store unavailable causes false reopens
    - Mapping incorrect (wrong evidence bound to wrong promise)
    moes:
    - Time from telemetry expiry to promise reopen <1 pipeline run
    - False-reopen rate <1%
  - id: CAP-PB-ADAPTER
    name: Legacy-Adapter Plugin Surface
    status: ACTIVE
    parent_id: CAP-PB-EXTRACT
    description: >-
      Sub-capability of CAP-PB-EXTRACT (also delivers to CAP-PB-DEV).
