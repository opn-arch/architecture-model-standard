    parent_id: CAP-DF
    status: ACTIVE
    description: "User-only approval at named gates. Between gates, assistant continues autonomously as long as regenerability confidence stays HIGH per added entity. Autonomy retracts to gate-only if any entity scores MEDIUM/LOW."
    intent: Make autonomy vs approval a confidence-controlled spectrum, not a binary
    goals:
    - Every entity added between gates has recorded regen-check score
    - Any MEDIUM/LOW entity triggers immediate stop and user consultation
    - Named gates (T0.13, phase boundaries) remain user-only regardless of confidence
    stakeholders:
    - User (product owner)
    - LLM Agent
    success_criteria:
    - Every commit message reports regen-check tally per added entity
    - Zero autonomous commits at MEDIUM/LOW confidence
    failure_modes:
    - Assistant self-scores optimistically to avoid stopping
    - Regen-check becomes rubber stamp rather than genuine assessment
    - Named gates skipped under time pressure
    verification:
    - id: VER-DF-GATING-1
      method: inspection
      target: "Every commit message contains 'regen: HIGH|MED|LOW (N entities)' line"
    - id: VER-DF-GATING-2
      method: test
      target: A validator lint rejects Plan B commits missing regen-check tally
