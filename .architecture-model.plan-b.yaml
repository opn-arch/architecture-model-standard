    stakeholder: CI/CD Pipeline
  - id: REQ-PB-10
    name: Consolidation-by-construction at cluster
    status: ACTIVE
    text: Consolidation MUST happen at the cluster stage via embedding-based grouping; no post-hoc A/B merger stage.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - No post-hoc merge stage exists in pipeline definition
    stakeholder: Human Architect
  - id: REQ-PB-11
    name: Legacy generators preserved via adapters
    status: ACTIVE
    text: Existing legacy generators (visualize.py, docs/generator.py, docs/se/*) MUST be preserved and wrapped as legacy adapters, NOT deleted during the Plan B refactor.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - All three legacy adapter components present; original files intact
    stakeholder: Human Architect
  - id: REQ-PB-12
    name: Three legacy adapters cover all current generation
    status: ACTIVE
    text: The three legacy adapters (PROJECTOR, PIPELINE, DOCS) MUST cover 100% of current generation entry points.
    priority: must
    verification_method: analysis
    acceptance_criteria:
    - Adapter coverage report enumerates all current entry points
    stakeholder: LLM Agent
  - id: REQ-PB-13
    name: CI gate fails closed on chain break
    status: ACTIVE
    text: The CI gate workflow MUST fail closed on any attribute chain break or standalone-verification regression.
    priority: must
    verification_method: test
    acceptance_criteria:
    - Synthetic chain-break commit blocked by CI gate in fixture repo
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-14
    name: Commits reference model entities
    status: ACTIVE
    text: 'Every Plan B commit message MUST include a "[refs: CAP-X BEH-Y ...]" trailer naming the entities affected.'
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Commit-msg hook rejects Plan B commits missing refs trailer
    stakeholder: Human Architect
  - id: REQ-PB-15
    name: Standalone-verification parametrized
    status: ACTIVE
    text: verify_entity_standalone MUST be a parametrized pytest fixture running over every entity in the model, not a hand-written per-entity test.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Single parametrized test
    - N entities discovered
    stakeholder: LLM Agent
  - id: REQ-PB-16
    name: SI&L records as promise evidence
    status: ACTIVE
    text: SI&L records MUST be usable as verify-up evidence for behavior and component promises.
    priority: must
    verification_method: demonstration
    acceptance_criteria:
    - Evidence binder resolves SI&L records into ProjectedView slice
    stakeholder: Human Architect
  - id: REQ-PB-17
    name: Projector matrix per-entity slices
    status: ACTIVE
    text: The projector matrix MUST produce a per-entity slice package for every entity kind (capability, behavior, component, interface, actor, constraint, requirement, system).
    priority: must
    verification_method: test
    acceptance_criteria:
    - Matrix coverage 100% across kinds
    stakeholder: LLM Agent
  - id: REQ-PB-19
    name: Jaccard similarity threshold for cluster
    status: ACTIVE
    text: "The cluster stage MUST use Jaccard similarity \u2265 0.5 for exercised-by inference when grouping candidate promises."
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Threshold constant set to 0.5; unit test asserts value
    stakeholder: Human Architect
  - id: REQ-PB-20
    name: Full test suite green per commit
    status: ACTIVE
    text: The full test suite MUST be green after every Plan B commit; no batching of failing states is permitted.
    priority: must
    verification_method: test
    acceptance_criteria:
    - pre-push hook forbids push with red tests
    stakeholder: CI/CD Pipeline
  - id: REQ-DF-SAMEMODEL
    name: Same-model vs new-model framing check
    status: ACTIVE
    text: "Before proposing artifact-level splits (new file, new repo, new schema), assistant MUST explicitly check whether user asked for a same-model expansion or an actual artifact split. Default is same-model expansion; splitting requires user confirmation."
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Assistant messages proposing artifact splits contain explicit 'same-model vs new-model' framing question
    - No new top-level artifact created without user answering the framing question
    stakeholder: LLM Agent
  - id: REQ-DF-COSTNAMING
    name: Name infrastructure cost before locking design choice
    status: ACTIVE
    text: "When a proposed design choice implies infrastructure change (schema bump, new tooling, new dependency), assistant MUST explicitly name that cost before the choice is locked, so the user can reject or accept with full information."
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Design proposals list explicit 'Infrastructure cost' or 'Requires schema change' line when applicable
    - No schema change lands without prior cost-naming turn
    stakeholder: LLM Agent
  - id: REQ-DF-EXPLICITADD
    name: Explicit paths for Plan B git commits
    status: ACTIVE
    text: "Plan B commits MUST use explicit paths in git add (never 'git add -A' or 'git add -u'). This prevents auto-regen contamination from .architecture/** and .architecture-models/** paths."
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Every T0.* commit staged via explicit path list
    - "Post-commit check confirms no .architecture/** or .architecture-models/** paths appear in the commit diff"
    stakeholder: LLM Agent
  - id: REQ-DF-YAMLLISTGUARD
    name: Guard against silent YAML list-item colon parse hazard
    status: ACTIVE
    text: "The parser MUST reject semantic lists (steps, acceptance_criteria, preconditions, postconditions, goals, success_criteria) that mix dict and str item types, since this pattern always indicates an unquoted-colon YAML parse bug rather than intentional data. Additionally, the diagram renderer's _lines() helper MUST defensively coerce non-str labels to str with a warning, so a bad model does not crash the viewer path."
    priority: should
    verification_method: test
    acceptance_criteria:
    - "Parser raises ParseError when a semantic list contains mixed dict+str items, naming the offending entity and field"
    - "diagram_renderer._lines() accepts non-str input by coercing via str() and emits a one-line warning to stderr identifying the caller"
    - "Regression test loads a fixture with an unquoted-colon steps item and asserts either parse rejection or renderer coercion (matching whichever defense is in place)"
    stakeholder: Model Author
  - id: REQ-DF-VERIFYCOVERAGE
    name: Baseline classifier surfaces UNVERIFIED_CONSTRAINT as G-VERIFY gap
    status: ACTIVE
    text: "scripts/plan_b_baseline_report.py MUST ingest validator warnings of type UNVERIFIED_CONSTRAINT and MISSING_META and surface each as an entry in the G-VERIFY gap tally. This closes the current divergence where the validator penalizes missing verifies edges but the baseline classifier does not report them, forcing manual grep of validator output to notice."
    priority: should
    verification_method: test
    acceptance_criteria:
    - "AC[0]: Given a model with N UNVERIFIED_CONSTRAINT warnings, scripts/plan_b_baseline_report.py reports G-VERIFY count increased by exactly N vs a baseline with those constraints verified"
    - "AC[1]: Baseline report includes the constraint ids for each G-VERIFY entry"
    - "AC[2]: A commit that lowers the validator score without changing G-VERIFY count triggers a warning in the baseline classifier output"
    stakeholder: Model Author
