    name: Standalone Verification Harness
    status: ACTIVE
    description: Parametrized pytest harness running verify_entity_standalone(entity_id) over every entity. Materializes slice, checks closure, checks external boundaries. Target runtime <30s over full model.
    intent: Provide parametrized pytest harness for entity-standalone verification
    source_paths:
    - tests/quality/test_entity_standalone.py
    - src/architecture_model/quality/standalone.py
    goals:
    - Parametrized pytest fixture over all entities in model
    - Fast execution (<30s over full model)
    - Zero false-positives/negatives
    - CI gate integration with journal event on override
