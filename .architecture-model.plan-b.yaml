  - id: BEH-SIO-11
    name: "SIO-11: YAML unquoted-colon in list items silently parses as dict, breaks diagram renderer"
    status: ACTIVE
    description: "Observation: During T0.11.6c, two list items containing an unquoted colon ('For each, assess: is it a recurring pattern...' and 'Ask: given these fields alone, could implementation proceed?') were parsed by YAML as single-key dicts instead of strings. The diagram renderer's _lines() at diagram_renderer.py:163 assumed str via value.split(), producing 'AttributeError: dict object has no attribute split'. Baseline generation was unaffected; only the viewer path crashed. Cause is a class of YAML parser silence — a mixed dict+str list is legal YAML but semantically wrong for a steps/AC/preconditions list. Two independent defenses: (a) the parser could reject mixed-type semantic lists, (b) the renderer could coerce label to str defensively before _lines()."
    intent: "SIO-11 observation about parser+renderer hazard vs YAML edge case"
    triage: promote-methodology
    triage_rationale: "Recurring hazard for any model author. Two independent low-cost defenses; both should ship. Preventing this at parse-time protects every downstream consumer, not just the viewer."
    resulting_entity: "REQ-DF-YAMLLISTGUARD"
    surfaced_in: "conversation-2026-09-13"
  - id: BEH-SIO-12
    name: "SIO-12: Validator penalty for missing verifies edges is invisible to baseline classifier"
    status: ACTIVE
    description: "Observation: During T0.11.6d, adding 5 constraints without accompanying verifies-relationships dropped the validator score from 88 to 78 (5 UNVERIFIED_CONSTRAINT warnings, -10 penalty). The baseline classifier (scripts/plan_b_baseline_report.py) did NOT surface these as a G-VERIFY gap despite that being exactly the category name. The gap only became visible via 'architecture-model validate | grep -i warn'. Two systems (validator, baseline classifier) that both know about verification coverage should agree on what counts as a verification gap. Baseline classifier should ingest validator warnings and surface UNVERIFIED_CONSTRAINT as G-VERIFY."
    intent: "SIO-12 observation about validator/baseline classifier divergence"
    triage: promote-methodology
    triage_rationale: "Two-source-of-truth pattern for the same concept (verification coverage). Merging via baseline classifier consuming validator warnings gives single-source-of-truth without changing schema. Modest-cost script change."
    resulting_entity: "REQ-DF-VERIFYCOVERAGE"
    surfaced_in: "conversation-2026-09-13"
  capabilities:
  - id: CAP-0
    name: "Plan B \u2014 Promise-Graph Architecture (Root)"
    status: ACTIVE
    description: 'Root capability aggregating the four umbrella capabilities that constitute Plan B: SLICE, MODEL, EXTRACT, DEV. Provides a single traversal root for ConOps and delivery-down decomposition.'
    intent: Serve as the single delivery-down root for all Plan B capabilities
    goals:
    - Every umbrella capability reachable from CAP-0 via contains
    - ConOps view renders full L1 capability structure from this root
    - Delivery-down chain-closure computable from this root
    stakeholders:
    - Human Architect
    - LLM Agent
    - CI/CD Pipeline
    success_criteria:
    - contains edges from CAP-0 cover all four umbrella caps
    - ConOps diagram traverses CAP-0 to render L1 groups
    moes:
    - 100% umbrella capability reachability from CAP-0
  - id: CAP-PB-SLICE
    name: Slice Any Entity at Any Decomposition Level
    status: ACTIVE
    description: Umbrella capability guaranteeing every entity in the model can be sliced into a self-contained package that documents and verifies its own promises, with external dependencies explicitly typed at slice boundaries.
    intent: Guarantee entity-as-standalone-unit at every decomposition level via slice_by_entity primitive
    goals:
    - Every entity produces a self-contained slice
    - Every promise reference resolves inside slice or declares external boundary
    - Slice materialization runs in <1s per entity
    - Slice output renders through delivery_chain projector without errors
    stakeholders:
    - Human Architect
    - LLM Agent
    - CI/CD Pipeline
    success_criteria:
    - verify_entity_standalone passes parametrized over all entities
    - Slice byte-stable under identical inputs
    - Zero silent external references
    failure_modes:
    - Slice materialization too slow (>1s per entity)
    - External boundary syntax ambiguous
    - Slice contains dangling refs (broken chain-closure)
    moes:
    - Slice materialization latency p95 <1s
    - Zero dangling references across all slices
    - 100% of entities have passing verify_entity_standalone
    assumptions:
    - Promise-graph schema (3.0) provides delivered_from + verified_by primitives
    - slice_by_entity from Phase 3 substrate extends cleanly to promise-graph
    trade_offs:
    - Rich slice metadata increases storage cost; accepted for verify-up traceability
    - LLM-required projector variants improve documentation but add cost; guarded by closure_pct threshold
    open_questions:
    - How to handle circular delivery dependencies (parent A delivers to child B which delivers to A)?
    - What is the correct external-boundary syntax for cross-repo references?
    requirements:
    - REQ-PB-1
    - REQ-PB-2
    - REQ-PB-3
  - id: CAP-PB-MODEL
    name: Model Any System via Promise Graph
    status: ACTIVE
    description: Umbrella capability providing the promise-graph schema 3.0 substrate. Promises are first-class; entities are containers; relationships derived from delivery-source and verification-evidence links.
    intent: Represent any system as a graph of promises with delivery-down source and verify-up evidence
    goals:
    - Promise type is first-class in schema 3.0
    - Every semantic field (intent/goals/slos/...) becomes a Promise record
    - Entity kinds are structural containers, not attribute owners
    - Semantic relationships (realizes, traces-to, exercised-by) derived from promise graph
    stakeholders:
    - Human Architect
    - LLM Agent
    - arch-agent Trainer
    - Downstream domain profiles (controls, mechanical, electrical)
    success_criteria:
    - 2.1 -> 3.0 migration round-trips for every existing fixture
    - Promise closure computable per-entity in <10ms
    - Domain profiles express promise-attribute extensions without base-schema change
    failure_modes:
    - Schema 3.0 migration lossy on prose fields
    - Promise graph too complex for LLM to reason about
    - Domain profiles pollute base promise vocabulary
    moes:
    - Round-trip fidelity 100% on structured fields
    - Round-trip fidelity >90% on prose fields via LLM re-derivation
    - Migration idempotency (re-run produces identical output)
    assumptions:
