  interfaces:
  - id: IF-PB-CODE-INVENTORY
    name: CodeInventory
    status: ACTIVE
    kind: library
    description: Output of scan stage; input to derive_promises. Dataclass with modules, functions, classes, imports, routes, tests, docs; deterministically ordered.
    intent: Carry raw AST inventory between scan and derive_promises stages
  - id: IF-PB-PROMISE-BATCH
    name: PromiseBatch
    status: ACTIVE
    kind: library
    description: Output of derive_promises; input to cluster. List of Promise records each carrying inferred provenance stamp.
    intent: Carry batch of Promise records with provenance between derive and cluster stages
  - id: IF-PB-PROMISE-FAMILIES
    name: PromiseFamilies
    status: ACTIVE
    kind: library
    description: Output of cluster; input to link. Promise records grouped by family via embedding-based clustering.
    intent: Carry family-grouped promises between cluster and link stages
  - id: IF-PB-LINKED-GRAPH
    name: LinkedPromiseGraph
    status: ACTIVE
    kind: library
    description: Output of link; input to containerize. Promise families with delivered_from and verified_by edges annotated per promise.
    intent: Carry linked promise graph between link and containerize stages
  - id: IF-PB-CONTAINED-MODEL
    name: ContainedModel
    status: ACTIVE
    kind: library
    description: Output of containerize; input to verify. Promise families assigned to entity kinds (capabilities/behaviors/components/interfaces).
    intent: Carry entity-typed model between containerize and verify stages
  - id: IF-PB-CLOSURE-REPORT
    name: ClosureReport
    status: ACTIVE
    kind: library
    description: Output of verify; input to publish. Per-entity closure_pct + gap breakdown + system-level score.
    intent: Carry chain-closure measurement between verify and publish stages
  - id: IF-PB-PUBLISHED-PACKAGE
    name: PublishedPackage
    status: ACTIVE
    kind: library
    description: Output of publish stage. ArchitecturePackage generation with generation number, root digest, CURRENT pointer.
    intent: Final output of pipeline; immutable versioned architecture package
  - id: IF-PB-PROMISE-API
    name: PromiseAPI
    status: ACTIVE
    kind: library
    description: Promise dataclass + parser API. Public surface for creating, round-tripping, and computing stable PR-<sha1> ids for Promise records. Basis of schema 3.0.
    intent: Public Promise dataclass + parser surface with deterministic ids
  - id: IF-PB-MIGRATION-CMD
    name: MigrationCommand
    status: ACTIVE
    kind: cli
    description: '`architecture-model migrate --to 3.0 <path>` CLI command. Emits migrated model with digest-locked LLM re-derivation for prose fields. Round-trip contract on 4 e2e benchmark models.'
    intent: CLI entry point for 2.1 -> 3.0 migration with digest-locked prose re-derivation
  - id: IF-PB-PIPELINE-API
    name: PipelineAPI
    status: ACTIVE
    kind: library
    description: '`Pipeline(llm=..., prompts=..., budget=...).run(repo_path)` public constructor + run surface. LLM provider required at construction time; policy-driven routing.'
    intent: Public Pipeline() ctor + run() surface with required LLM provider
  - id: IF-PB-PROJECTOR-REGISTRY
    name: ProjectorRegistryAPI
    status: ACTIVE
    kind: library
    description: '`register(name, callable)` / `resolve(name)` projector registry. Auto-generated matrix over family x kind x (deterministic | llm) populates this registry at import time.'
    intent: Public register/resolve surface for projector matrix
  - id: IF-PB-LLM-PROVIDER-API
    name: LLMProviderAPI
    status: ACTIVE
    kind: library
    description: '`LLMProvider` runtime-checkable Protocol exposing `complete`, `stream`, `structured`, `tokenize`. Provider fan-in for MCP / Frontier / Relay adapters; required at Pipeline construction.'
    intent: Runtime-checkable LLMProvider Protocol surface
  - id: IF-PB-PROMPT-LIBRARY-API
    name: PromptLibraryAPI
    status: ACTIVE
    kind: library
    description: Versioned prompt fragment lookup by content-hash. Every LLM call cites the prompt version in its provenance; snapshot-locked.
    intent: Content-hashed prompt fragment lookup with provenance-cite semantics
  - id: IF-PB-BUDGET-API
    name: BudgetEnforcerAPI
    status: ACTIVE
    kind: library
    description: Per-pipeline-run LLM budget accounting. Emits budget-exhausted journal event on breach; partial-run recovery via checkpoint.
    intent: Public budget-cap + partial-recovery surface for LLM spend
  - id: IF-PB-SIL-EVIDENCE-API
    name: SILEvidenceAPI
    status: ACTIVE
    kind: library
    description: Maps SI&L records (`.architecture/sil.sqlite`) to `Promise.verified_by`. Stale telemetry (>7d) reopens Promise.status.
    intent: Bind SI&L telemetry as Promise verify-up evidence with stale-reopen
  - id: IF-PB-LEGACY-VISUALIZE
    name: LegacyVisualizeAdapter
    status: ACTIVE
    kind: library
    description: Adapter surface wrapping `core/visualize.py` generators behind the projector interface. Mapping table at `.architecture/adapters/visualize-mapping.yaml`.
    intent: Adapter-shaped surface preserving core/visualize.py generators
  - id: IF-PB-LEGACY-PIPELINE
    name: LegacyPipelineAdapter
    status: ACTIVE
    kind: library
    description: Adapter surface wrapping the existing 10-stage pipeline behind `scan` + `derive_promises` as one strategy among many.
    intent: Adapter-shaped surface plugging 10-stage pipeline into new pipeline
  - id: IF-PB-LEGACY-DOCS
    name: LegacyDocsAdapter
    status: ACTIVE
    kind: library
    description: Adapter surface wrapping `docs/generator.py`, `docs/component_spec.py`, `docs/icd.py`, `docs/se/*` behind projector variants.
    intent: Adapter-shaped surface preserving docs/generator.py + docs/se/*
  - id: IF-PB-STANDALONE-HARNESS-API
    name: StandaloneHarnessAPI
    status: ACTIVE
    kind: library
    description: '`verify_entity_standalone(entity_id)` parametrized pytest harness API. Materializes slice, checks closure, checks external boundaries. Target runtime <30s over full model.'
    intent: Public verify_entity_standalone() harness surface
  - id: IF-PB-CI-GATE-WORKFLOW
    name: CIGateWorkflow
    status: ACTIVE
    kind: cli
    description: GitHub Actions workflow (`.github/workflows/architecture-gate.yml`) enforcing standalone-verification harness + chain-closure diff vs base. Blocks merge on open promises without typed-gap or on closure regression without override.
    intent: CI workflow surface enforcing standalone-verification + closure gate
  layers: []
  constraints: []
  requirements:
  - id: REQ-PB-1
    name: Every entity produces self-contained slice
    status: ACTIVE
    text: Every entity in the model MUST be materializable into a self-contained slice package that includes its promises, delivery-down sources, verify-up evidence, and typed external boundaries.
    priority: must
    verification_method: test
    acceptance_criteria:
    - verify_entity_standalone passes parametrized over every entity
    - Zero silent external references in any slice
    stakeholder: Human Architect
  - id: REQ-PB-2
    name: Slice materialization latency
    status: ACTIVE
    text: Slice materialization MUST complete in <1 second per entity at p95.
    priority: must
    verification_method: test
    acceptance_criteria:
    - p95 latency <1s across all entities in benchmark suite
    stakeholder: LLM Agent
  - id: REQ-PB-3
    name: Zero dangling promise references
    status: ACTIVE
    text: A slice MUST NOT contain any promise reference that cannot be resolved inside the slice or declared as an external boundary.
    priority: must
    verification_method: analysis
    acceptance_criteria:
    - Static analysis reports 0 dangling refs across all slices
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-4
    name: Delivery-down and verify-up populated
    status: ACTIVE
    text: Every entity attribute MUST populate delivered_from (upstream source) and verified_by (downstream evidence) or explicitly declare a typed gap.
    priority: must
    verification_method: analysis
    acceptance_criteria:
    - Typed-gap inventory covers every unfilled attribute
    stakeholder: Human Architect
  - id: REQ-PB-5
    name: Promise-graph schema round-trip stability
    status: ACTIVE
    text: Promise-graph schema 3.0 YAML MUST round-trip byte-stable through parser and dumper.
    priority: must
    verification_method: test
    acceptance_criteria:
    - 3746+ round-trip tests pass byte-identical
    stakeholder: LLM Agent
  - id: REQ-PB-6
    name: Migration preserves all schema 2.2 content
    status: ACTIVE
    text: Migration from schema 2.2 to 3.0 MUST preserve all existing entity content and relationships without loss.
    priority: must
    verification_method: test
    acceptance_criteria:
    - Migration fixture diff shows 0 semantic loss
    stakeholder: Human Architect
  - id: REQ-PB-7
    name: LLM budget enforced per stage
    status: ACTIVE
    text: LLM budget cap MUST be enforced at every pipeline stage; overruns MUST fail closed.
    priority: must
    verification_method: test
    acceptance_criteria:
    - Budget-cap test forces overrun and observes stage failure
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-8
    name: LLM calls recorded with provider/model/cost
    status: ACTIVE
    text: Every LLM call MUST be recorded with provider name, model id, prompt digest, token counts, and cost.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - meta.provider block and SI&L records populated on every emit
    stakeholder: Human Architect
  - id: REQ-PB-9
    name: Pipeline deterministic replay
    status: ACTIVE
    text: The 7-stage extraction pipeline MUST produce byte-identical output on repeat runs with pinned inputs and pinned AMS_DETERMINISTIC_NOW.
    priority: must
    verification_method: test
    acceptance_criteria:
    - Determinism harness reports 100% byte-identical replay
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-10
    name: Consolidation-by-construction at cluster
    status: ACTIVE
    text: Consolidation MUST happen at the cluster stage via embedding-based grouping; no post-hoc A/B merger stage.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - No post-hoc merge stage exists in pipeline definition
    stakeholder: Human Architect
  - id: REQ-PB-11
    name: Legacy generators preserved via adapters
    status: ACTIVE
    text: Existing legacy generators (visualize.py, docs/generator.py, docs/se/*) MUST be preserved and wrapped as legacy adapters, NOT deleted during the Plan B refactor.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - All three legacy adapter components present; original files intact
    stakeholder: Human Architect
  - id: REQ-PB-12
    name: Three legacy adapters cover all current generation
    status: ACTIVE
    text: The three legacy adapters (PROJECTOR, PIPELINE, DOCS) MUST cover 100% of current generation entry points.
    priority: must
    verification_method: analysis
    acceptance_criteria:
    - Adapter coverage report enumerates all current entry points
    stakeholder: LLM Agent
  - id: REQ-PB-13
    name: CI gate fails closed on chain break
    status: ACTIVE
    text: The CI gate workflow MUST fail closed on any attribute chain break or standalone-verification regression.
    priority: must
    verification_method: test
    acceptance_criteria:
    - Synthetic chain-break commit blocked by CI gate in fixture repo
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-14
    name: Commits reference model entities
    status: ACTIVE
    text: 'Every Plan B commit message MUST include a "[refs: CAP-X BEH-Y ...]" trailer naming the entities affected.'
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Commit-msg hook rejects Plan B commits missing refs trailer
    stakeholder: Human Architect
  - id: REQ-PB-15
    name: Standalone-verification parametrized
    status: ACTIVE
    text: verify_entity_standalone MUST be a parametrized pytest fixture running over every entity in the model, not a hand-written per-entity test.
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Single parametrized test
    - N entities discovered
    stakeholder: LLM Agent
  - id: REQ-PB-16
    name: SI&L records as promise evidence
    status: ACTIVE
    text: SI&L records MUST be usable as verify-up evidence for behavior and component promises.
    priority: must
    verification_method: demonstration
    acceptance_criteria:
    - Evidence binder resolves SI&L records into ProjectedView slice
    stakeholder: Human Architect
  - id: REQ-PB-17
    name: Projector matrix per-entity slices
    status: ACTIVE
    text: The projector matrix MUST produce a per-entity slice package for every entity kind (capability, behavior, component, interface, actor, constraint, requirement, system).
    priority: must
    verification_method: test
    acceptance_criteria:
    - Matrix coverage 100% across kinds
    stakeholder: LLM Agent
  - id: REQ-PB-18
    name: Existing test suite continues to pass
    status: ACTIVE
    text: The full existing test suite (3746 passed, 104 skipped) MUST continue to pass throughout the Plan B refactor.
    priority: must
    verification_method: test
    acceptance_criteria:
    - pytest green after every commit; no regressions
    stakeholder: CI/CD Pipeline
  - id: REQ-PB-19
    name: Jaccard similarity threshold for cluster
    status: ACTIVE
    text: "The cluster stage MUST use Jaccard similarity \u2265 0.5 for exercised-by inference when grouping candidate promises."
    priority: must
    verification_method: inspection
    acceptance_criteria:
    - Threshold constant set to 0.5; unit test asserts value
    stakeholder: Human Architect
  - id: REQ-PB-20
    name: Full test suite green per commit
    status: ACTIVE
    text: The full test suite MUST be green after every Plan B commit; no batching of failing states is permitted.
    priority: must
    verification_method: test
    acceptance_criteria:
    - pre-push hook forbids push with red tests
    stakeholder: CI/CD Pipeline
