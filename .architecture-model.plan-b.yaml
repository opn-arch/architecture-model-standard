  - id: BEH-DF-1
    name: "Brainstorm \u2192 Plan \u2192 Approve \u2192 Execute Cycle"
    status: ACTIVE
    description: "Canonical model-driven development cycle. User intent enters via brainstorming (superpowers/brainstorming skill). Assistant produces a written plan (superpowers/writing-plans). User approves plan explicitly (superpowers/executing-plans gate). Assistant executes plan with per-step verification (superpowers/verification-before-completion). Every phase has a defined skill in .config/opencode/skills/superpowers/."
    intent: Ensure no code is written without explicit user-approved plan preceded by user-clarified intent
    steps:
    - Detect intent (user message contains goal/need/change)
    - Invoke brainstorming skill to clarify requirements
    - Draft plan artifact (docs/plans/YYYY-MM-DD-name.md)
    - Present plan; request explicit approval
    - Upon approval, execute plan with atomic commits per step
    - Verify each commit (suite green + regen-check per entity)
    acceptance_criteria:
    - "AC[0]: Every non-trivial change has an approved plan artifact in docs/plans/ authored before code changes"
    - "AC[1]: Execution commits contain the plan-doc task id in their message"
    - "AC[2]: Full test suite is green after every commit produced by this cycle"
    preconditions:
    - User has expressed intent or reframing
    postconditions:
    - Plan artifact exists on disk
    - Execution commits reference plan-doc task ids
    verification:
    - id: VER-DF-1
      method: inspection
      target: "self.AC[0] and self.AC[1] hold across all commits produced by this cycle"
    open_questions:
    - What threshold of 'trivial' skips the plan artifact?
  - id: BEH-DF-2
    name: Feedback-Driven Reframing Checkpoint
    status: ACTIVE
    description: "When user feedback reframes the current problem (not just refines it), assistant halts execution and returns to brainstorming. Reframing signals: new noun categories in user message, explicit re-prioritization, contradiction with earlier decision. This behavior addresses SIO-1."
    intent: Prevent execution momentum from carrying past a scope reframe
    steps:
    - Parse user message for reframing signals
    - If reframing detected, pause current execution
    - Summarize old frame vs new frame
    - Confirm reframing with user
    - Return to plan-writing under new frame
    acceptance_criteria:
    - "AC[0]: Every user message received during execution is classified as one of {refine, reframe, approve, reject}"
    - "AC[1]: A reframe classification always halts execution before the next tool call and produces an updated plan artifact"
    preconditions:
    - Execution in progress
    - New user message received
    postconditions:
    - Either execution continues (no reframe) or plan artifact updated (reframe)
    verification:
    - id: VER-DF-2
      method: inspection
      target: "self.AC[0] and self.AC[1] hold for every user message during execution"
  - id: BEH-DF-3
    name: Typed-Gap Surfacing
    status: ACTIVE
    description: "When a field is empty or a relationship is missing, classify the absence into a named gap category (G-DELIVERY, G-VERIFY, G-OPEN-Q, ...). Never leave silent NULLs. Baseline reporter runs after every model mutation."
    intent: Make model incompleteness addressable rather than invisible
    steps:
    - After any model mutation, run scripts/plan_b_baseline_report.py
    - Compare gap counts to previous baseline
    - Any new gap category triggers naming discussion
    - Report gap deltas in commit message
    acceptance_criteria:
    - "AC[0]: scripts/plan_b_baseline_report.py exits 0 after every mutation commit"
    - "AC[1]: Every commit message contains either a gap-delta report or the literal string 'gaps unchanged'"
    - "AC[2]: No silent NULL (empty field with no gap category) exists on any BEH/CAP/COMP entity added in the commit"
    verification:
    - id: VER-DF-3
      method: test
      target: "self.AC[0] verified by CI running the baseline script"
    - id: VER-DF-4
      method: inspection
      target: "self.AC[1] and self.AC[2] verified by commit-message review"
  - id: BEH-DF-4
    name: SIO Capture During Conversation
    status: ACTIVE
    description: "When a friction point, missed pattern, or process observation surfaces during conversation, capture it as a Self-Improvement Opportunity (SIO) entity before end of turn. Each SIO is a behavior under CAP-DF-SELFIMP with intent field carrying the observation."
    intent: Prevent methodology lessons from evaporating between turns
    steps:
    - Assistant maintains an in-turn SIO scratchpad
    - Any observation about the process (as distinct from the artifact) goes on the scratchpad
    - At end-of-turn (or at natural pause), scratchpad entries land in the model as BEH-SIO-N entities
    - Each SIO gets triage=pending until BEH-DF-5 processes it
    acceptance_criteria:
    - "AC[0]: SIO scratchpad is empty at end of every turn"
    - "AC[1]: Every turn containing a reframing signal produces at least one BEH-SIO-N entity"
    - "AC[2]: Every newly-created BEH-SIO-N entity has triage=pending until BEH-DF-5 processes it"
    preconditions:
    - Conversation turn active
    postconditions:
    - Scratchpad empty at end of turn
    - New SIO entities have triage=pending
    verification:
    - id: VER-DF-5
      method: inspection
      target: "self.AC[0], self.AC[1], self.AC[2] hold at end of every conversation turn"
  - id: BEH-DF-5
    name: SIO Triage (apply-here | promote | discard)
    status: ACTIVE
    description: "Process pending SIOs. Each SIO gets a triage decision: apply-here (address in current context, do not persist as methodology change), promote-methodology (create/update methodology entity), or discard (with rationale). Triage rationale always recorded."
    intent: Convert observations into either concrete methodology entities or explicit discards
    steps:
    - List all triage=pending SIOs
    - "For each, assess whether it is a recurring pattern (promote), a context-specific fix (apply-here), or a false signal (discard)"
    - Record triage decision + rationale on the SIO entity
    - If promote-methodology, create the resulting entity and link via resulting_entity field
    acceptance_criteria:
    - "AC[0]: count of triage=pending SIOs = 0 at end of every T0.* task commit"
    - "AC[1]: Every triaged SIO has a non-empty rationale field"
    - "AC[2]: Every promoted SIO has resulting_entity populated with a valid entity id"
    preconditions:
    - At least one triage=pending SIO exists
    postconditions:
    - No SIO remains triage=pending across turns
    - Promoted SIOs have resulting_entity populated
    verification:
    - id: VER-DF-6
      method: analysis
      target: "self.AC[0], self.AC[1], self.AC[2] verified at end of every T0.* commit"
  - id: BEH-DF-6
    name: Regenerability Self-Check Per Entity
    status: ACTIVE
    description: "For every entity added or materially modified, assistant self-assesses: 'Could a competent developer write viable code implementing this entity's promise using only the model's entity detail, without reading source code?' Score HIGH / MEDIUM / LOW. HIGH -> continue autonomously. MEDIUM/LOW -> stop and consult user."
    intent: Convert autonomy into a confidence-gated privilege earned per-entity
    steps:
    - After adding/modifying an entity, list its populated fields
    - "Ask whether, given these fields alone, implementation could proceed"
    - Score HIGH (yes, no gaps) / MEDIUM (yes with plausible defaults) / LOW (no, essential detail missing)
    - Record score in commit message tally
    - LOW score triggers immediate stop
    acceptance_criteria:
    - "AC[0]: Every entity added or modified in a commit appears in that commit's 'regen: HIGH|MEDIUM|LOW (N entities checked)' tally line"
    - "AC[1]: No MEDIUM or LOW score appears in a commit tally without a preceding user consultation record"
    - "AC[2]: The tally line uses the exact format 'regen: <SCORE> (<N> entities checked)' for machine parsing"
    preconditions:
    - Entity added or materially modified
    postconditions:
    - Regen-check score recorded
    - If MEDIUM/LOW, execution paused and user consulted
    verification:
    - id: VER-DF-7
      method: inspection
      target: "self.AC[0], self.AC[1], self.AC[2] hold for every arch(plan-b) commit"
  - id: BEH-DF-7
    name: Continuous Attribute Propagation (Fill-If-Empty)
    status: ACTIVE
    description: "Parent-to-child attribute propagation: when a child entity lacks an attribute that its parent has, propagate parent value only if child's field is empty. Children with own values are preserved. Propagation is idempotent."
    intent: Reduce boilerplate by propagating parent context without overwriting child-specific detail
    steps:
    - For each entity with parent_id
    - Iterate over semantic attributes (intent, goals, ...)
    - If child's attribute is empty AND parent's is non-empty, copy parent value
    - Never overwrite child's non-empty attribute
    - Log propagations for auditability
    acceptance_criteria:
    - "AC[0]: scripts/plan_b_propagate.py --dry-run produces an empty diff on second consecutive run (idempotence)"
    - "AC[1]: No child field with a pre-existing non-empty value is overwritten by parent propagation"
    - "AC[2]: Propagation log records source (parent_id, field_name) for every child field filled"
    preconditions:
    - Model in valid state
    postconditions:
    - Running script twice produces identical output
    verification:
    - id: VER-DF-8
      method: test
      target: "self.AC[0], self.AC[1], self.AC[2] verified by scripts/plan_b_propagate.py test mode"
