    - Benchmark fidelity 100%
  - id: CAP-PB-VERIFY
    name: Universal verify_entity_standalone Harness
    status: ACTIVE
    parent_id: CAP-PB-SLICE
    description: >-
      Sub-capability of CAP-PB-SLICE (also delivers to CAP-PB-DEV).
      Parametrized pytest harness runs verify_entity_standalone over every
      entity. CI gate blocks merge on open promises without typed-gap.
    intent: Provide universal verification harness that runs standalone check over every entity
    goals:
    - Parametrized pytest fixture over all entities in model
    - Fast execution (<30s over full model)
    - Zero false-positives/negatives
    - CI gate integration with journal event on override
    stakeholders:
    - CAP-PB-SLICE
    - CAP-PB-DEV
    - CI/CD Pipeline
    - Human Architect
    success_criteria:
    - Harness runs in <30s
    - Zero false-positives on typed-gap entities
    - CI blocks merge on regression
    failure_modes:
    - Harness too slow blocks CI
    - Typed-gap syntax ambiguous causes false-positive
    - Override abused (audit gap)
    moes:
    - Harness runtime p95 <30s
    - Merge-block precision >99%
  components:
  - id: COMP-PB-PROMISE-TYPE
    name: Promise Dataclass
    status: ACTIVE
    description: >-
