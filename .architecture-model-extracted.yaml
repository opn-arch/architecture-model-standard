      returns: GateResult
      body_hint: "Check if code reality is tracking toward authored architecture intent.\n\nArgs:\n    model: The architecture\
        \ model to check.\n    manifest: The reality manifest from code scanning.\n    phase: Override lifecycle phase (\"\
        concept\" or \"production\").\n           If None, defaults to \"production\"."
    - name: parse_requirements_doc
      params:
      - 'text: str'
      returns: ArchitectureModel
      body_hint: 'Parse a markdown requirements document into an ArchitectureModel.


        Supported sections: # Actors, # Capabilities, # Constraints (case-insensitive).'
    - name: main
      params:
      - 'argv: list[str] | None'
      returns: int
    - name: cluster_modules
      params:
      - 'modules: list[str]'
      - 'edges: list[tuple[str'
      - str]]
      - 'target_k: int'
      - 'min_cluster_size: int'
      returns: list[list[str]]
      body_hint: "Cluster modules into groups by import-graph affinity.\n\nArgs:\n    modules: List of module file paths.\n\
        \    edges: List of (source, target) import edges.\n    target_k: Target number of clusters.\n    min_cluster_size:\
        \ Merge clusters smaller than this.\n\nReturns:\n    List of module groups (each group is a list of file paths)."
    - name: compute_compression_stats
