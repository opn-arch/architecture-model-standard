    - name: manifest_to_source_graph
      params:
      - 'manifest: Any'
      - 'model: Any'
      returns: '''SourceGraph'''
      body_hint: 'Convert a Manifest''s import data into a SourceGraph for interface extraction.


        Resolves module-name imports (e.g. ''src.b.core'') to file paths by matching

        against manifest modules, then creates DependencyEdge objects.'
    - name: extract_component_interfaces
      params:
      - 'model: Any'
      - 'graph: ''SourceGraph'''
      returns: int
      body_hint: "Extract interface contracts between components from cross-boundary edges.\n\nFor each dependency edge that\
        \ crosses a component boundary:\n- The source component gets a 'requires' interface\n- The target component gets a\
        \ 'provides' interface\n\nArgs:\n    model: ArchitectureModel with entities.components\n    graph: SourceGraph with\
        \ edges (dependency info)\n\nReturns:\n    Number of interfaces added."
