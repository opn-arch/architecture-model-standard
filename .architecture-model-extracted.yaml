    - name: create_behaviors_from_manifest
      params:
      - 'model: Any'
      - 'manifest: Manifest'
      returns: tuple[list[Behavior], list[Relationship]]
      body_hint: "Auto-create granular behaviors from manifest, one per significant function.\n\nScans all modules in the\
        \ manifest, creates a Behavior for each function\nin router and service modules. Links behaviors to components via\
        \ relationships.\n\nArgs:\n    model: ArchitectureModel with entities.components populated.\n    manifest: Manifest\
        \ with modules and interfaces.\n\nReturns:\n    Tuple of (behaviors created, relationships linking components to behaviors)."
    - name: decompose_behavior
      params:
      - 'behavior: Behavior'
      - 'model: ArchitectureModel'
      - manifest
      returns: Behavior
      body_hint: 'Promote behavior''s raw steps to structured Steps.


        For each raw step (a function/method name):

        1. Find which component contains a function with that name

        2. Use the function name as the action (titlecase, underscores to spaces)

        3. Set component_ref to the owning component''s ID


        If manifest is provided, also look up function signatures for richer descriptions.


        Returns a NEW Behavior with structured_steps populated.'
