      returns: str
      body_hint: 'Format a DecomposeResult for the agent to assign semantic names.


        Returns a compact string showing each cluster''s key files, classes,

        and inter-cluster dependencies.'
    - name: run_pipeline
      params:
      - 'project_root: Path'
      - 'parent_model: str'
      - 'model_file: str | None'
      - 'output_dir: str'
      - 'deep: bool'
      - 'compact: bool'
      - 'from_scratch: bool'
      returns: PipelineResult
      body_hint: "Run the full decomposition pipeline.\n\n1. Generate recursive manifests (per-block AST scan + dependency\
        \ analysis)\n2. Decompose parent model into sub-models (relationship tracing)\n3. Write all artifacts to output_dir/<block_id>/\n\
        \nArgs:\n    project_root: Root directory with .architecture-model.yaml\n    parent_model: Config filename with functional_blocks\
        \ (default: .architecture-model.yaml)\n    model_file: Model filename with entities/relationships. If None, auto-detects:\n\
        \                tries parent_model first, then .architecture-model-extracted.yaml\n    output_dir: Output directory\
        \ name (default: .architecture-models)\n    deep: Enable iterative deep decomposition of blocks\n    compact: Compact\
        \ root model after decomposition\n    from_scratch: If True and no model exists, bootstrap one from manifest\n   \
        \               using module grouping and auto-enrichment\n\nReturns:\n    PipelineResult with manifests, sub_models,\
        \ and written paths."
    - name: detect_behavior_triggers
      params:
      - 'behaviors: list[Behavior]'
      - 'call_graph: CallGraph'
      - 'behavior_entries: dict[str'
      - str]
      - 'max_depth: int'
