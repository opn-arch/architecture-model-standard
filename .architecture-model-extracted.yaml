    - name: full_extraction
      params:
      - 'repo_path: Path'
      - 'target_systems: int'
      returns: ArchitectureModel
      body_hint: "Run complete architecture extraction pipeline.\n\nPipeline steps:\n1. Generate manifest (AST scan) + optionally\
        \ scan non-Python languages\n2. Build call graph from manifest\n3. Group modules into components (uses SourceGraph\
        \ path if multi-language)\n4. Create initial model with components\n5. Detect system boundaries (multi-signal)\n6.\
        \ Create behaviors from manifest (router/service functions)\n7. Detect behavior triggers from call graph\n8. Infer\
        \ composite behaviors (use cases from trigger chains)\n9. Decompose behaviors (raw steps → structured Steps)\n10.\
        \ Infer capabilities from behavior trigger patterns\n11. Build capability hierarchy from URL nesting\n12. Return enriched\
        \ model\n\nArgs:\n    repo_path: Path to repository root\n    target_systems: Number of systems to detect (0 = auto)\n\
        \nReturns:\n    Fully enriched ArchitectureModel"
