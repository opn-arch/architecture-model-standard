      params:
      - 'repo_path: Path'
      - 'target_systems: int'
      - 'output_dir: str'
      returns: tuple[ArchitectureModel, dict]
      body_hint: "Full extraction + docs + compaction + hierarchical output.\n\nProduces:\n- Compact .architecture-model.yaml\
        \ (use cases + summaries only)\n- .architecture-models/full-model.yaml (complete reference)\n- .architecture-models/docs/\
        \ (component specs, behavior specs, diagrams, etc.)\n- .architecture-models/COMP-*/ (per-component sub-models with\
        \ full behaviors)\n\nArgs:\n    repo_path: Path to repository root\n    target_systems: Number of systems to detect\
        \ (0 = auto)\n    output_dir: Output directory name (default: .architecture-models)\n\nReturns:\n    (compact_model,\
        \ artifacts) where artifacts describes what was written."
