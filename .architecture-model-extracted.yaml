      - 'realized: bool'
      returns: float
      body_hint: Compute confidence for a Capability. Returns 0.0-1.0.
    - name: compute_interface_confidence
      params:
      - 'interface: Interface'
      returns: float
      body_hint: Compute confidence for an Interface. Returns 0.0-1.0.
    - name: compute_model_confidence
      params:
      - 'model: ArchitectureModel'
      returns: ArchitectureModel
      body_hint: Compute and set confidence on all entities in the model.
    - name: aggregate_block_confidence
      params:
      - 'model: ArchitectureModel'
      returns: dict[str, dict]
      body_hint: Aggregate confidence scores per F-block.
    - name: model_confidence_summary
      params:
      - 'model: ArchitectureModel'
      returns: dict
      body_hint: Generate overall confidence summary for the model.
    - name: compute_function_confidence
      params:
      - func_info
      returns: float
      body_hint: 'Compute confidence for a function from manifest FunctionInfo.


        Factors:

        - Has typed signature (params with types, return type): 30%

        - Has docstring: 25%

        - Has call graph (calls list): 20%

        - Has raises info: 15%

        - Has parameters at all: 10%'
    - name: load_corrections
      params:
      - 'repo_path: Path'
      returns: list[dict]
      body_hint: Load corrections from .architecture/corrections.yaml. Returns [] if missing.
    - name: store_correction
      params:
      - 'repo_path: Path'
      - 'correction: dict'
      returns: dict
      body_hint: Append a correction with auto-generated id, created_at, and applied=false.
    - name: apply_corrections
      params:
      - 'model: Any'
      - 'corrections: list[dict]'
      returns: tuple[Any, list[str]]
      body_hint: Apply unapplied rename and add_relationship corrections to a model.
    - name: mark_applied
      params:
      - 'repo_path: Path'
      - 'correction_ids: list[str]'
      returns: None
      body_hint: Mark specified corrections as applied=true in the YAML file.
    - name: coverage_report
      params:
      - 'model: ''ArchitectureModel'''
      - 'manifest: dict'
      - 'import_deps: dict[str'
      - set[str]] | None
      returns: CoverageResult
      body_hint: Run all coverage checks and return aggregate result.
    - name: summary
      returns: str
    - name: compute_complexity
      params:
      - 'comp: Component'
      - 'model: ArchitectureModel'
      returns: float
      body_hint: "Weighted complexity score for determining if a component should be in a System.\n\nFactors:\n    - Number\
        \ of symbols x 2.0\n    - Total members (sum of all symbol members) x 0.3\n    - Number of functions x 0.5\n    -\
        \ Number of depends-on relationships (inbound + outbound) x 1.5"
    - name: identify_systems
      params:
      - 'model: ArchitectureModel'
      - 'manifest: dict'
      returns: list[SystemCandidate]
      body_hint: "Identify F-block groups that should become Systems.\n\nGroups components by source_block, computes aggregate\
        \ complexity per group,\nand returns SystemCandidates for groups exceeding SYSTEM_THRESHOLD.\n\nFor components without\
        \ an source_block field, they are skipped (remain as\ntop-level components).\n\nArgs:\n    model: The architecture\
        \ model with enriched components.\n    manifest: Manifest dict containing functional_blocks metadata.\n\nReturns:\n\
        \    List of SystemCandidate for groups exceeding threshold."
    - name: decompose_model
      params:
      - 'model: ArchitectureModel'
      - 'manifest: dict'
      - 'output_dir: str'
      returns: DecompositionResult
      body_hint: "Decompose a flat model into top-level + system sub-models.\n\n1. Identifies system candidates via F-block\
        \ complexity\n2. For each system:\n   - Creates System entity with sub_model_ref\n   - Extracts system's components\
        \ into a sub-model\n   - Partitions relationships: intra-system stay in sub-model,\n     inter-system get promoted\
        \ to top-level (from/to rewritten to system ID)\n3. Remaining components stay in top-level\n\nArgs:\n    model: Flat\
        \ architecture model (v1.2+ with enriched components).\n    manifest: Manifest dict with functional_blocks metadata.\n\
        \    output_dir: Directory name for sub-model refs (default \"systems\").\n\nReturns:\n    DecompositionResult with\
        \ top-level model and sub-models dict."
    - name: detect_systems
      params:
      - 'model: ArchitectureModel'
      - manifest
      - 'target_systems: int'
      returns: list[SystemScore]
      body_hint: "Multi-signal system boundary detection.\n\nUses import coupling, data affinity, directory cohesion, and\
        \ API surface\nsignals to identify bounded-context boundaries.\n\nArgs:\n    model: Architecture model with components\
        \ having source_files.\n    manifest: Manifest with modules (ModuleInfo instances).\n    target_systems: Desired number\
        \ of systems (0 = auto-calculate).\n\nReturns:\n    List of SystemScore representing detected system boundaries."
    - name: diff_models
      params:
      - 'old_model: ArchitectureModel'
      - 'new_model: ArchitectureModel'
      returns: ModelDiff
      body_hint: "Compare two model versions and produce a structured diff.\n\nArgs:\n    old_model: The previous/baseline\
        \ model.\n    new_model: The current/updated model.\n\nReturns:\n    ModelDiff with all detected changes."
    - name: has_changes
      returns: bool
    - name: added_count
      returns: int
    - name: removed_count
      returns: int
    - name: modified_count
      returns: int
    - name: summary
      returns: str
    - name: format_report
      returns: str
      body_hint: Format a human-readable diff report.
    - name: affected_artifacts
      returns: set[str]
      body_hint: 'Determine which artifacts might be stale based on changes.


        Returns set of artifact names that should be regenerated.'
    - name: merge_manifest
      params:
      - 'model: ArchitectureModel'
      - 'manifest_path: str | Path'
      - 'project_root: str | Path | None'
      returns: ArchitectureModel
      body_hint: "Merge manifest data into the architecture model (in-place mutation).\n\nWhat gets merged:\n- Component file\
        \ lists get enriched with manifest-discovered files.\n- Layers get directory lists from manifest module scan.\n- Meta\
        \ gets manifest_hash updated.\n\nWhat does NOT get overwritten:\n- Entity names, descriptions, status markers.\n-\
        \ Relationships (these are architectural decisions).\n- Capabilities, behaviors, constraints (model-level truth).\n\
        \nArgs:\n    model: The architecture model to enrich.\n    manifest_path: Path to the reality-manifest.json file.\n\
        \    project_root: Root of the consumer project (for config lookup).\n                  Defaults to manifest_path's\
        \ grandparent (output/{project}/manifest → root).\n\nReturns the same model instance (mutated)."
    - name: enrich_from_manifest
      params:
      - 'model: ArchitectureModel'
      - 'manifest: dict'
      returns: EnrichmentResult
      body_hint: "Enrich an ArchitectureModel with ground-truth symbols and functions from an AST manifest.\n\nReplaces component\
        \ symbols/functions with manifest-derived data, enriches\nrelationship imports, and computes naming accuracy vs prior\
        \ predictions.\n\nArgs:\n    model: The architecture model to enrich (mutated in-place).\n    manifest: Manifest dict\
        \ as produced by the manifest generator.\n\nReturns:\n    EnrichmentResult with the enriched model and naming_accuracy\
        \ score."
    - name: compact_for_generation
      params:
      - 'model: ArchitectureModel'
      returns: ArchitectureModel
      body_hint: 'Compact an enriched model for LLM code generation.


        Truncates symbol members and component functions when the model is too

        large for a 7B model''s effective context. Preserves structure (all

        components, all symbol names by kind) but limits detail per entity.


        The model is mutated in-place and returned.


        Strategy:

        - Cap symbols per component to _MAX_SYMBOLS_PER_COMPONENT (keep by importance)

        - Cap members per symbol to _MAX_MEMBERS_PER_SYMBOL (keep __init__ + public)

        - Cap functions per component to _MAX_FUNCTIONS_PER_COMPONENT

        - Prioritize: __init__ first, then alphabetical for determinism

        - Excess symbols are listed as names-only in a comment field

        - For very large models (>16 components), apply stricter per-component limits'
    - name: compose_enriched_model
      params:
      - 'project_root: Path'
      returns: ArchitectureModel
      body_hint: "Compose a fully-enriched ArchitectureModel from source code.\n\nScans all source files in the project, extracting:\n\
        - Module constants, class attributes, module assignments → Constant objects\n- Function signatures with body hints\
        \ → FunctionSignature objects\n- Test contracts from matching test files → TestContract objects\n\nEach source module\
        \ becomes a Component in the resulting model.\n\nArgs:\n    project_root: Root directory of the project to scan.\n\
        \nReturns:\n    An ArchitectureModel with one Component per source file, enriched\n    with constants, signatures,\
        \ and test contracts."
    - name: model
      returns: ArchitectureModel
