      returns: RepresentativenessResult
    - name: compute_hierarchical_representativeness
      params:
      - 'root_model: ArchitectureModel'
      - 'sub_models: dict[str'
      - ArchitectureModel]
      - 'recursive_manifests: dict[str'
      - '''RecursiveManifest'']'
      returns: HierarchicalRepresentativenessResult
      body_hint: 'Verify representativeness at every level of decomposition.


        Root level: checks that all blocks are represented and cross-block relationships

        match real import dependencies.


        Block level: standard file_coverage + relationship_accuracy + boundary_coherence

        within each block''s scope.'
    - name: to_dict
      returns: dict
    - name: to_dict
      returns: dict
    - name: slice_by_source_block
      params:
      - 'model: ArchitectureModel'
      - 'source_block: str'
      - 'include_relationships: bool'
      - 'project_root: Union[Path'
      - str
      - None]
      returns: ArchitectureModel
      body_hint: "Extract all entities and relationships related to a specific F-block.\n\nArgs:\n    model: Full architecture\
        \ model.\n    source_block: F-block identifier (e.g., \"S1\", \"S2\").\n    include_relationships: Whether to include\
        \ relationships between sliced entities.\n\nReturns:\n    New ArchitectureModel containing only the F-block's entities."
    - name: slice_by_layer
      params:
      - 'model: ArchitectureModel'
      - 'layer_id: str'
      returns: ArchitectureModel
      body_hint: "Extract all entities allocated to a specific layer.\n\nArgs:\n    model: Full architecture model.\n    layer_id:\
        \ Layer identifier (e.g., \"web-layer\", \"pipeline-layer\").\n\nReturns:\n    New ArchitectureModel with layer-specific\
        \ entities."
    - name: slice_by_status
      params:
      - 'model: ArchitectureModel'
      - 'status: Status'
      returns: ArchitectureModel
      body_hint: "Filter model to only include entities with a specific status.\n\nArgs:\n    model: Full architecture model.\n\
        \    status: Status to filter by.\n\nReturns:\n    New ArchitectureModel with only matching entities."
    - name: slice_for_artifact
      params:
      - 'model: ArchitectureModel'
      - 'artifact_name: str'
      returns: ArchitectureModel
      body_hint: "Extract the model subset relevant to a specific artifact's regeneration.\n\nArtifact-specific slicing rules:\n\
        - functional-architecture: capabilities, behaviors (summary), relationships\n- logical-architecture: layers, components,\
        \ inter-layer relationships\n- use-cases: actors, behaviors (full), capabilities (summary)\n- icd: interfaces, components\
        \ (providers/consumers)\n- requirements-analysis: constraints, capabilities, behaviors (summary)\n- readme: everything\
        \ (summary level)\n\nArgs:\n    model: Full architecture model.\n    artifact_name: Name of the artifact to slice\
        \ for.\n\nReturns:\n    Model subset appropriate for the artifact."
    - name: auto_assign_source_blocks
      params:
      - 'model: ArchitectureModel'
      - 'max_cluster_size: int'
      returns: ArchitectureModel
      body_hint: 'Assign source_block values to components via dependency-graph clustering.


        Used when the model has no source_block annotations (e.g., oracle-extracted models).

        Groups components by import/dependency density using greedy modularity:

        1. Build undirected adjacency from depends_on relationships

        2. Seed clusters from highest-degree nodes

        3. Grow each cluster by adding adjacent unassigned nodes (max size limit)

        4. Singletons keep their own source_block (decomposer threshold handles them)


        Mutates nothing — returns a new model with source_block assigned on components.'
    - name: compute_modularity
      params:
      - 'model: ''ArchitectureModel'''
      returns: float
      body_hint: 'Compute Newman''s modularity Q over depends-on edges.


        Q = (1/2m) * sum_ij (A_ij - k_i*k_j / 2m) * delta(c_i, c_j)


        Uses undirected interpretation of depends-on edges.'
    - name: compute_conductance
      params:
      - 'model: ''ArchitectureModel'''
      returns: dict[str, float]
      body_hint: 'Compute conductance per F-block.


        conductance = edges_out / (edges_out + edges_in)

        where edges_in = edges with both endpoints in the block,

        edges_out = edges with exactly one endpoint in the block.'
    - name: compute_agreement_rate
      params:
      - 'model: ''ArchitectureModel'''
      returns: float
      body_hint: 'Compare existing source_block assignments with auto_assign_source_blocks output.


        Returns fraction of components where assignments agree.'
    - name: compute_source_block_quality
      params:
      - 'model: ''ArchitectureModel'''
      returns: FBlockQuality
      body_hint: Compute all F-block quality metrics.
    - name: compute_provenance
      params:
      - 'model: ''ArchitectureModel'''
      - 'quality: FBlockQuality'
      returns: dict[str, FBlockProvenance]
      body_hint: Compute per-component provenance and attach to component.extensions.
    - name: test_affinity_decompose
      params:
      - 'repo_path: Path'
      returns: list[Subsystem]
      body_hint: 'Decompose a repository into subsystems based on test file affinity.


        Algorithm:

        1. Discover all test files (*_test.py, test_*.py)

        2. Discover all source files (non-test .py files)

        3. For each test file, AST-parse its imports to identify which source modules it tests

        4. Group source modules by their primary test file (each source → exactly one subsystem)

        5. Determine dependencies between subsystems via import analysis

        6. Return subsystems sorted topologically (leaves first)


        Source modules with no test → assigned to ''root'' subsystem'
