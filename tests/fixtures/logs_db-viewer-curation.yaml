    annotations:
      - use_case:
          qualified_id: project-documentation-orchestration-2-related::BEH-104
        goal: Acquire heterogeneous project evidence as normalized linked knowledge records.
        trigger: An operator or scheduled ingestion job supplies a source for ingestion.
        preconditions:
          - The source is accessible and its project can be resolved.
        postconditions:
          - Normalized records and project links are persisted.
        success_outcome: Available source records are accepted or reported without an unhandled source failure.
        moes:
          - Accepted records divided by attempted records
        evidence:
          - source: scripts/_pipeline_ingest.py
            claim: The ingestion orchestrator reads supported sources, normalizes extracted records, persists logs, and creates project links.
      - use_case:
          qualified_id: root::BEH-348
        goal: Convert conversation history into normalized knowledge and extraction candidates.
        trigger: An operator provides chat, OpenCode, or GitHub conversation history.
        preconditions:
          - Conversation source data is readable.
        postconditions:
          - Normalized sessions and extracted conversation records are available for persistence.
        success_outcome: Each readable conversation is normalized or its failure is reported.
        moes:
          - Normalized conversations divided by attempted conversations
        evidence:
          - source: scripts/ingestion/ingest_chat.py
            claim: Chat, OpenCode, and GitHub records are loaded, normalized into sessions, validated, and processed for extraction.
      - use_case:
          qualified_id: root::BEH-347
        goal: Convert coursework evidence into linked course, skill, assignment, and log records.
        trigger: An operator starts coursework ingestion for an available course source.
        preconditions:
          - Coursework source data and database access are available.
        postconditions:
          - Course-related entities and links are persisted idempotently.
        success_outcome: Coursework records are stored without duplicate constrained records.
        moes:
          - Persisted coursework records divided by attempted coursework records
        evidence:
          - source: scripts/ingestion/ingest_courses.py
            claim: Coursework ingestion creates course, skill, assignment, and log records using idempotent database operations.
      - use_case:
          qualified_id: root::BEH-346
        goal: Convert goals and career evidence into structured knowledge records.
        trigger: An operator starts goals ingestion for an available goals source.
        preconditions:
          - Goal or career source data is readable.
        postconditions:
          - Structured goal and career evidence is persisted and linked.
        success_outcome: Readable goal records are transformed without an unhandled source failure.
        moes:
          - Persisted goal records divided by attempted goal records
        evidence:
          - source: scripts/ingestion/ingest_goals.py
            claim: The goals ingestion workflow parses goal and career source material and writes structured linked records.
      - use_case:
          qualified_id: project-documentation-orchestration-2-related::BEH-102
        goal: Assemble grounded documentation context from structural, graph, and semantic evidence.
        trigger: A project artifact or entity-context request needs supporting documentation context.
        preconditions:
          - A project or entity scope and query are available.
        postconditions:
          - Available model, graph, and vector context sections are merged within the context budget.
        success_outcome: The downstream workflow receives the available required context sections.
        moes:
          - Required context sections present in the assembled context
        evidence:
          - source: app/services/context_assembler.py
            claim: Context assembly combines model knowledge, graph relationships, and semantic vector matches under an output budget.
      - use_case:
          qualified_id: root::BEH-342
        goal: Curate deduplicated knowledge-base entities from enriched records.
        trigger: A reviewer or batch process starts knowledge-base curation.
        preconditions:
          - Enriched source entries are available.
        postconditions:
          - Deduplicated knowledge-base entities and questions are saved.
        success_outcome: Accepted entities are retained without duplicate identifiers.
        moes:
          - Accepted entities without duplicate identifiers
        evidence:
          - source: scripts/update_kb.py
            claim: The KB update workflow collects entities, deduplicates entities and questions, and writes curated knowledge artifacts.
      - use_case:
